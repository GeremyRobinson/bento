name: ios
on:
  push:
    branches-ignore: [main]
    paths: ["ios/**", ".github/workflows/ios.yml", "!ios/shots/**"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Lesson logic tests
        run: cd Packages/ObentoCore && swift test
      - name: Make the Xcode project
        run: brew install xcodegen && xcodegen
      - name: Build for the iPad simulator
        run: |
          xcodebuild -project Obento2.xcodeproj -scheme Obento2 -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E ": error:" -A4 build.log | head -200; exit 1; }
          grep -E ": warning:" build.log | grep Obento2/ | sort -u | head -40 || true
      - name: Build the Swift Playgrounds version
        continue-on-error: true
        run: |
          cd Obento2.swiftpm
          xcodebuild -list
          xcodebuild -scheme Obento2 -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build-pg CODE_SIGNING_ALLOWED=NO build > ../pg.log 2>&1 \
            || { grep -E ": error:" -A4 ../pg.log | head -80; tail -30 ../pg.log; exit 1; }
          echo "playground builds"
      - name: Screenshots
        timeout-minutes: 15
        run: |
          set -x
          xcrun simctl list devices available | grep -E "iPad|iPhone" | head -20
          APP=$(find build/Build/Products -name '*.app' -maxdepth 3 | head -1)
          rm -f shots/*.png; mkdir -p shots
          # macOS has no `timeout`; perl's alarm does the same job
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          shoot() { # device-name prefix, appearance, orientation flag
            UDID=$(xcrun simctl list devices available | grep -m1 -E "$1" | grep -oE '[0-9A-F-]{36}')
            [ -n "$UDID" ] || { echo "no simulator matching $1"; return 0; }
            xcrun simctl boot "$UDID" || true
            limit 300 xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl ui "$UDID" appearance "$2"
            xcrun simctl install "$UDID" "$APP"
            for s in $4; do
              xcrun simctl terminate "$UDID" education.bento.obento2 || true
              limit 60 xcrun simctl launch "$UDID" education.bento.obento2 -shot "$s" $3 || true
              sleep 6
              limit 60 xcrun simctl io "$UDID" screenshot "shots/$5-$s.png" || true
            done
          }
          shoot "iPad Pro 13-inch" light -landscape "paper selected page-g5-volume-0 page-g5-volume-1 page-g5-volume-2 page-add page-add-1 cards-add" ipad
          # the whole lesson playing on its own, as a video
          UDID=$(xcrun simctl list devices available | grep -m1 "iPad Pro 13-inch" | grep -oE '[0-9A-F-]{36}')
          xcrun simctl terminate "$UDID" education.bento.obento2 || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force shots/ipad-demo.mp4 & REC=$!
          sleep 1
          xcrun simctl launch "$UDID" education.bento.obento2 -shot demo -landscape
          sleep 26
          kill -INT $REC; wait $REC || true
          # keep the video small enough to send
          avconvert --source shots/ipad-demo.mp4 --preset Preset960x540 --output shots/demo-small.mp4 --replace && mv shots/demo-small.mp4 shots/ipad-demo.mp4 || true
          ls -la shots
          shoot "iPad Pro 13-inch" dark -landscape "page-g5-volume-1" ipad-dark
          shoot "iPhone 1[5-9] Pro \\(" light "" "paper page-g5-volume-0 page-g5-volume-1 page-add" phone
      - name: Keep the demo video with the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-demo
          path: ios/shots/ipad-demo.mp4
          if-no-files-found: ignore
      - name: Save screenshots to the branch
        if: always()
        run: |
          # the pictures go on top of whatever the branch holds now, so other pushes never conflict with them
          mkdir -p "$RUNNER_TEMP/shots" && cp shots/*.png "$RUNNER_TEMP/shots/" 2>/dev/null || { echo "no shots"; exit 0; }
          git config user.name "obento-ci"; git config user.email "ci@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            rm -f shots/ipad-demo.mp4 shots/*.png; cp "$RUNNER_TEMP"/shots/*.png shots/
            git add -A shots && git commit -qm "iOS screenshots for ${GITHUB_SHA::7}" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          done
