<title>1st Grade: Numbers to 120</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* 1st grade, chapter 3 (Numbers to 120), from design/grade1.md. Kit copied from grade1-ch2.html (itself grade1-ch1.html's). The kit is new5-lessons.html's: the whole
   screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is the only chrome.
   1 square = 20 paper units, a strong line every 5 squares (a block). One counter is 3 x 3 squares. */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #E0559B; --tint: rgba(224, 85, 155, .16); --tint-strong: rgba(224, 85, 155, .34);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #E47BAE; --tint: rgba(228, 123, 174, .2); --tint-strong: rgba(228, 123, 174, .4);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #E47BAE; --tint: rgba(228, 123, 174, .2); --tint-strong: rgba(228, 123, 174, .4);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
/* chapter 3 is the decimals pink (Theme.swift Chapter.decimals 0xE0559B; on dark paper lifted a quarter toward the ink) */
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--tint)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".7"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="var(--tint)"/>
      <circle cx="5" cy="5" r="2" fill="var(--chapter)"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Problem 1 · Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (new5-lessons.html's kit) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set();
let UP = false;
let DRY = false;   // true while a lesson only measures its record
function put(k, tag, a, kind = "fade", text) { if (DRY) return; items.push({ k, tag, a, kind, text, up: UP }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: 1,
    "stroke-linejoin": "round" }, o.live ? "none" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, rx: o.rx ?? null,
    "stroke-dasharray": o.dash ? "6 6" : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null }, o.live ? "none" : o.c && !o.fill && !o.dash ? "line" : "fade");
}
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) { text(`${k}${i}${s[i]}`, s[i], right - col - 1, row, "maths", { c: o.c }); col += 2; }
}
// a block drawn on the paper: an outline, its word and arrow (Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// an answer box in the record: cells of 2 squares, the number in the middle
function dbox(k, x, y, cells, value, state, actName) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}${state}`, x, y, cells * 2, 2, { c });
  if (value) text(`${k}v${value}`, value, x + cells, y + 1, "maths", { c: vc });
  if (state === "active" && !value) put(`${k}cur`, "line", { x1: sq(x + cells), y1: sq(y + 0.35), x2: sq(x + cells), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
const ring = (k, x, y, r = 1.05, c = "var(--chapter)") => path(k, `M${sq(x + r)} ${sq(y)}a${sq(r)} ${sq(r)} 0 1 1 0 -0.1`, { c });
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// ---------- motion: springs for things that move, timers for See beats ----------
// tween(o, key, to): o[key] glides to `to` on a critically damped spring's path. later(ms, fn): a See beat's next move.
let tweens = [], timers = new Set(), needFrame = false;
const spring = u => u >= 1 ? 1 : (1 - (1 + 7 * u) * Math.exp(-7 * u)) / (1 - 8 * Math.exp(-7));
function tween(o, k, to, ms = 360, opt = {}) {
  tweens = tweens.filter(t => !(t.o === o && t.k === k));
  tweens.push({ o, k, from: o[k], to, t0: performance.now() + (opt.delay || 0), ms, done: opt.done });
  kick();
}
function stepTweens() {
  const now = performance.now(), fin = [];
  for (const t of tweens) {
    const u = Math.max(0, Math.min(1, (now - t.t0) / t.ms));
    t.o[t.k] = t.from + (t.to - t.from) * spring(u);
    if (u >= 1) { t.o[t.k] = t.to; fin.push(t); }
  }
  if (!fin.length) return;
  tweens = tweens.filter(t => !fin.includes(t));
  for (const t of fin) if (t.done) { t.done(); needFrame = true; }
}
function later(ms, fn) {
  const id = setTimeout(() => { timers.delete(id); fn(); render(); frame(lesson.frame()); }, ms);
  timers.add(id);
}
const busy = () => tweens.length > 0 || timers.size > 0;
let raf = 0;
function kick() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

// ---------- voice (G 2 Nov: the words are read aloud for K–2) ----------
// The instruction, a miss's line and the last Say line are spoken as they appear; the speaker mark says them again.
const voice = {
  synth: null, key: null, log: [],
  init() { try { this.synth = ("speechSynthesis" in window) && typeof SpeechSynthesisUtterance === "function" ? window.speechSynthesis : null; } catch (e) { this.synth = null; } },
  plain: s => s.replace(/−/g, " minus ").replace(/\+/g, " plus ").replace(/=/g, " equals ").replace(/…/g, ", "),
  speak(s) {
    if (!s) return;
    this.log.push(s); if (this.log.length > 80) this.log.shift();
    if (!this.synth) return;
    try { this.synth.cancel(); const u = new SpeechSynthesisUtterance(this.plain(s)); u.rate = 0.9; u.onerror = () => {}; this.synth.speak(u); } catch (e) {}
  },
};
voice.init();

function render() {
  stepTweens();
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none", a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${Math.min(n++ * 0.035, 1.2).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    out += `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
  }
  sceneEl.innerHTML = out;
  drawn = next;
  if (tweens.length) kick();
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${idx + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
  if (lesson.voiceKey !== voice.key) { voice.key = lesson.voiceKey; voice.speak(lesson.voiceText); }
  if (needFrame) { needFrame = false; frame(lesson.frame()); }
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 125%. The frame's top sits at the top of the
// screen (the words on rows 0–2 at the top, never an empty band above them); it's centred across.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 24, bottom = 110;
  const s = Math.min((W - 32) / sq(f.w), (H - top - bottom - 16) / sq(f.h), (lesson && lesson.maxZoom) || 1.25);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { camTo = null; Object.assign(cam, t); applyCam(); return; }
  if (camTo && Math.abs(camTo.x - t.x) + Math.abs(camTo.y - t.y) + Math.abs(camTo.s - t.s) < 1e-6) return;
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- typing: a keyboard still works on a Mac (the drawn digit pad is how a child writes) ----------
const keys = document.getElementById("keys");
addEventListener("keydown", e => {
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); act(`dig:${e.key}`); }
  else if (e.key === "Backspace") { e.preventDefault(); act("dig:del"); }
  else if (e.key === "Enter") { e.preventDefault(); act("check"); }
});

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; mouse and touch alike ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  if (down) return;
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { id: e.pointerId, p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
});
svg.addEventListener("pointermove", e => {
  if (!down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
function up(e) {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); render(); frame(lesson.frame()); return; }
  if (d.moved || e.type === "pointercancel") return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) { render(); frame(lesson.frame()); }
}
svg.addEventListener("pointerup", up);
svg.addEventListener("pointercancel", up);
function act(a) {
  if (a === "speak") { voice.speak(lesson.replay); return; }
  if (a === "next") { leave(); return; }
  if (busy()) return;
  lesson.act(a);
  render(); frame(lesson.frame());
}

// ============================================================================================================
// ---------- the 1st grade kit (built once; later chapters reuse it) ----------
// X0: the picture's left edge (a block line). A counter is a dot in a 3 x 3 cell; rows of ten are 30 squares, so the
// strong lines fall after every fifth counter. The line 0 to 20 is 3 squares a step, 0 on X0, every 5 on a strong line.
const X0 = 5, CR = 1.3;
const xOf = n => X0 + 3 * n;
function counter(k, x, y, style, o = {}) {
  const fill = style === "solid" ? "var(--chapter)" : style === "striped" ? "url(#stripes)" : "url(#dots)";
  put(k, "circle", { cx: sq(x + 1.5), cy: sq(y + 1.5), r: sq(CR), fill, stroke: "var(--chapter)", "stroke-width": 1.5, opacity: o.op ?? null }, o.live ? "none" : "fade");
  if (o.crossed) line(`${k}x`, x + 0.4, y + 2.6, x + 2.6, y + 0.4, { c: "var(--ink)" });
}
// a row of n places (dashed 3 x 3 cells); full: its outline goes solid in the chapter colour
function places(k, x, y, n, o = {}) {
  const c = o.full ? "var(--chapter)" : "var(--ink3)", f = !!o.full;
  rect(`${k}o${f}`, x, y, 3 * n, 3, { c, dash: !f });
  for (let i = 1; i < n; i++) line(`${k}d${i}${f}`, x + 3 * i, y, x + 3 * i, y + 3, { c, dash: !f });
}
// the number line 0 to 20 on row y; lit numbers in the chapter colour, one ringed
function numLine(k, y, o = {}) {
  line(k, X0, y, xOf(20), y);
  for (let n = 0; n <= 20; n++) {
    const x = xOf(n), lit = o.lit && o.lit.has(n);
    line(`${k}t${n}`, x, y, x, y + (n % 5 ? 0.5 : 1));
    text(`${k}n${n}${lit ? "L" : ""}`, n, x, y + 1.85, "small", { c: lit ? "var(--chapter)" : null });
  }
  if (o.ring != null) ring(`${k}r${o.ring}`, xOf(o.ring), y + 1.85, 1.15);
}
// a hop: an arc from x1 to x2 standing on row y, h squares high, with its arrowhead where it lands
function hopArc(k, x1, x2, y, h, o = {}) {
  const mx = (x1 + x2) / 2, d = `M${sq(x1)} ${sq(y)}Q${sq(mx)} ${sq(y - 2 * h)} ${sq(x2)} ${sq(y)}`;
  path(k, d, { c: o.c || "var(--chapter)", live: o.live });
  const tx = (x2 - mx), ty = 2 * h, l = Math.hypot(tx, ty), ux = tx / l, uy = ty / l, a = 0.6;
  const p = (s, n) => `${sq(x2 - ux * a * s - uy * a * n)} ${sq(y - uy * a * s + ux * a * n)}`;
  path(`${k}a`, `M${p(1, 0.6)}L${sq(x2)} ${sq(y)}L${p(1, -0.6)}`, { c: o.c || "var(--chapter)", live: o.live });
}
// the drawn number row (G 2 Nov: tap, not type): 0–10 on one row, 11–20 under it with each teen under its ones,
// every cell 3 x 3 squares. Tapping a number writes it in the record's box.
function numberRow(k, x, y, o = {}) {
  const cell = (n, cx, cy) => {
    const bad = o.wrong === n;
    rect(`${k}c${n}${bad}`, cx, cy, 3, 3, { c: bad ? "var(--wrong)" : "var(--ink3)" });
    text(`${k}n${n}${bad}`, n, cx + 1.5, cy + 1.5, "maths", { c: bad ? "var(--wrong)" : null });

      if (st === "write") digitPad(X0, PY, "row");
      if (st === "done") nextBlock(X0, PY);
    },
  });
  return L;
}

// ---------- Count to 120 (g1-count120): how many? ----------
// The chart from 1, its first n places shaded, numbers left off. Tap each full row: it counts by tens (10, 20 …);
// then drag along the rest; then write how many. The chart is 12 rows (60 squares), too tall to keep a block big, so
// four rows show at a time and the chart turns on by three rows as the count goes down it.

  const { n } = P, T = tensOf(n), o = onesOf(n), rows = 4, CB = CY + BK * rows, RY = CB + 2.5, PY = CB + 5;
  const winOf = f => f < 4 ? 0 : Math.min(8, 3 + 3 * Math.floor((f - 4) / 3));

  const L = writer3({
    id: "count120", maxZoom: 1.25, stage: "tens", rowsDone: 0, counted: 0, skipped: false, grabbed: null, msg: null, prob: { ...P },
    boxes: [{ id: "s", ans: n, other: "Count the full rows by tens, then the rest by ones.",
      slips: slips3(n, [[o ? `${T * 10}${o}` : -1, `${n} is ${T} tens and ${o}: ${[...String(n)].join(", ")}.`], [n - 1, "Touch each place once."], [n + 1, "Touch each place once."],
        [o ? T * 10 : -1, "That's only the full rows. Count on the rest too."]]) }],
    progress() { return stageIndex(stages, this.stage === "see" ? (o ? "ones" : "tens") : this.stage); },
    r0() { return winOf(this.stage === "tens" ? this.rowsDone : o ? T : T - 1); },
    frame() { const wr = this.stage === "write" || this.stage === "done"; return { x: 4, y: -1, w: CR_X + 4 - 4, h: (wr ? PY + 3 : CB + 1) + 2 }; },
    onCounted() { this.stage = "see"; later(900, () => { this.stage = "write"; this.active = "s"; }); },
    tap(q) {
      if (this.stage !== "tens" || busy()) return false;
      const r0 = this.r0(), v = chartAt(q, r0, rows); if (v == null) return false;
      const r = rowOf(v);
      if (r < this.rowsDone) return false;
      if (r === this.rowsDone && r < T) {
        this.rowsDone++; this.msg = null;
        if (this.rowsDone === T) { if (o) this.stage = "ones"; else { this.stage = "see"; later(900, () => { this.stage = "write"; this.active = "s"; }); } }
        return true;
      }
      if (r < T) { miss(this, "Count the rows in order, from the top."); return true; }
      if (r === T && o) { miss(this, `That row has only ${o}. Tap the full rows first.`); return true; }
      return false;
    },
    grab(q) {
      if (this.stage !== "ones" || busy()) return false;
      const v = chartAt(q, this.r0(), rows); if (v == null || rowOf(v) !== T) return false;
      const pc = placeCounter(this, 10 * T + 1, n), nx = pc.next();
      if (v > nx && v <= n) return deadGrab(this, SKIP);
      if (v > n) return false;
      this.grabbed = true; this.skipped = false; this.lastQ = q; pc.enter(v); return true;
    },
    drag(q) { if (this.grabbed !== true) return; const pc = placeCounter(this, 10 * T + 1, n), r0 = this.r0(); walk(this, q, p => pc.enter(chartAt(p, r0, rows))); },
    release() {
      const g = this.grabbed; this.grabbed = null; this.lastQ = null;
      if (g !== true || this.stage !== "ones") return;
      if (this.skipped) miss(this, SKIP);
      this.skipped = false;
    },
    act(x) { writeAct(this, x); },
    scene() {
      const st = this.stage, r0 = this.r0();
      head(this, { tens: "Tap each full row to count by tens.", ones: "Now drag along the rest to count on.",
        see: o ? "Now drag along the rest to count on." : "Tap each full row to count by tens.",
        write: "Write how many are shaded.", done: n >= 100 ? "Ten tens is 100, and counting goes on." : "After 9 ones comes a new ten." }[st], null, 46);
      for (let v = 10 * r0 + 1; v <= Math.min(120, 10 * (r0 + rows)); v++) {
        if (v <= n) fillPlace("sh", v, r0, "var(--tint-strong)");
        if (v > 10 * T && v <= 10 * T + this.counted) chartNum("cn", v, r0, { c: "var(--ink)" });
      }

        rect(`rw${r}_${r0}`, X0, CY + BK * (r - r0), 50, BK, { c: "var(--chapter)" });
        readout(`rt${r}_${r0}`, 10 * (r + 1), CR_X, CY + BK * (r - r0) + 2.5);
      }
      if (st === "write" || st === "done") recordW(this, "rec", [{ box: "s", cells: 3 }], X0, RY);
      if (st === "write") digitPad(X0, PY, "row");
      if (st === "done") nextBlock(X0, PY);
    },
  });
  return L;
}

// ---------- Tens and ones (g1-tensones) ----------
// Counters 3 x 3 arrive loose in rows of ten, each in its own outlined place, rows a square apart, the last row short.
// Tap a full row: it closes into one ten (a chapter outline, its inner lines faint, 10 at its end). Then count the
// ones; then write the number. The record and the pad sit beside the picture, so a tall picture keeps its size.
function dTensOnes(idx, P = GEN.tensones(idx)) {
  const { n } = P, t = tensOf(n), o = onesOf(n), PY = 6, RX = 40, R = t + (o ? 1 : 0), rowY = r => PY + 4 * r;
  const stages = ["group", "count", "write", "done"];
  const recToks = [t, { w: t === 1 ? "ten and" : "tens and" }, o, { w: o === 1 ? "one is" : "ones is" }, { box: "s", cells: 2 }];
  const L = writer3({
    id: "tensones", maxZoom: 1.25, stage: "group", grouped: [], counted: [], grabbed: null, msg: null, prob: { n, t, o },
    boxes: [{ id: "s", ans: n, other: "Count the tens by 10s, then count on the ones.",
      slips: slips3(n, [[t + o, `Each ten is worth 10, not 1. ${pl(t, "ten", "tens")} is ${10 * t}.`], [o * 10 + t, `The tens come first. Write ${t}, then ${o}.`],
        [10 * t, `That's only the tens. Add the ${pl(o, "one", "ones")} too.`]]) }],
    progress() { return stageIndex(stages, this.stage === "see" ? "count" : this.stage); },
    frame() {
      const wr = this.stage === "write" || this.stage === "done";
      const bottom = Math.max(rowY(R) - 1 + (o ? 1.5 : 0), wr ? PY + 4 + 16 : 0);
      const right = wr ? measure(() => recordW(this, "m", recToks, RX, PY + 1.5)) : RX + 14;
      return { x: 4, y: -1, w: right + 1 - 4, h: bottom + 2 };
    },
    rowAt(q) { const r = Math.floor((q.y - PY) / 4); if (r < 0 || r >= R || q.y - rowY(r) > 3.3 || q.x < X0 - 0.3 || q.x > xOf(r < t ? 10 : o) + 0.3) return null; return r; },
    toWrite(ms) { later(ms, () => { this.stage = "write"; this.active = "s"; }); },
    tap(q) {
      if (busy()) return false;
      const r = this.rowAt(q); if (r == null) return false;
      if (this.stage === "group") {
        if (r === t) { miss(this, `That's only ${o}. A ten needs 10.`); return true; }
        if (this.grouped.includes(r)) return false;
        this.grouped.push(r); this.msg = null;
        if (this.grouped.length === t) { if (o) this.stage = "count"; else { this.stage = "see"; this.toWrite(1500); } }
        return true;
      }
      if (this.stage === "count" && r < t) { miss(this, "That's a ten. Count the ones on their own."); return true; }
      return false;
    },
    grab(q) {
      if (this.stage !== "count" || busy()) return false;
      if (this.rowAt(q) !== t) return false;
      this.grabbed = true; this.lastQ = q; this.msg = null; this.count(q); return true;
    },
    count(q) {
      if (q.y < rowY(t) - 0.3 || q.y > rowY(t) + 3.3) return;
      const j = Math.floor((q.x - X0) / 3);
      if (j < 0 || j >= o || this.counted.includes(j) || this.stage !== "count") return;
      this.counted.push(j);
      if (this.counted.length === o) { this.stage = "see"; this.toWrite(900); }
    },
    drag(q) { if (this.grabbed) walk(this, q, p => this.count(p)); },
    release() { this.grabbed = null; this.lastQ = null; },
    act(x) { writeAct(this, x); },
    scene() {
      const st = this.stage, wr = st === "write" || st === "done";
      head(this, { group: "Tap each full row to make a ten.", count: "Now count the ones.", see: o ? "Now count the ones." : "No ones on their own.",
        write: "Write the number that goes in the box.", done: "The first digit counts tens; the second counts ones." }[st], null, 46);
      for (let r = 0; r < R; r++) {
        const y = rowY(r), len = r < t ? 10 : o, g = this.grouped.includes(r);
        for (let j = 0; j < len; j++) {
          if (!g) rect(`co${r}_${j}`, xOf(j), y, 3, 3, { c: "var(--ink2)" });
          counter(`c${r}_${j}`, xOf(j), y, "solid");
        }
        if (g) {
          for (let j = 1; j < 10; j++) line(`gd${r}_${j}`, xOf(j), y, xOf(j), y + 3, { c: "var(--ink3)", dash: true });
          rect(`g${r}`, X0, y, 30, 3, { c: "var(--chapter)" });
          label(`gl${r}`, "10", xOf(10), y + 1.5, { c: "var(--chapter)" });
        }
      }
      // the ones as they're counted: their numbers under them
      this.counted.forEach((j, i) => text(`cn${j}`, i + 1, xOf(j) + 1.5, rowY(t) + 4.1, "small", { c: "var(--chapter)" }));
      if (!wr) {
        const k = this.grouped.length;
        if (k) readout(`rt${k}`, st === "group" ? runOf(Array.from({ length: k }, (_, i) => pl(i + 1, "ten", "tens"))) : pl(t, "ten", "tens"), RX, PY + 1.5);
        if (this.counted.length) readout(`ro${this.counted.length}`, runOf(this.counted.map((_, i) => i + 1)), RX, rowY(t) + 1.5);
      }
      if (wr) recordW(this, "rec", recToks, RX, PY + 1.5);
      if (st === "write") digitPad(RX, PY + 4, "grid");
      if (st === "done") nextBlock(RX, PY + 4);
    },
  });
  return L;
}

// ---------- Compare two-digit numbers (g1-compare) ----------
// Both numbers as tens (closed rows) and ones, side by side, a block between; each number written over its stack, so
// the problem is the picture's names and the record is that line: the sign is written into the gap. Tap the number
// with more tens (same tens: look at the ones); then tap the sign (<, = and > in the gap, under the record).
function dCompare(idx, P = GEN.compare(idx)) {
  const { a, b } = P, ta = tensOf(a), tb = tensOf(b), ao = onesOf(a), bo = onesOf(b);
  const NY = 8, SY = 11, AX = X0, BX = 40, GX = 36, SIGN = a < b ? "<" : a > b ? ">" : "=";
  // the closed tens stack touching (nothing on them is tapped), the ones a square under them, so 9 tens and 9 ones
  // are 31 squares tall and the camera stays near 75%

  const bottom = Math.max(SY + H, SY + 11), shortBottom = SY + Math.min(hOf(ta, ao), hOf(tb, bo));
  const nextAt = shortBottom + 5 <= bottom ? [hOf(ta, ao) <= hOf(tb, bo) ? AX : BX, shortBottom + 2] : [AX, bottom + 2];
  const stages = ta !== tb ? ["tens", "sign", "done"] : ["tens", "ones", "sign", "done"];
  const big = a >= b ? "A" : "B";
  const L = {
    id: "compare", maxZoom: 1.25, stage: "tens", msg: null, note: null, picked: null, wrongPick: null, signWrong: null, prob: { ...P, SIGN },
    progress() { return stageIndex(stages, this.stage); },
    frame() { return { x: 4, y: -1, w: 67, h: (this.stage === "done" ? Math.max(bottom, nextAt[1] + 2) : bottom) + 2 }; },
    act(x) {
      if (x.startsWith("pick:") && (this.stage === "tens" || this.stage === "ones")) {
        const side = x.slice(5), [bn, sn] = a >= b ? [a, b] : [b, a];
        if (this.stage === "tens") {
          if (ta === tb) { this.note = `Same tens: ${ta} and ${tb}. Look at the ones.`; this.msg = null; this.stage = "ones"; return; }
          if (side === big) { this.picked = side; this.msg = null; this.wrongPick = null; this.stage = "sign"; return; }
          this.wrongPick = side;
          return miss(this, `${bn} has ${pl(tensOf(bn), "ten", "tens")} and ${sn} has ${tensOf(sn)}. ${pl(tensOf(bn), "ten", "tens")} is more.`);
        }
        if (ao === bo) { this.note = "Same tens, same ones."; this.msg = null; this.stage = "sign"; return; }
        if (side === big) { this.picked = side; this.msg = null; this.wrongPick = null; this.note = null; this.stage = "sign"; return; }
        this.wrongPick = side;
        return miss(this, `${bn} has ${pl(onesOf(bn), "one", "ones")} and ${sn} has ${onesOf(sn)}. ${pl(onesOf(bn), "one", "ones")} is more.`);
      }
      if (x.startsWith("sign:") && this.stage === "sign") {
        const s = x.slice(5);
        if (s === SIGN) { this.signWrong = null; this.msg = null; this.note = null; this.stage = "done"; return; }
        this.signWrong = s;
        miss(this, a === b ? "Same tens and same ones, so the numbers are equal." : s === "=" ? `${a} and ${b} are not the same number.` : `The open side faces the bigger number, ${Math.max(a, b)}.`);
      }
    },
    scene() {
      const st = this.stage;
      head(this, { tens: "Tap the number with more tens.", ones: "Tap the number with more ones.", sign: "Tap the sign that goes between them.",
        done: "More tens is bigger; with the same tens, more ones is bigger." }[st], this.msg ? null : this.note, 46);
      const onesLit = st !== "tens" && ta === tb;
      const stack = (K, x, t, o) => {
        for (let r = 0; r < t; r++) {
          const y = SY + 3 * r;
          for (let j = 0; j < 10; j++) counter(`${K}c${r}_${j}`, x + 3 * j, y, "solid");
          for (let j = 1; j < 10; j++) line(`${K}d${r}_${j}`, x + 3 * j, y, x + 3 * j, y + 3, { c: "var(--ink3)", dash: true });
          rect(`${K}g${r}`, x, y, 30, 3, { c: "var(--chapter)" });
        }
        const y = SY + 3 * t + (t ? 1 : 0);
        for (let j = 0; j < o; j++) { rect(`${K}oo${j}`, x + 3 * j, y, 3, 3, { c: "var(--ink2)" }); counter(`${K}o${j}`, x + 3 * j, y, "solid"); }
        if (onesLit && o) rect(`${K}lit`, x - 0.5, y - 0.5, 3 * o + 1, 4, { c: "var(--chapter)", dash: true });
        if (st === "tens" || st === "ones") put(`${K}hit`, "rect", { x: sq(x), y: sq(NY - 1.5), width: sq(30), height: sq(SY + Math.max(3, hOf(t, o)) - NY + 1.5), fill: "transparent", "data-act": `pick:${K}` }, "none");
      };
      stack("A", AX, ta, ao); stack("B", BX, tb, bo);
      // the record: the numbers over their stacks, the sign written between them once it's found
      const wc = s => this.msg && this.wrongPick === s ? "var(--wrong)" : null;
      digits(`nA${wc("A") || ""}`, String(a), AX + 30, NY, { c: wc("A") });
      digits(`nB${wc("B") || ""}`, String(b), BX + 2 * String(b).length, NY, { c: wc("B") });
      if (this.picked === "A") ringAt("pkA", AX + 30 - String(a).length, NY, String(a).length + 0.4);
      if (this.picked === "B") ringAt("pkB", BX + String(b).length, NY, String(b).length + 0.4);
      if (st === "done") text(`sg${SIGN}`, SIGN, GX + 1.5, NY, "maths");
      // the readouts: each number's tens (and ones, once they decide), beside it
      if (st !== "tens") {
        const ro = (t, o) => onesLit || this.note === "Same tens, same ones." ? `${pl(t, "ten", "tens")}, ${pl(o, "one", "ones")}` : pl(t, "ten", "tens");
        readout(`roA${st}`, ro(ta, ao), AX + 30 - 2 * String(a).length - 1.5, NY, "end");
        readout(`roB${st}`, ro(tb, bo), BX + 2 * String(b).length + 1.5, NY);
      }
      // the signs, under the record in the gap
      if (st === "sign") ["<", "=", ">"].forEach((s, i) => {
        const y = SY + 4 * i, stt = this.msg && this.signWrong === s ? "wrong" : null, c = stt ? "var(--wrong)" : "var(--ink)";
        rect(`sb${s}${stt || ""}`, GX, y, 3, 3, { c });
        text(`st${s}${stt || ""}`, s, GX + 1.5, y + 1.5, "maths", { c: stt ? c : null });
        put(`sh${s}`, "rect", { x: sq(GX), y: sq(y), width: sq(3), height: sq(3), fill: "transparent", "data-act": `sign:${s}` }, "none");
      });
      if (st === "done") nextBlock(nextAt[0], nextAt[1]);
    },
  };
  return L;
}

// ---------- 10 more, 10 less (g1-tenmore) ----------
// Three rows of the 120 chart: n's row, the row above and the row below, n ringed. Drag the ring down (10 more) or up
// (10 less): it snaps a place at a time; the readout says how far. Then both numbers' tens digits light and their
// ones digits are underlined: the ones stay. Write the record.
function dTenMore(idx, P = GEN.tenmore(idx)) {
  const { n, more } = P, w = more ? "more" : "less", dir = more ? "down" : "up", res = more ? n + 10 : n - 10, o = onesOf(n), newT = tensOf(res);
  const r0 = rowOf(n) - 1, rows = 3, CB = CY + BK * rows, RY = CB + 3, PY = CB + 6, op = more ? "+" : "−";
  const stages = ["drag", "write", "done"];
  const L = writer3({
    id: "tenmore", maxZoom: 1.25, stage: "drag", ring: n, grabbed: false, msg: null, prob: { ...P, res },
    boxes: [{ id: "s", ans: res, other: `${pl(newT, "ten", "tens")} and ${pl(o, "one", "ones")}.`,
      slips: slips3(res, [[n + (more ? 1 : -1), `That's 1 ${w}. For 10 ${w}, change the tens and keep ${o ? `the ${pl(o, "one", "ones")}` : "the ones the same"}.`],
        [more ? n - 10 : n + 10, `That's 10 ${more ? "less" : "more"}. You want 10 ${w}.`],
        [newT, `That's only the tens. ${o ? `Put the ${pl(o, "one", "ones")} back on the end.` : "Put the 0 back in the ones place."}`]]) }],
    progress() { return stageIndex(stages, this.stage === "see" ? "drag" : this.stage); },
    frame() { const wr = this.stage === "write" || this.stage === "done"; return { x: 4, y: -1, w: 52, h: (wr ? PY + 3 : RY + 1) + 2 }; },
    grab(q) {
      if (this.stage !== "drag" || busy()) return false;
      const c = cellOf(n, r0);
      if (q.x < c.x - 0.5 || q.x > c.x + BK + 0.5 || q.y < c.y - 0.5 || q.y > c.y + BK + 0.5) return false;
      this.grabbed = true; this.msg = null; return true;
    },
    drag(q) { if (this.grabbed) this.ring = chartAt(q, r0, rows, true); },
    release() { if (!this.grabbed) return; this.grabbed = false; this.land(this.ring); },
    tap(q) {
      if (this.stage !== "drag" || busy()) return false;
      const v = chartAt(q, r0, rows); if (v == null || v === n) return false;
      this.land(v); return true;
    },
    land(v) {

      this.ring = n;
      miss(this, d === -(res - n) ? `That's 10 ${more ? "less" : "more"}. Go ${dir} for 10 ${w}.` : `That's ${Math.abs(d)} ${d > 0 ? "more" : "less"}. 10 ${w} is one row ${dir}.`);
    },
    act(x) { writeAct(this, x); },
    scene() {
      const st = this.stage, wr = st === "write" || st === "done", found = st !== "drag";
      head(this, { drag: `Drag the ring to 10 ${w}.`, see: `Drag the ring to 10 ${w}.`, write: "Write the number that goes in the box.",
        done: more ? "One row down is one more ten; the ones stay." : "One row up is one ten less; the ones stay." }[st], null, 46);
      for (let v = 10 * r0 + 1; v <= 10 * (r0 + rows); v++) {

        else chartNum("cn", v, r0);
      }
      chartLines("ch", r0, rows);
      const c = cellOf(this.ring, r0);
      ringAt(this.grabbed ? "rgLive" : `rg${this.ring}`, c.x + 2.5, c.y + 2.5, 2.1, this.grabbed);
      // how far the ring is from n, under the chart in the ring's column

  });

}

// ---------- lessons, the bar ----------
let lesson, idx = 0;
const LESSONS = {
  count120: { name: "Count to 120", make: (i, P) => { P = P || GEN.count(i); return P.kind === "many" ? dHowMany(i, P) : dCountOn(i, P); } },
  tensones: { name: "Tens and ones", make: dTensOnes },
  compare: { name: "Compare two-digit numbers", make: dCompare },
  tenmore: { name: "10 more, 10 less", make: dTenMore },

const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id, i = 0, P) {
  id = String(id).replace(/^g1-/, "");
  if (!LESSONS[id]) id = "count120";
  tweens = []; timers.forEach(clearTimeout); timers.clear();
  idx = i;
  lesson = LESSONS[id].make(i, P);
  pick.value = id;
  drawn = new Set(); voice.key = null; keys.blur();
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g1ch3-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value, 0);
document.getElementById("fresh").onclick = () => leave();
function leave() { start(lesson.id, idx + 1); }
let first = "count120", firstI = 0;
try {
  const q = new URLSearchParams(location.search);
