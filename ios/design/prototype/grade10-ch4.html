<title>Congruent triangles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* 10th grade, chapter 4: Congruent triangles (ios/design/grade10.md). Kit and engine from grade10-ch3.html (and ch2, ch1). The whole screen is one sheet of graph paper
   seen through one camera; the floating pill at the bottom is the only chrome. 1 square = 20 paper units, a strong line
   every 5 squares (a block). Chapter colour: grade10.md names none, so this is the geometry colour of new5-lessons.html. */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #1E8A78; --tint: rgba(30, 138, 120, .2); --tint-strong: rgba(30, 138, 120, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #4FD1BC; --tint: rgba(79, 209, 188, .22); --tint-strong: rgba(79, 209, 188, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #4FD1BC; --tint: rgba(79, 209, 188, .22); --tint-strong: rgba(79, 209, 188, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit of new5-lessons.html) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set();
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in
let TOOL = false;     // what's put now is a tool lying on the paper (compass, ruler), not the picture
function put(k, tag, a, kind = "fade", text, delay = 0) { if (TOOL) a = { ...a, "data-tool": 1 }; items.push({ k, tag, a, kind, text, delay }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash || o.live ? null : 1 },
    o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay || 0);
}
const seg = (k, p, q, o) => line(k, p.x, p.y, q.x, q.y, o);
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, "stroke-linejoin": "round",
    pathLength: o.live ? null : 1 }, o.live ? "none" : "line", undefined, o.delay || 0);
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null,
    pathLength: o.c && !o.fill ? 1 : null }, o.live ? "none" : o.c && !o.fill ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade", undefined, o.delay || 0); }
function ringAt(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": 1.5, pathLength: o.live ? null : 1 }, o.live ? "none" : "line", undefined, o.delay || 0); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s, o.delay || 0);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) { text(`${k}${i}${s[i]}`, s[i], right - col - 1, row, "maths", { c: o.c }); col += 2; }
}
// maths in the record: digits 2 squares each (school's squared paper), letters close as school writes names,
// ° hugging the digit before it, ∠ and ∥ drawn as marks; returns where it ends (in squares)
function mrow(k, s, x, row, c) {
  let col = x;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], kk = `${k}${i}${ch}`;
    if (ch === " ") { col += 0.6; continue; }
    if (ch === "∠") { path(kk, `M${sq(col + 1.5)} ${sq(row - 0.75)}L${sq(col + 0.2)} ${sq(row + 0.65)}H${sq(col + 1.6)}`, { c: c || "var(--ink)" }); col += 1.9; continue; }
    if (ch === "∥") { line(`${kk}a`, col + 0.45, row + 0.8, col + 0.8, row - 0.8, { c }); line(`${kk}b`, col + 1.05, row + 0.8, col + 1.4, row - 0.8, { c }); col += 1.9; continue; }
    if (/[0-9]/.test(ch)) {
      const run = s.slice(i).match(/^[0-9.]+/)[0];
      if (run.includes(".") && !run.endsWith(".")) { text(kk + run, run, col + 0.3, row, "maths", { c, anchor: "start" }); col += decW(run); i += run.length - 1; continue; }
      text(kk, ch, col + 1, row, "maths", { c }); col += 2; continue;
    }
    if (ch === "°") { text(kk, ch, col - 0.2, row, "maths", { c, anchor: "start" }); col += 0.9; continue; }
    if (ch === "′" || ch === "″") { text(kk, ch, col - 0.1, row, "maths", { c, anchor: "start" }); col += ch === "′" ? 0.5 : 0.8; continue; }
    const w = "(),:".includes(ch) ? 0.8 : ch === "→" ? 2.2 : ch === "=" || ch === "÷" || ch === "+" || ch === "M" ? 1.6 : 1.35;
    text(kk, ch, col + w / 2, row, "maths", { c }); col += w;
  }
  return col;
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// an answer box in the record: cells of 2 squares, the typed digits on the right, the cursor after them
function dbox(k, x, y, cells, value, state) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : "var(--ink)";
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (value && value.includes(".")) text(`${k}v${value}`, value, x + cells * 2 - 0.4, y + 1, "maths", { anchor: "end", c: state === "right" || state === "wrong" ? c : null });
  else if (value) digits(`${k}v${value}`, value, x + cells * 2, y + 1, { c: state === "right" || state === "wrong" ? c : null });
  if (state === "active") put(`${k}cur`, "line", { x1: sq(x + cells * 2 + 0.4), y1: sq(y + 0.35), x2: sq(x + cells * 2 + 0.4), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": "type" }, "none");
}

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none", a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${(Math.min(n++ * 0.035, 1.2) + it.delay).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    out += `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
  }
  sceneEl.innerHTML = out;
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: fits what the lesson shows, its top row at the top of the screen (the words on rows 0-2), eased 0.75 s
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 16, bottom = 96;
  const s = Math.min((W - 48) / sq(f.w), (H - top - bottom) / sq(f.h), (lesson && lesson.maxZoom) || 1.6);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/-/g, "−").replace(/,/g, ".").replace(/[^0-9−.]/g, "").replace(/(?!^)−/g, "").replace(/(\..*)\./g, "$1").slice(0, 5)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (the tools, a point) or pan the paper ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { if (down.moved) { lesson.drag(toPaper(e)); render(); } return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e), d.moved); render(); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) render();
});
function act(a) {
  if (a === "type") { if (lesson.typing) openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render();
}
// timers for the See beats; a new problem cancels the old one's
let token = 0;
function after(ms, fn) { const t = token; setTimeout(() => { if (t !== token) return; fn(); render(); }, ms); }

// ---------- geometry on the paper (in squares; y runs down the page, so "up" is a negative angle) ----------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const V = (x, y) => ({ x, y });
const add = (a, b) => V(a.x + b.x, a.y + b.y), sub = (a, b) => V(a.x - b.x, a.y - b.y), mul = (a, k) => V(a.x * k, a.y * k);
const lerp = (a, b, t) => V(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angOf = (c, p) => Math.atan2(p.y - c.y, p.x - c.x);
const unit = a => V(Math.cos(a), Math.sin(a));
const polar = (c, r, a) => V(c.x + r * Math.cos(a), c.y + r * Math.sin(a));
const rot = (v, a) => V(v.x * Math.cos(a) - v.y * Math.sin(a), v.x * Math.sin(a) + v.y * Math.cos(a));
const mod = (a, m) => ((a % m) + m) % m;
const wrapPi = a => mod(a + Math.PI, TAU) - Math.PI;
const near = (a, b, e = 0.01) => dist(a, b) < e;
const fmt = v => Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1);
const val = (v, L) => typeof v === "function" ? v(L) : v || "";
// an arc is { t: "arc", c, r, a0, a1 } with a0 < a1 (a whole circle: a1 - a0 = TAU); a line is { t: "seg", a, b }
const arcHas = (a, ang) => a.a1 - a.a0 >= TAU - 1e-9 || mod(ang - a.a0, TAU) <= a.a1 - a.a0 + 1e-9;
function onObj(o, p) {
  if (o.t === "seg") { const d = sub(o.b, o.a), t = ((p.x - o.a.x) * d.x + (p.y - o.a.y) * d.y) / (d.x * d.x + d.y * d.y); return t >= -1e-6 && t <= 1 + 1e-6; }
  return arcHas(o, angOf(o.c, p));
}
function interCL(c, r, a, b) {
  const d = sub(b, a), f = sub(a, c), A = d.x * d.x + d.y * d.y, B = 2 * (f.x * d.x + f.y * d.y), C = f.x * f.x + f.y * f.y - r * r, disc = B * B - 4 * A * C;
  if (disc < -1e-9) return [];
  const s = Math.sqrt(Math.max(0, disc));
  return [(-B - s) / (2 * A), (-B + s) / (2 * A)].map(t => add(a, mul(d, t)));
}
function interCC(c1, r1, c2, r2) {
  const d = dist(c1, c2);
  if (d < 1e-9 || d > r1 + r2 + 1e-9 || d < Math.abs(r1 - r2) - 1e-9) return [];
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const m = add(c1, mul(sub(c2, c1), a / d)), n = V(-(c2.y - c1.y) / d, (c2.x - c1.x) / d);
  return h < 1e-9 ? [m] : [add(m, mul(n, h)), sub(m, mul(n, h))];
}
function interLL(a, b, c, d) {
  const r = sub(b, a), s = sub(d, c), den = r.x * s.y - r.y * s.x;
  if (Math.abs(den) < 1e-12) return [];
  return [add(a, mul(r, ((c.x - a.x) * s.y - (c.y - a.y) * s.x) / den))];
}
function crossings(objs) {
  const out = [];
  for (let i = 0; i < objs.length; i++) for (let j = i + 1; j < objs.length; j++) {
    const o = objs[i], q = objs[j];
    const pts = o.t === "seg" && q.t === "seg" ? interLL(o.a, o.b, q.a, q.b) : o.t === "seg" ? interCL(q.c, q.r, o.a, o.b)
      : q.t === "seg" ? interCL(o.c, o.r, q.a, q.b) : interCC(o.c, o.r, q.c, q.r);
    for (const p of pts) if (onObj(o, p) && onObj(q, p)) out.push(p);

// an arc's path, from angle a to angle b (either way round)

  return `M${sq(p0.x)} ${sq(p0.y)}A${sq(r)} ${sq(r)} 0 ${Math.abs(span) > Math.PI ? 1 : 0} ${span > 0 ? 1 : 0} ${sq(p1.x)} ${sq(p1.y)}`;
}

// ---------- marks school puts on a picture ----------
// a point's name, half a square off it (lab: which way, in squares)
function nameAt(k, s, p, lab, c) {
  const [dx, dy] = lab;
  text(k, s, p.x + dx * 0.9, p.y + dy * 1.15, "say", { anchor: dx > 0.3 ? "start" : dx < -0.3 ? "end" : "middle", c });
}
// a bracket beside a segment that slides along it, counting squares (t: how far it has gone, 0 to 1)
function bracket(k, p, q, side, t, name, per = 1) {
  const len = dist(p, q), u = mul(sub(q, p), 1 / len), n = side;
  const a = add(p, mul(n, 1.5)), b = add(a, mul(u, len * t));
  seg(`${k}l`, a, b, { c: "var(--chapter)", live: true });
  seg(`${k}t0`, a, add(a, mul(n, -0.7)), { c: "var(--chapter)", live: true });
  seg(`${k}t1`, b, add(b, mul(n, -0.7)), { c: "var(--chapter)", live: true });
  const lp = add(lerp(a, b, t < 1 ? 1 : 0.5), mul(n, 1.3));
  const s = t < 1 ? String(Math.floor(len * t / per)) : `${name} = ${fmt(len / per)}`;
  text(`${k}n`, s, lp.x, lp.y, "small", { c: "var(--chapter)", live: true, anchor: Math.abs(n.x) > 0.5 ? (n.x > 0 ? "start" : "end") : "middle" });
}
// 7th grade's protractor laid on the paper: its middle on the corner, its flat side along one arm; a tick a degree,
// longer every 5° and 10°. dir -1 opens upward. Readings: [degrees, label] written just outside it.
function protractor(k, c, base, R, dir, reads) {
  path(`${k}o`, arcD(c, R, base, base + dir * Math.PI), { c: "var(--ink2)" });
  seg(`${k}b`, polar(c, R, base), polar(c, R, base + Math.PI), { c: "var(--ink2)" });
  for (let d = 0; d <= 180; d++) {
    const a = base + dir * d * DEG, len = d % 10 === 0 ? 1.3 : d % 5 === 0 ? 0.85 : 0.45;
    seg(`${k}t${d}`, polar(c, R, a), polar(c, R - len, a), { c: d % 5 ? "var(--ink3)" : "var(--ink2)", w: d % 5 ? 0.75 : 1.5 });
  }
  for (const [d, s, off = -8] of reads) { const p = polar(c, R + 1.8, base + dir * (d + off) * DEG); text(`${k}r${d}${s}`, s, p.x, p.y, "small", { c: "var(--chapter)" }); }
}
// the square corner mark (5th grade's): at p, between the directions u and v
function cornerMark(k, p, u, v, o = {}) {
  const a = add(p, mul(u, 1.2)), b = add(a, mul(v, 1.2)), c = add(p, mul(v, 1.2));
  path(k, `M${sq(a.x)} ${sq(a.y)}L${sq(b.x)} ${sq(b.y)}L${sq(c.x)} ${sq(c.y)}`, { c: "var(--chapter)", ...o });
}
// parallel arrowheads (5th grade's): on a line going along u, at p

  const n = V(-u.y, u.x), a = add(sub(p, mul(u, 0.7)), mul(n, 0.7)), b = sub(sub(p, mul(u, 0.7)), mul(n, 0.7));
  path(k, `M${sq(a.x)} ${sq(a.y)}L${sq(p.x)} ${sq(p.y)}L${sq(b.x)} ${sq(b.y)}`, { c: "var(--chapter)", ...o });
}

// ---------- the construction engine: compass, straightedge, pins (chapter 1; later chapters reuse it) ----------
// A lesson is a list of tasks. The compass is drawn on the paper as a tool: drag its point to lift it (it snaps to
// marked points), drag its pencil to open it (it snaps to a marked point, or to whole squares), turn it by its top to
// swing an arc. The straightedge is a plain ruler: drag it, turn it by an end; its edge snaps to marked points, and
// on release through the right two the line draws along it. Pin a crossing: tap where two drawn things cross.
const KNOB = 3;     // how far the compass's top stands off the line between its legs (seen from above)
function con(cfg) {
  const T = cfg.tasks, LR = (cfg.ruler && cfg.ruler.len) || 46;
  const L = {
    id: cfg.id, index: cfg.index, maxZoom: 1.25, ti: 0, msg: null, arcs: [], bad: null, lines: [], pts: {}, want: [], wrongPt: null,
    typed: "", typing: false, verdict: null, bi: 0, vals: {}, hold: null, t0: {}, flag: {}, wName: null, wLen: 0, LR, cfg,
    cmp: { N: { ...cfg.park.N }, w: cfg.park.w, phi: 0 },
    rul: cfg.ruler ? { p: { ...cfg.ruler.p }, a: cfg.ruler.a } : null,
    get task() { return T[this.ti]; },
    get stage() { return this.task.id; },
    progress() { return [this.ti, T.length - 1]; },
    frame() { return cfg.frame; },
    animating() { return this.task.kind === "see" || !!(cfg.animating && cfg.animating(this)); },
    tool() { const t = this.task; return t.tool !== undefined ? t.tool : { arc: "compass", open: "compass", walk: "compass", pin: "compass", ruler: "ruler" }[t.kind] || null; },
    at(n) { const p = this.pts[n]; return !!p && near(this.cmp.N, p); },
    wIs(v) { return Math.abs(this.cmp.w - v) < 0.01; },
    pen() { return polar(this.cmp.N, this.cmp.w, this.cmp.phi); },
    knob() { const u = unit(this.cmp.phi); return add(add(this.cmp.N, mul(u, this.cmp.w / 2)), V(u.y * KNOB, -u.x * KNOB)); },
    marks() { return Object.entries(this.pts).map(([n, p]) => ({ n, x: p.x, y: p.y, hide: p.hide })); },
    markNear(q, r, not) {
      let best = null, bd = r;
      for (const m of this.marks()) { if (not && near(m, not)) continue; const d = dist(m, q); if (d < bd) { bd = d; best = m; } }
      return best;
    },
    covers(c, r, a) { return this.arcs.some(x => near(x.c, c) && Math.abs(x.r - r) < 1e-6 && arcHas(x, a)); },
    geo() { return cfg.geo(this).concat(this.arcs, this.lines.map(l => ({ t: "seg", a: l.a, b: l.b }))); },
    passed(id) { return this.ti > T.findIndex(t => t.id === id); },
    phase(id) {
      const k = T.findIndex(t => t.id === id);
      if (this.ti > k) return 1; if (this.ti < k) return 0;
      const t0 = this.t0[id]; return t0 == null ? 0 : Math.min(1, (performance.now() - t0) / T[k].dur);
    },
    maxW() { return this.task.maxW ? val(this.task.maxW, this) : cfg.maxW || 30; },
    addPin(name, p, lab, kind = "pin") { this.pts[name] = { x: p.x, y: p.y, lab, kind }; },
    next() {
      const was = this.tool();
      this.ti = Math.min(this.ti + 1, T.length - 1); this.msg = null; this.bad = null; this.wrongPt = null; this.hold = null;
      const t = this.task;
      if (this.tool() === "ruler" && was !== "ruler") this.rul = { p: { ...cfg.ruler.p }, a: cfg.ruler.a };
      if (t.kind === "pin") this.want = t.want(this);
      if (t.kind === "type") { this.typing = true; this.typed = ""; this.verdict = null; this.bi = 0; }
      if (t.kind === "see") { this.t0[t.id] = performance.now(); after(t.dur, () => { if (this.task === t) this.next(); }); }
      if (t.enter) t.enter(this);
    },

    // ----- the hand: grab a tool (or the lesson's own point), drag it, let go -----
    grab(q) {
      const t = this.task, tool = this.tool();
      if (t.onGrab) t.onGrab(this);
      if (tool === "compass") {
        const dK = dist(q, this.knob()), dP = dist(q, this.pen()), dN = dist(q, this.cmp.N), m = Math.min(dK, dP, dN);
        if (m > 2.2) return false;
        if (m === dK) this.hold = { mode: "swing", last: angOf(this.cmp.N, q), cum: 0, lo: 0, hi: 0, phi0: this.cmp.phi };
        else if (m === dP) this.hold = { mode: "open", w0: this.cmp.w };
        else this.hold = { mode: "move", off: sub(this.cmp.N, q) };
        this.bad = null; this.wrongPt = null; this.msg = null;
        return true;
      }
      if (tool === "ruler") {

        if (tt < -1.5 || tt > 4 || s < -1 || s > LR + 1) return false;
        if (s < 8 || s > LR - 8) {

          let piv = on.length ? on.reduce((m, x) => (end ? x.s < m.s : x.s > m.s) ? x : m) : null;
          if (!piv) { const sp = end ? 0 : LR; piv = { p: add(r.p, mul(u, sp)), s: sp }; }
          this.hold = { mode: "turn", g0: q, a0: r.a, piv: V(piv.p.x, piv.p.y), sp: piv.s };
        } else this.hold = { mode: "slide", g0: q, p0: { ...r.p }, a0: r.a };

    },
    drag(q) {
      const h = this.hold, t = this.task;

      if (h.mode === "move") { const N = add(q, h.off), s = this.snapNeedle(N); this.cmp.N = s ? V(s.x, s.y) : N; }
      else if (h.mode === "open") this.setPencil(q, h.w0);
      else if (h.mode === "swing") {
        const a = angOf(this.cmp.N, q), d = wrapPi(a - h.last); h.last = a;
        let cum = h.cum + d;
        cum = Math.max(h.hi - TAU, Math.min(h.lo + TAU, cum));
        h.cum = cum; h.lo = Math.min(h.lo, cum); h.hi = Math.max(h.hi, cum);

      else if (h.mode === "turn") {

    release(q, moved) {

      } else if (h.mode === "slide" || h.mode === "turn") {
        if (t.kind !== "ruler") return;
        const on = this.onEdge();
        if (on.length < 2) return;
        const ok = t.ok(this, on.map(x => x.n));
        // drawn along it, the ruler goes back to where it lies when not in use
        if (ok === true || ok === "more") { t.draw(this); this.rul = { p: { ...cfg.ruler.p }, a: cfg.ruler.a }; if (ok === true) this.next(); } else if (ok && ok !== "keep") this.msg = ok;
      }
    },
    snapNeedle(N) {
      const m = this.markNear(N, 1.2);

      const c = cfg.circle;
      if (c && this.task.needleCircle && Math.abs(dist(N, c.c) - c.r) < 1.2) return polar(c.c, c.r, angOf(c.c, N));
      return null;
    },
    setPencil(q, w0 = this.cmp.w) {

      let w, phi, named = null;
      if (m && dist(m, N) <= max + 1e-9 && dist(m, N) >= 2) { w = dist(m, N); phi = angOf(N, m); named = m; }
      else if (c && this.task.pencilCircle && Math.abs(dist(q, c.c) - c.r) < 1.0) { const p = polar(c.c, c.r, angOf(c.c, q)); w = dist(p, N); phi = angOf(N, p); }
      else { const raw = dist(q, N); phi = angOf(N, q); w = Math.abs(raw - w0) < 0.35 ? w0 : Math.max(2, Math.min(max, Math.round(raw))); }

      if (named && nm && !named.hide && !nm.hide) { this.wName = nm.n + named.n; this.wLen = w; }
    },
    // the ruler's edge: the marked points it passes through (within a hair), with how far along the edge they are
    onEdge(e = 0.05) {

      for (const m of this.marks()) {
        const d = sub(m, r.p), s = d.x * u.x + d.y * u.y, tt = d.x * b.x + d.y * b.y;
        if (Math.abs(tt) < e && s > 0.3 && s < LR - 0.3) out.push({ n: m.n, p: m, s, hide: m.hide });
      }
      return out.sort((a, b) => a.s - b.s);
    },
    // the free place the hand puts the ruler; its edge snaps onto marked points near it (two: through both)
    setRuler(p, a, h) {
      const u = unit(a), b = V(-u.y, u.x), cand = [];
      for (const m of this.marks()) {
        const d = sub(m, p), s = d.x * u.x + d.y * u.y, tt = d.x * b.x + d.y * b.y;
        if (Math.abs(tt) < 0.9 && s > 0.3 && s < LR - 0.3) cand.push({ m, s, tt });
      }
      cand.sort((x, y) => Math.abs(x.tt) - Math.abs(y.tt));
      if (h && h.mode === "turn") {             // turning: the point under the finger's pivot stays on the edge
        const i = cand.findIndex(c => near(c.m, h.piv, 0.05));
        if (i > 0) cand.unshift(cand.splice(i, 1)[0]);
      }
      if (cand.length >= 2 && dist(cand[0].m, cand[1].m) > 0.5) {
        let nu = unit(angOf(cand[0].m, cand[1].m));
        if (nu.x * u.x + nu.y * u.y < 0) nu = mul(nu, -1);
        this.rul = { p: sub(V(cand[0].m.x, cand[0].m.y), mul(nu, cand[0].s)), a: Math.atan2(nu.y, nu.x) };
      } else if (cand.length) this.rul = { p: add(p, mul(b, cand[0].tt)), a };
      else this.rul = { p, a };
    },
    onSwing(arc) {
      const t = this.task;
      if (t.swing) return t.swing(this, arc);
      if (t.kind === "arc") {
        const okC = typeof t.centre === "function" ? t.centre(this, arc.c) : near(arc.c, this.pts[t.centre] || V(1e9, 0));
        if (!okC) { this.bad = arc; this.msg = val(t.centreMiss, this) || `Put its point on ${t.centre} first.`; return; }
        const wm = t.width && t.width(arc.r, this);
        if (wm) { this.bad = arc; this.msg = wm; return; }
        this.arcs.push(arc);
        const ok = t.cover(this, arc);
        if (ok === true) this.next(); else if (typeof ok === "string") this.msg = ok;
        return;
      }
      // between arcs: going on with an arc already drawn is fine (same middle, same width)
      if (this.arcs.some(a => near(a.c, arc.c) && Math.abs(a.r - arc.r) < 1e-6)) { this.arcs.push(arc); this.msg = null; return; }
      this.bad = arc; this.msg = val(t.swingMiss, this) || "First tap where they cross.";
    },
    tap(q) {
      const t = this.task;
      if (t.tap) return t.tap(this, q);
      if (t.kind !== "pin") return false;
      const marks = this.marks(), xs = crossings(this.geo()).filter(p => !marks.some(m => near(m, p, 0.05)));
      let best = null, bd = 2;
      for (const p of xs) { const d = dist(p, q); if (d < bd) { bd = d; best = p; } }
      const open = this.want.filter(w => !this.pts[w.name]);
      if (!best) {
        if (t.notYet && open.some(w => w.at.some(a => dist(a, q) < 3))) { this.msg = t.notYet; return true; }
        return false;
      }
      const w = open.find(w => w.at.some(a => dist(a, best) < 0.5));
      if (!w) { this.msg = val(t.wrong, this); this.wrongPt = best; return true; }
      this.addPin(w.name, best, w.lab); this.msg = null; this.wrongPt = null;
      if (this.want.every(w => this.pts[w.name])) this.next();

    },
    act(x) {
      const t = this.task;
      if (t.act && x !== "check" && x !== "neg") { t.act(this, x); return; }
      if (t.kind !== "type") return;
      if (x === "neg") { this.typed = this.typed.startsWith("−") ? this.typed.slice(1) : "−" + this.typed; this.verdict = null; this.msg = null; return; }
      if (x !== "check") return;
      const box = t.boxes ? t.boxes[this.bi] : t;
      if (!this.typed || this.typed === "−" || this.typed === ".") { this.msg = "Type the number first."; return; }
      const v = +this.typed.replace("−", "-");
      if (Math.abs(v - box.answer) < 1e-6) {
        this.vals[`${t.id}${this.bi}`] = v; this.typed = ""; this.verdict = null; this.msg = null; this.bi++;
        if (!t.boxes || this.bi >= t.boxes.length) { this.typing = false; this.next(); }
      } else { this.verdict = "wrong"; this.msg = box.wrong(v, this); }
    },
    type(v) { this.typed = v; this.verdict = null; this.msg = null; },

    // ----- drawing -----
    scene() {
      const t = this.task, fr = cfg.frame, W = fr.w - 3;
      const nr = words(`say-${val(t.say, this)}`, val(t.say, this), 0, 1, W), r2 = 1.3 + 2 * nr;
      if (this.msg) words(`msg-${this.msg}`, this.msg, 0, r2, W, "small", { c: "var(--wrong)" });
      else if (val(t.sub, this)) words(`sub-${val(t.sub, this)}`, val(t.sub, this), 0, r2, W, "small");
      cfg.figure(this);
      // pencil marks: the arcs (drawn live by the hand, so they don't draw in again)
      this.arcs.forEach((a, k) => path(`arc${k}`, arcD(a.c, a.r, a.a0, a.a1), { c: "var(--ink2)", live: true }));
      if (this.bad) path("bad", arcD(this.bad.c, this.bad.r, this.bad.a0, this.bad.a1), { c: "var(--wrong)", live: true });
      const h = this.hold;
      if (h && h.mode === "swing" && h.hi - h.lo > 0.01) path("livearc", arcD(this.cmp.N, this.cmp.w, h.phi0 + h.lo, h.phi0 + h.hi), { c: "var(--ink2)", live: true });
      for (const l of this.lines) seg(l.k, l.a, l.b, { c: l.answer ? "var(--chapter)" : "var(--ink2)", delay: l.delay || 0 });
      if (cfg.extra) cfg.extra(this);
      for (const [n, p] of Object.entries(this.pts)) {
        if (p.ghost) continue;
        const c = p.kind === "fig" ? "var(--ink)" : "var(--chapter)";
        dot(`pt${n}`, p.x, p.y, 0.3, { c, live: p.kind === "fig" ? false : undefined });
        if (!p.hide) nameAt(`ptn${n}`, n, p, p.lab, c);
      }
      if (this.wrongPt) dot(`wp${this.wrongPt.x.toFixed(2)}`, this.wrongPt.x, this.wrongPt.y, 0.45, { c: "var(--wrong)" });
      const tool = this.tool();
      TOOL = true;
      if (tool === "compass") this.drawCompass();
      if (tool === "ruler") this.drawRuler();
      TOOL = false;
      if (cfg.record) cfg.record(this);
      if (t.kind === "done") block("next", cfg.nextAt.x, cfg.nextAt.y, 10, "Next problem", "next");
    },
    drawCompass() {
      const N = this.cmp.N, P = this.pen(), K = this.knob(), u = unit(this.cmp.phi), up = V(u.y, -u.x);
      seg("cmpL", N, K, { c: "var(--ink2)" }); seg("cmpR", K, P, { c: "var(--ink2)" });
      seg("cmpNeedle", N, add(N, mul(sub(K, N), 0.12)), { c: "var(--ink)" });
      ringAt("cmpK", K.x, K.y, 0.75, { c: "var(--ink2)", fill: "var(--paper)" });
      dot("cmpN", N.x, N.y, 0.22, { c: "var(--ink)" });
      dot("cmpP", P.x, P.y, 0.3, { c: "var(--ink2)" });
      const h = this.hold;
      if (h && ["move", "open", "swing"].includes(h.mode)) {
        const t = this.task, ro = t.readout ? t.readout(this) : this.wName && this.wIs(this.wLen) ? `width ${this.wName}` : `width ${fmt(this.cmp.w)}`;
        const at = add(K, mul(up, 1.9));
        text("readout", ro, at.x, at.y, "small", { c: "var(--chapter)", live: true });
      }
    },
    drawRuler() {
      const r = this.rul, u = unit(r.a), b = V(-u.y, u.x), e1 = add(r.p, mul(u, LR)), w = 2.5;
      const c = [r.p, e1, add(e1, mul(b, w)), add(r.p, mul(b, w))];
      put("rulBody", "path", { d: `M${c.map(p => `${sq(p.x)} ${sq(p.y)}`).join("L")}Z`, fill: "var(--paper)", "fill-opacity": 0.72, stroke: "var(--ink2)", "stroke-width": 1.5 }, "fade");
      seg("rulEdge", r.p, e1, { c: "var(--ink)" });

  const slip = kind === "sides" ? [(AD - G.q) / G.p, (AD - G.s) / G.r].filter(v => Number.isInteger(v) && v > 0 && v !== G.x) : [];
  const tasks = [
    { id: "lay", kind: "ruler", say: "Lay the straightedge along a diagonal, corner to corner, and cut.", sub: "Drag it. Turn it by an end.",
      ok(L, ns) {
        const has = n => ns.includes(n);
        if (has("A") && has("C")) { st.cut = "AC"; return true; }
        if (has("B") && has("D")) { st.cut = "BD"; return true; }
        return "That's a side. Lay it from a corner to the corner across.";
      },
      draw() {},
      read: (L, on) => { if (on.length < 2) return null; const ns = on.map(x => x.n); return (ns.includes("A") && ns.includes("C")) || (ns.includes("B") && ns.includes("D")) ? "corner to corner" : "along a side"; },
      demo(H) { H.layThrough(A, C); } },
    { id: "part", kind: "see", tool: null, dur: 700, say: "Cut: two triangles." },
    { id: "turn", kind: "turn", tool: null, say: "Turn one triangle about the cut's middle onto the other.", sub: "Drag it by its ring.",
      grab(L, p) { if (dist(p, ring()) < 1.6) { st.held = { last: angOf(mid, p), cum: 0 }; L.msg = null; return true; } return false; },
      drag(L, p) {
        const hd = st.held, a = angOf(mid, p); hd.cum = clamp(hd.cum + wrapPi(a - hd.last), -1.2 * Math.PI, 1.2 * Math.PI); hd.last = a;
        st.phi = Math.abs(Math.abs(hd.cum) - Math.PI) < 10 * DEG ? Math.sign(hd.cum) * Math.PI : hd.cum;
        st.live = Math.abs(st.phi) === Math.PI ? "half turn: fits" : `turned ${Math.round(Math.abs(st.phi) / DEG)}°`;
      },
      release(L) {
        st.held = null;
        if (Math.abs(st.phi) === Math.PI) { st.turned = true; L.next(); return; }
        st.phi = 0; st.live = null; L.msg = "Turn it all the way: a half turn.";
      },
      tap: () => { st.held = null; return false; },
      demo(H) { H.arcDrag(mid, ring(), Math.PI); } },
    { id: "marks", kind: "see", tool: null, dur: 1600, say: "It fits exactly: opposite sides and angles match." },
  ];
  if (kind === "sides") tasks.push({ id: "write", kind: "type", tool: null, say: "Opposite sides are equal. Find x, then AB.", boxes: [
    { answer: G.x, wrong: v => slip.includes(v) ? "Opposite sides are equal: AB and DC." : xMiss(v, cc, dd) },
    { answer: b, wrong: v => v === G.x ? `x is ${G.x}. AB is ${G.p} × ${G.x}${plusS(G.q)}.` : `Put ${G.x} in for x: ${G.p} × ${G.x}${plusS(G.q)}.` }] });
  if (kind === "angles") tasks.push(
    { id: "slide", kind: "slide", tool: null, say: "Slide ∠A along AB to the next corner.", sub: "Drag it by its middle.",
      grab(L, p) { const sp = spOf(0); if (inWedge(p, lerp(A, B, st.wu), sp, 3.4)) { st.held = { g0: p, u0: st.wu }; L.msg = null; return true; } return false; },
      drag(L, p) { const d = sub(B, A); st.wu = clamp(st.held.u0 + dot2(sub(p, st.held.g0), d) / dot2(d, d), 0, 1); st.live = st.wu > 0.97 ? "straight line: 180°" : null; },
      release(L) {
        st.held = null;
        if (st.wu >= 0.6) { st.wu = 1; st.win = true; st.live = "straight line: 180°"; L.next(); } else { st.wu = 0; st.live = null; L.msg = "Slide it all the way along AB to B."; }
      },
      tap: () => { st.held = null; return false; },
      demo(H) { const sp = spOf(0), g = polar(A, 2, (sp[0] + sp[1]) / 2); H.drag(g, add(g, sub(B, A))); } },
    { id: "write", kind: "type", tool: null, say: "Find ∠B, then ∠C.", boxes: [
      { answer: 180 - G.al, wrong: v => v === G.al ? "Opposite angles are equal; next-door angles add to 180°." : `∠A and ∠B make a straight line: 180° ${MIN} ${G.al}°.` },
      { answer: G.al, wrong: v => v === 180 - G.al ? "Opposite angles are equal; next-door angles add to 180°." : `∠C is across from ∠A: they're equal.` }] });
  if (kind === "diag") tasks.push({ id: "write", kind: "type", tool: null, say: "The half turn swaps the two halves of each diagonal. Find y.", boxes: [
    { answer: G.x, wrong: v => xMiss(v, cc, dd, "y") }] });
  if (kind === "rect") tasks.push({ id: "write", kind: "type", tool: null, say: "Its diagonals are equal. Find x, then AC.", boxes: [
    { answer: G.x, wrong: v => xMiss(v, cc, dd) },
    { answer: G.d, wrong: v => v === G.x ? `x is ${G.x}. AC is ${G.p} × ${G.x}${plusS(G.q)}.` : `Put ${G.x} in for x: ${G.p} × ${G.x}${plusS(G.q)}.` }] });
  tasks.push({ id: "done", kind: "done", tool: null, say: kind === "rect" ? "Its diagonals are equal, so every corner is square: it's a rectangle."
    : "A half turn about the middle lands it on itself: opposite sides and angles match, and the diagonals cut each other in half." });
  const pts = {}; Q.forEach((p, j) => pts[NM[j]] = { ...p, lab: [0, 0], ghost: true });
  if (kind === "diag") pts.E = { ...mid, lab: [0, 0], ghost: true };
  const LRr = Math.ceil(Math.max(dist(A, C), dist(B, D)) + 3);
  const R1 = Yb + 4.5, R2 = R1 + 3, CKX = Math.max(30, mw(eqS(G.p || 1, G.q || 1, G.r || 1, G.s || 1, "x")) + 4), RX = Math.max(...Q.map(p => p.x), kind === "angles" ? ext.x : 0);
  const vName = kind === "rect" ? ["AC", "BD"] : kind === "diag" ? (short[0] === 1 ? ["BE", "ED"] : ["AE", "EC"]) : ["AB", "DC"];
  return con({
    id: "parallelogram", index: i, frame: { x: -1, y: -1, w: Math.ceil(Math.max(fw, LRr + 2, RX + 4, CKX + 12)), h: R2 + 2.5 }, nextAt: V(CKX, R2 - 1), pts, park: { N: V(-60, -60), w: 6 }, geo: () => [], tasks, G, st, k, Q,
    ruler: { p: V(1, Yb + 3), a: 0, len: LRr },
    animating: L => !!st.held || ["part", "marks"].includes(L.stage),
    figure(L) {
      const segs = st.segs = [[A, B], [B, C], [C, D], [D, A]], stg = L.stage, cutDone = !!st.cut;
      // parting: the halves move apart a square, then (after the turn) back together
      st.o = stg === "part" ? 0.5 * ease(L.phase("part")) : stg === "turn" ? 0.5 : stg === "marks" ? (L.phase("marks") < 0.35 ? 0.5 : 0.5 * (1 - ease((L.phase("marks") - 0.35) / 0.65))) : 0;
      const landed = stg === "marks" && L.phase("marks") < 0.35, apart = cutDone && (stg === "part" || stg === "turn" || stg === "marks");
      const marked = L.passed("marks");
      if (!apart) poly("pg", Q);
      if (kind === "diag" || kind === "rect" || (marked && kind !== "angles" && kind !== "sides")) {
        const ds = kind === "diag" && !marked ? [short] : [[0, 2], [1, 3]];
        ds.forEach(([a, c]) => { seg(`dg${a}`, Q[a], Q[c], { c: "var(--ink2)" }); segs.push([Q[a], Q[c]]); });
      }
      if (cutDone && !apart) { const [a, c] = st.cut === "AC" ? [A, C] : [B, D]; seg("cut", a, c, { c: "var(--chapter)" }); segs.push([a, c]); }
      if (apart) {
        const t2 = T2(st.o), t1 = landed ? T1(0.5, Math.PI) : T1(st.o, stg === "turn" ? st.phi : 0), live = stg !== "marks" || !landed;
        put("t2", "path", { d: `M${t2.map(p => `${sq(p.x)} ${sq(p.y)}`).join("L")}Z`, fill: "none", stroke: "var(--ink)", "stroke-width": 1.5, "stroke-linejoin": "round" }, "none");
        put("t1", "path", { d: `M${t1.map(p => `${sq(p.x)} ${sq(p.y)}`).join("L")}Z`, fill: "var(--tint)", stroke: "var(--chapter)", "stroke-width": 1.5, "stroke-linejoin": "round" }, "none");
        if (stg === "marks" && !landed) put("t1b", "path", { d: `M${T1(st.o, 0).map(p => `${sq(p.x)} ${sq(p.y)}`).join("L")}Z`, fill: "none", stroke: "var(--ink)", "stroke-width": 1.5 }, "none");
        if (stg === "turn") { const r = ring(); ringAt("tring", r.x, r.y, 0.7, { c: "var(--chapter)", live: true }); dot("tmid", mid.x, mid.y, 0.25, { c: "var(--chapter)", live: true }); }
        void live;
      }
      // the marks the half turn proves
      if (marked) {
        tickMarks("m0", A, B, 1, { c: "var(--chapter)" }); tickMarks("m2", D, C, 1, { c: "var(--chapter)" });
        tickMarks("m1", B, C, 2, { c: "var(--chapter)" }); tickMarks("m3", A, D, 2, { c: "var(--chapter)" });
        const sq4 = kind === "rect" && L.vals.write1 != null;
        if (sq4) Q.forEach((p, j) => cornerMark(`cm${j}`, p, unit(angOf(p, Q[(j + 1) % 4])), unit(angOf(p, Q[(j + 3) % 4]))));
        else [0, 1, 2, 3].forEach(j => arcMarks(`ma${j}`, Q[j], spOf(j), j % 2 ? 2 : 1, { c: "var(--chapter)" }));
        const halves = kind === "rect" ? [0, 1, 2, 3] : kind === "diag" ? short : [];
        for (const j of halves) tickMarks(`e${j}`, Q[j], mid, 3, { c: "var(--chapter)" });
      }
      if (kind === "angles" && L.passed("turn")) {
        line("ext", B.x, B.y, ext.x, ext.y, { c: "var(--ink2)", dash: true }); segs.push([B, ext]);
        const sp = spOf(0), tip = lerp(A, B, st.wu);
        wedge("wA", tip, sp[0], sp[1] - sp[0], 3, { live: !!st.held || st.wu > 0, fill: st.win ? "var(--tint-strong)" : "var(--tint)" });
        if (st.win) wedge("wB", B, spOf(1)[0], spOf(1)[1] - spOf(1)[0], 3, { fill: "var(--tint)" });
      }
      // the names
      if (kind === "diag") { dot("pE", mid.x, mid.y, 0.3, { c: "var(--ink)" }); cornerName("nE", "E", mid, add(mid, V(0, 3)), segs); }
      NM.forEach((s, j) => cornerName(`n${s}`, s, Q[j], mid, segs));
      const rings = Q.map(p => [p, 2.6]);
      if (kind === "sides") { sideName("vAB", letX(G.p, G.q), A, B, mid, segs, { rings }); sideName("vDC", letX(G.r, G.s), D, C, mid, segs, { rings }); sideName("vAD", f1(AD), A, D, mid, segs, { rings }); }
      if (kind === "angles") angName("vA", `${G.al}°`, A, spOf(0), segs, rings, { r0: 3.6 });
      if (kind === "diag") { const [a, c] = short; sideName("v1", letX(G.p, G.q, "y"), Q[a], mid, Q[(a + 1) % 4], segs, { rings }); sideName("v2", letX(G.r, G.s, "y"), mid, Q[c], Q[(c + 1) % 4], segs, { rings }); }
      if (kind === "rect") { sideName("v1", letX(G.p, G.q), A, mid, B, segs, { rings }); sideName("v2", letX(G.r, G.s), B, mid, A, segs, { rings }); }
    },
    record(L) {
      const stg = L.stage, segs = st.segs, top = Yb - k * h, R = Math.max(...Q.map(p => p.x)), Lx = Math.min(...Q.map(p => p.x));
      if (kind !== "angles") readout("kn", `${k} squares = 1`, [{ x: Lx, y: Yb + 2.2, anchor: "start" }, { x: Lx, y: top - 1.8, anchor: "start" }, { x: R, y: top - 1.8, anchor: "end" }], segs, false, "var(--ink2)");
      const ro = st.live || (stg === "marks" || (L.passed("turn") && kind !== "angles" && !L.passed("marks")) ? "half turn: fits" : null);
      if (ro) readout("ro", ro, [{ x: R, y: Yb + 2.2, anchor: "end" }, { x: R, y: top - 1.8, anchor: "end" }, { x: Lx, y: top - 1.8, anchor: "start" }, { x: Lx, y: Yb + 2.2, anchor: "start" }, { x: R, y: Yb + 3.4, anchor: "end" }], segs, !!st.held);
      if (!L.passed("marks") || (kind === "angles" && !L.passed("slide"))) return;
      const typing = stg === "write", v = L.vals;
      if (kind === "angles") {
        let e = mrow("r1", `∠B = 180° ${MIN} ${G.al}° =`, 1, R1); e = boxAt(L, "write", 0, e, R1, 3); mrow("r1d", "°", e, R1, v.write0 != null ? "var(--chapter)" : null);
        if (v.write0 != null) { e = mrow("r2", "∠C =", 1, R2); e = boxAt(L, "write", 1, e, R2, 3); mrow("r2d", "°", e, R2, v.write1 != null ? "var(--chapter)" : null); }
      } else {
        const va = kind === "diag" ? "y" : "x";
        mrow("r1", eqS(G.p, G.q, G.r, G.s, va), 1, R1);
        let e = mrow("r2", `${va} =`, 1, R2); boxAt(L, "write", 0, e, R2, 2);
        if (kind !== "diag" && v.write0 != null) { e = mrow("r3", `${vName[0]} =`, 14, R2); boxAt(L, "write", 1, e, R2, 2); }
      }
      if (typing) checkKeys(CKX, R2 - 1, false);
    },
  });
}

// ---------- hands for checking (they move the tools the way a finger does, through grab, drag and release) ----------
const hands = {
  get L() { return lesson; },
  drag(from, to, n = 8) {
    if (!lesson.grab(from)) throw new Error(`nothing to grab at ${from.x.toFixed(2)}, ${from.y.toFixed(2)} (${lesson.stage})`);
    for (let k = 1; k <= n; k++) lesson.drag(lerp(from, to, k / n));
    lesson.release(to, true); render();
  },
  needleTo(p) { this.drag({ ...lesson.cmp.N }, p); },
  pencilTo(p) { this.drag(lesson.pen(), p); },
  widthTo(w) { this.drag(lesson.pen(), polar(lesson.cmp.N, w, lesson.cmp.phi)); },
  // turn the compass by its top through an angle (radians), a little at a time
  swing(delta) {
    const N = lesson.cmp.N, K = lesson.knob(), r = dist(N, K), a0 = angOf(N, K), n = Math.max(2, Math.ceil(Math.abs(delta) / 0.15));
    if (!lesson.grab(K)) throw new Error("can't grab the compass's top");
    for (let k = 1; k <= n; k++) lesson.drag(polar(N, r, a0 + delta * k / n));
    lesson.release(polar(N, r, a0 + delta), true); render();
  },
  // set the pencil just before angle a (keeping the width), then swing through to just past angle b
  swingAcross(a, b) {
    const N = lesson.cmp.N, w = lesson.cmp.w, d = wrapPi(b - a), s = Math.sign(d) || 1;
    let off = 0.3;
    for (const o of [0.3, 0.45, 0.6, 0.75]) { const p = polar(N, w, a - s * o); if (!lesson.markNear(p, 1.4, N)) { off = o; break; } }
    this.pencilTo(polar(N, w, a - s * off));
    if (!lesson.wIs(w)) throw new Error("the width changed while setting the pencil");
    this.swing(d + s * 2 * off);
  },
  tap(p) { if (lesson.grab(p)) lesson.release(p, false); else lesson.tap(p); render(); },
  // slide the ruler's edge onto p1, then turn it by its far end until it lies through p2
  rulerThrough(p1, p2) {
    let r = lesson.rul, u = unit(r.a), b = V(-u.y, u.x);
    const g = add(add(r.p, mul(u, lesson.LR / 2)), mul(b, 1.25));
    const ti = lesson.ti;
    this.drag(g, add(g, sub(p1, add(r.p, mul(u, 1.2)))));     // p1 near the near end, so turning the far end pivots on it
    if (lesson.ti !== ti) return;
    r = lesson.rul; u = unit(r.a); b = V(-u.y, u.x);
    const g2 = add(add(r.p, mul(u, lesson.LR - 3)), mul(b, 1.25)), da = wrapPi(angOf(p1, p2) - r.a), n = Math.max(2, Math.ceil(Math.abs(da) / 0.1));
    if (!lesson.grab(g2)) throw new Error("can't grab the ruler's end");
    for (let k = 1; k <= n; k++) lesson.drag(add(p1, rot(sub(g2, p1), da * k / n)));
    lesson.release(add(p1, rot(sub(g2, p1), da)), true); render();
  },
  // play the current task the right way (Show me's data)
  step() { const t = lesson.task; if (t.demo) t.demo(this); else if (t.kind === "type") { const b = t.boxes ? t.boxes[lesson.bi] : t; lesson.type(b.answer < 0 ? "−" + -b.answer : String(b.answer)); act("check"); } else if (t.kind === "see") { lesson.next(); render(); } },
};

// lay the straightedge straight onto a line through p1 and p2 and let go (for checking)
hands.layThrough = function (p1, p2) {
  const a = angOf(p1, p2), u = unit(a), b = V(-u.y, u.x);
  lesson.rul = { p: sub(p1, mul(u, 2)), a };
  const g = add(add(lesson.rul.p, mul(u, lesson.LR / 2)), mul(b, 1.25));
  if (!lesson.grab(g)) throw new Error("can't grab the straightedge");
  lesson.drag(g); lesson.release(g, true); render();
};
// turn something by a ring: grab it at from, carry it round c through delta (radians), let go
hands.arcDrag = function (c, from, delta, n) {
  n = n || Math.max(4, Math.ceil(Math.abs(delta) / 0.12));
  if (!lesson.grab(from)) throw new Error(`can't grab the ring (${lesson.stage})`);
  for (let j = 1; j <= n; j++) lesson.drag(add(c, rot(sub(from, c), delta * j / n)));
  lesson.release(add(c, rot(sub(from, c), delta)), true); render();
};
// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  congruent: { name: "Same parts, same triangle", make: dCongruent },
  isosceles: { name: "Isosceles triangles", make: dIsosceles },
  parallelogram: { name: "Inside a parallelogram", make: dParallelogram },
};
const IDX = {};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id, index) {
  if (!LESSONS[id]) id = "congruent";
  if (index != null) IDX[id] = index;
  token++;
  lesson = LESSONS[id].make(IDX[id] || 0);
  document.body.className = "geometry";
  pick.value = id;
  drawn = new Set(); keys.blur(); keys.value = "";
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g10ch4-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value, 0);
document.getElementById("fresh").onclick = () => leave();
function leave() { IDX[lesson.id] = (IDX[lesson.id] || 0) + 1; start(lesson.id); }
let first = "congruent", firstI = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g10ch4-lesson") || "congruent";
  firstI = +(u.get("i") || 0);
  if (u.get("theme")) document.documentElement.dataset.theme = u.get("theme");
} catch (err) {}
start(first, firstI);
