<title>Right triangles and trig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* ′ (prime) drawn from a serif face so A′ never reads as A' (the rounded faces draw it upright) */
@font-face { font-family: "Prime"; src: local("Georgia"), local("Times New Roman"), local("Times"); unicode-range: U+2032-2033; }
/* 10th grade, chapter 6: Right triangles and trig (ios/design/grade10.md). Kit and engine from grade10-ch5.html (and ch4 to ch1). The whole screen is one sheet of graph paper
   seen through one camera; the floating pill at the bottom is the only chrome. 1 square = 20 paper units, a strong line

:root {

  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #4FD1BC; --tint: rgba(79, 209, 188, .22); --tint-strong: rgba(79, 209, 188, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #4FD1BC; --tint: rgba(79, 209, 188, .22); --tint-strong: rgba(79, 209, 188, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }

  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }

  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">

<nav id="bar" aria-label="Lessons">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit of new5-lessons.html) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set();
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in
let TOOL = false;     // what's put now is a tool lying on the paper (compass, ruler), not the picture
function put(k, tag, a, kind = "fade", text, delay = 0) { if (TOOL) a = { ...a, "data-tool": 1 }; items.push({ k, tag, a, kind, text, delay }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash || o.live ? null : 1 },
    o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay || 0);
}
const seg = (k, p, q, o) => line(k, p.x, p.y, q.x, q.y, o);
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, "stroke-linejoin": "round",
    pathLength: o.live ? null : 1 }, o.live ? "none" : "line", undefined, o.delay || 0);
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null,
    pathLength: o.c && !o.fill ? 1 : null }, o.live ? "none" : o.c && !o.fill ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade", undefined, o.delay || 0); }
function ringAt(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": 1.5, pathLength: o.live ? null : 1 }, o.live ? "none" : "line", undefined, o.delay || 0); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null, ...(o.attrs || {}) }, o.live ? "none" : "fade", s, o.delay || 0);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) { text(`${k}${i}${s[i]}`, s[i], right - col - 1, row, "maths", { c: o.c }); col += 2; }
}
// maths in the record: digits 2 squares each (school's squared paper), letters close as school writes names,
// ° hugging the digit before it, ∠ and ∥ drawn as marks; returns where it ends (in squares)
function mrow(k, s, x, row, c) {
  let col = x;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], kk = `${k}${i}${ch}`;
    if (ch === " ") { col += 0.6; continue; }
    if (ch === "∠") { path(kk, `M${sq(col + 1.5)} ${sq(row - 0.75)}L${sq(col + 0.2)} ${sq(row + 0.65)}H${sq(col + 1.6)}`, { c: c || "var(--ink)" }); col += 1.9; continue; }
    if (ch === "∥") { line(`${kk}a`, col + 0.45, row + 0.8, col + 0.8, row - 0.8, { c }); line(`${kk}b`, col + 1.05, row + 0.8, col + 1.4, row - 0.8, { c }); col += 1.9; continue; }
    if (/[0-9]/.test(ch)) {
      const run = s.slice(i).match(/^[0-9.]+/)[0];
      if (run.includes(".") && !run.endsWith(".")) { text(kk + run, run, col + 0.3, row, "maths", { c, anchor: "start" }); col += decW(run); i += run.length - 1; continue; }
      text(kk, ch, col + 1, row, "maths", { c }); col += 2; continue;
    }
    if (ch === "°") { text(kk, ch, col - 0.2, row, "maths", { c, anchor: "start" }); col += 0.9; continue; }
    const fnw = /^(sin|cos|tan)/.exec(s.slice(i));
    if (fnw) { text(kk, fnw[0], col, row, "maths", { c, anchor: "start" }); col += 3.2; i += 2; continue; }
    if (ch === "²" || ch === "¹" || ch === "⁻") { text(kk, ch, col - 0.15, row - 0.25, "maths", { c, anchor: "start" }); col += ch === "²" ? 0.95 : 0.7; continue; }
    if (ch === "′" || ch === "″") { text(kk, ch, col - 0.1, row, "maths", { c, anchor: "start" }); col += ch === "′" ? 0.5 : 0.8; continue; }
    const w = "(),:/".includes(ch) ? 0.8 : ch === "→" ? 2.2 : ch === "=" || ch === "÷" || ch === "+" || ch === "M" ? 1.6 : 1.35;
    text(kk, ch, col + w / 2, row, "maths", { c }); col += w;
  }
  return col;
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// an answer box in the record: cells of 2 squares, the typed digits on the right, the cursor after them
function dbox(k, x, y, cells, value, state) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : "var(--ink)";
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (value && value.includes(".")) text(`${k}v${value}`, value, x + cells * 2 - 0.4, y + 1, "maths", { anchor: "end", c: state === "right" || state === "wrong" ? c : null });
  else if (value) digits(`${k}v${value}`, value, x + cells * 2, y + 1, { c: state === "right" || state === "wrong" ? c : null });
  if (state === "active") put(`${k}cur`, "line", { x1: sq(x + cells * 2 + 0.4), y1: sq(y + 0.35), x2: sq(x + cells * 2 + 0.4), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": "type" }, "none");
}

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none", a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${(Math.min(n++ * 0.035, 1.2) + it.delay).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    out += `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
  }
  sceneEl.innerHTML = out;
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `${lesson.index < 3 ? "Guided" : "Problem"} ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: fits what the lesson shows, its top row at the top of the screen (the words on rows 0-2), eased 0.75 s
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 16, bottom = 96;
  const s = Math.min((W - 48) / sq(f.w), (H - top - bottom) / sq(f.h), (lesson && lesson.maxZoom) || 1.6);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/-/g, "−").replace(/,/g, ".").replace(/[^0-9−.]/g, "").replace(/(?!^)−/g, "").replace(/(\..*)\./g, "$1").slice(0, 5)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (the tools, a point) or pan the paper ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { if (down.moved) { lesson.drag(toPaper(e)); render(); } return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e), d.moved); render(); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) render();
});
function act(a) {
  if (a === "type") { if (lesson.typing) openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render();
}
// timers for the See beats; a new problem cancels the old one's
let token = 0;
function after(ms, fn) { const t = token; setTimeout(() => { if (t !== token) return; fn(); render(); }, ms); }

// ---------- geometry on the paper (in squares; y runs down the page, so "up" is a negative angle) ----------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const V = (x, y) => ({ x, y });
const add = (a, b) => V(a.x + b.x, a.y + b.y), sub = (a, b) => V(a.x - b.x, a.y - b.y), mul = (a, k) => V(a.x * k, a.y * k);
const lerp = (a, b, t) => V(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angOf = (c, p) => Math.atan2(p.y - c.y, p.x - c.x);
const unit = a => V(Math.cos(a), Math.sin(a));
const polar = (c, r, a) => V(c.x + r * Math.cos(a), c.y + r * Math.sin(a));
const rot = (v, a) => V(v.x * Math.cos(a) - v.y * Math.sin(a), v.x * Math.sin(a) + v.y * Math.cos(a));
const mod = (a, m) => ((a % m) + m) % m;
const wrapPi = a => mod(a + Math.PI, TAU) - Math.PI;
const near = (a, b, e = 0.01) => dist(a, b) < e;
const fmt = v => Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1);
const val = (v, L) => typeof v === "function" ? v(L) : v || "";
// an arc is { t: "arc", c, r, a0, a1 } with a0 < a1 (a whole circle: a1 - a0 = TAU); a line is { t: "seg", a, b }
const arcHas = (a, ang) => a.a1 - a.a0 >= TAU - 1e-9 || mod(ang - a.a0, TAU) <= a.a1 - a.a0 + 1e-9;
function onObj(o, p) {
  if (o.t === "seg") { const d = sub(o.b, o.a), t = ((p.x - o.a.x) * d.x + (p.y - o.a.y) * d.y) / (d.x * d.x + d.y * d.y); return t >= -1e-6 && t <= 1 + 1e-6; }
  return arcHas(o, angOf(o.c, p));
}
function interCL(c, r, a, b) {
  const d = sub(b, a), f = sub(a, c), A = d.x * d.x + d.y * d.y, B = 2 * (f.x * d.x + f.y * d.y), C = f.x * f.x + f.y * f.y - r * r, disc = B * B - 4 * A * C;
  if (disc < -1e-9) return [];
  const s = Math.sqrt(Math.max(0, disc));
  return [(-B - s) / (2 * A), (-B + s) / (2 * A)].map(t => add(a, mul(d, t)));
}
function interCC(c1, r1, c2, r2) {
  const d = dist(c1, c2);
  if (d < 1e-9 || d > r1 + r2 + 1e-9 || d < Math.abs(r1 - r2) - 1e-9) return [];
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const m = add(c1, mul(sub(c2, c1), a / d)), n = V(-(c2.y - c1.y) / d, (c2.x - c1.x) / d);
  return h < 1e-9 ? [m] : [add(m, mul(n, h)), sub(m, mul(n, h))];
}
function interLL(a, b, c, d) {

// ---------- the construction engine: compass, straightedge, pins (chapter 1; later chapters reuse it) ----------
// A lesson is a list of tasks. The compass is drawn on the paper as a tool: drag its point to lift it (it snaps to

    get task() { return T[this.ti]; },
    get stage() { return this.task.id; },
    progress() { return [this.ti, T.length - 1]; },
    frame() { return cfg.frame; },
    animating() { return this.task.kind === "see" || !!(cfg.animating && cfg.animating(this)); },
    tool() { const t = this.task; return t.tool !== undefined ? t.tool : { arc: "compass", open: "compass", walk: "compass", pin: "compass", ruler: "ruler" }[t.kind] || null; },
    at(n) { const p = this.pts[n]; return !!p && near(this.cmp.N, p); },

    knob() { const u = unit(this.cmp.phi); return add(add(this.cmp.N, mul(u, this.cmp.w / 2)), V(u.y * KNOB, -u.x * KNOB)); },

    covers(c, r, a) { return this.arcs.some(x => near(x.c, c) && Math.abs(x.r - r) < 1e-6 && arcHas(x, a)); },
    geo() { return cfg.geo(this).concat(this.arcs, this.lines.map(l => ({ t: "seg", a: l.a, b: l.b }))); },
    passed(id) { return this.ti > T.findIndex(t => t.id === id); },

    maxW() { return this.task.maxW ? val(this.task.maxW, this) : cfg.maxW || 30; },
    addPin(name, p, lab, kind = "pin") { this.pts[name] = { x: p.x, y: p.y, lab, kind }; },

function dTrigangle(i) {

  const tasks = [

      act(L, x) {
        const r = x.slice(5); if (st.sel.includes(r)) return;

        st.sel.push(r); L.msg = null; if (st.sel.length === 2) L.next();
      },
      demo() { need.forEach(r => lesson.act(`side:${r}`)); } },
    { id: "ratio", kind: "type", tool: null, say: `Write ${fn} A as a decimal.`, boxes: [{ answer: r2v, wrong: v => {
      if (Math.abs(v - Math.round(L2[botR] / L2[topR] * 100) / 100) < 0.006) return fn === "tan" ? `tan is across over beside: ${L2.opp}/${L2.adj}, not ${L2.adj}/${L2.opp}.` : fn === "sin" ? `sin is across over the long side: ${a}/${c}, not ${c}/${a}.` : `cos is beside over the long side: ${b}/${c}, not ${c}/${b}.`;
      return Math.abs(v - L2[topR] / L2[botR]) < 0.06 ? "Round it to the hundredth." : `Divide: ${L2[topR]} ÷ ${L2[botR]}.`;
    } }] },
    { id: "turn", kind: "turn", tool: null, say: "Turn the arm until the wheel reads the same.", sub: "Drag its ring.",
      grab(L, p) { if (dist(p, armTip(st.d)) < 2) { st.held = "turn"; L.msg = null; return true; } return false; },
      drag(L, p) { st.d = clamp(Math.round(Math.atan2(cen.y - p.y, p.x - cen.x) / DEG), 1, 89); },
      release(L) { if (!st.held) return; st.held = null; if (st.d === A) { L.msg = null; L.next(); } else L.msg = early(st.d); },

    id: "trigangle", index: i, frame: { x: -1, y: -1, w: fw, h: R2 + 2.5 }, nextAt: V(CKX + 12, R2 - 1), pts: {}, park: { N: V(-60, -60), w: 6 }, geo: () => [], tasks, G, st, cen, tip, foot, A, uu,
    animating: L => !!st.held,
    figure(L) {

      const fin = guide, moved = st.held || st.d !== d0, resv = (dd => [[cen, armTip(dd)]]);
      segs.push(...resv(A));

      text("nA", "A", Wx - 1.4, Wy + 1.3, "say"); segs.push(...boxSegs(V(Wx - 1.4, Wy + 1.3), 1.4, 1.6));

    },
  });
}

// ---------- hands for checking (they move the tools the way a finger does, through grab, drag and release) ----------
const hands = {
  get L() { return lesson; },
  drag(from, to, n = 8) {
    if (!lesson.grab(from)) throw new Error(`nothing to grab at ${from.x.toFixed(2)}, ${from.y.toFixed(2)} (${lesson.stage})`);
    for (let k = 1; k <= n; k++) lesson.drag(lerp(from, to, k / n));
    lesson.release(to, true); render();
  },
  needleTo(p) { this.drag({ ...lesson.cmp.N }, p); },
  pencilTo(p) { this.drag(lesson.pen(), p); },
  widthTo(w) { this.drag(lesson.pen(), polar(lesson.cmp.N, w, lesson.cmp.phi)); },
  // turn the compass by its top through an angle (radians), a little at a time
  swing(delta) {
    const N = lesson.cmp.N, K = lesson.knob(), r = dist(N, K), a0 = angOf(N, K), n = Math.max(2, Math.ceil(Math.abs(delta) / 0.15));
    if (!lesson.grab(K)) throw new Error("can't grab the compass's top");
    for (let k = 1; k <= n; k++) lesson.drag(polar(N, r, a0 + delta * k / n));
    lesson.release(polar(N, r, a0 + delta), true); render();
  },
  // set the pencil just before angle a (keeping the width), then swing through to just past angle b
  swingAcross(a, b) {
    const N = lesson.cmp.N, w = lesson.cmp.w, d = wrapPi(b - a), s = Math.sign(d) || 1;
    let off = 0.3;
    for (const o of [0.3, 0.45, 0.6, 0.75]) { const p = polar(N, w, a - s * o); if (!lesson.markNear(p, 1.4, N)) { off = o; break; } }

    if (!lesson.wIs(w)) throw new Error("the width changed while setting the pencil");

  },
  tap(p) { if (lesson.grab(p)) lesson.release(p, false); else lesson.tap(p); render(); },
  // slide the ruler's edge onto p1, then turn it by its far end until it lies through p2
  rulerThrough(p1, p2) {
    let r = lesson.rul, u = unit(r.a), b = V(-u.y, u.x);
    const g = add(add(r.p, mul(u, lesson.LR / 2)), mul(b, 1.25));
    const ti = lesson.ti;
    this.drag(g, add(g, sub(p1, add(r.p, mul(u, 1.2)))));     // p1 near the near end, so turning the far end pivots on it

  },

  step() { const t = lesson.task; if (t.demo) t.demo(this); else if (t.kind === "type") { const b = t.boxes ? t.boxes[lesson.bi] : t; lesson.type(b.answer < 0 ? "−" + -b.answer : String(b.answer)); act("check"); } else if (t.kind === "see") { lesson.next(); render(); } },
};

// lay the straightedge straight onto a line through p1 and p2 and let go (for checking)
hands.layThrough = function (p1, p2) {
  const a = angOf(p1, p2), u = unit(a), b = V(-u.y, u.x);
  lesson.rul = { p: sub(p1, mul(u, 2)), a };
  const g = add(add(lesson.rul.p, mul(u, lesson.LR / 2)), mul(b, 1.25));
  if (!lesson.grab(g)) throw new Error("can't grab the straightedge");

};
// turn something by a ring: grab it at from, carry it round c through delta (radians), let go
hands.arcDrag = function (c, from, delta, n) {
  n = n || Math.max(4, Math.ceil(Math.abs(delta) / 0.12));
  if (!lesson.grab(from)) throw new Error(`can't grab the ring (${lesson.stage})`);
  for (let j = 1; j <= n; j++) lesson.drag(add(c, rot(sub(from, c), delta * j / n)));
