<title>Grade 11 Inverses and logs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* 11th grade, chapter 3: Inverses and logs (ios/design/grade11.md). The whole screen is one sheet of graph paper seen
   through one camera; the floating pill at the bottom is the only chrome. 1 square = 20 paper units, a strong line
   every 5. Kit from grade11-ch2.html (no 3D here). grade11.md gives no chapter colour: this chapter (functions, their
   inverses and graphs on the plane) uses the kit's blue, the colour of 8th grade's plane chapter. */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #4F63D9; --tint: rgba(79, 99, 217, .22); --tint-strong: rgba(79, 99, 217, .42);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none; margin: 0;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); box-sizing: border-box; }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); white-space: nowrap; }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <!-- negative is striped (7th grade's): a negative square is the tint crossed by the chapter colour -->
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--paper)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".7"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-40000" y="-40000" width="80000" height="80000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 4</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (grade11-ch1.html's kit) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene"), upEl = document.getElementById("upright");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const ceil5 = v => 5 * Math.ceil(v / 5 - 1e-9);

// TZ: a text zoom the kit can write words at (a whole step, so they stay on the grid); every lesson here keeps TZ = 1.
// UP: what's put now faces the child (drawn over the tilting paper, never tilted). FRAMING: the scene is being drawn
// only to measure the camera's frame at the tilt it is heading to.
let items = [], drawn = new Set(), TZ = 1, UP = false, FRAMING = false, SEGS = [];
const FS = { maths: 36, say: 28, small: 20 }, CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function put(k, tag, a, kind = "fade", text, bb) { items.push({ k, tag, a, kind, text, bb, up: UP }); }
const sq = n => n * SQ;
const W = o => (o.w || 1.5) * (o.z || 1);
function line(k, x1, y1, x2, y2, o = {}) {
  if (!o.free) SEGS.push([x1, y1, x2, y2]);
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": W(o),
    "stroke-dasharray": o.dash ? `${6 * (o.z || 1)} ${6 * (o.z || 1)}` : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1, opacity: o.op ?? null },
    o.live ? "none" : o.dash ? "fade" : "line", null, [Math.min(x1, x2), Math.min(y1, y2), Math.max(x1, x2), Math.max(y1, y2)]);
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": W(o), opacity: o.op ?? null,
    "stroke-dasharray": o.dash ? `${6 * (o.z || 1)} ${6 * (o.z || 1)}` : null, pathLength: o.dash ? null : 1 },
    o.live ? "none" : o.dash || o.kind === "fade" ? "fade" : "line", null, o.bb || null);
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? W(o) : null, opacity: o.op ?? null, "stroke-dasharray": o.dash ? `${6 * (o.z || 1)} ${6 * (o.z || 1)}` : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null }, o.live ? "none" : o.c && !o.fill && !o.dash ? "line" : "fade", null, [x, y, x + w, y + h]);
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade", null, [x - r, y - r, x + r, y + r]); }
// a word or number: three sizes only (maths 36, words 28, small 20), times the text zoom
function text(k, s, x, y, cls, o = {}) {
  const z = o.z ?? TZ, size = FS[cls] * z, str = String(s);
  const w = str.length * size * (cls === "maths" || /^[0-9?]+$/.test(str) ? 0.6 : 0.52) / SQ, h = CAPH[cls] * z;
  const anchor = o.anchor || "middle", x0 = anchor === "start" ? x : anchor === "end" ? x - w : x - w / 2;
  const style = [o.c ? `fill:${o.c}` : "", z !== 1 ? `font-size:${size}px` : ""].filter(Boolean).join(";") || null;
  put(k + (z !== 1 ? `@${z}` : ""), "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": anchor, "dominant-baseline": "central", style },
    o.live ? "none" : "fade", str, [x0, y - h / 2, x0 + w, y + h / 2]);
}
// words in rows of 2 squares (times the zoom), wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const z = TZ, per = (cls === "say" ? 0.72 : 0.52) * z, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  s = s.replace(/ ([=+−×÷<>]) /g, "\u00A0$1\u00A0");
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2 * z, cls, { anchor: "start", c: o.c, live: o.live }));
  return rows.length;
}
// a label's ink half a square from the edge it labels
function lab(k, s, side, edge, along, cls = "small", c, o = {}) {
  const z = TZ, h = CAPH[cls] * z / 2, live = o.live;
  if (side === "above") text(k, s, along, edge - 0.5 * z - h, cls, { c, live, anchor: o.anchor });
  else if (side === "below") text(k, s, along, edge + 0.5 * z + h, cls, { c, live, anchor: o.anchor });
  else if (side === "left") text(k, s, edge - 0.5 * z, along, cls, { c, anchor: "end", live });
  else text(k, s, edge + 0.5 * z, along, cls, { c, anchor: "start", live });
}
const ring = (k, x, y, r = 0.9) => { const R = r * TZ; path(k, `M${sq(x + R)} ${sq(y)}a${sq(R)} ${sq(R)} 0 1 1 0 -0.1`, { c: "var(--chapter)", z: TZ, bb: [x - R, y - R, x + R, y + R] }); };
// a number written as school writes it on squared paper: 2 squares a digit (and a minus), lined up on the right; the
// point sits on the grid line between two digits
function digits(k, s, right, row, o = {}) {
  const z = TZ; let col = 0; s = String(s).replace("-", "−");
  for (let i = s.length - 1; i >= 0; i--) {
    if (s[i] === ".") { text(`${k}${i}.`, ".", right - col, row, "maths", { c: o.c, live: o.live }); continue; }
    text(`${k}${i}${s[i]}`, s[i], right - col - z, row, "maths", { c: o.c, live: o.live }); col += 2 * z;
  }
}
const cellsOf = v => String(v).replace(".", "").length;
// a tight number's width in whole squares (maths, 36: about 1.1 squares a character)
const tightW = v => Math.ceil(String(v).length * 1.08 + 0.4);
// an answer box in the record: cells of 2 squares, what's typed lined up on the right, the cursor after it
function dbox(k, x, y, cells, value, state, dec) {
  const z = TZ, c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}${state}`, x, y, cells * 2 * z, 2 * z, { c, z, live: state === "wrong" });
  if (value && dec) text(`${k}v${value}`, String(value).replace("-", "−"), x + cells * 2 * z - 0.3, y + z, "maths", { c: vc, live: true, anchor: "end" });
  else if (value) digits(`${k}v${value}`, value, x + cells * 2 * z, y + z, { c: vc, live: true });
  if (state === "active") put(`${k}cur`, "line", { x1: sq(x + cells * 2 * z + 0.4 * z), y1: sq(y + 0.35 * z), x2: sq(x + cells * 2 * z + 0.4 * z), y2: sq(y + 1.65 * z), stroke: "var(--chapter)", "stroke-width": 1.5 * z }, "none");
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2 * z), height: sq(2 * z), fill: "transparent", "data-act": "type" }, "none");
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  const z = TZ;
  rect(`${k}o`, x, y, w * z, 2 * z, { c: "var(--ink)", z });
  text(`${k}w${label}`, label, x + z, y + z, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + (w - 1.6) * z)} ${sq(y + z)}h${sq(0.8 * z)}m${-6 * z} ${-6 * z}l${6 * z} ${6 * z}l${-6 * z} ${6 * z}`, { z });
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w * z), height: sq(2 * z), fill: "transparent", "data-act": act }, "none");
}
// a written line of maths on squares: every glyph 2 squares (a digit, a letter, = − × ÷ + ( )), a power or an index
// 1 square a digit (small, raised or lowered), an answer box, or a finished answer in the chapter colour
function mrow(k, toks, x, y) {
  const z = TZ; let cx = x;
  toks.forEach((t, i) => {
    if (typeof t === "string" || t.s != null) {
      const s = typeof t === "string" ? t : t.s;
      for (const ch of s) { text(`${k}:${i}:${cx}:${ch}`, ch, cx + z, y, "maths", { c: t.c }); cx += 2 * z; }
    } else if (t.sup != null || t.sub != null) {
      // a power or an index hugs the glyph before it: 0.6 of a square a digit, small
      const s = String(t.sup ?? t.sub), dy = t.sup != null ? -0.75 * z : 0.6 * z;
      let px = cx - 0.4 * z;
      for (const ch of s) { text(`${k}:${i}:${cx}:${ch}`, ch, px + 0.3 * z, y + dy, "small", { c: t.c || "var(--ink)" }); px += 0.6 * z; }
      cx = px + 0.4 * z;
    } else if (t.root != null) {
      // a root: its sign 2 squares, the number under its bar 2 squares a digit, an index small in the sign's crook
      const s = String(t.root), w = 2 * s.length * z;
      path(`${k}:${i}:rad${s}`, `M${sq(cx + 0.2 * z)} ${sq(y + 0.15 * z)}L${sq(cx + 0.65 * z)} ${sq(y - 0.1 * z)}L${sq(cx + 1.15 * z)} ${sq(y + 0.9 * z)}L${sq(cx + 1.8 * z)} ${sq(y - 1.2 * z)}H${sq(cx + 2 * z + w)}`, { c: t.c || "var(--ink)", z, bb: [cx, y - 1.3 * z, cx + 2 * z + w, y + z] });
      if (t.idx) text(`${k}:${i}:ri`, t.idx, cx + 0.7 * z, y - 0.6 * z, "small", { c: t.c || "var(--ink)" });
      cx += 2 * z;
      for (const ch of s) { text(`${k}:${i}:${cx}:${ch}`, ch, cx + z, y, "maths", { c: t.c }); cx += 2 * z; }
    } else if (t.tight != null) {
      // a decimal: one tight number
      const w = tightW(t.tight); text(`${k}:${i}:${cx}:t${t.tight}`, String(t.tight).replace("-", "−"), cx + w / 2, y, "maths", { c: t.c }); cx += w;
    } else if (t.box) {
      // a finished answer is written straight after its = sign, 2 squares a digit (a decimal tight)
      const dec = String(t.value ?? "").includes(".") || t.dec;
      const cells = t.state === "done" ? (dec ? tightW(t.value) / 2 : cellsOf(t.value)) : Math.max(t.cells, dec ? Math.ceil(tightW(t.value || "") / 2) : cellsOf(t.value || ""));
      if (t.state === "done") { if (dec) text(`${k}:${i}:at${t.value}`, String(t.value).replace("-", "−"), cx + cells * z, y, "maths", { c: "var(--chapter)" }); else digits(`${k}:${i}:a`, String(t.value), cx + cells * 2 * z, y, { c: "var(--chapter)" }); }
      else dbox(`${k}:${i}:b`, cx, y - z, cells, t.value, t.state, dec);
      cx += cells * 2 * z;
    }
  });
  return cx;
}
function mwidth(toks) {
  return toks.reduce((w, t) => w + (typeof t === "string" ? 2 * t.length : t.s != null ? 2 * t.s.length : t.sup != null || t.sub != null ? 0.6 * String(t.sup ?? t.sub).length
    : t.root != null ? 2 + 2 * String(t.root).length : t.tight != null ? tightW(t.tight) : 2 * (t.state === "done" ? cellsOf(t.value) : Math.max(t.cells, cellsOf(t.value || "")))), 0) * TZ;
}
// what to do on the rows above the picture: one line, and a small second line (or what a slip says, in red). Words
// always face the child (UP), so they stay put when the paper tilts.
function dhead(L, say, sub, width = 66, x = 0, y = 0) {
  const up = UP; UP = true;
  const z = TZ, rows = words(`say-${say}`, say, x, y + z, width * z);
  const y2 = y + z + 2 * z * (rows - 1) + 2.3 * z;
  if (L.msg) words(`msg-${L.msg}`, L.msg, x, y2, width * z, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, x, y2, width * z, "small");
  UP = up;
}
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];
const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
// the first three problems of a run are the friendly ones: the smallest of six draws (the web's withEasyStart)
function easy(gen, size, idx) {
  let best = gen(); if (idx >= 3) return best;
  for (let i = 1; i < 6; i++) { const p = gen(); if (size(p) < size(best)) best = p; }
  return best;
}
// how far a finger may be from a handle and still take it: 2.5 squares, or 28 px on the screen when zoomed out
const hitR = () => Math.max(2.5, 28 / (cam.s * SQ));

let raf = 0;
function render() {
  items = []; SEGS = []; lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none", a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${Math.min(n++ * 0.035, 1.2).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  sceneEl.innerHTML = out; upEl.innerHTML = outUp;
  const m = lesson.paperMatrix && lesson.paperMatrix();
  if (m) document.getElementById("paperg").setAttribute("transform", `matrix(${m.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  // a lesson that's moving draws again next frame
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${probIdx + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}
// what's drawn now, in squares, with a square around it
function frameBox() {
  if (!lesson.t) return contentBox();
  const save = items; items = []; FRAMING = true;
  try { lesson.scene(); } finally { FRAMING = false; }
  const b = contentBox(); items = save; return b;
}
function contentBox(list = items) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const it of list) if (it.bb) { x0 = Math.min(x0, it.bb[0]); y0 = Math.min(y0, it.bb[1]); x1 = Math.max(x1, it.bb[2]); y1 = Math.max(y1, it.bb[3]); }
  return { x: Math.min(x0, 0) - 1, y: Math.min(y0, 0) - 1, w: x1 - Math.min(x0, 0) + 2, h: y1 - Math.min(y0, 0) + 2 };
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.25x. The words' rows sit at the top of

          miss: "t is 3t ÷ 3.", slip: x => Math.abs(x - L2) < 0.001 ? "That's 3t. Divide by 3 for t." : Math.abs(x - 3 * L2) < 0.02 ? `3t is ${L2}: divide, don't multiply.` : null }] : [])]);
    },
    act(x) {
      if (x !== "check" || !this.typing) return;
      const r = wcheck(this);
      if (this.stage === "div" && r === "all") { this.stage = "tap"; return; }
      if (this.stage === "log" && (r === "next" || r === "all")) { this.stage = three ? "third" : "done"; return; }
      if (this.stage === "third" && r === "all") this.stage = "done";
    },
    scene() {
      const st = this.stage, live = !!this.held, after = s => stages.indexOf(st) > stages.indexOf(s), open = after("tap");
      const sayLine = story ? `${a === 1 ? "1 cell doubles" : `${a} cells double`} every hour. When are there ${d}?` : null;
      const tStr = (+(t10 / 10).toFixed(1)).toString(), near = i0 <= 4 ? `a bit past ${j}` : `past halfway to ${j + 1}`;
      const say = {
        div: [sayLine || `Get ${Bs}ᵗ on its own.`, sayLine ? `Get ${Bs}ᵗ on its own: divide by ${a}.` : `Divide by ${a}.`],
        tap: [sayLine || `Which block is ${tv} in?`, sayLine ? `Tap the block ${tv} is in.` : `Tap the block: its ends are the powers either side of ${v}.`],
        squeeze: [`Squeeze ${tv} to a tenth.`, `Drag the point to the last tick under ${v}.`],
        log: [`Write ${tv} as a log.`, `It asks: ${Bs} to what power makes ${v}?`],
        third: ["Now find t.", ""],
        done: [`${pw(j)} is ${lab1(j)} and ${pw(j + 1)} is ${lab1(j + 1)}, so the power that makes ${v} is ${near}: ${tStr}${three ? ", and t is a third of that" : ""}.`, ""],
      }[st];
      dhead(this, say[0], say[1], 60);
      put("room", "g", {}, "none", null, [0, Y1, 50, Y2 + 2]);
      // line 1: the powers
      line("l1", 0, Y1, 5 * N, Y1);
      for (let n = 0; n <= N; n++) {
        line(`t1${n}`, 5 * n, Y1, 5 * n, Y1 + 0.6, { free: 1 });
        const lit = (this.press != null && (n === this.press || n === this.press + 1)) || (open && (n === j || n === j + 1));
        text(`p1${n}${lit}`, lab1(n), 5 * n, Y1 - 1.3, "small", { c: lit ? CH : "var(--ink2)" });
        text(`n1${n}`, n, 5 * n, Y1 + 1.6, "small", { c: "var(--ink)" });
      }
      if (st === "tap") put("taphit", "rect", { x: 0, y: sq(Y1 - 3), width: sq(5 * N), height: sq(6), fill: "transparent" }, "none");
      if (this.press != null) { rect(`pr${this.press}`, 5 * this.press, Y1 - 0.5, 5, 1, { fill: "var(--tint)", live: true }); readout("ends", `${pw(this.press)} = ${lab1(this.press)}, ${pw(this.press + 1)} = ${lab1(this.press + 1)}`, NX, 7.5); }
      // the name at line 1's right end
      mrow("name", [...(a > 1 ? [`${a}·`] : []), Bs, { sup: three ? "3t" : "t" }, `=${d}`], NX, Y1);
      // line 2: the block opened into tenths
      if (open) {
        rect("blk", 5 * j, Y1 - 0.5, 5, 1, { fill: "var(--tint)" });
        line("z1", 5 * j, Y1 + 0.6, 0, Y2, { dash: true, c: "var(--ink3)" }); line("z2", 5 * j + 5, Y1 + 0.6, 50, Y2, { dash: true, c: "var(--ink3)" });
        line("l2", 0, Y2, 50, Y2);
        for (let n = 0; n <= 10; n++) { line(`t2${n}`, 5 * n, Y2, 5 * n, Y2 + 0.6, { free: 1 }); text(`n2${n}`, (+(j + n / 10).toFixed(1)).toString(), 5 * n, Y2 + 1.6, "small", { c: "var(--ink)" }); }
        if (st === "squeeze") {
          dot("hd", 5 * this.i, Y2, live ? 0.75 : 0.6, { live: true });
          if (live || this.msg) { const x = j + this.i / 10; readout("tick", `${pw((+x.toFixed(1)).toString())} = ${val(x)}`, NX, 7.5, this.msg ? "var(--wrong)" : CH); }
        } else {
          rect("lit", 5 * i0, Y2 - 1, 5, 1, { fill: "var(--tint-strong)" });
          const lo = (+(j + i0 / 10).toFixed(1)).toString(), hi = (+(j + (i0 + 1) / 10).toFixed(1)).toString();
          freeLab("litn", `${lo} < ${tv} < ${hi}`, 5 * i0 + 2.5, Y2 - 2.3, "small", CH, [[0, 0, "middle"], [-2, 0, "end"], [2, 0, "start"]]);
          if (after("log")) dot("val", 50 * (Lg - j), Y2, 0.5, { c: "var(--right)" });
        }
      }
      // the record
      let ry = Y2 + 6;
      if (a > 1) { mrow("rd", [Bs, { sup: "t" }, `=${d}÷${a}=`, st === "div" ? wtok(this, "v") : { box: 1, cells: cellsOf(v), value: v, state: "done" }], 0, ry); ry += 3; }
      if (after("squeeze")) {
        const lnT = P.b === 2 ? [LOG, { sub: 2 }] : [{ tight: ln }];
        mrow("rl", [`${tv}=`, ...lnT, wtok(this, "L"), ...(wdone(this, "L") ? ["≈", { tight: L2.toFixed(2) }] : [])], 0, ry); ry += 3;
        if (three && wdone(this, "L")) { mrow("rt", ["t≈", wtok(this, "t")], 0, ry); ry += 3; }
      }
      if (st === "done") block("next", 0, ry, 10, "Next problem", "next");
      else if (this.typing) block("check", 0, ry, 7, "Check", "check");
    },
  };
  if (a > 1) writer(L, [{ id: "v", ans: v, cells: cellsOf(v), miss: `${Bs}${sup(three ? "3t" : "t")} is what's left when ${d} is shared into ${a} equal parts.`,
    slip: x => x === d ? `Divide first: ${Bs}ᵗ is on its own only after ÷ ${a}.` : x === d - a ? `${a}·${Bs}ᵗ is ${a} times ${Bs}ᵗ: divide by ${a}, don't take away.` : null }]);
  return L;
}

// ---------- self test: every generator over many problems, and every picture's camera ----------
function wfill(L) { L.wr.list.forEach(w => (L.wr.vals[w.id] = w.shown ?? w.ans)); L.wr.i = L.wr.list.length; L.typing = false; }
function camOf(L) { const keep = lesson; lesson = L; items = []; SEGS = []; L.scene(); const s = fitTo(contentBox()).s; lesson = keep; return s; }
function selfTest(N = 300) {
  const fail = [], ok = (c, m) => { if (!c) fail.push(m); };
  let minCam = 9;
  const cam1 = (L, what) => { const s = camOf(L); minCam = Math.min(minCam, s); ok(s >= 0.75, `${what} camera ${s.toFixed(2)}`); };
  for (let i = 0; i < N; i++) {
    const idx = i % 12;
    // Composing functions: the web's ranges, the answer from the same numbers, the biggest build inside the frame
    const c = genComp(idx), g = c.c * c.k + c.d;
    ok([c.a, c.c].every(v => v && Math.abs(v) <= 5) && [c.b, c.d].every(v => v && Math.abs(v) <= 9) && c.k && Math.abs(c.k) <= 4 && g !== 0, `compose ${JSON.stringify(c)}`);
    { const L = dComp(c); ok(L.P.out === c.a * g + c.b, "compose answer"); L.stage = "fWrite"; L.M = { n: "f", X: 5, Y: 11, w: Math.abs(g), inVal: g, m: c.a, add: c.b }; L.rows = [...Array.from({ length: Math.abs(c.a) }, () => ({ n: Math.abs(g), neg: c.a * g < 0 })), { n: Math.abs(c.b), neg: c.b < 0 }]; writer(L, [{ id: "f", ans: L.P.out, cells: cellsOf(L.P.out) }]); cam1(L, `compose ${JSON.stringify(c)}`); }
    // Inverse functions
    const q = genInv(idx);
    if (q.kind === "cube") ok([1, 2].includes(q.a) && [2, 3].includes(Math.abs(q.x)) && q.y === q.a * q.x ** 3, `inverse cube ${JSON.stringify(q)}`);
    else ok(AS.includes(q.a) && q.b && Math.abs(q.b) <= 9 && q.x >= -6 && q.x <= 9 && q.y === q.a * q.x + q.b && q.y !== q.x, `inverse ${JSON.stringify(q)}`);
    { const L = dInv(q), { pl, t0, f } = invPlane(q); ok(t0 !== q.x && f(t0) >= pl.yl && f(t0) <= pl.yh && q.y <= pl.yh && q.y >= pl.yl && q.x >= pl.xl && q.x <= pl.xh, `inverse plane ${JSON.stringify(q)}`);
      L.stage = "flip"; cam1(L, `inverse flip ${JSON.stringify(q)}`); L.toWrite(); wfill(L); L.stage = "done"; L.typing = false; cam1(L, `inverse done ${JSON.stringify(q)}`); }
    // Evaluating logarithms
    const lg = genLog(idx), top = { 2: 6, 3: 4, 5: 3, 10: 3 }[lg.b];
    ok(top && lg.m >= 1 && lg.k >= 1 && lg.m <= top && lg.k <= top && lg.m !== lg.k, `log ${JSON.stringify(lg)}`);
    { const L = dLog(lg); L.stage = "done"; writer(L, [{ id: "s", ans: lg.m + lg.k, cells: 2 }]); wfill(L); cam1(L, `log ${JSON.stringify(lg)}`); }
    // Log graphs
    const G = genLG(idx);
    ok([2, 3].includes(G.base) && (!G.moved || (G.h >= -2 && G.h <= 1 && G.k >= -2 && G.k <= 2 && (G.h || G.k))) && G.j >= 1 && G.j <= (G.base === 2 ? 3 : 2), `loggraph ${JSON.stringify(G)}`);
    if (idx < 3) ok(G.base === 2 && !G.moved, "loggraph easy start");
    { const L = dLG(G); L.fi = G.base === 2 ? 3 : 2; L.stage = "write"; L.toWrite(); wfill(L); L.stage = "done"; L.typing = false; cam1(L, `loggraph ${JSON.stringify(G)}`);
      if (G.moved) ok(2 ** G.j + G.h <= 10 && G.j + G.k >= -3, "loggraph slid point on the plane"); }
    // Solve with a log
    const S = genSolve(idx);
    { const b = S.b === "e" ? Math.E : S.b, Lg = Math.log(S.v) / Math.log(b);
      ok(S.d === S.a * S.v && S.a >= 1 && S.a <= 5 && S.v > b && S.v < b ** 5 && Math.abs(Lg - Math.round(Lg)) > 1e-6 && solveOK(S), `logsolve ${JSON.stringify(S)}`);
      if (idx < 3) ok(S.b === 2 && S.a === 1, "logsolve easy start");
      const L = dSolve(S); ok(Math.floor(10 * L.P.L2 + 1e-9) === Math.floor(10 * Lg), "logsolve tenth holds the log");
      L.stage = "done"; L.toWrite(); wfill(L); L.typing = false; cam1(L, `logsolve ${JSON.stringify(S)}`); }
  }
  // the biggest builds
  { const L = dComp({ a: 5, b: 9, c: 5, d: 9, k: 4 }); L.stage = "fRows"; L.M = { n: "f", X: 5, Y: 11, w: 29, inVal: 29, m: 5, add: 9 }; L.n = 6; cam1(L, "compose biggest"); }
  return { fail: fail.slice(0, 12), count: fail.length, minCam: +minCam.toFixed(2) };
}

// ---------- lessons, the bar ----------
let lesson, probIdx = 0, curId = "compose";
const LESSONS = {
  compose: { name: "Composing functions", gen: genComp, make: dComp },
  inverse: { name: "Inverse functions", gen: genInv, make: dInv },
  log: { name: "Evaluating logarithms", gen: genLog, make: dLog },
  loggraph: { name: "Log graphs", gen: genLG, make: dLG },
  logsolve: { name: "Solve with a log", gen: genSolve, make: dSolve },
};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id, idx = 0, P) {
  if (!LESSONS[id]) id = "compose";
  const e = LESSONS[id]; curId = id; probIdx = idx; token++;
  lesson = e.make(P || e.gen(idx));
  pick.value = id;
  drawn = new Set(); keys.blur();
  render(); frame(null, true);
  try { localStorage.setItem("g11ch3-lesson", id); } catch (err) {}
}
function next() { start(curId, probIdx + 1); }
pick.onchange = () => start(pick.value, 0);
document.getElementById("fresh").onclick = () => next();
let first = "compose", firstP = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g11ch3-lesson") || "compose";
  firstP = Math.max(0, (+u.get("p") || 1) - 1);
} catch (err) {}
start(first, firstP);
</script>
