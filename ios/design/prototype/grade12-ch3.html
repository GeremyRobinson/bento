<title>Undoing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* 12th grade, chapter 3: Undoing (inverse functions, log rules, arcsin). Chapter 2's kit (grade12-ch2.html), built on the 5th grade preview kit (new5-lessons.html).
   The whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is the only
   chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). iPad landscape only.
   Chapter colour: grade12.md names none; undoing is graphs on the plane, so this uses the kit's blue (the plane's colour
   in 6th grade's Points in four quadrants, 7th grade's lines and grade8-ch3.html). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #4F63D9; --tint: rgba(79, 99, 217, .2); --tint-strong: rgba(79, 99, 217, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 120px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the 5th grade kit) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const choose = arr => arr[rnd(0, arr.length - 1)];
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set();
let UP = false;
function put(k, tag, a, kind = "fade", text) { items.push({ k, tag, a, kind, text, up: UP }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c === "none" ? null : (o.c || "var(--ink)"), "stroke-width": o.c === "none" ? null : (o.w || 1.5),
    "stroke-dasharray": o.dash ? "6 6" : null, pathLength: o.fill || o.dash ? null : 1, opacity: o.op ?? null }, o.live ? "none" : o.fill || o.dash ? "fade" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null,
    pathLength: o.c && !o.fill ? 1 : null }, o.live ? "none" : o.c && !o.fill ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade"); }
function ringAt(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.fill || "var(--paper)", stroke: o.c || "var(--ink)", "stroke-width": 1.5 }, o.live ? "none" : "fade"); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const max = Math.max(8, widthSq);
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { const next = (cur + " " + w).trim(); if (tw(next, cls) > max && cur) { rows.push(cur); cur = w; } else cur = next; }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a block drawn on the paper: an outline, its word and arrow (Cut, Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}

// text widths, in squares, for laying words and working on whole squares
const mctx = document.createElement("canvas").getContext("2d");
const PX = { maths: 36, say: 28, small: 20 };
function tw(s, cls = "maths") { mctx.font = `600 ${PX[cls]}px ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif`; return mctx.measureText(String(s)).width / SQ; }

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none", a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${Math.min(n++ * 0.035, 1.2).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s), at most 125%. The frame's top sits at the top of the
// screen (the words on rows 0–2), never centred with an empty band above it.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 16, bottom = 96;
  const s = Math.min((W - 48) / sq(f.w), (H - top - bottom) / sq(f.h), (lesson && lesson.maxZoom) || 1.25);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- typing (the iPad's own keys): digits, a decimal point, and a minus in front ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = (lesson.typed || "").replace("−", "-"); keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => {
  const raw = keys.value.replace(/[−–]/g, "-"), neg = raw.trim().startsWith("-");
  lesson.type(((neg ? "−" : "") + raw.replace(/[^0-9.]/g, "")).slice(0, 5)); render();
});
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; mouse and touch alike ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); render(); frame(lesson.frame()); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) { render(); frame(lesson.frame()); }
});
function act(a) {
  if (a === "type") { openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}

// ---------- the designer kit: labels, answer boxes, what to do ----------
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c, o = {}) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c, live: o.live });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c, live: o.live });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end", live: o.live });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start", live: o.live });
}
function dbox(k, x, y, cells, value, state, actName) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  const cls = value && tw(value) > cells * 2 - 0.3 ? "say" : "maths";        // a long slip still fits its box
  if (value) text(`${k}v`, value, x + cells, y + 1, cls, { c: vc, live: true });
  if (state === "active") {
    const cx = x + cells + (value ? tw(value, cls) / 2 : 0) + 0.25;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// what to do on the rows above the picture: one line, and a small line under it (or what a slip says, in red)
function dhead(L, say, sub) {
  const W = Math.min(72, L.frame().w - 3);
  const rows = words(`say-${say}`, say, 0, 1, W);
  const y = 1 + 2 * rows + 0.3;
  if (L.msg) words(`msg-${L.msg}`, L.msg, 0, y, W, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, 0, y, W, "small");
}
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// ---------- school working on squared paper ----------
// A line of working sits on a row: ry is the line through its middle, where a fraction's bar lies. A fraction's top
// is centred a square above the bar and its bottom a square below (boxes: 2 squares tall above and below the bar).
// Tokens: {s, c} maths text · {box, cells} an answer box · {f: [top tokens, bottom tokens], c} a fraction.
function tokW(t) {
  if (t.box) return t.cells * 2;
  if (t.f) return Math.max(listW(t.f[0]), listW(t.f[1]));
  if (t.tight) return tw(t.s, t.cls || "maths") + 0.3;                     // a finished line, set close
  return Math.ceil(tw(t.s, t.cls || "maths") + 0.4);
}
const listW = l => l.reduce((s, t) => s + tokW(t), 0);
function mrow(L, k, x, ry, toks) {
  for (const [i, t] of toks.entries()) {
    const w = tokW(t), kk = `${k}${i}`;
    if (t.box) dbox(`${kk}${t.box}`, x, ry - 1, t.cells, L.vals[t.box] || "", boxState(L, t.box), `box:${t.box}`);
    else if (t.f) {
      const [top, bot] = t.f, wt = listW(top), wb = listW(bot);
      mlist(L, `${kk}t`, top, x + Math.floor((w - wt) / 2), ry - 1, t.c);
      line(`${kk}bar${w}`, x, ry, x + w, ry, { c: t.c });
      mlist(L, `${kk}b`, bot, x + Math.floor((w - wb) / 2), ry + 1, t.c);
    } else text(`${kk}:${t.s}`, t.s, x + w / 2, ry, t.cls || "maths", { c: t.c });
    x += w;
  }
  return x;
}
function mlist(L, k, toks, x, yc, c) {
  for (const [i, t] of toks.entries()) {
    const w = tokW(t);
    if (t.box) dbox(`${k}${i}${t.box}`, x, yc - 1, t.cells, L.vals[t.box] || "", boxState(L, t.box), `box:${t.box}`);
    else text(`${k}${i}:${t.s}`, t.s, x + w / 2, yc, "maths", { c: t.c || c });
    x += w;
  }
}

// ---------- exact values: s · a√r / d ----------
const sqFree = r => { for (let k = 2; k * k <= r; k++) if (r % (k * k) === 0) return false; return true; };
function simpRoot(m) { let k = 1, r = m; for (let j = 2; j * j <= r; j++) while (r % (j * j) === 0) { r /= j * j; k *= j; } return [k, r]; }
const vNum = v => v.s * v.a * Math.sqrt(v.r) / v.d;
// as text: −1/2, √2/2, 2√2/3, √3, 1
const vText = v => `${v.s < 0 ? "−" : ""}${v.a === 1 && v.r > 1 ? "" : v.a}${v.r > 1 ? "√" + v.r : ""}${v.d > 1 ? "/" + v.d : ""}`;
const magText = v => vText({ ...v, s: 1 });
// as written in the record, in the chapter colour: a minus, then the fraction
function vToks(v, c = "var(--chapter)") {
  const top = `${v.a === 1 && v.r > 1 ? "" : v.a}${v.r > 1 ? "√" + v.r : ""}`;
  const t = [];
  if (v.s < 0) t.push({ s: "−", c });
  if (v.d > 1) t.push({ f: [[{ s: top }], [{ s: String(v.d) }]], c }); else t.push({ s: top, c });
  return t;
}
// the answer boxes for a value: a fraction (top over bottom), a root over a bottom ([1]√[2] over [2]), a root, a number
function layoutOf(v) { return v.r === 1 ? (v.d === 1 ? "int" : "frac") : (v.d === 1 ? "rootw" : "root"); }
function boxToks(v, pre, cellsBottom = 1) {
  const lay = layoutOf(v);
  if (lay === "frac") return [{ f: [[{ box: pre + "a", cells: 2 }], [{ box: pre + "d", cells: cellsBottom }]] }];
  if (lay === "int") return [{ box: pre + "a", cells: 2 }];
  const root = [{ box: pre + "a", cells: 2 }, { s: "√" }, { box: pre + "r", cells: 1 }];
  if (lay === "rootw") return root;
  return [{ f: [root, [{ box: pre + "d", cells: cellsBottom }]] }];
}
const num = s => (s == null || s === "" ? null : s === "−" ? -1 : Number(s.replace("−", "-")));
function readVal(L, v, pre) {

      if (st === "all") block("all", P.left, r2 - 1, 9, "That's all", "all", { arrow: false });
      if (st === "done") block("next", P.left, Math.ceil(by), 10, "Next problem", "next");
    },
  });
  return L;
}

// ---------- lessons, the bar ----------
let lesson, index = 0;
const LESSONS = {
  undo: { name: "Undo a function", make: i => { const Q = genUndo(i); return Q.kind === "table" ? dTable(Q) : dUndo(Q); } },
  logrules: { name: "Log rules", make: i => dLog(genLog(i)) },
  arcsin: { name: "Undo a sine", make: i => dArc(genArc(i)) },
};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id, i = 0) {
  if (!LESSONS[id]) id = "undo";
  index = i;
  lesson = LESSONS[id].make(i);
  document.body.className = "undoing";
  pick.value = id;
  drawn = new Set(); keys.blur();
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g12ch3-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value, 0);
document.getElementById("fresh").onclick = () => leave();
function leave() { start(lesson.id, index + 1); }
window.GEN = { undo: genUndo, log: genLog, arc: genArc, solsOf, crossOf, arcOf, vNum, PUT, PROD };
let first = "undo", firstI = 0;
try { const u = new URLSearchParams(location.search); first = u.get("l") || localStorage.getItem("g12ch3-lesson") || "undo"; firstI = +(u.get("i") || 0); } catch (err) {}
start(first, firstI);
if (document.fonts) document.fonts.ready.then(() => render());
</script>
