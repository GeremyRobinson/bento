<title>2nd Grade: Data</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). iPad landscape only.
   2nd grade, chapter 5 (Data): pink, the island's chapter pink (as chapter 2). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #D6407F; --tint: rgba(214, 64, 127, .2); --tint-strong: rgba(214, 64, 127, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none; margin: 0;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 196px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--tint)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit of new5-lessons.html) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pickOne = list => list[rnd(0, list.length - 1)];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const count = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
const ceil5 = n => Math.ceil(n / 5) * 5;

let items = [];
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in
function put(k, tag, a, kind = "fade", text, html) { items.push({ k, tag, a, kind, text, html }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: o.dash ? null : 1,
    "stroke-dasharray": o.dash ? "6 6" : null }, o.live ? "none" : o.dash ? "fade" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  const outline = o.c && !o.fill && !o.dash;
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, "stroke-dasharray": o.dash ? (o.dash === true ? "6 6" : o.dash) : null,
    pathLength: outline ? 1 : null }, o.live ? "none" : outline ? "line" : "fade");
}
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c, live: o.live }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, lined up on the right
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) { text(`${k}${i}${s[i]}`, s[i], right - col - 1, row, "maths", { c: o.c }); col += 2; }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// a word block to tap: a pick on the paper (+ or −, Add or Take away), its word centred
function pickBlock(k, x, y, w, label, act, cls = "maths", c) {
  rect(`${k}o${c || ""}`, x, y, w, 2, { c: c || "var(--ink)" });
  text(`${k}w${label}`, label, x + w / 2, y + 1, cls, { c: cls === "small" ? "var(--ink)" : c });
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c, live) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c, live });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c, live });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end", live });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start", live });
}
// an answer box in the record: cells of 2 squares, the typed digits lined up on the right
function dbox(k, x, y, cells, value, state, actName = "box:ans") {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}${state}`, x, y, cells * 2, 2, { c });
  if (value) digits(`${k}v${value}${state}`, value, x + cells * 2, y + 1, { c: vc });
  if (state === "active") put(`${k}cur`, "line", { x1: sq(x + cells * 2 + 0.4), y1: sq(y + 0.35), x2: sq(x + cells * 2 + 0.4), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// lessons with answer boxes: each box has its own value; the hidden input types into the active one
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { if (L.canType && !L.canType(a.slice(4))) return true; L.active = a.slice(4); L.typing = true; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id && L.typing ? "active" : "idle"; }
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// an equation written on the squares: 2 squares a digit or sign; a box where the child writes
function eqRow(k, toks, x, yc, o = {}) {
  let cx = x;
  toks.forEach((t, i) => {
    if (t && t.box) { dbox(`${k}b${t.box}`, cx, yc - 1, t.cells || 2, t.val || "", t.state, `box:${t.box}`); cx += 2 * (t.cells || 2); return; }
    const s = String(typeof t === "object" ? t.t : t), c = typeof t === "object" ? t.c : o.c;
    for (const ch of s) { text(`${k}:${i}:${ch}:${cx}:${c || ""}`, ch, cx + 1, yc, "maths", { c }); cx += 2; }
  });
  return cx;
}

// ---------- motion: pieces glide (a spring's path) to where the lesson puts them; drawing-in survives re-renders ----------
const GL = new Map(); let frameNo = 0;
const spring = u => u >= 1 ? 1 : (1 - (1 + 7 * u) * Math.exp(-7 * u)) / (1 - 8 * Math.exp(-7));
function glide(k, x, y, now = false, dur = 450) {
  const t = performance.now(); let g = GL.get(k);
  if (!g || now) { g = { fx: x, fy: y, tx: x, ty: y, t0: t - dur, dur }; GL.set(k, g); }
  else if (g.tx !== x || g.ty !== y) { const c = glideAt(g, t); Object.assign(g, { fx: c.x, fy: c.y, tx: x, ty: y, t0: t, dur }); }
  g.seen = frameNo;
  return glideAt(g, t);
}
function glideAt(g, t) { const e = spring(Math.min(1, (t - g.t0) / g.dur)); return { x: g.fx + (g.tx - g.fx) * e, y: g.fy + (g.ty - g.fy) * e }; }
// a piece that appears where another was (a ten opening, a ten closing) starts from there
function seed(k, x, y) { GL.set(k, { fx: x, fy: y, tx: x, ty: y, t0: performance.now() - 1000, dur: 450, seen: frameNo }); }
const gliding = () => { const t = performance.now(); for (const g of GL.values()) if (t - g.t0 < g.dur) return true; return false; };

let born = new Map(), raf = 0;
const DRAWN = { line: 0.55, fade: 0.4 };
function render() {
  items = []; frameNo++;
  lesson.scene();
  const now = performance.now(), next = new Map(); let n = 0, out = "";
  for (const it of items) {
    const a = { ...it.a };
    if (it.kind !== "none") {
      let b = born.get(it.k);
      if (!b) b = { t0: now, delay: Math.min(n++ * 0.035, 1.2), kind: it.kind };
      next.set(it.k, b);
      const el = (now - b.t0) / 1000;
      if (el < b.delay + DRAWN[b.kind] + 0.05) {
        a.class = ((a.class || "") + (b.kind === "line" ? " in-line" : " in-fade")).trim();
        a.style = `animation-delay:${(b.delay - el).toFixed(3)}s;` + (a.style || "");
      }
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    out += `<${it.tag} ${attrs}>${it.html != null ? it.html : it.text != null ? esc(it.text) : ""}</${it.tag}>`;
  }
  sceneEl.innerHTML = out;
  born = next;
  for (const [k, g] of GL) if (g.seen !== frameNo) GL.delete(k);
  if (gliding() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${probIndex + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, its top rows at the top of the screen, eased (0.75 s), never past 125%
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 20, bottom = 104;
  const s = Math.min((W - 48) / sq(f.w), (H - top - bottom) / sq(f.h), (lesson && lesson.maxZoom) || 1.25);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { camTo = null; Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- the voice (K–2): the instruction, a miss and the last line are read aloud; the speaker mark reads again ----------
let said = new Set(), saying = [];
function forSpeech(s) {
  return s.replace(/(^|\s)\?(?=[\s.,]|$)/g, "$1question mark").replace(/−/g, " minus ").replace(/\+/g, " plus ").replace(/=/g, " equals ");
}
function speak(s) {
  try {
    const ss = window.speechSynthesis;
    if (!ss || typeof SpeechSynthesisUtterance === "undefined") return;
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;   // browsers speak only after a first touch
    const u = new SpeechSynthesisUtterance(forSpeech(s)); u.lang = "en-US"; u.rate = 0.9; ss.speak(u);
  } catch (e) { /* no voice here */ }
}
function hush() { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* no voice here */ } }
function voice(list, missLine) {
  const fresh = list.filter(s => s && !said.has(s));
  if (fresh.some(s => s !== missLine)) hush();
  fresh.forEach(speak);
  said = new Set(list); saying = list;
}
function sayAgain() { hush(); saying.forEach(speak); }
// the speaker mark: a small drawn speaker in the margin, level with the first line of words
function speaker(y) {
  const x = sq(-3), t = sq(y);
  path("spk", `M${x + 5} ${t + 15}h8l10 -9v28l-10 -9h-8z`, { c: "var(--ink2)" });
  path("spkw1", `M${x + 28} ${t + 14}q5 6 0 12`, { c: "var(--ink2)" });
  path("spkw2", `M${x + 32} ${t + 9}q10 11 0 22`, { c: "var(--ink2)" });
  put("spkhit", "rect", { x, y: t, width: sq(2), height: sq(2), fill: "transparent", "data-act": "speak" }, "none");
}

// ---------- the top rows: a story (numbers in the chapter colour), the instruction, then a miss (red) or the readout ----------
function storyRows(sentences, widthSq) {
  const max = Math.floor(widthSq / 0.72), rows = []; let cur = "";
  for (const s of sentences) { if (!cur) cur = s; else if ((cur + " " + s).length <= max) cur += " " + s; else { rows.push(cur); cur = s; } }
  if (cur) rows.push(cur);
  const out = [];
  for (const r of rows) {
    if (r.length <= max) { out.push(r); continue; }
    let c = ""; for (const w of r.split(" ")) { if ((c + " " + w).trim().length > max && c) { out.push(c); c = w; } else c = (c + " " + w).trim(); }
    if (c) out.push(c);
  }
  return out;
}
function richLine(k, s, x, y, all) {
  const html = s.split(" ").map(w => all || /^\d/.test(w) ? `<tspan style="fill:var(--chapter)">${esc(w)}</tspan>` : esc(w)).join(" ");
  put(k, "text", { x: sq(x), y: sq(y), class: "say", "text-anchor": "start", "dominant-baseline": "central" }, "fade", null, html);
}
// where the instruction sits (row centre): under the story's lines, or on rows 0–2
const instrY = rows => rows && rows.length ? 2 * rows.length + 2 : 1;
function header(L, say, readout, width = 44) {
  const rows = L.storyRows || [], iy = instrY(rows);
  speaker(rows.length ? 0 : 0);
  rows.forEach((r, i) => richLine(`st${i}:${r}`, r, 0, 1 + 2 * i, L.storyAll));
  words(`say-${say}`, say, 0, iy, width);
  if (L.msg) words(`msg-${L.msg}`, L.msg, 0, iy + 2.3, width, "small", { c: "var(--wrong)" });
  else if (readout) text(`ro-${readout}`, readout, 0, iy + 2.6, "say", { anchor: "start", c: "var(--chapter)", live: !!L.held });
  voice([rows.length ? L.storySentences.join(" ") : null, say, L.msg].filter(Boolean), L.msg);
}

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; mouse and touch alike ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/[^0-9]/g, "").slice(0, lesson.maxLen ? lesson.maxLen() : 3)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  if (e.button > 0) return;
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab) { if (lesson.grab(p)) down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;

        if (inBox(q, h.x, h.y, 5, XH, 0.6)) { this.drag0 = { i, p: q, u: null }; this.held = true; this.msg = null; return true; }
      }
      return false;
    },
    drag(q) { if (this.stage === "hop") { this.hops.drag(q); return; } if (this.drag0) { this.drag0.p = q; this.drag0.u = q.y > (fold ? RY + 3 : TT + 1) && q.x < X(fold ? 10 : lo + 6) + 2.5 ? this.col(q.x) : null; } },
    release() {
      if (this.stage === "hop") { this.hops.release(); return; }
      const g = this.drag0; this.held = null; this.drag0 = null; if (!g || g.u == null) return;
      const i = g.i, u = g.u, w = fold ? data[i] : v;
      if (u !== w) {
        this.msg = !fold ? `That's above ${u}. The new ${one} is ${v} inches.` : P.past[i] && u === w + 1 ? `It's nearest ${w}.` : `That's above ${u}. The ${one} ends near ${w}.`;
        return;
      }
      this.placed[i] = true; seed(`xg${fold ? `d${i}` : "new"}`, g.p.x - 2.5, g.p.y - XH / 2);
      if (this.placed.every(Boolean)) this.stage = stages[1];
    },
    hopped(c) {
      if (c.from !== lw) { this.msg = "Start at the shortest, the X farthest left."; this.chain = null; return; }
      if (c.to !== hi) { this.msg = `That's ${Math.abs(c.to - c.from)} in. Hop to the X farthest right.`; return; }
      this.stage = "write"; this.active = "ans"; this.typing = true;
    },
    toWrite() { this.stage = "write"; this.active = "ans"; this.typing = true; },
    tap(q) {
      const st = this.stage; if (st !== "count" && st !== "tall") return false;
      const s = this.stacks(), u = this.col(q.x);
      if (Math.abs(q.x - X(u)) > 2.6 || !s[u] || q.y < LY - XH * s[u].length - 0.6 || q.y > LY + 0.5) return false;
      const n = s[u].length;
      if (st === "tall") {
        if (u !== mode) { this.msg = `That stack has ${n}. Find a taller one.`; return true; }
        this.msg = null; this.tallLit = u; this.toWrite(); return true;
      }
      // tap to count: each tap numbers the next X in the stack, from the bottom
      if (ask === 0 && u !== v) { this.msg = `That's the stack over ${u}. Count over ${v}.`; return true; }
      if (ask === 2 && u === v) { this.msg = `Longer than ${v} doesn't count ${v}.`; return true; }
      if (ask === 2 && u < v) { this.msg = `That one is shorter than ${v}.`; return true; }
      const next = s[u].find(x => !this.numbered[x.id]); if (!next) return true;
      this.msg = null; this.numbered[next.id] = ++this.counted;
      if (this.counted === want) this.toWrite();
      return true;
    },
    act(x) {
      if (boxAct(this, x)) return;
      if (x !== "check" || this.stage !== "write") return;
      let slips = [], plain;
      if (fold || ask === 1) { const n = howMany(data, mode); slips = [[n, "That's how many X's. Write the length under the stack."], [mode - 1, "That number is next to the tallest stack. Read the number right under it."], [mode + 1, "That number is next to the tallest stack. Read the number right under it."]]; plain = "Read the number under the tallest stack."; }
      else if (ask === 0) { const n = want; slips = [[n - 1, `Count the new ${one} too: its X is on top of the stack.`], [howMany(data, v - 1), `That's the stack above ${v - 1}. Find ${v} on the line first.`], [howMany(data, v + 1), `That's the stack above ${v + 1}. Find ${v} on the line first.`], [data.length + 1, `That's every ${one}. Count only the X's above ${v}.`]]; plain = `Count the X's above ${v}, the new one too.`; }
      else if (ask === 2) { slips = [[data.filter(u => u >= v).length, `Longer than ${v} doesn't count ${v}.`]]; plain = `Count the X's to the right of ${v}.`; }
      else { slips = [[hi + lw, "How much longer means the difference. Subtract."], [hi - lw + 1, "Count the hops, not the marks."]]; plain = `Take ${lw} away from ${hi}.`; }
      if (checkAnswer(this, want, slips, plain)) this.stage = "done";
    },
    scene() {
      const st = this.stage, si = stages.indexOf(st), g = this.drag0, c = this.chain;
      const say = { place: fold ? "Put each X above its length." : "Put its X above its length.", count: ask === 0 ? `Count the X's over ${v}.` : `Tap each X right of ${v}.`,
        tall: "Tap the tallest stack.", hop: "Hop from the shortest to the longest.", write: "Write the answer.", done: `Each X is one ${one}, above its length.` }[st];
      header(this, say, null, 50);
      // the fold: five things from 0 on the ruler, each with its X at its end until it's placed
      if (fold) {
        data.forEach((u, i) => drawItem(`f${i}`, one, X0, X(u) + (P.past[i] ? 1 : 0), 5 + 3 * i));
        ruler("ru", X0, RY, 5, 10);
      }
      text("title", th.title, X(lo + 2.5), TT, "say");
      // the inch line: a mark at each inch, numbered under it
      const lit = new Set(fold ? [] : ask === 0 || ask === 2 ? [v] : []);
      if (this.tallLit != null) lit.add(this.tallLit);
      if (g && g.u != null) lit.add(g.u);
      if (st === "hop" && c) { lit.add(c.from); lit.add(c.to); } else if (ask === 3 && !fold && si > 0) { lit.add(lw); lit.add(hi); }
      line("ln", X(lo - 1) - 1, LY, X(lo + 6) + 1, LY);
      for (let u = lo - 1; u <= lo + 6; u++) { line(`lk${u}`, X(u), LY, X(u), LY + 1); text(`lnum${u}${lit.has(u) ? "l" : ""}`, u, X(u), LY + 2.3, "small", { c: lit.has(u) ? "var(--chapter)" : null }); }
      text("lunit", "inches", X(lo + 6) + 2, LY + 2.3, "small", { anchor: "start" });
      // the stacks: an X in a cell over its number; counted ones numbered, in the chapter colour
      const s = this.stacks();
      for (const [u, xs] of Object.entries(s)) xs.forEach((m, k) => {
        const top = LY - XH * (k + 1), n = this.numbered[m.id], on = m.fresh || n || this.tallLit === +u;
        const pos = glide(`xg${m.id}`, X(+u) - 2.5, top), moving = Math.abs(pos.x - X(+u) + 2.5) + Math.abs(pos.y - top) > 0.01;
        xMark(`x${m.id}:${on ? "c" : ""}`, pos.x, pos.y, XH, on ? "var(--chapter)" : "var(--ink)", moving || m.fresh);
        if (n) text(`xn${m.id}`, n, X(+u) + 1.8, top + XH / 2, "small", { anchor: "start", c: "var(--chapter)" });
      });
      // the new thing at the top right with its length, and its X to place
      if (!fold && ask === 0) {
        drawItem("new", one, NX, NX + 10, NY);
        text("newl", `${v} inches`, NX + 10.5, NY + 1, "say", { anchor: "start" });
      }
      if (st === "place") this.placed.forEach((p, i) => {
        if (p) return;
        const h = this.holder(i), held = g && g.i === i;
        rect(`xh${i}`, h.x, h.y, 5, XH, { c: "var(--ink3)", dash: true });
        const at = held ? { x: g.p.x - 2.5, y: g.p.y - XH / 2 } : glide(`xp${i}`, h.x, h.y);
        xMark(`xp${i}`, at.x, at.y, XH, "var(--chapter)", true);
        if (held) seed(`xp${i}`, at.x, at.y);
      });
      // the readouts beside the plot, at the line's right end
      const rx = X(lo + 6) + 2, ry = LY - 1.5;
      if (g && g.u != null) sideRO(`${g.u} in`, rx, ry, true);
      if (st === "count" && this.counted) sideRO(`${this.counted}`, rx, ry);
      if (st === "hop" && c && c.to !== c.from) sideRO(`${Math.abs(c.to - c.from)} in`, rx, ry, !!this.held);
      // hops under the line, an inch a hop
      const k = c || (ask === 3 && !fold && si > 0 ? { from: lw, to: hi } : null);
      if (k) hopsOf(k.from, k.to).forEach(([p, r]) => arc(`hp${p}:${r}`, X(p), X(r), LY, -0.8, { live: !!this.held }));
      if (st !== "write" && st !== "done") return;
      if (ask === 3 && !fold) boxWord(this, [String(hi), "−", String(lw), "="], "in", X0, ROW);
      else boxWord(this, [], fold || ask === 1 ? "inches" : many, X0, ROW);
    },
  });
  L.hops = hopper(L, { at: px => L.col(px), band: [LY - 1.5, LY + 3], xr: [X(lo - 1), X(lo + 6)] }, c => L.hopped(c));
  return L;
}

// ---------- lessons, the bar ----------
let lesson, probIndex = 0;
const LESSONS = {
  "g2-makegraph": { name: "Make a graph", make: dMakeGraph },
  "g2-bargraph": { name: "Bar graphs", make: dBarGraph },
  "g2-lineplot": { name: "Line plots", make: dLinePlot },
};
window.GEN = { makegraph: genMakeGraph, bargraph: genBarGraph, lineplot: genLinePlot, modeOf, howMany, isFold };
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id) {
  if (!LESSONS[id]) id = "g2-makegraph";
  timers.forEach(clearTimeout); timers = [];
  GL.clear(); born = new Map(); said = new Set(); hush();
  lesson = LESSONS[id].make(probIndex);
  pick.value = id; keys.blur();
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g2ch5-lesson", id); } catch (err) { /* private window */ }
}
pick.onchange = () => { probIndex = 0; start(pick.value); };
document.getElementById("fresh").onclick = () => leave();
function leave() { probIndex++; start(lesson.id); }
let first = "g2-makegraph";
try {
  const q = new URLSearchParams(location.search);
  first = q.get("l") || localStorage.getItem("g2ch5-lesson") || first;
  probIndex = Math.max(0, parseInt(q.get("i") || "0", 10) || 0);
} catch (err) { /* private window */ }
start(first);
</script>
