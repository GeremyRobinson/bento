<title>3rd Grade: Fractions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). iPad landscape only.
   Chapter colour: Fractions is blue (grade3.md open question 1: blue for Fractions, the fractions' blue of 4th and
   5th grade's fraction chapters). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #4F63D9; --tint: rgba(79, 99, 217, .2); --tint-strong: rgba(79, 99, 217, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none; margin: 0;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; pointer-events: none; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out both; }
.in-fade { opacity: 0; animation: fade .4s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 120px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); white-space: nowrap; }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
/* the live readout of a hand move, big in the pill's middle while the finger is down */
#bar #live { font: 600 22px var(--round); color: var(--chapter); padding: 0 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#bar #live:empty, #bar #live:empty + .sep { display: none; }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <!-- a striped disk: the number being taken away (or the second number waiting) -->
    <pattern id="stripes" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="var(--paper)"/><line x1="1.5" y1="0" x2="1.5" y2="7" stroke="var(--chapter)" stroke-width="2.5" opacity=".55"/>
    </pattern>
  </defs>
  <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
  <g id="scene"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <span id="live" aria-live="polite"></span>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit from new5-lessons.html) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
let RNG = Math.random;
const rnd = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const pick = arr => arr[rnd(0, arr.length - 1)];
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const ceil5 = x => Math.ceil(x / 5 - 1e-9) * 5;
const ease = u => (u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const sq = n => n * SQ;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

let items = [];
// what's drawn reaches this far (in squares); the camera frames it
let X = { l: 0, r: 0, b: 0 }, track = true, XF = null, DELAY = null;
const CHW = { maths: 1.05, say: 0.72, small: 0.52 };
function reach(l, r, b) { if (!track) return; X.l = Math.min(X.l, l); X.r = Math.max(X.r, r); X.b = Math.max(X.b, b); }
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in
function put(k, tag, a, kind = "fade", text) { if (XF) a.transform = XF; items.push({ k, tag, a, kind, text, delay: DELAY }); }
function line(k, x1, y1, x2, y2, o = {}) {
  reach(Math.min(x1, x2), Math.max(x1, x2), Math.max(y1, y2));
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    opacity: o.op ?? null, "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 },
    o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, "stroke-linecap": "butt",
    "stroke-linejoin": "miter", pathLength: 1 }, o.live ? "none" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  reach(x, x + w, y + h);
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, "stroke-dasharray": o.dash ? "6 6" : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null }, o.live ? "none" : o.c && !o.fill && !o.dash ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) {
  reach(x - r, x + r, y + r);
  put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)", opacity: o.op ?? null }, o.live ? "none" : "fade");
}
function text(k, s, x, y, cls, o = {}) {
  const w = String(s).length * (CHW[cls] || 0.7), an = o.anchor || "middle";
  reach(an === "start" ? x : an === "end" ? x - w : x - w / 2, an === "start" ? x + w : an === "end" ? x : x + w / 2, y + 0.8);
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": an, "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function wrap(s, widthSq, cls = "say") {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  return rows;
}
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const rows = wrap(s, widthSq, cls);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, lined up on the right
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) { text(`${k}${i}${s[i]}`, s[i], right - col - 1, row, "maths", { c: o.c }); col += 2; }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// a label's ink half a square from what it labels
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end" });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start" });
}
// an answer box in the record: cells of 2 squares, what's typed lined up on the right, the cursor after it
function dbox(k, x, y, cells, value, state, actName) {
  const c = state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  rect(`${k}o${cells}${state === "idle"}`, x, y, cells * 2, 2, { c });
  if (value) digits(`${k}v${value}`, value, x + cells * 2, y + 1, { c: state === "wrong" ? c : null });
  if (state === "active") {
    const cx = x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// a line of the record: every character in its own 2 × 2 squares, as school writes on squared paper.
// A token is a number or sign, {t, c} (a coloured one) or {box, cells, val, state} (the child's box).
// Also {gap: n} (n empty squares), {w: "tens", sq: 4} (a word, 28, in sq squares) and {t, pad} (a number right-aligned
// in a wider slot, so a line written under another keeps its columns).
const tokW = t => (t && t.box ? t.cells * 2 : t && t.gap != null ? t.gap : t && t.w ? t.sq
  : String(t && t.t != null ? t.t : t).length * 2 + ((t && t.pad) || 0));
const eqW = toks => toks.reduce((s, t) => s + tokW(t), 0);
function eqRow(k, toks, x, y) {
  let cx = x;
  toks.forEach((t, i) => {
    if (t && t.box) { dbox(`${k}B${t.box}`, cx, y - 1, t.cells, t.val || "", t.state, `box:${t.box}`); cx += t.cells * 2; return; }
    if (t && t.gap != null) { cx += t.gap; return; }
    if (t && t.w) { text(`${k}${i}w${t.w}${cx}`, t.w, cx + 0.4, y, "say", { anchor: "start", c: t.c }); cx += t.sq; return; }
    if (t && t.pad) cx += t.pad;
    const s = String(t && t.t != null ? t.t : t), col = t && t.c;
    for (const ch of s) {
      if (ch === ",") text(`${k}${i},${cx}`, ",", cx + 0.15, y, "maths", { anchor: "start" });
      else text(`${k}${i}${ch}${cx}`, ch, cx + 1, y, "maths", { c: col });
      cx += 2;
    }
  });
  return cx;
}
// an array of things: rows × cols cells of c squares, the cells faint over the paper, the outline in ink
function cells(k, x, y, rows, cols, c, o = {}) {
  if (rows <= 0 || cols <= 0) return;
  for (let i = 1; i < cols; i++) line(`${k}v${i}`, x + i * c, y, x + i * c, y + rows * c, { c: "var(--ink3)", w: 1, op: .6, live: o.live });
  for (let j = 1; j < rows; j++) line(`${k}h${j}`, x, y + j * c, x + cols * c, y + j * c, { c: "var(--ink3)", w: 1, op: .6, live: o.live });
  if (o.outline !== false) rect(`${k}o`, x, y, cols * c, rows * c, { c: "var(--ink)", live: o.live });
}
const dotR = c => c * 0.24;
function dots(k, x, y, rows, cols, c, o = {}) {
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    if (o.n != null && i * cols + j >= o.n) return;
    dot(`${k}${i}_${j}`, x + j * c + c / 2, y + i * c + c / 2, dotR(c), { live: o.live });
  }
}
// a bracket down the side of what it counts: [ on the left, ] on the right; dashed while it's still open
function bracket(k, side, x, y1, y2, open) {
  const t = side === "L" ? 0.6 : -0.6;
  line(`${k}${open}`, x, y1, x, y2, { dash: open });
  line(`${k}t1`, x, y1, x + t, y1); line(`${k}t2`, x, y2, x + t, y2);
}
// a name still to find: an empty box where its number goes
function nameBox(k, cx, cy) { rect(`${k}nb`, Math.round(cx) - 2, Math.round(cy) - 1, 4, 2, { c: "var(--ink3)" }); }
// a thing taken away: crossed out where it sits
function cross(k, x, y, c) { const r = c * 0.32; line(`${k}x`, x - r, y + r, x + r, y - r, { c: "var(--ink)" }); }

// ---------- motion: a thing that moves glides to where it now belongs ----------
// (a thing no longer drawn, e.g. a row dragged away again, stops counting as moving)
const TW = new Map(); let RN = 0;
function glide(id, to, dur = 380) {
  const now = performance.now(); let t = TW.get(id);
  if (t) t.last = RN;
  if (!t) { t = { v: to.slice(), from: to.slice(), to: to.slice(), t0: now, dur, on: false, last: RN }; TW.set(id, t); return t.v; }
  if (t.to[0] !== to[0] || t.to[1] !== to[1]) { t.from = t.v.slice(); t.to = to.slice(); t.t0 = now; t.dur = dur; }
  const u = clamp((now - t.t0) / t.dur, 0, 1), e = ease(u);
  t.v = [t.from[0] + (t.to[0] - t.from[0]) * e, t.from[1] + (t.to[1] - t.from[1]) * e];
  t.on = u < 1;
  return t.v;
}
const gliding = () => { for (const t of TW.values()) if (t.on && t.last === RN) return true; return false; };

// ---------- render: draw the scene, the words above it, then frame it ----------
let raf = 0, born = new Map(), framed = null, lesson;
function render() {
  const now = performance.now();
  RN++;
  if (lesson.tick) lesson.tick(now);
  items = []; X = { l: 0, r: 0, b: 0 }; track = true; XF = null; DELAY = null;
  lesson.scene(now);
  // what to do on the rows above the picture (a story first, where there is one); a miss under it in red
  const W = Math.max(44, X.r), h = lesson.head();
  let y = 1;
  if (h.story) y += 2 * words(`story-${h.story}`, h.story, 0, y, 66, "say", { c: "var(--ink2)" });
  const ns = words(`say-${h.say}`, h.say, 0, y, W);
  track = false;
  let my = y + 2 * ns + 0.3;
  if (lesson.msg) my += 2 * words(`msg-${lesson.msg}`, lesson.msg, 0, my, W, "small", { c: "var(--wrong)" });
  // what a square stands for, when a big problem makes it smaller (small, under the words)
  if (h.note) words(`note-${h.note}`, h.note, 0, my, W, "small", { c: "var(--ink2)" });
  track = true;
  let n = 0, out = "";
  const seen = new Set();
  for (const it of items) {
    seen.add(it.k);
    const a = { ...it.a };
    if (it.kind !== "none") {
      let b = born.get(it.k);
      if (!b) { b = { t0: now, d: it.delay != null ? it.delay : Math.min(n++ * 0.035, 1.2) }; born.set(it.k, b); }
      const el = (now - b.t0) / 1000, dur = it.kind === "line" ? .55 : .4;
      if (el < b.d + dur) {
        a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
        a.style = `animation-delay:${(b.d - el).toFixed(3)}s;` + (a.style || "");
      }
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    out += `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
  }
  for (const k of [...born.keys()]) if (!seen.has(k)) born.delete(k);
  sceneEl.innerHTML = out;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
  // the camera frames what's drawn now (never while a finger moves something)
  // (the real bounds, words included; the camera centres them across the screen, so the picture sits centred under
  // the words and fills the space below them)
  const f = { x: Math.min(-1, X.l - 1), y: -1, w: X.r - Math.min(-1, X.l - 1) + 1, h: X.b + 2 };
  if (!(down && down.grabbed) && (!framed || Math.abs(f.x - framed.x) + Math.abs(f.w - framed.w) + Math.abs(f.h - framed.h) > 0.3)) {
    frame(f, !framed); framed = f;
  }
  if ((gliding() || (lesson.anim && lesson.anim(now))) && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.25x. The words keep the top-left of the
// screen, the picture under them; there's no empty band above or beside the paper.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
const MAXZ = 1.25, TOP = 16, BOTTOM = 104;
const fitScale = (w, h) => Math.min((innerWidth - 48) / sq(w), (innerHeight - TOP - BOTTOM) / sq(h), MAXZ);
function fitTo(f) {
  const s = fitScale(f.w, f.h);
  return { s, x: sq(f.x + f.w / 2) - innerWidth / 2 / s, y: sq(f.y) - TOP / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { camTo = null; Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = ease(u);
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => { if (framed) frame(framed, true); });

// the record beside the picture or under it, whichever lets the camera show both bigger. Beside, it starts on the
// block line a block right of the picture; under, 3 rows under it. (grade3.md: a tall picture keeps its record beside it.)
function placeRecord({ x0, picR, picB, recW, recH, y0 = 10, minW = 44 }) {
  const under = { rx: x0, ry: picB + 3, w: Math.max(picR, x0 + recW, minW), h: picB + 3 + recH };
  const bx = ceil5(picR + 3), beside = { rx: bx, ry: y0, w: Math.max(bx + recW, minW), h: Math.max(picB, y0 + recH) };
  const sc = f => fitScale(f.w + 2, f.h + 2);
  return sc(beside) > sc(under) + 0.005 ? { ...beside, beside: true } : { ...under, beside: false };
}

// ---------- typing (the iPad's own number keys), only for the number school writes ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/[^0-9]/g, "").slice(0, lesson.maxLen || 3)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });
function withBoxes(L) {
  L.vals = {}; L.active = null; L.verdict = null; L.typing = false;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  L.write = function (id) { this.active = id; this.typing = true; this.verdict = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
// checks the typed number: right, a known slip (the web's words), or "Not quite." and the web's hint
function checkBox(L, id, ans, slips, hint) {
  const v = L.vals[id];
  if (!v) return false;
  if (+v === ans) { L.verdict = null; L.msg = null; L.typing = false; return true; }
  L.verdict = "wrong";
  const s = slips.find(([w]) => w === +v && w !== ans);
  L.msg = s ? s[1] : `Not quite. ${hint}`;
  return false;
}
// a box token for the record: the child's box, or once it's right the number in the chapter colour
// (pad: once right, the number keeps the box's width, right-aligned, so the columns under it stay put)
const boxTok = (L, id, ans, cells, right, pad) => (right ? { t: ans, c: "var(--chapter)", pad: pad ? Math.max(0, cells * 2 - String(ans).length * 2) : 0 }
  : { box: id, cells, val: L.vals[id] || "", state: boxState(L, id) });
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; mouse and touch alike ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
const live = document.getElementById("live");
function setLive() { live.textContent = down && down.grabbed && lesson.readout ? lesson.readout() : ""; }
let down = null;
svg.addEventListener("pointerdown", e => {
  if (down) return;
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { id: e.pointerId, p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; if (!lesson.keepMsg) lesson.msg = null; lesson.keepMsg = false; setLive(); render(); }
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
});
svg.addEventListener("pointermove", e => {
  if (!down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); setLive(); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
function up(e) {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); setLive(); render(); afterAct(); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
}
svg.addEventListener("pointerup", up);
svg.addEventListener("pointercancel", up);
function afterAct() { if (lesson.typing) openKeys(); else keys.blur(); }
function act(a) {
  if (a === "next") { leave(); return; }
  if (boxAct(lesson, a)) { render(); openKeys(); return; }
  lesson.act(a);
  render(); afterAct();
}

// ---------- the hand moves this chapter adds (each built once, for later chapters too) ----------

// Drag a rectangle's edge: an array's open edge (bottom: rows, right: columns) snaps a cell at a time.
// (inset: when rows sit c apart with a gap between them, the open edge sits inset squares above the next row's top)
function EdgeDrag({ axis, x, y, c, span, min = 1, cap, inset = 0 }) {
  return {
    n: min, grabbed: false, start: min,
    edge() { return (axis === "rows" ? y : x) + this.n * c - inset; },
    grab(p) {
      const e = this.edge(), along = axis === "rows" ? p.x - x : p.y - y, across = axis === "rows" ? p.y - e : p.x - e;
      if (Math.abs(across) > 2.2 || along < -2 || along > span * c + 2) return false;
      this.grabbed = true; this.start = this.n; return true;
    },
    drag(p) { this.n = clamp(Math.round(((axis === "rows" ? p.y - y : p.x - x) + inset) / c), min, cap); },
    release() { this.grabbed = false; return this.n; },
    // the open edge in the chapter colour, with a dot to hold it by
    draw(k) {
      const e = this.edge(), L = span * c;
      if (axis === "rows") { line(`${k}e`, x, e, x + L, e, { c: "var(--chapter)", live: true }); dot(`${k}h`, x + L / 2, e, this.grabbed ? 0.7 : 0.55, { live: true }); }
      else { line(`${k}e`, e, y, e, y + L, { c: "var(--chapter)", live: true }); dot(`${k}h`, e, y + L / 2, this.grabbed ? 0.7 : 0.55, { live: true }); }
    },
    room() { if (axis === "rows") reach(x, x + span * c, y + cap * c + 1 - inset); else reach(x, x + cap * c + 1 - inset, y + span * c); },
    hand(v) { const L = span * c / 2; return axis === "rows" ? [{ x: x + L, y: this.edge() }, { x: x + L, y: y + v * c - inset }] : [{ x: this.edge(), y: y + L }, { x: x + v * c - inset, y: y + L }]; },
  };
}

// Drag across to share: empty rows on the right; their right edge snaps a column at a time and each new column takes
// one thing for every row from the end of the pile, sliding across.
function Share({ sx, y, c, rows, avail, cap = 10 }) {
  const ed = EdgeDrag({ axis: "cols", x: sx, y, c, span: rows, min: 0, cap });
  return {
    ed, get k() { return ed.n; }, set k(v) { ed.n = v; },
    // where pile thing i (of avail, counted from the start) goes: null while it stays in the pile
    cellOf(i) { const e = avail - 1 - i, j = Math.floor(e / rows), r = e % rows; return j < this.k ? [sx + j * c + c / 2, y + r * c + c / 2] : null; },
    readout() { const k = this.k, left = avail - k * rows; return left >= 0 ? `${k} in each · ${left} left` : `${k} in each · ${-left} missing`; },
    draw(k, o = {}) {
      // the rows to fill: faint lines across, the filled part outlined row by row
      if (!o.done) for (let r = 0; r <= rows; r++) line(`${k}g${r}`, sx, y + r * c, sx + cap * c, y + r * c, { c: "var(--ink3)", w: 1, op: .6 });
      for (let j = 1; j < this.k; j++) line(`${k}v${j}`, sx + j * c, y, sx + j * c, y + rows * c, { c: "var(--ink3)", w: 1, op: .6, live: true });
      for (let r = 0; r < rows; r++) if (this.k > 0) rect(`${k}r${r}`, sx, y + r * c, this.k * c, c, { c: "var(--ink)", live: true });
      line(`${k}l`, sx, y, sx, y + rows * c);
      if (!o.done) { ed.draw(k); reach(sx, sx + cap * c + 1, y + rows * c); }
    },
  };
}

// Slide pieces: a block of things waits beside the picture; dragged sideways it snaps a cell at a time, and let go
// right over its place it lands (crossing out what it covers, or joining the end).
function Slide({ gx, gy, c, cellsAt, S }) {
  return {
    off: S, grabbed: false,
    at(i) { const [col, row] = cellsAt[i]; return [gx + (col + this.off) * c, gy + row * c]; },
    grab(p) {
      if (!cellsAt.some((_, i) => { const [x, y] = this.at(i); return p.x >= x - 0.5 && p.x <= x + c + 0.5 && p.y >= y - 0.5 && p.y <= y + c + 0.5; })) return false;
      this.grabbed = true; this.px = p.x; this.o0 = this.off; return true;
    },
    drag(p) { this.off = clamp(this.o0 + Math.round((p.x - this.px) / c), 0, S + 1); },
    release() { this.grabbed = false; return this.off; },
    draw(k) {
      cellsAt.forEach((_, i) => {
        const [x, y] = this.at(i);
        rect(`${k}f${i}`, x, y, c, c, { fill: "var(--tint)", live: true });
        rect(`${k}o${i}`, x, y, c, c, { c: "var(--ink)", live: true });
        dot(`${k}d${i}`, x + c / 2, y + c / 2, dotR(c), { live: true });
      });
      reach(gx, gx + (Math.max(...cellsAt.map(q => q[0])) + S + 1) * c, gy + (Math.max(...cellsAt.map(q => q[1])) + 1) * c);
    },
    hand(v) { const [x, y] = this.at(0); return [{ x: x + c / 2, y: y + c / 2 }, { x: x + c / 2 + (v - this.off) * c, y: y + c / 2 }]; },
  };
}

// Turn a quarter: grab a corner and swing the picture round its middle; it snaps at a quarter turn, then slides so its
// top-left corner is back on its block line.
function Turn({ x, y, rows, cols, c }) {
  const W = cols * c, H = rows * c, C = [x + W / 2, y + H / 2];
  const ang = p => Math.atan2(p.y - C[1], p.x - C[0]) * 180 / Math.PI;
  const corners = [[x, y], [x + W, y], [x + W, y + H], [x, y + H]];
  const SW = 340, SL = 420;
  return {
    theta: 0, grabbed: false, run: null, settled: false, C,
    grab(p) {
      if (this.run || this.settled || !corners.some(([u, v]) => Math.hypot(p.x - u, p.y - v) < 3)) return false;
      this.a0 = ang(p); this.grabbed = true; return true;
    },
    drag(p) { let d = ang(p) - this.a0; while (d > 180) d -= 360; while (d < -180) d += 360; this.theta = d; },
    quarter() { return Math.abs(Math.round(this.theta / 90)) % 2 === 1; },
    release() {
      this.grabbed = false;
      const q = this.quarter(), to = q ? Math.round(this.theta / 90) * 90 : 0;
      this.run = { from: this.theta, to, t0: performance.now() };
      return q;
    },
    // where it is now: swinging (an angle), sliding home (a corner), or settled
    state(now) {
      if (!this.run) return { phase: this.settled ? "still" : "swing", theta: this.settled ? 0 : this.theta };
      const t = now - this.run.t0;
      if (t < SW) return { phase: "swing", theta: this.run.from + (this.run.to - this.run.from) * ease(t / SW) };
      if (this.run.to === 0) { this.run = null; this.theta = 0; return { phase: "swing", theta: 0 }; }
      const tl = [C[0] - H / 2, C[1] - W / 2], u = ease(clamp((t - SW) / SL, 0, 1));
      if (t < SW + SL) return { phase: "slide", o: [tl[0] + (x - tl[0]) * u, tl[1] + (y - tl[1]) * u] };
      this.run = null; this.settled = true; return { phase: "still" };
    },
    moving() { return !!this.run; },
    // the handle: a dot on the bottom-right corner and a curved arrow round it
    draw(k) {
      const [cx, cy] = [x + W, y + H], r = 2.4, a1 = -20 * Math.PI / 180, a2 = 110 * Math.PI / 180;
      const p1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)], p2 = [cx + r * Math.cos(a2), cy + r * Math.sin(a2)];
      path(`${k}arc`, `M${sq(p1[0])} ${sq(p1[1])}A${sq(r)} ${sq(r)} 0 0 1 ${sq(p2[0])} ${sq(p2[1])}l${sq(0.75)} ${sq(-0.2)}M${sq(p2[0])} ${sq(p2[1])}l${sq(0.15)} ${sq(-0.75)}`, { c: "var(--chapter)" });
      dot(`${k}h`, cx, cy, this.grabbed ? 0.7 : 0.55, { live: true });
      reach(cx, cx + r + 0.5, cy + r + 0.5);
    },
    room() { const m = Math.max(W, H); reach(Math.min(x, C[0] - H / 2), Math.max(x + W, C[0] + H / 2, x + H), Math.max(y + H, C[1] + W / 2, y + W)); },
    hand(deg) {
      const r = Math.hypot(W / 2, H / 2), a = Math.atan2(H / 2, W / 2);
      return [{ x: x + W, y: y + H }, { x: C[0] + r * Math.cos(a + deg * Math.PI / 180), y: C[1] + r * Math.sin(a + deg * Math.PI / 180) }];
    },
  };
}
// the rows light one by one and their counts are written at the right ends (See)
function countRows(k, x, y, rows, cols, c, o = {}) {
  for (let i = 0; i < rows; i++) {
    DELAY = 0.2 + i * 0.45;
    rect(`${k}lit${i}`, x, y + i * c, cols * c, c, { fill: "var(--tint)" });
    if (i === rows - 1) DELAY = 0.2;
    if (i < rows - 1 || o.last) text(`${k}n${i}`, (i + 1) * o.by, x + cols * c + 0.5, y + i * c + c / 2, "small", { anchor: "start", c: "var(--chapter)" });
    DELAY = null;
  }
}

// ---------- the hand moves chapter 2 adds ----------

// Ruler cut: a handle on a stem at the picture's edge. Dragged along, it snaps between things and a dashed cut runs
// across the picture. axis "cols": the stem stands over the top edge and the cut runs down; "rows": the stem sticks out
// of the right edge and the cut runs across. It rests at the far end (no cut) until it's moved.
function RulerCut({ axis, x, y, c, n, span, len = 3 }) {
  const down = axis === "cols";
  return {
    k: n, grabbed: false,
    at(k = this.k) { return down ? [x + k * c, y - len] : [x + span * c + len, y + k * c]; },
    grab(p) {
      const [hx, hy] = this.at();
      const ok = down ? Math.abs(p.x - hx) < 2 && p.y > hy - 2 && p.y < y + 0.5
        : Math.abs(p.y - hy) < 2 && p.x > x + span * c - 0.5 && p.x < hx + 2;
      if (!ok) return false;
      this.grabbed = true; return true;
    },
    drag(p) { this.k = clamp(Math.round((down ? p.x - x : p.y - y) / c), 1, n - 1); },
    release() { this.grabbed = false; return this.k; },
    draw(k) {
      const [hx, hy] = this.at(), L = span * c;
      if (down) line(`${k}s`, hx, y, hx, hy, { c: "var(--chapter)", live: true });
      else line(`${k}s`, x + L, hy, hx, hy, { c: "var(--chapter)", live: true });
      dot(`${k}h`, hx, hy, this.grabbed ? 0.7 : 0.55, { live: true });
      if (this.k > 0 && this.k < n) {
        if (down) line(`${k}cut`, hx, y - 0.6, hx, y + L + 0.6, { c: "var(--ink2)", dash: true, live: true });
        else line(`${k}cut`, x - 0.6, hy, x + L + 0.6, hy, { c: "var(--ink2)", dash: true, live: true });
      }
    },
    hand(v) { const [a, b] = this.at(), [c2, d] = this.at(v); return [{ x: a, y: b }, { x: c2, y: d }]; },
  };
}

// An array that a cut parts in two (after `at` columns, or `at` rows): the second part sits `gap` squares away. Before
// the cut it reads as one array (a faint line where the cut will go); once cut, the cut's edges are ink. Keys never
// change, so nothing redraws while the parts glide.
function splitArray(k, x, y, rows, cols, c, { axis, at, gap = 0, cut = false, tint = [false, false] }) {
  const byCols = axis === "cols", ink = { c: "var(--ink)" }, faint = { c: "var(--ink3)", w: 1, op: .6 };
  const P = byCols
    ? [{ x, y, w: at, h: rows, j0: 0, i0: 0 }, { x: x + at * c + gap, y, w: cols - at, h: rows, j0: at, i0: 0 }]
    : [{ x, y, w: cols, h: at, j0: 0, i0: 0 }, { x, y: y + at * c + gap, w: cols, h: rows - at, j0: 0, i0: at }];
  P.forEach((p, n) => {
    const W = p.w * c, H = p.h * c;
    if (tint[n]) rect(`${k}t${n}`, p.x, p.y, W, H, { fill: "var(--tint)" });
    for (let j = 1; j < p.w; j++) line(`${k}v${p.j0 + j}`, p.x + j * c, p.y, p.x + j * c, p.y + H, faint);
    for (let i = 1; i < p.h; i++) line(`${k}h${n}_${p.i0 + i}`, p.x, p.y + i * c, p.x + W, p.y + i * c, faint);
    for (let i = 0; i < p.h; i++) for (let j = 0; j < p.w; j++)
      dot(`${k}d${p.i0 + i}_${p.j0 + j}`, p.x + j * c + c / 2, p.y + i * c + c / 2, dotR(c));
  });
  const [A, B] = P;
  if (byCols) {
    line(`${k}l`, A.x, y, A.x, y + rows * c, ink);
    line(`${k}r`, B.x + B.w * c, y, B.x + B.w * c, y + rows * c, ink);
    for (const [n, p] of [[0, A], [1, B]]) { line(`${k}T${n}`, p.x, y, p.x + p.w * c, y, ink); line(`${k}B${n}`, p.x, y + rows * c, p.x + p.w * c, y + rows * c, ink); }
    if (cut) { line(`${k}c0`, A.x + at * c, y, A.x + at * c, y + rows * c, ink); line(`${k}c1`, B.x, y, B.x, y + rows * c, ink); }
    else line(`${k}v${at}`, x + at * c, y, x + at * c, y + rows * c, faint);
  } else {
    line(`${k}t`, x, A.y, x + cols * c, A.y, ink);
    line(`${k}b`, x, B.y + B.h * c, x + cols * c, B.y + B.h * c, ink);
    for (const [n, p] of [[0, A], [1, B]]) { line(`${k}L${n}`, x, p.y, x, p.y + p.h * c, ink); line(`${k}R${n}`, x + cols * c, p.y, x + cols * c, p.y + p.h * c, ink); }
    if (cut) { line(`${k}c0`, x, A.y + at * c, x + cols * c, A.y + at * c, ink); line(`${k}c1`, x, B.y, x + cols * c, B.y, ink); }
    else line(`${k}hc`, x, y + at * c, x + cols * c, y + at * c, faint);
  }
  return P;
}

// the biggest cells that still let the camera show the whole problem at 75% or more (else the one seen biggest)
function bestCell(cands, lay) {
  let best = null, bs = -1, any = cands[cands.length - 1], as = -1;
  for (const c of cands) {
    const R = lay(c), s = fitScale(R.w + 2, R.h + 2);
    if (s >= 0.74 && c * s > bs) { bs = c * s; best = c; }
    if (s > as) { as = s; any = c; }
  }
  return best != null ? best : any;
}
// how far a drag may go past the answer: at least one more, and never more than 36 squares (as chapter 1)
const capFor = (n, c) => Math.max(n + 1 <= 10 ? n + 1 : 10, Math.min(10, n + 2, Math.floor(36 / c)));
const CH = "var(--chapter)";
const litTok = (v, on) => (on ? { t: v, c: CH } : v);

// ---------- shared pieces chapter 3 adds ----------
// a ring round a digit of the record (the next digit, when rounding)
function ring(k, x, y, r = 1.05) {
  put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: "none", stroke: CH, "stroke-width": 1.5, pathLength: 1 }, "line");
}
// later(): a timed step that belongs to this problem only (a new problem cancels it)
function later(ms, fn) { const L0 = lesson; setTimeout(() => { if (lesson !== L0) return; fn(); render(); afterAct(); }, ms); }
// a piece that appears where another was (a ten opening, a ten closing) starts from there, then glides
function seedAt(id, p) { TW.set(id, { v: p.slice(), from: p.slice(), to: p.slice(), t0: 0, dur: 420, on: false, last: RN }); }
const PLN = { 100: ["hundreds", "hundred"], 10: ["tens", "ten"], 1: ["ones", "one"] };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const rh = x => Math.floor((x + 50) / 100) * 100;   // to the nearest hundred, halfway up
const CAST = [{ name: "Leo" }, { name: "Mia" }, { name: "Ava" }, { name: "Sam" }];

// Drag a point along a line: the line's ends lo..hi; while it moves, a bracket under the line from each end to where the
// number is, each with how far it is ("3 to 350"), as Rounding decimals' line 2 does.
function farBrackets(k, x0, x1, xp, y, lo, hi, v, live = true) {
  const by = y + 3;
  path(`${k}L`, `M${sq(x0)} ${sq(by - 0.6)}V${sq(by)}H${sq(xp)}V${sq(by - 0.6)}`, { c: CH, live });
  path(`${k}R`, `M${sq(xp)} ${sq(by - 0.6)}V${sq(by)}H${sq(x1)}V${sq(by - 0.6)}`, { c: CH, live });
  const sL = `${v - lo} to ${lo}`, sR = `${hi - v} to ${hi}`, wL = sL.length * 0.52 / 2 + 0.3, wR = sR.length * 0.52 / 2 + 0.3;
  // each label under its own part, kept clear of the other
  let cL = (x0 + xp) / 2, cR = (xp + x1) / 2;
  cL = Math.max(x0 + wL - 0.5, cL); cR = Math.min(x1 - wR + 0.5, cR);
  if (cR - wR < cL + wL + 0.6) { const m = (cL + wL + cR - wR) / 2; cL = m - wL - 0.3; cR = m + wR + 0.3; }
  text(`${k}Lw`, sL, cL, by + 1.2, "small", { c: CH, live });
  text(`${k}Rw`, sR, cR, by + 1.2, "small", { c: CH, live });

        const y = BY[r], pw = WH / m, cuts = this.cut ? D : m, out = lift && st === "first";
        // the shading (the first piece lifted out, while it's lifted)
        if (out) { if (n > 1) rect(`f${r}`, pw, y, (n - 1) * pw, BH, { fill: "var(--tint-strong)" }); rect(`hole${r}`, 0, y, pw, BH, { c: "var(--ink3)", dash: true }); }
        else rect(`f${r}`, 0, y, n * pw, BH, { fill: "var(--tint-strong)" });
        rect(`o${r}`, out ? pw : 0, y, out ? WH - pw : WH, BH, { c: "var(--ink)" });
        for (let i = 1; i < cuts; i++) if (!(out && i * WH / cuts < pw)) line(`c${r}_${cuts}_${i}`, i * WH / cuts, y, i * WH / cuts, y + BH, {});
        if (kind === "bottom" && st === "first") hitRect(`hb${r}`, 0, y, NX + 4, BH, `bar:${r}`);
        // the tapped bar's shaded pieces number
        if (kind === "bottom" && this.tapped === r) for (let i = 0; i < n; i++) text(`pn${r}_${i}`, i + 1, (i + 0.5) * pw, y + BH / 2, "say", { c: CH });
        // same top: the two pieces lift out over the bars, side by side, their real sizes; then they go home
        if (lift) {
          const g = glide(`lp${r}`, st === "first" ? [liftX[r], 10] : [0, T[r]], 480);
          piece(`lp${r}`, g[0], g[1], pw, BH, true, this.tapped === r ? CH : "var(--ink)");
          if (st === "first") { lab(`lpn${r}`, `1/${m}`, "above", g[1], g[0] + pw / 2, "small"); hitRect(`hp${r}`, g[0], g[1], pw, BH, `pc:${r}`); }
        }
        // the names at the right ends; once signed they come together into one line
        const at = glide(`nm${r}`, done ? [NX + r * 7, GY + 1] : [NX, T[r] + BH / 2], 600);
        fracCol(`nm${r}`, at[0], at[1], n, m, null);
      });
      // the ruler under the bars: one piece's length from the left end, its handle at the right; the cuts dashed across
      if (kind === "equal" && st === "first") {
        const len = WH / this.ru;
        path("ru", `M0 ${sq(RY - 0.6)}V${sq(RY)}H${sq(len)}V${sq(RY - 0.6)}`, { c: CH, live: true });
        dot("ruh", len, RY, this.held ? 0.7 : 0.55, { live: true });
        if (this.ru > 1) {
          for (let i = 1; i < this.ru; i++) line(`dc${this.ru}_${i}`, i * len, BY[0] - 0.6, i * len, BY[1] + BH + 0.6, { c: "var(--ink2)", dash: true, live: true });
          const t = this.rulerText(this.ru);
          text(`rut${t}`, t, 0, RY + 1.4, "small", { anchor: "start", c: CH, live: true });
        }
        reach(0, WH, RY + 2);
      }
      // the sign's place between the names, and the signs to tap
      if (!done) rect("sp", NX + 1, GY, 2, 2, { c: "var(--ink3)" });
      if (st === "sign") SIGNS.forEach((sym, i) => signBlock(`sg${i}`, NX + 5 + 5 * i, GY, sym, ACTS[i], this.bad === ACTS[i]));
      if (done) {
        DELAY = 0.5;
        text("sign", SIGNS[right], NX + 5.5, GY + 1, "maths", { c: CH });
        // (See) the shading's ends drop dashed lines across the other bar; the extra is outlined
        const e = [a / b * WH, c / d * WH];
        line("e0", e[0], BY[0] - 0.6, e[0], BY[1] + BH + 0.6, { c: "var(--ink2)", dash: true });
        if (s) {
          line("e1", e[1], BY[0] - 0.6, e[1], BY[1] + BH + 0.6, { c: "var(--ink2)", dash: true });
          const r = s > 0 ? 0 : 1, x1 = Math.min(...e), x2 = Math.max(...e);
          rect("extra", x1 + 0.4, BY[r] + 0.4, x2 - x1 - 0.8, BH - 0.8, { c: CH });
        }
        DELAY = null;
        block("next", NX, GY + 5, 11, "Next problem", "next");
      }
      reach(0, NX + 4, T[1] + BH);
    },
  };
  return L;
}

// ---------- the problems (fresh numbers every time; easy first by index) ----------
const GEN = {
  // Equal parts (new): early strips into 2, 3 or 4; then up to eighths, other shapes half the time (odd problems), one
  // set of other shapes in four not equal. A rectangle of 12 to 48 tiles, up to 8 × 6.
  shapeparts(i) {
    if (i < 3 || i % 2 === 0) {
      const b = i < 3 ? pick([2, 3, 4]) : pick([2, 3, 4, 6, 8]);
      for (;;) { const W = b * rnd(1, Math.floor(8 / b)), H = rnd(2, 6); if (W >= 2 && W * H >= 12 && W * H <= 48) return { kind: "strips", W, H, b }; }
    }
    for (;;) {
      const W = rnd(3, 8), H = rnd(2, 6), T = W * H, b = pick([2, 3, 4, 6, 8]);
      if (T < 12 || T > 48 || T % b) continue;
      const s = T / b, byCols = RNG() < 0.5;
      const run = byCols ? H : W;
      if (s < 3 || s % run === 0 || run % s === 0) continue;
      const bad = RNG() < 0.25 ? rnd(0, b - 2) : null, rg = snakeRegions(W, H, b, byCols, RNG() < 0.5, RNG() < 0.5, bad);
      // (parts that look different: at least one isn't a plain rectangle)
      const isRect = i => { const t = []; rg.forEach((row, y) => row.forEach((v, x) => { if (v === i) t.push([y, x]); }));
        const ys = t.map(q => q[0]), xs = t.map(q => q[1]); return (Math.max(...ys) - Math.min(...ys) + 1) * (Math.max(...xs) - Math.min(...xs) + 1) === t.length; };
      if (Array.from({ length: b }, (_, i) => i).every(isRect)) continue;
      return { kind: "shapes", W, H, b, bad, rg };
    }
  },
  // Unit fractions (web g3-unitfrac): early one part of 2, 3 or 4 shaded; then 3, 4, 6 or 8 parts, one shaded 35% of
  // the time, else 2 to b − 1.
  unitfrac(i) {
    if (i < 3) return { b: pick([2, 3, 4]), k: 1 };
    const b = pick([3, 4, 6, 8]);
    return { b, k: RNG() < 0.35 ? 1 : rnd(2, b - 1) };
  },
  // Fractions on a line (web g3-fracline): early halves, thirds or fourths, 0 to 1; then thirds to eighths, a line to 2
  // three times in ten when b is 6 or less (the point past 1).
  fracline(i) {
    const b = i < 3 ? pick([2, 3, 4]) : pick([3, 4, 6, 8]);
    const w = i >= 3 && b <= 6 && RNG() < 0.3 ? 2 : 1;
    let a;
    do a = rnd(1, w * b - 1); while (a % b === 0 || (w === 2 && a < b));
    return { a, b, w };
  },
  // Equal fractions (new): same point with b and d from the pairs 2–4, 2–6, 2–8, 3–6, 4–8 (either on top), a/b on a tick
  // of d. Early: halves and fourths. Then wholes one problem in four: 0 to 2 cut in halves to sixths (the point on 1 or
  // 2), or 0 to 4 in wholes.
  equiv(i) {
    if (i >= 3 && (i - 3) % 4 === 3) { const b = pick([1, 2, 3, 4, 6]); return { kind: 1, b, n: b === 1 ? rnd(1, 4) : rnd(1, 2) }; }
    const pr = i < 3 ? [2, 4] : pick([[2, 4], [2, 6], [2, 8], [3, 6], [4, 8]]), [b, d] = i === 0 || RNG() < 0.5 ? pr : [pr[1], pr[0]];
    const a = b < d ? rnd(1, b - 1) : (b / d) * rnd(1, d - 1);
    return { kind: 0, a, b, d };
  },
  // Comparing fractions (web g3-fraccompare): early same bottom; then same bottom 40%, same top 42%, same amount 18%.
  fraccompare(i) {
    const r = i < 3 ? 0 : RNG(), DENS = [2, 3, 4, 6, 8];
    if (r < 0.4) {
      const b = pick([3, 4, 6, 8]), a = rnd(1, b - 1); let c; do c = rnd(1, b - 1); while (c === a);
      return { a, b, c, d: b };
    }
    if (r < 0.82) {
      let a, b, d;
      do { a = rnd(1, 3); b = pick(DENS); d = pick(DENS); } while (b === d || a >= Math.min(b, d));
      return { a, b, c: a, d };
    }
    const [b, k] = pick([[2, 2], [2, 4], [3, 2], [4, 2]]), a = rnd(1, b - 1);
    return RNG() < 0.5 ? { a, b, c: a * k, d: b * k } : { a: a * k, b: b * k, c: a, d: b };
  },
};

// ---------- lessons, the bar ----------
const LESSONS = {
  "g3-shapeparts": { name: "Equal parts of a shape", gen: i => GEN.shapeparts(i), make: dShapeParts },
  "g3-unitfrac": { name: "Unit fractions", gen: i => GEN.unitfrac(i), make: dUnitFrac },
  "g3-fracline": { name: "Fractions on a number line", gen: i => GEN.fracline(i), make: dFracLine },
  "g3-equiv": { name: "Equal fractions", gen: i => GEN.equiv(i), make: dEquiv },
  "g3-fraccompare": { name: "Comparing fractions", gen: i => GEN.fraccompare(i), make: dCompare },
};
const pickEl = document.getElementById("pick");
pickEl.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
const idx = {};
function start(id, o = {}) {
  if (!LESSONS[id]) id = "g3-shapeparts";
  if (o.i != null) idx[id] = o.i;
  if (idx[id] == null) idx[id] = 0;
  const e = LESSONS[id];
  TW.clear(); born = new Map(); framed = null;
  lesson = e.make(o.P || e.gen(idx[id]));
  lesson.index = idx[id];
  pickEl.value = id;
  keys.blur(); live.textContent = "";
  render();
  try { localStorage.setItem("g3ch5-lesson", id); } catch (err) {}
}
pickEl.onchange = () => start(pickEl.value);
document.getElementById("fresh").onclick = () => leave();
function leave() { idx[lesson.id] = (idx[lesson.id] || 0) + 1; start(lesson.id); }
let first = "g3-shapeparts";
const qs = new URLSearchParams(location.search);
try { first = qs.get("l") || localStorage.getItem("g3ch5-lesson") || first; } catch (err) { first = qs.get("l") || first; }
if (qs.get("theme")) document.documentElement.dataset.theme = qs.get("theme");
start(first, { i: qs.get("i") != null ? +qs.get("i") : 0 });
</script>
