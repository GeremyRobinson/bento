<title>4th Grade: Measurement</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). iPad landscape only. */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #B7791F; --tint: rgba(197, 138, 27, .2); --tint-strong: rgba(197, 138, 27, .4);
  --right: #178A57; --right-tint: rgba(23, 138, 87, .2); --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #F0B341; --tint: rgba(240, 179, 65, .22); --tint-strong: rgba(240, 179, 65, .42);
  --right: #3CCF8E; --right-tint: rgba(60, 207, 142, .22); --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #F0B341; --tint: rgba(240, 179, 65, .22); --tint-strong: rgba(240, 179, 65, .42);
  --right: #3CCF8E; --right-tint: rgba(60, 207, 142, .22); --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); white-space: nowrap; }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
/* the live readout of a hand move, big in the pill's middle */
#bar #live { font: 600 22px var(--round); color: var(--chapter); padding: 0 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#bar #live:empty, #bar #live:empty + .sep { display: none; }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <!-- the second amount's pieces are striped (5th grade's bars) -->
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--tint)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".55"/>
    </pattern>
    <!-- a second number's disks are striped -->
    <pattern id="dstripe" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="var(--tint)"/>
      <line x1="1.2" y1="0" x2="1.2" y2="5" stroke="var(--chapter)" stroke-width="2.2"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <span id="live" aria-live="polite"></span>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit from grade4-ch2.html) ----------
// KS: a big problem draws its words, record and blocks KS times as big (whole steps, so they stay on the grid) when the
// camera has to step back for its picture (Two-digit times two-digit's biggest rectangles); 1 everywhere else.
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
let KS = 1;

let items = [], drawn = new Set();
let X = { l: 0, r: 0, b: 0 }, track = true;
const CHW = { maths: 1.05, say: 0.75, small: 0.55 }, FS = { maths: 36, say: 28, small: 20 };
function reach(l, r, b) { if (!track) return; X.l = Math.min(X.l, l); X.r = Math.max(X.r, r); X.b = Math.max(X.b, b); }
function put(k, tag, a, kind = "fade", text) { items.push({ k, tag, a, kind, text }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  reach(Math.min(x1, x2), Math.max(x1, x2), Math.max(y1, y2));
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-opacity": o.op ?? null, "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 },
    o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, "stroke-opacity": o.op ?? null,
    "stroke-dasharray": o.dash ? "6 6" : null, pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  reach(x, x + w, y + h);
  const outline = o.c && !o.fill && !o.dash;
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, "stroke-dasharray": o.dash ? "6 6" : null, opacity: o.op ?? null, rx: o.rx ?? null,
    pathLength: outline ? 1 : null }, o.live ? "none" : outline ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { reach(x - r, x + r, y + r); put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade"); }
function text(k, s, x, y, cls, o = {}) {
  const w = String(s).length * (CHW[cls] || 0.7) * KS, an = o.anchor || "middle";
  reach(an === "start" ? x : an === "end" ? x - w : x - w / 2, an === "start" ? x + w : an === "end" ? x : x + w / 2, y + 0.8 * KS);
  const st = [o.c ? `fill:${o.c}` : "", KS !== 1 ? `font-size:${FS[cls] * KS}px` : ""].filter(Boolean).join(";");
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": an, "dominant-baseline": "central", style: st || null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = (cls === "say" ? 0.72 : 0.52) * KS, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2 * KS, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  const K = KS;
  rect(`${k}o`, x, y, w * K, 2 * K, { c: o.main === false ? "var(--ink3)" : "var(--ink)" });
  text(`${k}w${label}`, label, x + K, y + K, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + (w - 1.6) * K)} ${sq(y + K)}h${sq(0.8 * K)}m${-6 * K} ${-6 * K}l${6 * K} ${6 * K}l${-6 * K} ${6 * K}`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w * K), height: sq(2 * K), fill: "transparent", "data-act": act }, "none");
}
// a label's ink half a square from what it labels
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c) {
  const h = CAPH[cls] * KS / 2, g = 0.5 * KS;
  if (side === "above") text(k, s, along, edge - g - h, cls, { c });
  else if (side === "below") text(k, s, along, edge + g + h, cls, { c });
  else if (side === "left") text(k, s, edge - g, along, cls, { c, anchor: "end" });
  else text(k, s, edge + g, along, cls, { c, anchor: "start" });
}
// what to do on the rows above the picture: one line (a story may take two), and a small line under it (or what a
// slip says, in red)
function dhead(L, say, sub, width) {
  const x = Math.min(0, X.l);
  const n = say ? words(`say-${say}`, say, x, KS, 66 * KS) : 1;
  track = false;
  const y = (2 * n + 1.3) * KS;
  if (L.msg) words(`msg-${L.msg}`, L.msg, x, y, width, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, x, y, width, "small");
  track = true;
}
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v.slice(0, this.maxLen || 2); this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// ---------- motion: a thing that moves glides from where it's drawn to where it belongs ----------
const MO = { cur: new Map(), tw: new Map(), emerge: new Set(), delay: new Map(), seen: new Set() };
const easeIO = u => (u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
function moveTo(id, x, y, r, o = {}) {
  MO.seen.add(id);
  const now = performance.now(), c = MO.cur.get(id);
  if (!c || o.now) { const v = { x, y, r }; MO.cur.set(id, v); MO.tw.delete(id); return v; }
  let t = MO.tw.get(id);
  if (t && (t.to.x !== x || t.to.y !== y || t.to.r !== r)) t = null;
  if (!t) {
    if (c.x === x && c.y === y && c.r === r) return c;
    const d = MO.delay.get(id) || 0; MO.delay.delete(id);
    t = { from: { ...c }, to: { x, y, r }, t0: now + d, dur: o.dur || 420 }; MO.tw.set(id, t);
  }
  const u = Math.max(0, Math.min(1, (now - t.t0) / t.dur)), e = easeIO(u);
  const v = { x: t.from.x + (t.to.x - t.from.x) * e, y: t.from.y + (t.to.y - t.from.y) * e, r: t.from.r + (t.to.r - t.from.r) * e };
  MO.cur.set(id, v);
  if (u >= 1) MO.tw.delete(id);
  return v;
}
const moving = id => MO.tw.has(id);
function disk(id, x, y, r, o = {}) {
  const v = moveTo(id, x, y, r, o);
  reach(v.x - v.r, v.x + v.r, v.y + v.r);
  const a = { cx: sq(v.x), cy: sq(v.y), r: sq(Math.max(0, v.r)) };
  if (o.striped) Object.assign(a, { fill: "url(#dstripe)", stroke: "var(--chapter)", "stroke-width": 1.5, r: sq(Math.max(0, v.r - 0.04)) });
  else a.fill = o.c || "var(--chapter)";
  put(`dk${id}`, "circle", a, MO.emerge.has(id) || o.live ? "none" : "fade");
}
let NID = 0;
const nid = () => ++NID;
const mk = n => Array.from({ length: n }, nid);
function emerge(x, y, r) { const id = nid(); MO.cur.set(id, { x, y, r }); MO.emerge.add(id); return id; }
let token = 0;
function after(ms, fn) { const t = token; setTimeout(() => { if (t !== token) return; fn(); render(); frame(lesson.frame()); if (lesson.typing) openKeys(); }, ms); }

// ---------- render ----------
let raf = 0;
const born = new Map();
function render() {
  items = []; X = { l: 0, r: 0, b: 0 }; MO.seen.clear();
  const head = lesson.scene() || ["", ""];
  for (const id of MO.tw.keys()) if (!MO.seen.has(id)) MO.tw.delete(id);
  const body = items; items = [];
  dhead(lesson, head[0], head[1], Math.max(44 * KS, X.r - Math.min(0, X.l) - 1));
  items = items.concat(body);
  const now = performance.now() / 1000;
  const next = new Set(); let n = 0, out = "";
  for (const it of items) {
    next.add(it.k);
    const a = { ...it.a };
    let delay = null;
    if (it.kind !== "none") {
      if (!drawn.has(it.k)) { delay = Math.min(n++ * 0.035, 1.2); born.set(it.k, { t: now, d: delay }); }
      else { const b = born.get(it.k); if (b) { const el = now - b.t; if (el < b.d + 0.65) delay = b.d - el; else born.delete(it.k); } }
      if (delay != null) {
        a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
        a.style = `animation-delay:${delay.toFixed(3)}s;` + (a.style || "");
      }
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    out += `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
  }
  sceneEl.innerHTML = out;
  for (const k of born.keys()) if (!next.has(k)) born.delete(k);
  if ((MO.tw.size || (lesson.animating && lesson.animating())) && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
  document.getElementById("live").textContent = (lesson.live && lesson.live()) || "";
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.25x
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
const viewScale = (w, h) => Math.min((innerWidth - 64) / sq(w), (innerHeight - 24 - 110 - 32) / sq(h), 1.25);
function fitTo(f) {
  const W = innerWidth, top = 24, s = viewScale(f.w, f.h);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); camTo = null; applyCam(); return; }
  if (camTo && Math.abs(camTo.x - t.x) + Math.abs(camTo.y - t.y) + Math.abs(camTo.s - t.s) < 0.01) return;
  if (!camTo && Math.abs(cam.x - t.x) + Math.abs(cam.y - t.y) + Math.abs(cam.s - t.s) < 0.01) return;
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = easeIO(u);
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));
function fitAll() { return { x: X.l - 2, y: -1, w: X.r - X.l + 4, h: X.b + 2 }; }

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(lesson.dot ? /[^0-9.]/g : /[^0-9]/g, "").slice(0, 7)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; mouse and touch alike ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
function toScreen(x, y) { const p = new DOMPoint(x * SQ, y * SQ).matrixTransform(svg.getScreenCTM()); return { x: p.x, y: p.y }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  if (down) return;
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { id: e.pointerId, p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
function up(e, cancel) {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e), d.moved); render(); frame(lesson.frame()); return; }
  if (d.moved || cancel) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) { render(); frame(lesson.frame()); }
}
svg.addEventListener("pointerup", e => up(e, false));
svg.addEventListener("pointercancel", e => up(e, true));
function act(a) {
  if (a === "type") { openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}

// ---------- numbers written on the squares ----------
const PL = ["ones", "tens", "hundreds", "thousands", "ten thousands", "hundred thousands"];
const PL1 = ["one", "ten", "hundred", "thousand", "ten thousand", "hundred thousand"];
const pl = (k, n) => (n === 1 ? PL1[k] : PL[k]);
const fmt = n => Number(n).toLocaleString("en-US");

      else this.msg = is(nAt * d) ? `That's how many. Each one is ${said(v, d)} ${th.long}: add ${said(v, d)} ${nAt} times.`
        : nAt > 1 && is((nAt - 1) * v) ? `There are ${nAt} of them: add ${said(v, d)} ${nAt} times.`
        : `Add ${said(v, d)} once for each ${th.one}.`;
    },
    scene() {
      const st = this.stage, done = st === "done";
      text("title", th.title, 0, top - 2 - (make ? 6 : 0), "say", { anchor: "start" });
      // the line: a tick each fourth or eighth, longer at halves and whole inches, which are named
      line("pl", 0, ly, 48, ly);
      for (let u = lo; u <= lo + 2 * d; u++) {
        const whole = u % d === 0, halfT = (2 * u) % d === 0, x = xOf(u);
        line(`pt${u}`, x, ly, x, ly + (whole ? 1.2 : halfT ? 0.9 : 0.5), { c: whole || halfT ? "var(--ink)" : "var(--ink3)" });
        if (halfT) text(`pn${u}`, said(u, d), x, ly + 2.2, "small");
      }
      // the cards waiting with the lengths (making the plot), the one to place now in ink, crossed out once placed
      if (make && (st === "place" || st === "drop")) data.forEach((u, i) => {
        const x = cardX(i), on = i === this.placed && st === "place", gone = i < this.placed;
        rect(`cd${i}${on}`, x, cardY, 4, 4, { c: on ? "var(--ink)" : "var(--ink3)" });
        text(`cv${i}`, said(u, d), x + 2, cardY + 2, "small", { c: gone ? "var(--ink3)" : "var(--ink)" });
        if (gone) line(`cx${i}`, x + 0.5, cardY + 3.5, x + 3.5, cardY + 0.5, { c: "var(--ink3)" });
      });
      // the X's: each glides from its card to its stack
      const lit = this.lit;
      data.forEach((u, i) => {
        if (i >= this.placed) return;
        const hx = xOf(u), hy = ly - 2 * level[i] - 1;
        const p0 = make && !MO.cur.has(ids[i]) ? moveTo(ids[i], cardX(i) + 2, cardY + 2, 0, { now: true }) : null;
        const pv = moveTo(ids[i], hx, hy, 0), on = lit.has(i), c = on ? cA : "var(--ink)";
        if (on) rect(`xl${i}`, hx - 1, hy - 1, 2, 2, { fill: "var(--tint-strong)" });
        const live = moving(ids[i]) || p0;
        line(`xa${i}${on}`, pv.x - 0.65, pv.y - 0.65, pv.x + 0.65, pv.y + 0.65, { c, live });
        line(`xb${i}${on}`, pv.x - 0.65, pv.y + 0.65, pv.x + 0.65, pv.y - 0.65, { c, live });
      });
      if (ask === 2 && (st === "tapX" || done)) line("vmark", xOf(v), ly - 2 * counts[v] - 1, xOf(v), ly, { dash: true, c: "var(--ink2)" });
      // the hop from the shortest to the longest, counting the pieces
      const len = this.held ? this.len : st === "write" || done ? (ask === 0 ? hi - low : 0) : 0;
      for (let k = 0; ask === 0 && k < len; k++) hop(`hp${k}`, xOf(low + k), xOf(low + k + 1), ly, { live: this.held, below: true, h: 0.6 });
      if (st === "hopIt") handle("hh", xOf(low + this.len), ly, this.held);
      // the question's line under the plot
      const ry = ly + 6;
      const ansT = done ? mixToks(fin, d, cA) : [{ gap: 0.5 }, boxTok(this, 1, "W"), { gap: 0.5 }, { fb: [{ id: "N", cells: 1 }, { id: "D", cells: 1 }], w: 3 }];
      if (ask === 0 && (st === "write" || done)) frow("rec", [...mixToks(hi, d), { op: "−" }, ...mixToks(low, d), { op: "=" }, ...ansT, { w: "in", c: done ? cA : null }], 0, ry, this);
      if (ask === 1 && (st === "write" || done)) frow("rec", [{ n: nAt }, { op: "×" }, ...mixToks(v, d), { op: "=" }, ...ansT, { w: "in", c: done ? cA : null }], 0, ry, this);
      if (ask === 2 && done) frow("rec", [{ n: longer, c: cA }, { w: `${longer === 1 ? th.one + " is" : th.many + " are"} ${th.more} than` }, ...mixToks(v, d), { w: "in" }], 0, ry, this);
      if (st === "write") block("check", 0, ry + 3, 7, "Check", "check");
      if (st === "tapX") choices("no", 0, ry - 1, [["none", "None"]], this.bad);
      if (done) block("next", 0, ry + 3, 10, "Next problem", "next");
      return {
        place: [`Each X is one ${th.one}. Place the first three.`, "Tap the line where the card's length is."],
        drop: ["The rest drop in.", ""],
        tapMax: [q, `Tap the ${th.most}.`],
        tapMin: [q, `Now tap the ${th.least}.`],
        hopIt: [q, `Hop from the ${th.least} to the ${th.most}.`],
        tapStack: [q, `Tap the ${th.many} at ${said(v, d)}.`],
        tapX: [q, `Tap each X ${th.more} than ${said(v, d)}, or None.`],
        write: [q, ask === 0 ? "Type the difference." : "Type the total."],
        done: [`Each X is one ${th.one}, over its length.`, ""],
      }[st];
    },
  });
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  convert: { name: "Converting measurements", make: i => lConvert(i) },
  measure: { name: "Measurement story problems", make: i => lMeasure(i) },
  area: { name: "Area and perimeter", make: i => lArea(i) },
  lineplot: { name: "Line plots with fractions", make: i => lPlot(i) },
};
// ?p= fixes the first problem: Converting measurements k,n,m (k: 0 ft, 1 m, 2 h, 3 lb, 4 km, 5 kg, 6 L, 7 min);
// Area and perimeter l,w,fold (fold 0 none, 1 area given, 2 perimeter given)
let FIXED = null;
const IDX = {};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id, index) {
  if (!LESSONS[id]) id = "convert";
  if (index != null) IDX[id] = index;
  token++; MO.cur.clear(); MO.tw.clear(); MO.emerge.clear(); MO.delay.clear(); born.clear();
  KS = 1;
  lesson = LESSONS[id].make(IDX[id] || 0);
  pick.value = id;
  keys.inputMode = lesson.dot ? "decimal" : "numeric";
  drawn = new Set(); keys.blur(); keys.value = "";
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g4ch7-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value);
document.getElementById("fresh").onclick = () => leave();
function leave() { IDX[lesson.id] = (IDX[lesson.id] || 0) + 1; start(lesson.id); }
let first = "convert", firstI = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g4ch7-lesson") || "convert";
  firstI = +(u.get("i") || 0);
  FIXED = u.get("p");
  if (u.get("theme")) document.documentElement.dataset.theme = u.get("theme");
} catch (err) {}
start(first, firstI);
