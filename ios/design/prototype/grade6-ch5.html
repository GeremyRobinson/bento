<title>Expressions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #4F63D9; --tint: rgba(79, 99, 217, .22); --tint-strong: rgba(79, 99, 217, .42);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
/* this chapter (Long division and decimals) is the decimals family's pink, as 5th grade's decimal lessons */
body.decimals { --chapter: #D6407F; --tint: rgba(214, 64, 127, .2); --tint-strong: rgba(214, 64, 127, .4) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.decimals { --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42) } }
:root { --cube-top: color-mix(in srgb, var(--chapter) 18%, var(--paper)); --cube-front: color-mix(in srgb, var(--chapter) 34%, var(--paper));
  --cube-side: color-mix(in srgb, var(--chapter) 52%, var(--paper)); --cube-edge: color-mix(in srgb, var(--chapter) 70%, var(--ink)); }
:root[data-theme="dark"] body.decimals { --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42) }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }
.label { font-size: 26px; font-weight: 600; fill: var(--ink2); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button[aria-pressed="true"] { background: var(--tint); }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .seg { display: flex; border: 1px solid var(--pill-line); border-radius: 999px; padding: 2px; }
#bar .seg button { font-size: 14px; padding: 6px 10px; }
#bar .seg[hidden] { display: none; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 120px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; } #bar .seg button { font-size: 13px; padding: 5px 8px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--tint)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// Obento² · 6th grade, chapter 5: Expressions. The paper kit is grade6-ch4.html's (grid, drawing in, camera, hands,
// boxes, and every move chapters 1–4 built); 8th grade's tilting paper (grade8-ch1.html) stands the cubes up. The four
// lessons and the pieces they add (a letter's strip, tapping a part of a written line) are below it. Open with
// ?l=expo | write | eval | equiv, and ?i=<n> to start at the n-th problem (easy first).
// ---------- the paper: squares, drawing, camera ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a * b / gcd(a, b);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set();
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in
// UP: what's put now stands up off the paper or faces the child (drawn over the tilting paper, never tilted)
// FLAP: what's put now rides on the half of the paper a fold is turning (drawn under the fold's transform, never drawn in)
let UP = false, FLAP = false;
function put(k, tag, a, kind = "fade", text) { items.push({ k, tag, a, kind, text, up: UP, flap: FLAP }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: 1 }, o.live ? "none" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, rx: o.rx ?? null, "stroke-dasharray": o.dash ? "6 6" : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null, transform: o.t || null }, o.live ? "none" : o.c && !o.fill ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade"); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c }); continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c }); col += 2;
  }
}
// a fraction in a column 4 squares wide: top centred on row r+1, its bar on r+2, bottom on r+3
function frac(k, top, bot, col, r, o = {}) {
  if (top != null) text(`${k}t${top}`, top, col + 2, r + 1, "maths", { c: o.c });
  line(`${k}bar`, col, r + 2, col + 4, r + 2, { c: o.c });
  if (bot != null) text(`${k}b${bot}`, bot, col + 2, r + 3, "maths", { c: o.c });
}
// a block drawn on the paper: an outline, its word and arrow (Check, Cut, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: o.main === false ? "var(--ink3)" : "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// an answer box in the work: cells of 2 squares, what's typed in the middle, the cursor after it
function answerBox(k, x, y, cells, value, state) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : "var(--ink)";
  rect(`${k}box${cells}`, x, y, cells * 2, 2, { c, live: false });
  if (value) text(`${k}v`, value, x + cells, y + 1, "maths", { c, live: true });
  if (state === "active") {
    const w = value ? value.length * 0.62 : 0;
    put(`${k}cur`, "line", { x1: sq(x + cells + w + 0.15), y1: sq(y + 0.35), x2: sq(x + cells + w + 0.15), y2: sq(y + 1.65),
      stroke: "var(--chapter)", "stroke-width": 2 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": "type" }, "none");
}

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "", outFlap = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none" && !it.flap, a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${Math.min(n++ * 0.035, 1.2).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.flap) outFlap += el; else if (it.up) outUp += el; else out += el;
  }
  const fmx = outFlap && lesson.flapMatrix && lesson.flapMatrix();
  sceneEl.innerHTML = out + (fmx ? `<g transform="matrix(${fmx.join(" ")})">${outFlap}</g>` : "");
  document.getElementById("upright").innerHTML = outUp;
  const m = lesson.paperMatrix && lesson.paperMatrix();
  if (m) document.getElementById("paperg").setAttribute("transform", `matrix(${m.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  // a lesson that's moving (the paper tilting, cubes rising) draws again next frame
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past the lesson's maxZoom (1.25)
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 24, bottom = 110;
  const s = Math.min((W - 64) / sq(f.w), (H - top - bottom - 32) / sq(f.h), (lesson && lesson.maxZoom) || 1.6);
  // the frame's top sits at the top of the screen (the words on rows 0–2 first, never an empty band above them)
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - (top + 16) / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
// the hyphen key writes a true minus (−), as grade 8 and 9's previews do
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/-/g, "−").replace(/[^0-9.−]/g, "").slice(0, 6)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); moved(); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) moved();
});
// after a hand move: draw, frame what's there now, and open the keys when the move led to a number to write
function moved() { render(); frame(lesson.frame()); if (lesson.typing) openKeys(); }
function act(a) {
  if (a === "type") { openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}


// ---------- Designer versions (ios/design/*.md) ----------
// The same paper and helpers. Three text sizes only (maths 36, say 28, small 20), one line weight (1.5), the camera
// never past 1.25 (maxZoom), a label's ink half a square from what it labels (lab), everything on grid lines. A number
// typed into the work sits 2 squares a digit, lined up on the right (dbox). Red only for wrong, green only for right.
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end" });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start" });
}
function dbox(k, x, y, cells, value, state, actName = "box:0", centred = false) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (value) {
    if (centred) text(`${k}v`, value, x + cells, y + 1, "maths", { c: vc, live: true });
    else digits(`${k}v${value}`, value, x + cells * 2, y + 1, { c: vc });
  }
  if (state === "active") {
    const cx = centred ? x + cells + (value ? value.length * 0.31 : 0) + 0.25 : x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// what to do on the rows above the picture: one line, and a small second line (or what a slip says, in red)
function dhead(L, say, sub, x = 0, y = 0) {
  // words wrap at the width the camera frames, so a long line never runs off the screen
  const ww = Math.min(66, (L.frame ? L.frame().w : 68) - 2);
  words(`say-${say}`, say, x, y + 1, ww);
  if (L.msg) words(`msg-${L.msg}`, L.msg, x, y + 3.3, ww, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, x, y + 3.3, ww, "small");
}
// lessons with more than one answer box: each box has its own value; the hidden input types into the active one
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const PIECE = { 2: ["half", "halves"], 3: ["third", "thirds"], 4: ["fourth", "fourths"], 5: ["fifth", "fifths"], 6: ["sixth", "sixths"],
  7: ["seventh", "sevenths"], 8: ["eighth", "eighths"], 9: ["ninth", "ninths"], 10: ["tenth", "tenths"], 11: ["eleventh", "elevenths"],
  12: ["twelfth", "twelfths"], 14: ["fourteenth", "fourteenths"], 15: ["fifteenth", "fifteenths"], 16: ["sixteenth", "sixteenths"],
  18: ["eighteenth", "eighteenths"], 20: ["twentieth", "twentieths"], 21: ["twenty-first", "twenty-firsts"],
  22: ["twenty-second", "twenty-seconds"], 24: ["twenty-fourth", "twenty-fourths"] };
const pname = (n, plural = true) => (PIECE[n] || [`${n}th`, `${n}ths`])[plural ? 1 : 0];
const ring = (k, x, y, r = 1.05) => path(k, `M${sq(x + r)} ${sq(y)}a${sq(r)} ${sq(r)} 0 1 1 0 -0.1`, { c: "var(--chapter)" });
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];


const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const pick1 = list => list[rnd(0, list.length - 1)];
const up5 = n => Math.ceil(n / 5) * 5;
const mctx = document.createElement("canvas").getContext("2d");
const PX = { maths: 36, say: 28, small: 20 };
// how wide a run of words is, in squares (words may sit mid-square; boxes after them start on the next grid line)
function textW(s, cls = "say") { mctx.font = `600 ${PX[cls]}px ${getComputedStyle(document.body).fontFamily}`; return mctx.measureText(String(s)).width / SQ; }
// a number as school writes it: 1 1/2, 2/3, 4
function mixedStr(num, den) {
  const g = gcd(num, den) || 1; num /= g; den /= g;
  const w = Math.floor(num / den), r = num - w * den;
  return r === 0 ? `${w}` : w ? `${w} ${r}/${den}` : `${r}/${den}`;
}
const half = x => mixedStr(Math.round(x * 2), 2);
const pair = (u, v) => `(${half(u)}, ${half(v)})`;
const arrowR = (x, y) => `M${sq(x - 0.8)} ${sq(y - 0.8)}L${sq(x)} ${sq(y)}L${sq(x - 0.8)} ${sq(y + 0.8)}`;
const arrowU = (x, y) => `M${sq(x - 0.8)} ${sq(y + 0.8)}L${sq(x)} ${sq(y)}L${sq(x + 0.8)} ${sq(y + 0.8)}`;

// a written line on squared paper: every character in its own 2 squares (digits, : × ÷ = $ %), words (units) at
// their width, answer boxes 2 squares a digit. A token: "12" | { s, c, cells } | { word, c } | { box, cells, value, state }
function cellsLine(k, toks, x, row, o = {}) {
  let cx = x;
  toks.forEach((t, i) => {
    const x0 = cx;
    if (t && t.box) {
      // a box grows a cell when more digits are typed than it holds, so nothing spills onto its neighbours
      const cells = Math.max(t.cells, String(t.value || "").replace(".", "").length);
      dbox(`${k}b${t.box}`, cx, row - 1, cells, t.value || "", t.state, `box:${t.box}`); cx += cells * 2;
    } else if (t && typeof t === "object" && t.sup != null) {
      // an exponent: small and raised, in a square of its own after its base
      text(`${k}p${i}_${cx}${t.sup}`, String(t.sup), cx - 0.4, row - 0.8, "small", { anchor: "start", c: t.c || o.c || "var(--ink)" }); cx += 1;
    } else if (t && t.word) { text(`${k}w${i}${t.word}`, t.word, cx + 0.4, row, "maths", { anchor: "start", c: t.c || o.c }); cx += Math.ceil(textW(t.word, "maths") + 0.8); }
    else {
      const s = String(t && typeof t === "object" ? t.s : t), c = (t && t.c) || o.c;
      if (t && t.cells) cx += (t.cells - s.length) * 2;
      for (const ch of s) { text(`${k}${i}_${cx}${ch}`, ch, cx + 1, row, "maths", { c }); cx += 2; }
    }
    if (o.pos) o.pos[i] = [x0, cx];
  });
  return cx;
}
// a sentence with answer boxes in it: words at 28, each box on the next grid line. A part: "words" | { t, cls, c } | box
function sentence(k, parts, x, row, o = {}) {
  let cx = x;
  parts.forEach((p, i) => {
    if (p && p.box) { const bx = Math.ceil(cx - 0.25); dbox(`${k}b${p.box}`, bx, row - 1, p.cells, p.value || "", p.state, `box:${p.box}`, true); cx = bx + p.cells * 2 + 0.45; return; }
    const s = String(p && typeof p === "object" ? p.t : p), cls = (p && p.cls) || "say", c = (p && p.c) || o.c;
    text(`${k}s${i}${s}`, s, cx, row, cls, { anchor: "start", c });
    cx += textW(s, cls) + (cls === "maths" ? 0.35 : 0.5);
  });
  return cx;
}
// outlined cells on the paper, each its own block, drawn in as they come
function cellRect(k, x, y, cols, rows, s, fill = "var(--tint)") {
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) rect(`${k}${i}_${j}`, x + j * s, y + i * s, s, s, { fill, c: "var(--chapter)" });
}

// ---------- the hand moves chapter 1 added (built once; this chapter reuses them) ----------
// The handle a finger holds: bigger while held.
const handle = (k, x, y, on) => dot(k, x, y, on ? 0.7 : 0.55, { c: "var(--chapter)", live: true });
// Drag a rectangle's edge: it snaps to whole cells (cell squares each), from lo to hi cells.
const edgeCount = (pos, from, cell, lo, hi) => clamp(Math.round((pos - from) / cell), lo, hi);
// The ruler: its handle sets one piece's length, snapped to the sizes allowed.
const rulerSnap = (len, sizes) => sizes.reduce((b, s) => (Math.abs(s - len) < Math.abs(b - len) ? s : b));
function drawRuler(k, x, y, len, on) {
  path(`${k}r`, `M${sq(x)} ${sq(y - 0.6)}V${sq(y)}H${sq(x + len)}V${sq(y - 0.6)}`, { c: "var(--chapter)", live: true });
  handle(`${k}h`, x + len, y, on);
}
// Hop: lay copies of a piece end to end; a tap lays one, a drag lays as many as reach the finger.
const hopCount = (pos, from, piece, lo, hi) => clamp(Math.round((pos - from) / piece), lo, hi);
const hopArc = (k, x1, x2, y, h = 2.5) => path(k, `M${sq(x1)} ${sq(y)}Q${sq((x1 + x2) / 2)} ${sq(y - h * 2)} ${sq(x2)} ${sq(y)}`, { c: "var(--chapter)" });
// The plane: origin (ox, oy), U squares a unit, X by Y units. Place a point snaps to every grid point (each square),
// dotted lines drop to both axes while it moves, the readout is its pair.
function Plane(ox, oy, U, X, Y, xName, yName) {
  const P = {
    ox, oy, U, X, Y,
    at: (u, v) => ({ x: ox + u * U, y: oy - v * U }),
    snap: q => ({ u: clamp(Math.round((q.x - ox)), 0, X * U) / U, v: clamp(Math.round(oy - q.y), 0, Y * U) / U }),
    holds: (q, m = 1.5) => q.x >= ox - m && q.x <= ox + X * U + m && q.y >= oy - Y * U - m && q.y <= oy + m,
    draw(k, lit = {}) {
      const xe = ox + X * U + 1.5, ye = oy - Y * U - 1.5;
      line(`${k}ax`, ox, oy, xe, oy); path(`${k}axa`, arrowR(xe, oy));
      line(`${k}ay`, ox, oy, ox, ye); path(`${k}aya`, arrowU(ox, ye));
      lab(`${k}xn`, xName, "right", xe + 0.2, oy, "small"); lab(`${k}yn`, yName, "right", ox + 1, ye + 0.6, "small");
      for (let i = 0; i <= X; i++) { line(`${k}xt${i}`, ox + i * U, oy, ox + i * U, oy + 0.5); lab(`${k}xl${i}${lit.x === i}`, i, "below", oy + 0.4, ox + i * U, "small", lit.x === i ? "var(--chapter)" : null); }
      for (let j = 1; j <= Y; j++) { line(`${k}yt${j}`, ox - 0.5, oy - j * U, ox, oy - j * U); lab(`${k}yl${j}${lit.y === j}`, j, "left", ox - 0.4, oy - j * U, "small", lit.y === j ? "var(--chapter)" : null); }
    },
    drops(k, u, v, c = "var(--chapter)") {
      const p = P.at(u, v);
      if (v > 0) line(`${k}dx${u}_${v}`, p.x, p.y, p.x, oy, { dash: true, c, live: true });
      if (u > 0) line(`${k}dy${u}_${v}`, p.x, p.y, ox, p.y, { dash: true, c, live: true });
    },
    // drag a point along a line through 0 (direction dx, dy): it snaps only to the grid points on it, j steps of 1/U
    lineSnap(q, dx, dy, jmax) {
      const u = (q.x - ox) / U, v = (oy - q.y) / U, s = (u * dx + v * dy) / (dx * dx + dy * dy);
      return clamp(Math.round(s * U), 0, jmax);
    },
  };
  return P;
}
// the readout beside a point while it's held
const pairLabel = (k, p, s) => text(k, s, p.x + 1, p.y + 1.3, "small", { anchor: "start", c: "var(--chapter)", live: true });


// ---------- 6th grade, chapter 4: Negative numbers (ios/design/grade6.md) ----------
// The chapter colour is the kit's blue. A line now runs both ways from 0 on the grid's own squares, 0 on a strong line;
// the plane is two such lines crossing at 0, two squares a unit, −12 to 12 across and −8 to 8 up, from row 6.
// The minus sign is typed as grade 8 and 9's previews type it: the hyphen key writes a true minus (−), a cell of its own.
const fm = x => (x < 0 ? "−" : "") + String(Math.round(Math.abs(x) * 100) / 100);
const numv = s => (s === "" || s == null || s === "−" || s === "." ? NaN : +String(s).replace("−", "-"));
const pairS = (u, v) => `(${fm(u)}, ${fm(v)})`;
const cellsOf = s => String(s).replace(".", "").length;
const arrowL = (x, y) => `M${sq(x + 0.8)} ${sq(y - 0.8)}L${sq(x)} ${sq(y)}L${sq(x + 0.8)} ${sq(y + 0.8)}`;
const arrowD = (x, y) => `M${sq(x - 0.8)} ${sq(y - 0.8)}L${sq(x)} ${sq(y)}L${sq(x + 0.8)} ${sq(y - 0.8)}`;
const ease = u => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// A point in one of three shades (the first full, the second half, the third an outline): two or three on one line
function ptDot(k, x, y, shade = 0, on = false, c = "var(--chapter)") {
  const r = sq(on ? 0.7 : 0.55);
  if (shade === 0) put(k, "circle", { cx: sq(x), cy: sq(y), r, fill: c }, "none");
  else put(k, "circle", { cx: sq(x), cy: sq(y), r: r - 0.75, fill: shade === 1 ? c : "var(--paper)", "fill-opacity": shade === 1 ? 0.4 : null, stroke: c, "stroke-width": 1.5 }, "none");
}
// a pick-one row: plain outlined blocks, the picked wrong one red (a sign is written at the maths size)
function choiceRow(k, opts, x, y, w, bad, cls = "small", gap = 3) {
  opts.forEach((o, i) => {
    const bx = x + i * (w + gap), isBad = bad === i;
    rect(`${k}${i}o${isBad}`, bx, y, w, 2, { c: isBad ? "var(--wrong)" : "var(--ink)" });
    text(`${k}${i}w${o}`, o, bx + w / 2, y + 1, cls, { c: isBad ? "var(--wrong)" : "var(--ink)" });
    put(`${k}${i}hit`, "rect", { x: sq(bx), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": `${k}${i}` }, "none");
  });
}

// A number line through 0 at (x0, y0), U squares a one, lo to hi; across, or upright (up). Its two halves are each
// a piece of paper a fold can lift: keep(x, y) leaves out what's lifted.
function NLine(x0, y0, U, lo, hi, up = false) {
  const N = {
    x0, y0, U, lo, hi, up,
    at: v => (up ? { x: x0, y: y0 - v * U } : { x: x0 + v * U, y: y0 }),
    val: (q, step = 1) => { const s = up ? (y0 - q.y) / U : (q.x - x0) / U; return clamp(Math.round(s / step) * step, lo, hi); },
    near: (q, m = 2) => (up ? Math.abs(q.x - x0) <= m && q.y >= y0 - hi * U - m && q.y <= y0 - lo * U + m
      : Math.abs(q.y - y0) <= m && q.x >= x0 + lo * U - m && q.x <= x0 + hi * U + m),
    draw(k, o = {}) {
      const keep = o.keep || (() => true), Z = N.at(0);
      const labels = o.labels || Array.from({ length: hi - Math.ceil(lo) + 1 }, (_, j) => Math.ceil(lo) + j).filter(v => v % 5 === 0);
      for (const [s, end] of [[-1, lo], [1, hi]]) {
        const E = N.at(end), X = up ? { x: x0, y: E.y - s } : { x: E.x + s, y: y0 };
        if (!keep((Z.x + E.x) / 2, (Z.y + E.y) / 2)) continue;
        line(`${k}h${s}`, Z.x, Z.y, X.x, X.y);
        path(`${k}a${s}`, up ? (s > 0 ? arrowU(X.x, X.y) : arrowD(X.x, X.y)) : (s > 0 ? arrowR(X.x, X.y) : arrowL(X.x, X.y)));
      }
      for (let v = Math.ceil(lo); v <= hi; v++) {
        const p = N.at(v); if (!keep(p.x, p.y)) continue;
        const t = v === 0 ? 0.9 : 0.5;
        if (up) line(`${k}t${v}`, x0 - t, p.y, x0 + t, p.y); else line(`${k}t${v}`, p.x, y0 - t, p.x, y0 + t);
      }
      for (const v of labels) {
        const p = N.at(v), lit = o.lit === v; if (!keep(p.x, p.y)) continue;
        if (up) lab(`${k}l${v}${lit}`, fm(v), "left", x0 - 0.6, p.y, "small", lit ? "var(--chapter)" : null);
        else lab(`${k}l${v}${lit}`, fm(v), "below", y0 + 0.5, p.x, "small", lit ? "var(--chapter)" : null);
      }
    },
  };
  return N;
}

// The plane in four quadrants: origin (ox, oy), U squares a unit, −X to X across and −Y to Y up. Place a point snaps
// to every grid point (half units), dotted lines drop to both axes, the readout is its pair.
function Plane4(ox, oy, U, X, Y) {
  const P = {
    ox, oy, U, X, Y,
    at: (u, v) => ({ x: ox + u * U, y: oy - v * U }),
    snap: q => ({ u: clamp(Math.round(q.x - ox), -X * U, X * U) / U, v: clamp(Math.round(oy - q.y), -Y * U, Y * U) / U }),
    holds: (q, m = 1.5) => Math.abs(q.x - ox) <= X * U + m && Math.abs(q.y - oy) <= Y * U + m,
    draw(k, keep = () => true, avoid = []) {
      const xe = X * U + 1, ye = Y * U + 1;
      for (const s of [-1, 1]) {
        if (keep(ox + s, oy)) { line(`${k}ax${s}`, ox, oy, ox + s * xe, oy); path(`${k}axa${s}`, s > 0 ? arrowR(ox + xe, oy) : arrowL(ox - xe, oy)); }
        if (keep(ox, oy - s)) { line(`${k}ay${s}`, ox, oy, ox, oy - s * ye); path(`${k}aya${s}`, s > 0 ? arrowU(ox, oy - ye) : arrowD(ox, oy + ye)); }
      }
      if (keep(ox + xe, oy)) lab(`${k}xn`, "x", "right", ox + xe + 0.2, oy, "small");
      if (keep(ox, oy - ye)) lab(`${k}yn`, "y", "right", ox + 0.6, oy - ye + 0.5, "small");
      text(`${k}o`, "0", ox - 0.9, oy + 1, "small");
      for (let i = -X; i <= X; i++) {
        const x = ox + i * U; if (!i || !keep(x, oy)) continue;
        line(`${k}xt${i}`, x, oy - 0.5, x, oy + 0.5);
        if (i % 2 === 0) lab(`${k}xl${i}`, fm(i), "below", oy + 0.5, x, "small");
      }
      for (let j = -Y; j <= Y; j++) {
        const y = oy - j * U; if (!j || !keep(ox, y)) continue;
        line(`${k}yt${j}`, ox - 0.5, y, ox + 0.5, y);
        if (j % 2 === 0) lab(`${k}yl${j}`, fm(j), "left", ox - 0.6, y, "small");
      }
      // the quadrants' numbers, small, in their outer corners (left out where a point and its pair sit)
      [["I", 1, 1], ["II", -1, 1], ["III", -1, -1], ["IV", 1, -1]].forEach(([n, a, b]) => {
        const x = ox + a * (X * U - 2), y = oy - b * (Y * U - 1.5);
        if (avoid.some(p => Math.abs(p.x - x) < 9 && Math.abs(p.y - y) < 3)) return;
        if (keep(x, y)) text(`${k}q${n}`, n, x, y, "small");
      });
    },
    drops(k, u, v, c = "var(--chapter)") {
      const p = P.at(u, v);
      if (v) line(`${k}dx`, p.x, p.y, p.x, oy, { dash: true, c, live: true });
      if (u) line(`${k}dy`, p.x, p.y, ox, p.y, { dash: true, c, live: true });
    },
  };
  return P;
}

// a point's pair on the plane, on its outer side (away from both axes and their numbers); at the top or bottom edge, beside it
function pairAt(k, P, u, v, s, c = "var(--chapter)") {
  const p = P.at(u, v), left = u < 0, edge = Math.abs(v) >= P.Y - 1;
  const y = edge ? p.y : v > 0 ? p.y - 1.3 : p.y + 1.4, x = edge ? p.x + (left ? -1.1 : 1.1) : p.x + (left ? -0.4 : 0.4);
  text(k, s, x, y, "small", { anchor: left ? "end" : "start", c, live: true });
}

// ---------- the new hand move: Fold along a grid line (3D, drawn flat) ----------
// Drag part of the paper over a grid line: it turns about the line. This preview draws the turn as seen from straight
// above (no tilt): the lifted half narrows toward the line by the cosine of its angle, shows its plain back past
// upright, and opens out over the other side. All the way over it prints what it carries there, and lies back.
// What the lesson draws while FLAP is set rides on the turning half (same keys as on the paper, so nothing redraws).
let FOLD_MS = 600;
function folder(L) {
  L.fold = null; // { line: "v" (a line up the paper, at x) | "h" (across, at y), at, side ±1, g: the grab's distance, ang }
  L.foldAng = function () {
    const f = this.fold; if (!f) return 0; if (!f.anim) return f.ang;
    const a = f.anim, u = clamp((performance.now() - a.t0) / a.ms, 0, 1); return a.from + (a.to - a.from) * ease(u);
  };
  L.flapMatrix = function () {
    const f = this.fold; if (!f) return null; const c = Math.cos(this.foldAng()), a = sq(f.at);
    return f.line === "v" ? [c, 0, 0, 1, a * (1 - c), 0] : [1, 0, 0, c, 0, a * (1 - c)];
  };
  L.foldStart = function (lineKind, at, q) {
    const d = lineKind === "v" ? q.x - at : q.y - at; if (Math.abs(d) < 0.5) return false;
    this.fold = { line: lineKind, at, side: Math.sign(d), g: Math.abs(d), ang: 0 }; return true;
  };
  L.foldDrag = function (q) {
    const f = this.fold; if (!f || f.anim) return;
    const d = (f.line === "v" ? q.x - f.at : q.y - f.at) * f.side; f.ang = Math.acos(clamp(d / f.g, -1, 1));
  };
  L.foldAnim = function (to, ms, then) {
    const f = this.fold; f.anim = { from: this.foldAng(), to, t0: performance.now(), ms };
    setTimeout(() => { f.ang = to; f.anim = null; if (then) then(); moved(); }, ms + 20);
  };
  // let go past 100°: it turns all the way over, prints (over(f)), lies back; less: it falls back flat
  L.foldRelease = function (over) {
    const f = this.fold; if (!f) return;
    if (f.ang > 1.75) this.foldAnim(Math.PI, FOLD_MS * 0.4, () => { over(f); this.foldAnim(0, FOLD_MS, () => { this.fold = null; }); });
    else this.foldAnim(0, FOLD_MS * 0.5, () => { this.fold = null; });
  };
  L.busy = function () { return !!(this.fold && this.fold.anim); };
  L.animating = function () { return this.busy(); };
  L.lifted = function (x, y) { const f = this.fold; if (!f) return false; return ((f.line === "v" ? x - f.at : y - f.at) * f.side) > 1e-6; };
  L.keepBase = function () { return (x, y) => !this.lifted(x, y); };
  // the turning half: its sheet (front: the grid and what it carries; back: plain, shaded), x0..x1 by y0..y1
  L.flap = function (x0, y0, x1, y1, front) {
    if (!this.fold) return;
    FLAP = true;
    const r = { x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
    if (this.foldAng() <= Math.PI / 2) {
      rect("flapP", r.x, r.y, r.w, r.h, { fill: "var(--paper)", live: true });
      rect("flapG", r.x, r.y, r.w, r.h, { fill: "url(#grid)", live: true });
      front(this.keepLifted());
    } else rect("flapB", r.x, r.y, r.w, r.h, { fill: "var(--grid-strong)", op: 0.55, live: true });
    rect("flapO", r.x, r.y, r.w, r.h, { c: "var(--ink3)", live: true });
    FLAP = false;
  };
  L.keepLifted = function () { return (x, y) => this.lifted(x, y); };
  return L;
}

// ---------- 6th grade, chapter 5: Expressions (ios/design/grade6.md) ----------
// A letter is a strip whose length isn't known yet: a plain bar with a dashed end and the letter in it, the same length
// wherever it's written. Swapping in a number drags the strip to that length, and every copy goes with it.
const SUPD = { 2: "²", 3: "³" };
const sup = n => SUPD[n] || String(n);
// timers for a lesson's beats; a new problem cancels the old one's
let token = 0;
function later(ms, fn) { const t = token; setTimeout(() => { if (t !== token) return; fn(); render(); frame(lesson.frame()); }, ms); }

// a letter's strip from (x, y), len squares long, h tall. Not known yet: a plain bar, its end dashed. Known (or held):
// its cells drawn. The letter (or the number swapped in) in it.
function strip(k, x, y, len, h, o = {}) {

  // the frame holds the widest the area gets (x at its longest) and the record
  const FW = Math.max(40, X0 + 3 + 2 * (kind === "combine" ? 16 : kind === "factor" ? Math.max(2 * PX + QN, m * xCap + nn) : xCap + b));
  const stages = { combine: ["slide", "write", "drag", "done"], dist: ["cut", "write", "drag", "done"], factor: ["rows", "write", "drag", "done"], pair: ["drag", "pick", "done"] }[kind];
  const sides = v => kind === "combine" ? [k * v, k * v] : kind === "dist" ? [a * (v + b), a * v + a * b] : kind === "factor" ? [PX * v + QN, G * (m * v + nn)]
    : [a * (v + b), a * v + (P.same ? a * b : b)];
  const L = withBoxes({
    id: "equiv", nums: { ...P, X0, Y0, RY, hMax }, maxZoom: 1.25, stage: stages[0], msg: null, verdict: null, typing: false,
    slid: 0, h: 1, xl: x0, cutAt: null, held: null, tries: [], bad: null,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return { x: -1, y: -0.5, w: FW, h: RY + 11 }; },
    // the area's shape now: rows (each 2 squares), the x strips' cells, the b cells
    rows() { return kind === "combine" ? k : kind === "factor" ? this.h : a; },
    grab(q) {
      const st = this.stage;
      if (st === "slide") { const yb = this.stripY(k - 1); if (q.x > X0 - 1 && q.x < X0 + 2 * this.xl + 1 && q.y > yb - 1 && q.y < yb + 3) { this.held = { k: "slide", y0: q.y, s0: this.slid }; this.msg = null; return true; } return false; }
      if (st === "cut") { if (q.x > X0 && q.x < X0 + 2 * (this.xl + b) && q.y > Y0 - 2.5 && q.y < Y0 + 1.5) { this.held = { k: "cut", col: this.col(q), y: Y0 }; this.msg = null; return true; } return false; }
      if (st === "rows") { if (Math.abs(q.y - (Y0 + 2 * this.h)) < 1.5 && q.x > X0 - 2 && q.x < X0 + 12) { this.held = { k: "rows" }; this.msg = null; return true; } return false; }
      if (st === "drag" || st === "pick") {
        const ex = X0 + 2 * this.xl;
        if (Math.abs(q.x - ex) < 1.5 && q.y > Y0 - 1 && q.y < Y0 + 2 * this.rows() + 1) { this.held = { k: "x" }; this.msg = null; return true; }
      }
      return false;
    },
    col(q) { return clamp(Math.round((q.x - X0) / 2), 1, this.xl + b - 1); },
    stripY(j) {
      // the bottom strip pushes the ones above it as it slides up
      let y = Y0 + 4 * (k - 1) - this.slid; const ys = [];
      for (let r = k - 1; r >= 0; r--) { ys[r] = Math.min(Y0 + 4 * r, y); y = ys[r] - 2; }
      return ys[j];
    },
    drag(q) {
      const h = this.held; if (!h) return;
      if (h.k === "slide") this.slid = clamp(h.s0 + (h.y0 - q.y), 0, 2 * (k - 1));
      else if (h.k === "cut") { h.col = this.col(q); h.y = clamp(q.y, Y0, Y0 + 2 * a); }
      else if (h.k === "rows") this.h = clamp(Math.round((q.y - Y0) / 2), 1, hMax);
      else this.xl = clamp(Math.round((q.x - X0) / 2), kind === "factor" ? 2 : 3, xCap);
    },
    release() {
      const h = this.held; this.held = null; if (!h) return;
      if (h.k === "slide") {
        this.slid = Math.round(this.slid / 2) * 2;
        if (this.slid === 2 * (k - 1)) { this.stage = "write"; this.typing = true; this.active = "c"; } else this.msg = "Slide them all together.";
        return;
      }
      if (h.k === "cut") {
        if (h.y < Y0 + 2 * a - 1) { this.msg = "Cut all the way down."; return; }
        if (h.col !== this.xl) { this.msg = "Cut where x ends."; this.bad = h.col; return; }
        this.cutAt = h.col; this.bad = null; this.stage = "write"; this.typing = true; this.active = "c"; return;
      }
      if (h.k === "rows") {
        const fits = PX % this.h === 0 && QN % this.h === 0;
        if (this.h === G) { this.stage = "write"; this.typing = true; this.active = "g"; return; }
        this.msg = this.h === 1 ? "Drag the bottom edge down to make rows." : fits ? "That fits, but more rows fit too." : "Not every row gets the same.";
        return;
      }
      // x dragged: both sides' values
      if (!this.tries.includes(this.xl)) this.tries.push(this.xl);
      if (this.tries.length > 3) this.tries.shift();
      if (kind === "pair") { this.stage = "pick"; return; }
      if (this.tries.length >= 2) this.stage = "done";
    },
    act(z) {
      if (boxAct(this, z)) return;
      const st = this.stage;
      if (z.startsWith("pk")) {
        if (st !== "pick") return;
        const same = z === "pk0", [A, Bv] = sides(this.xl);
        if (same === P.same) { this.stage = "done"; this.bad = null; this.msg = null; return; }
        this.bad = same ? 0 : 1;
        this.msg = P.same ? `At x = ${this.xl} both are ${A}. Try more x: they stay the same.` : `At x = ${this.xl} they're ${A} and ${Bv}, so not the same.`;
        return;
      }
      if (z !== "check" || st !== "write") return;
      const want = kind === "combine" ? { c: k } : kind === "dist" ? { c: a, d: a * b } : { g: G, ...(m === 1 ? {} : { m }), n: nn };
      const ids = Object.keys(want), empty = ids.find(id => !this.vals[id]);
      if (empty) { if (this.vals[this.active]) { this.active = empty; return; } this.msg = "Write the number."; return; }
      const bad = ids.find(id => numv(this.vals[id]) !== want[id]);
      if (!bad) { this.verdict = null; this.msg = null; this.stage = "drag"; this.typing = false; this.active = null; return; }
      this.active = bad; this.verdict = "wrong";
      const v = numv(this.vals[bad]);
      if (kind === "combine") this.msg = "Count the rows: each row is one x.";
      else if (kind === "dist") this.msg = bad === "c" ? `${a} rows of x make ${a}x.` : v === b ? `Every row has ${b} too: ${a} rows of ${b}.` : `${a} rows of ${b}: count the cells.`;
      else this.msg = bad === "g" ? (G % v === 0 && v > 1 ? "That's a common factor, but not the greatest." : "Count the rows.") : "Write what one row holds.";
    },
    scene() {
      const st = this.stage, H = this.held, xl = this.xl, CU = CH;
      const done = st === "done", [A, Bv] = sides(xl);
      const say = {
        slide: ["Slide them together.", "Drag the bottom strip up."], write: kind === "combine" ? ["Write how many x's that is.", ""] : kind === "dist" ? ["Write each part.", ""] : ["Write it as rows.", ""],
        cut: ["Cut where x ends.", "Drag down along a grid line."], rows: ["Make rows that both parts fill.", "Drag the bottom edge down."],
        drag: ["Drag x.", this.tries.length ? "Try another length." : kind === "pair" ? "Are they the same for every x?" : "Try any length: see both sides."],
        pick: ["Same or not the same?", "Drag x again to try more."],
        done: kind === "combine" ? [`${k} rows of x are ${k}x, whatever x is.`, ""] : kind === "dist" ? [`${a} rows of x + ${b} are ${a}x + ${a * b}, whatever x is.`, ""]
          : kind === "factor" ? [`${G} rows of ${mx} + ${nn} are ${PX}x + ${QN}, whatever x is.`, ""]
          : P.same ? [`${a} rows of x + ${b} are ${a}x + ${a * b}, whatever x is.`, ""] : [`${a}(x + ${b}) is ${a}x + ${a * b}, not ${a}x + ${b}.`, ""],
      }[st];
      dhead(this, say[0], say[1]);
      const xKnownCells = H && H.k === "x" ? 2 : 0;
      const xstrip = (key, x, y) => strip(key, x, y, 2 * xl, 2, { label: "x", cls: "small", cell: xKnownCells });
      if (kind === "combine") {
        for (let r = 0; r < k; r++) xstrip(`cs${r}`, X0, this.stripY(r));
        if (st === "slide") handle("hs", X0, this.stripY(k - 1) + 2, H && H.k === "slide");
        const yb = this.stripY(k - 1), group = (() => { let g = 1; for (let r = k - 2; r >= 0; r--) { if (this.stripY(r) + 2 >= this.stripY(r + 1) - 0.01) g++; else break; } return g; })();
        if (st === "slide" && H) lab("rds", `${group} rows of x`, "right", X0 + 2 * xl + 1, yb + 1, "small", CU);
        if (st !== "slide") { lab("kl", k, "left", X0 - 0.6, Y0 + k, "say", CU); lab("xl", "x", "above", Y0 - 0.6, X0 + xl, "say", CU); }
      } else if (kind === "factor") {
        const hh = this.h, xs = this.xl;
        for (let r = 0; r < hh; r++) {
          const sr = Math.floor(PX / hh) + (r < PX % hh ? 1 : 0), cr = Math.floor(QN / hh) + (r < QN % hh ? 1 : 0);
          let cx = X0;
          for (let j = 0; j < sr; j++) { strip(`fs${r}_${j}`, cx, Y0 + 2 * r, 2 * xs, 2, { label: "x", cls: "small", cell: xKnownCells }); cx += 2 * xs; }
          for (let j = 0; j < cr; j++) rect(`fc${r}_${j}`, cx + 2 * j, Y0 + 2 * r, 2, 2, { fill: "var(--tint-strong)", c: CU, live: true });
        }
        if (st === "rows") {
          handle("hr", X0, Y0 + 2 * hh, H && H.k === "rows");
          const fits = PX % hh === 0 && QN % hh === 0, one = PX / hh === 1 ? "x" : `${PX / hh}x`;
          if (H) text("rdr", fits ? `${hh} rows: ${one} and ${QN / hh}` : `${hh} rows: not the same`, X0 - 2, Y0 + 2 * hh + 1.6, "small", { anchor: "start", c: CU, live: true });
        } else lab("gl", G, "left", X0 - 0.6, Y0 + G, "say", CU);
      } else {
        // the area a rows tall: x strips, then the b cells (apart once cut)
        const gap = this.cutAt != null ? 1 : 0, bx = X0 + 2 * xl + gap;
        for (let r = 0; r < a; r++) xstrip(`as${r}`, X0, Y0 + 2 * r);
        cellRect(`bc${b}_`, bx, Y0, b, a, 2, "var(--tint-strong)");
        lab("al", a, "left", X0 - 0.6, Y0 + a, "say", CU);
        lab("xlab", "x", "above", Y0 - 0.6, X0 + xl, "say", CU); lab("blab", b, "above", Y0 - 0.6, bx + b, "say", CU);
        if (H && H.k === "cut") {
          const cx = X0 + 2 * H.col;
          line(`cut${H.col}`, cx, Y0 - 1, cx, H.y, { c: CU, live: true }); handle("hc", cx, H.y, true);
          if (H.col === xl) text("rdc", `x | ${b}`, cx + 0.8, Y0 - 2.6, "small", { anchor: "start", c: CU, live: true });
        } else if (st === "cut" && this.bad != null) line(`badcut${this.bad}`, X0 + 2 * this.bad, Y0, X0 + 2 * this.bad, Y0 + 2 * a, { c: "var(--wrong)", live: true });
      }
      if (st === "drag" || st === "pick") handle("hx", X0 + 2 * xl, Y0, H && H.k === "x");
      // the record: what's written; the tries under it
      const pos = [], cs = s => String(s);
      const box = (id, ans, cells = 1) => (st === "write" ? { box: id, cells: Math.max(cells, cs(ans).length), value: this.vals[id] || "", state: boxState(this, id) } : { s: cs(ans), c: CU });
      if (kind === "combine" && st !== "slide") cellsLine("rec", [...Array(k).fill(0).flatMap((_, j) => (j ? ["+", "x"] : ["x"])), "=", box("c", k), "x"], 0, RY, { pos });
      if (kind === "dist" && st !== "cut") cellsLine("rec", [cs(a), "(", "x", "+", cs(b), ")", "=", box("c", a), "x", "+", box("d", a * b, 2)], 0, RY, { pos });
      if (kind === "factor" && st !== "rows") cellsLine("rec", [cs(PX), "x", "+", cs(QN), "=", box("g", G), "(", ...(m === 1 ? [] : [box("m", m)]), "x", "+", box("n", nn), ")"], 0, RY, { pos });
      if (kind === "pair") {
        const ex = cellsLine("rec", [cs(a), "(", "x", "+", cs(b), ")"], 0, RY);
        text("and", "and", ex + 1, RY, "say", { anchor: "start" });
        cellsLine("rec2", [cs(a), "x", "+", cs(P.same ? a * b : b)], ex + 5, RY);
      }
      if (st === "write") block("check", 0, RY + 3, 7, "Check", "check");
      const showTries = st === "drag" || st === "pick" || done;
      if (showTries) {
        const list = this.tries.slice();
        if (H && H.k === "x" && !list.includes(xl)) list.push(xl);
        list.slice(-3).forEach((v, j) => { const [p, q] = sides(v); text(`try${j}_${v}`, `x = ${v}: ${p} and ${q}`, 0, RY + 2.6 + j * 1.6, "small", { anchor: "start", c: v === xl ? CU : "var(--ink2)", live: true }); });
      }
      void A; void Bv;
      if (st === "pick") choiceRow("pk", ["Same", "Not the same"], 0, RY + 8, 12, this.bad, "small", 2);
      if (done) block("next", 0, RY + 8, 10, "Next problem", "next");
    },
  });
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  expo: { name: "Exponents and order", make: i => dExpo(i) },
  write: { name: "Write expressions", make: i => dWrite(i) },
  eval: { name: "Evaluate expressions", make: i => dEval(i) },
  equiv: { name: "Equivalent expressions", make: i => dEquiv(i) },
};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
// each lesson counts its problems: the n-th problem is generated with index n (easy first)
const idxOf = {};
let firstIndex = 0;
function start(id) {
  id = String(id || "").replace(/^g6-/, "");
  if (!LESSONS[id]) id = "expo";
  const i = idxOf[id] ?? firstIndex; idxOf[id] = i + 1;
  token++;
  lesson = LESSONS[id].make(i);
  lesson.index = i;
  pick.value = id;
  drawn = new Set(); keys.blur();
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g6ch5-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value);
document.getElementById("fresh").onclick = () => leave();
// a lesson that tilted the paper lays it flat again before the next problem
function leave() { const go = () => start(lesson.id); if (lesson.leave) lesson.leave(go); else go(); }
let first = "expo";
try {
  const q = new URLSearchParams(location.search);
  first = q.get("l") || localStorage.getItem("g6ch5-lesson") || "expo";
  if (q.get("i")) firstIndex = Math.max(0, parseInt(q.get("i"), 10) || 0);
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
} catch (err) {}
start(first);
</script>
