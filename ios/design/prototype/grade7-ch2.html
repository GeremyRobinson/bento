<title>7th Grade: Percents</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block).
   Chapter 2, Percents, has no colour of its own in grade7.md; it keeps chapter 1's blue, the colour of 6th grade's
   percent bar (grade6-ch1.html, Percent of a number), whose look its bars follow. */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #4F63D9; --tint: rgba(79, 99, 217, .22); --tint-strong: rgba(79, 99, 217, .42);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
/* the live readout of a hand move, big in the pill's middle while the finger is down */
#bar #live { font: 600 22px var(--round); color: var(--chapter); padding: 0 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#bar #live:empty, #bar #live:empty + .sep { display: none; }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <span id="live" aria-live="polite"></span>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit of new5-lessons.html) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = list => list[rnd(0, list.length - 1)];
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const fmt = v => String(Math.round(v * 100) / 100);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

let items = [];
let drawn = new Set();
function put(k, tag, a, kind = "fade", text, bb) { items.push({ k, tag, a, kind, text, bb }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
// a path; bb is its reach in squares [left, top, right, bottom] so the camera can frame it
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": 1.5, pathLength: o.dash ? null : 1,
    "stroke-dasharray": o.dash ? "6 6" : null }, o.live ? "none" : o.dash ? "fade" : "line", null, o.bb || null);
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? 1.5 : null, opacity: o.op ?? null, "stroke-dasharray": o.dash ? "6 6" : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null }, o.live ? "none" : o.c && !o.fill && !o.dash ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade"); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c }); continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c }); col += 2;
  }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Cut, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
// a label's ink half a square from what it labels
function lab(k, s, side, edge, along, cls = "small", c) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end" });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start" });
}
// an answer box in the record: cells of 2 squares, what's typed in its middle
function dbox(k, x, y, cells, value, state, actName) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (value) text(`${k}v`, value, x + cells, y + 1, "maths", { c: vc, live: true });
  if (state === "active") {
    const cx = x + cells + (value ? value.length * 0.31 : 0) + 0.25;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// what to do on the rows above the picture: one line, and a small second line (or what a miss says, in red)
function dhead(L, say, sub) {
  words(`say-${say}`, say, 0, 1, 60);
  if (L.msg) words(`msg-${L.msg}`, L.msg, 0, 3.3, 60, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, 0, 3.3, 60, "small");
}
// lessons with answer boxes: each box has its own value; the hidden input types into the active one
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; L.verdict = null; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const ring = (k, x, y, r = 1.05) => path(k, `M${sq(x + r)} ${sq(y)}a${sq(r)} ${sq(r)} 0 1 1 0 -0.1`, { c: "var(--chapter)", bb: [x - r, y - r, x + r, y + r] });
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// ---------- what's drawn reaches: the camera frames it ----------
const CHW = { maths: 1.05, say: 0.7, small: 0.55 }, CHH = { maths: 0.7, say: 0.55, small: 0.4 };
function extentOf(it) {
  const a = it.a;
  if (it.bb) return it.bb;
  if (a["data-act"]) return null;
  if (it.tag === "line") return [Math.min(a.x1, a.x2) / SQ, Math.min(a.y1, a.y2) / SQ, Math.max(a.x1, a.x2) / SQ, Math.max(a.y1, a.y2) / SQ];
  if (it.tag === "rect") return [a.x / SQ, a.y / SQ, (a.x + a.width) / SQ, (a.y + a.height) / SQ];
  if (it.tag === "circle") return [(a.cx - a.r) / SQ, (a.cy - a.r) / SQ, (a.cx + a.r) / SQ, (a.cy + a.r) / SQ];
  if (it.tag === "text") {
    const cls = (a.class || "").split(" ")[0], w = String(it.text).length * (CHW[cls] || 0.6), h = CHH[cls] || 0.5, x = a.x / SQ, y = a.y / SQ;
    const l = a["text-anchor"] === "start" ? x : a["text-anchor"] === "end" ? x - w : x - w / 2;
    return [l, y - h, l + w, y + h];
  }
  return null;
}
let reachBox = null;

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "";
  let bx = [Infinity, Infinity, -Infinity, -Infinity];
  for (const it of items) {
    next.add(it.k);
    const e = extentOf(it);
    if (e) bx = [Math.min(bx[0], e[0]), Math.min(bx[1], e[1]), Math.max(bx[2], e[2]), Math.max(bx[3], e[3])];
    const fresh = !drawn.has(it.k) && it.kind !== "none", a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${Math.min(n++ * 0.035, 1.2).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    out += `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
  }
  sceneEl.innerHTML = out;
  reachBox = bx;
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
  document.getElementById("live").textContent = down && down.grabbed && lesson.live ? lesson.live() : "";
}
// the frame: what's drawn now, from the top-left of the words, a square of margin round it
function autoFrame() {
  const b = reachBox;
  const x0 = Math.min(0, b[0]) - 1, y0 = Math.min(0, b[1]) - 0.5;
  return { x: x0, y: y0, w: b[2] - x0 + 1, h: b[3] - y0 + 1 };
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 125%. The frame's top sits at the top of
// the screen (the words on the top rows, never an empty band above them); it's centred across.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 24, bottom = 100;
  const s = Math.min((W - 48) / sq(f.w), (H - top - bottom) / sq(f.h), 1.25);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); camTo = null; applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, Math.max(0, (t - camT0) / 750)), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(autoFrame(), true));

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/[^0-9.]/g, "").slice(0, 5)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; mouse and touch alike ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  if (down) return;
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { id: e.pointerId, p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { if (down.moved) { lesson.drag(toPaper(e)); render(); } return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
function lift(e) {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e), d.moved); after(); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) after();
}
svg.addEventListener("pointerup", lift);
// a cancelled touch puts back what the finger held
svg.addEventListener("pointercancel", e => { if (down && e.pointerId === down.id) { const d = down; down = null; if (d.grabbed && lesson.cancel) lesson.cancel(); render(); } });
function after() { if (lesson.typing) openKeys(); render(); frame(autoFrame()); }
function act(a) {
  if (a === "type") { openKeys(); return; }
  if (a === "next") { start(lesson.id, lesson.index + 1); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(autoFrame());
}

// ---------- numbers: fractions and how the paper writes them ----------
function fr(n, d = 1) { const g = gcd(Math.abs(n), Math.abs(d)) || 1; return { n: n / g, d: d / g }; }
const fval = f => f.n / f.d;
const fdiv = (a, b) => fr(a.n * b.d, a.d * b.n), fmul = (a, b) => fr(a.n * b.n, a.d * b.d);
const feq = (a, b) => a.n * b.d === b.n * a.d;
// (fifths are written 2/5: the rounded font's fifths glyphs are too small to read)
const GLY = { "1/2": "½", "1/3": "⅓", "2/3": "⅔", "1/4": "¼", "3/4": "¾", "1/6": "⅙", "5/6": "⅚", "1/8": "⅛", "3/8": "⅜", "5/8": "⅝", "7/8": "⅞" };
// a fraction as a word on the paper: 2, ½, 1½, 2/9, 1 4/9
function fs(f) {
  const w = Math.floor(f.n / f.d), r = f.n % f.d;
  if (!r) return String(w);
  const g = GLY[`${r}/${f.d}`];
  return w ? (g ? `${w}${g}` : `${w} ${r}/${f.d}`) : (g || `${r}/${f.d}`);
}
const divisors = n => { const d = []; for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i); return d; };
const nearest = (list, x) => list.reduce((b, v) => Math.abs(v - x) < Math.abs(b - x) ? v : b);

// ---------- the record: a line of school maths on the squares ----------
// Tokens: "12" (2 squares a digit, the point on a line), "x" (2 squares a letter), "=" "÷" "×" "+" (3 squares),
// { w: "km" } words, { fv: fraction, improper } a fraction stacked (a mixed number's whole beside it),
// { cfr: [top, bottom] } a fraction over a fraction, { box, cells } and { fbox: [top, bottom] } answer boxes.
const OPS = new Set(["=", "÷", "×", "+", "−"]);

  const wasName = err ? "real" : "was", nowName = err ? "guess" : "now", chg = err ? "gap" : "change";
  const stages = ["drag", "cut", "write", "done"];
  const L = withBoxes({
    id: "pctchange", index, P, stage: "drag", b: 0, s: PBAR, msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage === "write2" ? "write" : this.stage); },
    live() {
      if (this.stage === "drag") return fmt(Math.abs(this.b) * O / PBAR);
      if (this.stage === "cut") return `${plural(PBAR / this.s, "block", "blocks")} of ${fmt(O * this.s / PBAR)}: the ${chg} is ${fmt(cs / this.s)} of them`;
      return "";
    },
    grab(q) {
      if (this.stage === "drag" && q.y > WY && q.y < NY + H && q.x > X0 + 5 && q.x < X0 + 78) { this.msg = null; this.drag(q); return true; }
      if (this.stage === "cut" && q.y > WY - 2.5 && q.y < WY + H + 1 && q.x > X0 - 1 && q.x < END + 2) { this.msg = null; return true; }
      return false;
    },
    drag(q) {
      if (this.stage === "drag") this.b = clamp(Math.round(q.x - END), -(PBAR - 1), 35);
      else this.s = snapBlock(q.x - X0);
    },
    cancel() { if (this.stage === "drag") this.b = 0; else this.s = PBAR; },
    release(q, moved) {
      if (this.stage !== "drag") return;
      if (this.b === Ln - PBAR) { this.stage = "cut"; this.msg = null; return; }
      if (this.b) this.msg = `Stretch it from ${O} to ${fmt(N)}.`;
      this.b = 0;
    },
    act(x) {
      if (boxAct(this, x)) return;
      const st = this.stage;
      if (x === "cut" && st === "cut") {
        if (this.s === PBAR) { this.msg = `Drag the ruler to cut the ${wasName} bar.`; return; }
        if (cs % this.s) { this.msg = `${fmt(c)} isn't a whole number of those.`; this.s = PBAR; return; }
        this.stage = "write"; this.active = "d"; this.typing = true; this.msg = null; return;
      }
      if (x !== "check") return;
      if (st === "write") {
        const v = this.vals.d;
        if (!v) { this.msg = "Write it in the box."; return; }
        if (Math.abs(+v - p / 100) < 1e-9) { this.verdict = null; this.stage = "write2"; this.active = "pc"; this.msg = null; return; }
        this.verdict = "wrong";
        if (Math.abs(+v - Math.round(c / N * 1e6) / 1e6) < 1e-6) this.msg = err ? `Divide by the real count, ${O}.` : "Divide by the original amount.";
        else this.msg = err ? `Compare the gap with the real count, ${O}.` : `Compare the change with where it started, ${O}.`;
      } else if (st === "write2") {
        const v = this.vals.pc;
        if (!v) { this.msg = "Write it in the box."; return; }
        if (+v === p) { this.verdict = "right"; this.stage = "done"; this.typing = false; this.msg = null; return; }
        this.verdict = "wrong";
        if (Math.abs(+v - p / 100) < 1e-9) this.msg = `A percent counts hundredths: ${fmt(p / 100)} is how many hundredths?`;
        else if (Math.abs(+v - p / 10) < 1e-9) this.msg = "Hundredths: move the point two places.";
        else this.msg = "Percent means hundredths: how many hundredths is it?";
      }
    },
    scene() {
      const st = this.stage, cut = !["drag", "cut"].includes(st), done = st === "done";
      const say = {
        drag: [err ? `How far off was ${G[0]}'s guess?` : "How much did it change?", "Drag the bracket from one end to the other."],
        cut: [`Cut the ${wasName} bar into blocks the ${chg} is made of.`, "Drag the ruler, then tap Cut."],
        write: [`Divide the ${chg} by ${err ? "the real count" : "where it started"}.`, ""],
        write2: ["Write it as a percent.", ""],
        done: [err ? `${G[1]} guess was off by ${PART[p]} the real count.` : `${fmt(c)} is ${PART[p]} ${O}, where it started: ${up ? "up" : "down"} ${p}%.`, ""],
      }[st];
      dhead(this, say[0], say[1]);
      // the two bars' words over their left ends; their numbers at their right ends
      text(`wl${wasName}`, wasName, X0, WY - 1, "small", { anchor: "start" });
      text(`nl${nowName}`, nowName, X0, BKY, "small", { anchor: "start" });
      const name = (k, v, x, y, cc) => {
        text(`${k}${v}`, fmt(v), x + 0.5, y, "maths", { anchor: "start", c: cc });
        if (thing) text(`${k}w`, thing, x + 0.9 + fmt(v).length * CHW.maths, y + 0.2, "small", { anchor: "start" });
      };
      // the change, on the now bar: on, its new blocks; down, the blocks it lost, dashed
      if (cut && up) rect("chf", END, NY, cs, H, { fill: "var(--tint-strong)" });
      rect("was", X0, WY, PBAR, H, { c: "var(--chapter)" });
      rect("now", X0, NY, Ln, H, { c: "var(--chapter)" });
      name("wn", O, END, WY + H / 2);
      const nx = cut && !up ? END : X0 + Ln;    // down: once its lost blocks are drawn, its name sits past them
      name("nn", N, nx, NY + H / 2);
      if (st === "cut") {
        Ruler.draw("r", X0, WY - 0.6, WY + H + 0.6, PBAR, this.s, { live: true });
        if (down && down.grabbed) text("rr", this.live(), X0 + this.s + 1, WY - 1.1, "small", { anchor: "start", c: "var(--chapter)", live: true });
        block("cut", 0, NY + H + 3, 6, "Cut", "cut");
      }
      if (cut) {
        const s = this.s, v = fmt(O * s / PBAR);
        cutBar("wc", X0, WY, PBAR, H, s, v);
        cutBar("nc", X0, NY, Ln, H, s, v);
        if (!up) { rect("lost", X0 + Ln, NY, cs, H, { c: "var(--ink3)", dash: true }); cutBar("lc", X0 + Ln, NY, cs, H, s, v, { c: "var(--ink3)", vc: "var(--ink3)", dash: true }); }
      }
      // the change bracket, between the two ends
      if (st === "drag") {
        if (this.b) bracket("bk", END, END + this.b, BKY);
        handleDot("bh", END + this.b, BKY);
        if (this.b && down && down.grabbed) text("br", this.live(), Math.max(END, END + this.b) + 1, BKY, "small", { anchor: "start", c: "var(--chapter)", live: true });
      } else {
        bracket("bk", END, X0 + Ln, BKY, { solid: true });
        text("bt", fmt(c), Math.max(END, X0 + Ln) + 0.6, BKY, "small", { anchor: "start", c: "var(--chapter)" });
      }
      // the record
      if (cut) {
        const ry = NY + H + 4;
        const big = Math.max(O, N), small = Math.min(O, N);
        mrow("r1", [fmt(big), "−", fmt(small), "=", { t: fmt(c), c: "var(--chapter)" }], 0, ry, this);
        mrow("r2", [fmt(c), "÷", O, "=", st === "write" ? { box: "d", cells: 3 } : { t: fmt(p / 100), c: "var(--chapter)" }], 0, ry + 3, this);
        if (st !== "write") mrow("r3", [fmt(p / 100), "=", done ? { t: p, c: "var(--chapter)" } : { box: "pc", cells: 2 }, "%"], 0, ry + 6, this);
        const rows = st === "write" ? 2 : 3;
        if (done) {
          // the now bar's name gets the percent
          text("pcn", err ? `${p}% error` : `${up ? "+" : "−"}${p}%`, nx + 0.5, NY + H + 0.9, "say", { anchor: "start", c: "var(--chapter)" });
          block("next", 0, ry + 3 * rows, 10, "Next problem", "next");
        } else block("check", 0, ry + 3 * rows, 7, "Check", "check");
      }
    },
  });
  return L;
}

// =====================================================================================================
// 3. Simple interest (g7-interest). A cell of 2 × 2 squares is 1% of the money: the money is a 10 × 10 grid of cells.
// Tap one year's cells, drag the years out (each lays a copy of them as a column), write I = P × r × t.
// =====================================================================================================
// problems 1–3: the interest over 1–2 years, $100–500, 2–5%; 4–6 the total; 7 on, how long
function genInterest(i) {
  const kind = i < 3 ? "interest" : i < 6 ? "total" : "long";
  const P = 100 * (i < 3 ? rnd(1, 5) : rnd(1, 20)), r = i < 3 ? rnd(2, 5) : rnd(2, 8), t = i < 3 ? rnd(1, 2) : kind === "long" ? rnd(2, 6) : rnd(1, 6);
  return { kind, P, r, t, I1: P * r / 100, I: P * r * t / 100 };
}
function lInterest(index) {
  const Q = genInterest(index), { kind, P, r, t, I1, I } = Q, long = kind === "long";
  const X0 = 0, GY = 8, YX = 22, YT = GY + 3, slots = long ? 6 : t, MAXY = 8;
  const years = n => plural(n, "year", "years");
  const stages = ["shade", "years", "write", "done"];
  const shaded = new Set();
  const cellAt = q => { const i = Math.floor((q.x - X0) / 2), j = Math.floor((q.y - GY) / 2); return i >= 0 && i < 10 && j >= 0 && j < 10 ? j * 10 + i : null; };
  const L = withBoxes({
    id: "interest", index, P: Q, stage: "shade", n: 0, n0: 0, paint: true, shaded, msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage === "write2" ? "write" : this.stage); },
    live() {
      if (this.stage === "shade") return `${shaded.size}% = ${usd(shaded.size * P / 100)}`;
      if (this.stage === "years") return `${years(this.n)}: ${this.n * r}% = ${usd(this.n * I1)}`;
      return "";
    },
    grab(q) {
      if (this.stage === "shade") {
        const c = cellAt(q); if (c == null) return false;
        this.paint = !shaded.has(c); this.msg = null; this.mark(c); return true;
      }
      if (this.stage === "years" && q.x > YX - 2 && q.x < YX + 2 * MAXY + 2 && q.y > GY - 1 && q.y < YT + 2 * r + 4) { this.n0 = this.n; this.msg = null; return true; }
      return false;
    },
    mark(c) { if (this.paint) shaded.add(c); else shaded.delete(c); },
    drag(q) {
      if (this.stage === "shade") { const c = cellAt(q); if (c != null) this.mark(c); }
      else this.n = clamp(Math.round((q.x - YX) / 2), 0, MAXY);
    },
    cancel() { if (this.stage === "years") this.n = this.n0; },
    release(q, moved) {
      if (this.stage === "shade") {
        const k = shaded.size;
        if (k === r) { this.stage = "years"; this.msg = null; }
        else if (k > r) { this.msg = `That's ${k}%. One year is ${r}%.`; shaded.clear(); }
        return;
      }
      if (this.stage !== "years") return;
      if (!moved) this.n = Math.min(this.n + 1, MAXY);              // a tap adds a year
      const n = this.n;
      if (n === t) { this.stage = "write"; this.active = long ? "t" : "I"; this.typing = true; this.msg = null; return; }
      if (!n || (!moved && n < t)) return;
      this.msg = long ? `That's ${years(n)}: ${usd(n * I1)}. Find ${usd(I)}.` : `That's ${years(n)}.`;
      this.n = 0;
    },
    act(c) {
      if (boxAct(this, c)) return;
      if (c !== "check") return;
      const st = this.stage;
      if (st === "write") {
        const id = long ? "t" : "I", v = this.vals[id];
        if (!v) { this.msg = "Write it in the box."; return; }
        if (long) {
          if (+v === t) { this.verdict = "right"; this.stage = "done"; this.typing = false; this.msg = null; return; }
          this.verdict = "wrong"; this.msg = `That's ${usd(+v * I1)}. Find ${usd(I)}.`; return;
        }
        if (+v === I) {
          if (kind === "total") { this.verdict = null; this.stage = "write2"; this.active = "T"; this.msg = null; return; }
          this.verdict = "right"; this.stage = "done"; this.typing = false; this.msg = null; return;
        }
        this.verdict = "wrong";
        if (+v === P * r * t) this.msg = `${r}% is ${r} hundredths: ${fmt(r / 100)}.`;
        else if (+v === I1 && t > 1) this.msg = `That's one year. ${years(t)}: ${t} × ${usd(I1)}.`;
        else if (+v === P + I) this.msg = `That's the money and the interest. The interest alone is ${usd(I)}.`;
        else this.msg = `Each year is ${usd(I1)}, and there ${t === 1 ? "is 1" : `are ${t}`}.`;
      } else if (st === "write2") {
        const v = this.vals.T;
        if (!v) { this.msg = "Write it in the box."; return; }
        if (+v === P + I) { this.verdict = "right"; this.stage = "done"; this.typing = false; this.msg = null; return; }
        this.verdict = "wrong";
        if (+v === I) this.msg = `That's the interest. Add it to the ${usd(P)}.`;
        else if (+v === P + I1 && t > 1) this.msg = `That's one year's interest. Add all ${t}: ${usd(I)}.`;
        else this.msg = `Add the interest to the ${usd(P)}.`;
      }
    },
    scene() {
      const st = this.stage, seen = ["write", "write2", "done"].includes(st), done = st === "done";
      const ask = { interest: `How much interest in ${years(t)}?`, total: `How much money after ${years(t)}?`, long: `How many years to earn ${usd(I)}?` }[kind];
      const say = {
        shade: ["Shade one year's interest.", "Tap cells, or drag over them. One cell is 1%."],
        years: [long ? ask : "Drag the years out.", "Tap to add a year, or drag."],
        write: [ask, kind === "total" ? "Write the interest first." : "Write it in the box."],
        write2: [`Add the interest to the ${usd(P)}.`, ""],
        done: [`Every year adds the same ${r}% of ${usd(P)}.`, ""],
      }[st];
      dhead(this, say[0], say[1]);
      // the money: 10 × 10 cells, each 1%; its name over it, what's shaded beside the name
      for (const c of shaded) rect(`sh${c}`, X0 + 2 * (c % 10), GY + 2 * Math.floor(c / 10), 2, 2, { fill: "var(--tint-strong)", live: st === "shade" });
      for (let k = 1; k < 10; k++) { line(`gv${k}`, X0 + 2 * k, GY, X0 + 2 * k, GY + 20, { c: "var(--ink3)" }); line(`gh${k}`, X0, GY + 2 * k, X0 + 20, GY + 2 * k, { c: "var(--ink3)" }); }
      rect("gout", X0, GY, 20, 20, { c: "var(--chapter)" });
      text("pn", usd(P), X0, GY - 1.15, "maths", { anchor: "start" });
      if (shaded.size) text(`cnt${shaded.size}`, this.live && st === "shade" ? this.live() : `${r}% = ${usd(I1)}`, X0 + 20, GY - 1, "small", { anchor: "end", c: "var(--chapter)", live: st === "shade" });
      // the years: the rate and how long, over a row of empty year columns
      text(`yr${long}`, `${r}% a year · ${long ? "? years" : years(t)}`, YX, GY + 1, "say", { anchor: "start" });
      for (let k = 0; k < slots; k++) rect(`sl${k}`, YX + 2 * k, YT, 2, 2 * r, { c: "var(--ink3)", dash: true });
      const n = seen ? t : this.n, live = st === "years";
      for (let k = 0; k < n; k++) {
        const over = !long && k >= t;
        for (let m = 0; m < r; m++) rect(`yc${k}_${m}${over}`, YX + 2 * k, YT + 2 * m, 2, 2, { fill: over ? "none" : "var(--tint-strong)", c: over ? "var(--wrong)" : "var(--chapter)", live });
        text(`yn${k}${over}`, k + 1, YX + 2 * k + 1, YT + 2 * r + 1, "small", { c: over ? "var(--wrong)" : "var(--chapter)", live });
      }
      if (live) handleDot("yh", YX + 2 * n, YT + r);
      if ((live && n) || seen) text(`yt${n}`, `${years(n)}: ${n * r}% = ${usd(n * I1)}`, YX, YT + 2 * r + 3, "small", { anchor: "start", c: "var(--chapter)", live });
      // the record
      if (seen) {
        const ry = Math.max(GY + 24, YT + 2 * r + 7);
        const ans = (id, v, cells) => (done || (id === "I" && st === "write2")) ? { t: v, c: "var(--chapter)" } : { box: id, cells };
        if (long) mrow("r1", ["I", "=", P, "×", fmt(r / 100), "×", ans("t", t, 1), "=", I], 0, ry, this);
        else mrow("r1", ["I", "=", P, "×", fmt(r / 100), "×", t, "=", ans("I", I, 3)], 0, ry, this);
        if (kind === "total" && st !== "write") mrow("r2", [P, "+", I, "=", ans("T", P + I, 4)], 0, ry + 3, this);
        const rows = kind === "total" && st !== "write" ? 2 : 1;
        if (done) block("next", 0, ry + 3 * rows, 10, "Next problem", "next"); else block("check", 0, ry + 3 * rows, 7, "Check", "check");
      }
    },
  });
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  discount: { name: "Discounts, tax and tips", make: lDiscount },
  pctchange: { name: "Percent change", make: lPctChange },
  interest: { name: "Simple interest", make: lInterest },
};
const GEN = { discount: genDiscount, pctchange: genPctChange, interest: genInterest };
const pickEl = document.getElementById("pick");
pickEl.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id, index = 0) {
  if (!LESSONS[id]) id = "discount";
  lesson = LESSONS[id].make(index);
  pickEl.value = id;
  drawn = new Set(); keys.blur(); down = null;
  render(); frame(autoFrame(), true);
  try { localStorage.setItem("g7ch2-lesson", id); } catch (err) {}
}
pickEl.onchange = () => start(pickEl.value, 0);
document.getElementById("fresh").onclick = () => start(lesson.id, lesson.index);
let first = "discount", firstP = 0;
try {
  const q = new URLSearchParams(location.search);
  first = q.get("l") || localStorage.getItem("g7ch2-lesson") || "discount";
  firstP = Math.max(0, (+q.get("p") || 1) - 1);
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
} catch (err) {}
start(first, firstP);
// for the preview's own checks: paper squares to screen points
window.T = { GEN, start, get lesson() { return lesson; }, scr(x, y) { const p = new DOMPoint(x * SQ, y * SQ).matrixTransform(svg.getScreenCTM()); return { x: p.x, y: p.y }; } };
</script>
