<title>8th Grade: Big and Small Numbers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). iPad landscape only.
   Chapter colour: grade8.md names none, so (as chapter 1) this uses paper-lessons.html's decimals colour (Multiply by 10, 100, 1000
   and Rounding decimals' zoom lines are the closest family: powers of ten, place columns, lines that open). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #D6407F; --tint: rgba(214, 64, 127, .2); --tint-strong: rgba(214, 64, 127, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
/* a unit cube's faces: the chapter colour mixed into the paper, opaque so cubes in front hide cubes behind */
:root { --cube-top: color-mix(in srgb, var(--chapter) 18%, var(--paper)); --cube-front: color-mix(in srgb, var(--chapter) 34%, var(--paper));
  --cube-side: color-mix(in srgb, var(--chapter) 52%, var(--paper)); --cube-edge: color-mix(in srgb, var(--chapter) 70%, var(--ink)); }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none; margin: 0;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
/* 0s that pass the point fall away */
.out-fall { animation: fall .75s ease-in forwards; transform-box: fill-box; }
@keyframes fall { from { opacity: 1; } to { opacity: 0; transform: translateY(36px); } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--tint)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>

  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const isqrt = n => { let r = Math.floor(Math.sqrt(n)); while (r * r > n) r--; while ((r + 1) * (r + 1) <= n) r++; return r; };
const isSquare = n => isqrt(n) ** 2 === n;
// an integer read with `places` decimals, trailing zeros dropped: (2916, 2) → "29.16", (500, 2) → "5"
function dec(v, places) {
  const s = String(v).padStart(places + 1, "0"), w = s.slice(0, s.length - places), f = s.slice(s.length - places).replace(/0+$/, "");
  return f ? `${w}.${f}` : w;
}
const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹", "-": "⁻" };
const sup = n => String(n).split("").map(c => SUP[c] || c).join("");

let items = [], drawn = new Set();
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in, and an
// optional delay (a count that runs on). UP: what's put now faces the child (drawn over the tilting paper, never tilted)
let UP = false;
function put(k, tag, a, kind = "fade", text, delay) { items.push({ k, tag, a, kind, text, up: UP, delay }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay);
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: 1,
    "stroke-dasharray": o.dash ? "0.03 0.03" : null }, o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay);
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, "stroke-dasharray": o.dash ? "6 6" : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null }, o.live ? "none" : o.c && !o.fill && !o.dash ? "line" : "fade", undefined, o.delay);
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade", undefined, o.delay); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s, o.delay);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c, live: o.live }); continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c, live: o.live }); col += 2;
  }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// a label's ink half a square from the edge it labels
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c, o = {}) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c, ...o });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c, ...o });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end", ...o });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start", ...o });
}
// an answer box in the record: cells of 2 squares, what's typed lined up on the right (or centred), the cursor after it
function dbox(k, x, y, cells, value, state, actName, centred = false) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null, v = String(value || "").replace("-", "−");
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (v) {
    if (centred) text(`${k}v`, v, x + cells, y + 1, "maths", { c: vc, live: true });
    else digits(`${k}v${v}`, v, x + cells * 2, y + 1, { c: vc, live: true });
  }
  if (state === "active") {
    const cx = centred ? x + cells + (v ? v.length * 0.31 : 0) + 0.25 : x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// a line of maths laid on the grid (names and the record): a character 2 squares, a space 1, a superscript 1 square a
// character in small type, an answer box 2 squares a cell (raised for an exponent), a fraction as a column with its bar
// on the row's middle, a root with its bar over the number. Returns its width and where each part sits.
// draw = false only measures. Tokens: "x² · " strings, {t, c} coloured text, {sup}, {box, cells, sup, L}, {frac: [top, bottom]},
// {root, idx}.
function mrow(k, toks, x, y, o = {}, draw = true) {
  let cx = x; const at = {};
  toks.forEach((t, i) => {
    if (t == null) return;
    const kk = `${k}.${i}`, x0 = cx, c = (t && t.c) || o.c;
    const T = (key, s, px, py, cls, col) => { if (draw) text(key, s, px, py, cls, { c: col, live: o.live }); };
    if (typeof t !== "object" || t.t != null) {
      for (const ch of String(typeof t === "object" ? t.t : t)) {
        if (ch === " ") cx += 1;
        else if (ch === "." || ch === ",") T(`${kk}p${ch}${cx}`, ch, cx, y, "maths", c);
        else { T(`${kk}${ch}${cx}`, ch, cx + 1, y, "maths", c); cx += 2; }
      }
    } else if (t.box) {
      const cells = t.cells || 1;
      if (draw) dbox(`${k}b${t.box}`, cx, t.sup ? y - 2 : y - 1, cells, t.L.vals[t.box] || "", boxState(t.L, t.box), `box:${t.box}`, !!t.centred);
      cx += cells * 2;
    } else if (t.sup != null) {
      // an exponent hugs its base: its first character starts in the base's last square
      const chs = String(t.sup).replace("-", "−"); cx -= 0.7;
      for (const ch of chs) { T(`${kk}s${ch}${cx}`, ch, cx + 0.5, y - 0.9, "small", c || "var(--ink)"); cx += 1; }
      cx += 0.7;
    } else if (t.frac) {
      const wt = mrow("", t.frac[0], 0, 0, o, false).w, wb = mrow("", t.frac[1], 0, 0, o, false).w, W = Math.max(wt, wb) + 2;
      if (draw) {
        mrow(kk + "t", t.frac[0], cx + (W - wt) / 2, y - 1, { ...o, c });
        line(`${kk}bar`, cx, y, cx + W, y, { c: c || "var(--ink)" });
        mrow(kk + "b", t.frac[1], cx + (W - wb) / 2, y + (t.frac[1].some(u => u && u.sup != null && !u.box) ? 1.7 : 1), { ...o, c });
      }
      cx += W;
    } else if (t.root != null) {
      const s = String(t.root), w = s.length * 2;
      if (draw) {
        path(`${kk}rad${s}`, `M${sq(cx + 0.2)} ${sq(y + 0.15)}L${sq(cx + 0.65)} ${sq(y - 0.1)}L${sq(cx + 1.15)} ${sq(y + 0.9)}L${sq(cx + 1.8)} ${sq(y - 1.2)}H${sq(cx + 2.2 + w)}`, { c: c || "var(--ink)" });
        if (t.idx) T(`${kk}ri`, t.idx, cx + 0.75, y - 0.75, "small", c || "var(--ink)");
        mrow(kk + "rd", [s], cx + 2, y, { ...o, c });
      }
      cx += 2 + w;
    }
    at[t.id || t.box || i] = { x: x0, w: cx - x0 };
  });
  return { w: cx - x, at };
}
// what to do on the rows above the picture: one line, and a small second line (or what a miss says, in red)
function dhead(L, say, sub, x = 0, y = 0, width = 60) {
  const n = words(`say-${say}`, say, x, y + 1, width);
  const y2 = y + 1 + 2 * n + 0.3;
  if (L.msg) words(`msg-${L.msg}`, L.msg, x, y2, width, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, x, y2, width, "small");
}
// lessons with answer boxes: each box has its own value; the hidden input types into the active one
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; L.verdict = null; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];
const num = s => s === "" || s == null ? NaN : +String(s).replace("−", "-");
// the first problems of a run are the friendly ones: the smallest of six draws (the web's withEasyStart)
function easyStart(i, draw, size) {
  let best = draw();
  if (i >= 3) return best;
  for (let k = 1; k < 6; k++) { const p = draw(); if (size(p) < size(best)) best = p; }
  return best;
}

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none" && it.kind !== "fall", a = { ...it.a };
    if (it.kind === "fall") { a.class = ((a.class || "") + " out-fall").trim(); a.style = `animation-delay:${(it.delay || 0).toFixed(3)}s;`; }
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      const d = it.delay != null ? it.delay : Math.min(n++ * 0.035, 1.2);
      a.style = `animation-delay:${d.toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  const m = lesson.paperMatrix && lesson.paperMatrix();
  if (m) document.getElementById("paperg").setAttribute("transform", `matrix(${m.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  // a lesson that's moving (the paper tilting, cubes rising) draws again next frame
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.25x. The frame's top row sits at the top
// of the screen (the words on rows 0–2), centred across; no empty band above the paper.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 24, bottom = 110;
  const s = Math.min((W - 64) / sq(f.w), (H - top - bottom - 16) / sq(f.h), 1.25);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { camTo = null; Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/−/g, "-").replace(/[^0-9.\-]/g, "").slice(0, 10)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, press, drag (on the lesson's picture) or pan the paper; mouse and touch alike ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); afterHand(); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) afterHand();
});
svg.addEventListener("pointercancel", () => { if (down && down.grabbed && lesson.cancel) lesson.cancel(); down = null; render(); });
function afterHand() { render(); frame(lesson.frame()); if (lesson.typing) openKeys(); }
function act(a) {
  if (a === "next") { leave(); return; }
  if (a === "type") { openKeys(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}

// ---------- the hand moves (each built once, for this chapter and the ones after) ----------
// Drag a square's corner: a square from (x0, y0), k squares a unit, its far corner snapped to whole units; it stays a
// square (the side is the farther of the finger's two distances). Returns the live side in units.
const cornerSide = (q, x0, y0, k, max) => Math.max(1, Math.min(max, Math.max(q.x - x0, q.y - y0) / k));
// A unit square's inside: its unit lines, every fifth one bold (as Multiply two-digit numbers bolds its tens)
function unitGrid(k, x0, y0, m, kk, c = "var(--ink3)", live = false) {
  for (let i = 1; i < m; i++) {
    const bold = i % 5 === 0, o = { c: bold ? "var(--ink2)" : c, w: bold ? 1.5 : 1, live };
    line(`${k}v${i}_${m}${kk}`, x0 + i * kk, y0, x0 + i * kk, y0 + m * kk, o);
    line(`${k}h${i}_${m}${kk}`, x0, y0 + i * kk, x0 + m * kk, y0 + i * kk, o);
  }
}
// A chip: an x (or what it stands for) in a 4 × 4 outline, crossed out when it cancels
function chip(k, x, y, label, o = {}) {
  if (o.lit) rect(`${k}f`, x, y, 4, 4, { fill: "var(--tint)", live: o.live });
  rect(`${k}o`, x, y, 4, 4, { c: o.c || "var(--ink)", live: o.live });
  text(`${k}t${label}`, label, x + 2, y + 2, "maths", { c: o.tc, live: o.live });
  if (o.crossed) line(`${k}x`, x + 0.5, y + 3.5, x + 3.5, y + 0.5, { c: "var(--chapter)", delay: o.delay });
}
// A bracket under (or over) a run of things, its ends turned up
const bracket = (k, x0, x1, y, o = {}) => path(k, `M${sq(x0)} ${sq(y - 0.6)}V${sq(y)}H${sq(x1)}V${sq(y - 0.6)}`, o);
// A line that opens: a number line from x0 to x0 + 50, one block a step, its labels below; a tick a block
const numberLine = (k, y, labels, o = {}) => {
  line(`${k}l`, 0, y, 50, y);
  for (let j = 0; j <= 10; j++) {
    line(`${k}t${j}`, j * 5, y - (j % 10 === 0 ? 1.5 : 1), j * 5, y);
    if (labels[j] != null) lab(`${k}n${j}${labels[j]}${o.lit === j}`, labels[j], "below", y, j * 5, "small", o.lit === j ? "var(--chapter)" : null);
  }
};

// ---------- the 3D paper (Unit cubes, as paper-lessons.html's Volume of a box draws it) ----------
// The paper turns and tips back about a point (no perspective in this preview: the app's long lens is RealityKit's);
// cubes stand on it and words stay upright. t is 0 flat, 1 tilted.
const PHI = 28 * Math.PI / 180, THETA = 52 * Math.PI / 180;
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
function tilter(L) {
  Object.assign(L, { tiltFrom: 0, tiltTo: 0, tiltAt: -1e9, piv: { x: 0, y: 0 } });
  L.t = function () { const u = Math.min(1, (performance.now() - this.tiltAt) / 1100); return this.tiltFrom + (this.tiltTo - this.tiltFrom) * ease(Math.max(0, u)); };
  L.tiltTo1 = function (to, after) { this.tiltFrom = this.t(); this.tiltTo = to; this.tiltAt = performance.now(); if (after) later(1150, after); };
  L.proj = function (x, y, z, t = this.t()) {
    const f = PHI * t, th = THETA * t, c = Math.cos(f), s = Math.sin(f), dx = x - this.piv.x, dy = y - this.piv.y;
    return { x: this.piv.x + c * dx - s * dy, y: this.piv.y + (s * dx + c * dy) * Math.cos(th) - z * Math.sin(th) };
  };
  L.paperMatrix = function () {
    const t = this.t(); if (t <= 0.001) return null;
    const f = PHI * t, th = THETA * t, c = Math.cos(f), s = Math.sin(f), a = c, b = s * Math.cos(th), cc = -s, d = c * Math.cos(th);
    const px = sq(this.piv.x), py = sq(this.piv.y);
    return [a, b, cc, d, px - (a * px + cc * py), py - (b * px + d * py)];
  };
  // a box's bounds as seen at tilt t
  L.bounds = function (x0, y0, x1, y1, z1, t) {
    let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
    for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [0, z1]) {
      const q = this.proj(x, y, z, t); a = Math.min(a, q.x); b = Math.min(b, q.y); c = Math.max(c, q.x); d = Math.max(d, q.y);
    }
    return { x0: a, y0: b, x1: c, y1: d };
  };
  return L;
}
// unit cubes (one block each) standing on the tilted paper, drawn back to front; each rises over 0.4 s from its time
function drawCubes(L, list, t) {
  const f = PHI * t, th = THETA * t, B = 5, now = performance.now(), cubes = [];
  const corner = (x, y, z) => { const q = L.proj(x, y, z, t); return `${sq(q.x)},${sq(q.y)}`; };
  for (const c of list) {
    const h = ease(Math.max(0, Math.min(1, (now - c.at) / 400)));
    if (h <= 0) continue;
    const cx = c.x + B / 2 - L.piv.x, cy = c.y + B / 2 - L.piv.y, zc = (c.k + h / 2) * B;
    cubes.push({ ...c, h, d: (cx * Math.sin(f) + cy * Math.cos(f)) * Math.sin(th) + zc * Math.cos(th) });
  }
  cubes.sort((p, q) => p.d - q.d);
  for (const c of cubes) {
    const x0 = c.x, x1 = x0 + B, y0 = c.y, y1 = y0 + B, z0 = c.k * B, z1 = (c.k + c.h) * B, id = `${x0}_${y0}_${c.k}`;
    const face = (n, pts, fill) => put(`${n}${id}`, "polygon", { points: pts.map(p => corner(...p)).join(" "), fill, stroke: "var(--cube-edge)", "stroke-width": 1.5, "stroke-linejoin": "round" }, "none");
    face("top", [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], "var(--cube-top)");
    face("front", [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], "var(--cube-front)");
    face("side", [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], "var(--cube-side)");
  }
}
// timers for the See beats; a new problem cancels the old one's
let token = 0;
function later(ms, fn) { const t = token; setTimeout(() => { if (t !== token) return; fn(); render(); frame(lesson.frame()); }, ms); }

// ---------- the problems (fresh numbers, easy first by index) ----------
const withCommas = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const WORD = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
// Scientific notation (the web's g8-sci): c 11–99, e 3–7, the number c × 10^(e−1). The first three problems are the
// smallest of six draws, sized as the web sizes them (the numbers in "45,000" plus the answers 4.5 and 4).
function genSci(i) {
  return easyStart(i, () => ({ c: rnd(11, 99), e: rnd(3, 7) }),
    p => withCommas(p.c * 10 ** (p.e - 1)).split(",").reduce((s, g) => s + +g, 0) + p.c / 10 + p.e);
}
// Small numbers (new, mirrors g8-sci): front c/10 with c 11–99, power −p with p 2–7; the first three problems p 2 or 3.
// From problem 7 half go the other way (rev: 3.2 × 10⁻³ as a decimal).
function genSmall(i) {
  return { c: rnd(11, 99), p: i < 3 ? rnd(2, 3) : rnd(2, 7), rev: i >= 6 && rnd(0, 1) === 1 };
}
// Multiply and divide big numbers (new): fronts 2–9, powers 2–8. The first three are × with a front product under 10
// and powers to 4 (the smallest of six); then × and ÷ take turns (÷: the first front a multiple of the second, its
// power the bigger); from problem 9 every third is + (same power, fronts with one decimal, their sum under 10).
function genCalc(i) {
  const kind = i < 3 ? "mul" : i < 8 ? (i % 2 ? "div" : "mul") : ["add", "mul", "div"][(i - 8) % 3];
  if (kind === "mul") {
    if (i < 3) return easyStart(i, () => { let f1, f2; do { f1 = rnd(2, 9); f2 = rnd(2, 9); } while (f1 * f2 >= 10); return { kind, f1, f2, a: rnd(2, 4), b: rnd(2, 4) }; },
      p => p.f1 + p.f2 + p.a + p.b + p.f1 * p.f2 + p.a + p.b);
    return { kind, f1: rnd(2, 9), f2: rnd(2, 9), a: rnd(2, 8), b: rnd(2, 8) };
  }
  if (kind === "div") {
    let f1, f2; do { f1 = rnd(2, 9); f2 = rnd(2, 9); } while (f1 % f2 || f1 === f2);
    const a = rnd(3, 8); return { kind, f1, f2, a, b: rnd(2, a - 1) };
  }
  let c1, c2; do { c1 = rnd(11, 99); c2 = rnd(11, 99); } while (c1 + c2 > 99 || c1 % 10 === 0 || c2 % 10 === 0 || (c1 + c2) % 10 === 0);
  return { kind, c1, c2, a: rnd(2, 8) };
}

// ---------- the hand moves new in this chapter ----------
// A place's name: its power of 10 (10⁴ … 10⁰ … 10⁻⁸), short enough for a column a block wide
const placeName = p => `10${sup(p)}`;
// How far the digits moved, as the readout says it: ÷ 10, ÷ 100, ÷ 1000, then ÷ 10⁴ … (× when they move left)
const movedBy = (n, op) => `${op} ${n <= 3 ? 10 ** n : "10" + sup(n)}`;
// A number written from its digits: sig (up to its last digit that isn't 0), the first at power `top`; 0s fill the
// whole places after it, and none trail after the point. ("45", 4) → "45000", ("45", −1) → "0.45"
function placeStr(sig, top) {
  const lastP = top - sig.length + 1, hiP = Math.max(top, 0), loP = Math.min(lastP, 0);
  let s = "";
  for (let p = hiP; p >= loP; p--) { if (p === -1) s += "."; const i = top - p; s += i >= 0 && i < sig.length ? sig[i] : "0"; }
  return s;
}
// Drag digits across place columns (Multiply by 10, 100, 1000's move): a number's digits in their places, sig then
// `zeros` whole-number 0s, the first at power `top` (a fraction while the finger moves them); xOf(p) is the middle of
// place p. 0s that pass the point fall away (faint while the finger holds them; o.fallAt: they drop and fade); with
// o.faint the empty places between the point and the first digit show faint 0s. Returns whether a digit sits after the point.
function placeDigits(k, sig, zeros, top, y, xOf, o = {}) {
  const live = !!o.live, r = Math.round(top), T = live ? top : r, since = o.fallAt ? performance.now() - o.fallAt : 1e9;
  let after = false;
  for (let i = 0; i < sig.length + zeros; i++) {
    const p = T - i, x = xOf(p), z = i >= sig.length;
    if (z && p < -0.5) {
      if (o.lo != null && p < o.lo - 0.5) continue;
      if (live) text(`${k}z${i}`, "0", x, y, "maths", { c: "var(--ink3)", live: true });
      else if (since < 800) put(`${k}fall${i}_${r}`, "text", { x: sq(x), y: sq(y), class: "maths", "text-anchor": "middle", "dominant-baseline": "central" }, "fall", "0", -since / 1000);
      continue;
    }
    text(live ? `${k}L${i}` : `${k}${i}_${r}`, z ? "0" : sig[i], x, y, "maths", { c: o.c, live });
    if (p < -0.5) after = true;
  }
  if (o.faint) for (let p = 0; p > T + 0.5; p--) text(`${k}e${p}`, "0", xOf(p), y, "maths", { c: "var(--ink3)", live });
  return after;
}
// A "× 10" chip: 2 × 2 squares, ×10 in it (small), crossed out when it cancels
function tenChip(k, x, y, o = {}) {
  if (o.fill) rect(`${k}f`, x, y - 1, 2, 2, { fill: o.fill, live: o.live, delay: o.delay });
  rect(`${k}o`, x, y - 1, 2, 2, { c: o.c || "var(--ink)", live: o.live });
  text(`${k}t`, "×10", x + 1, y, "small", { c: o.tc || "var(--ink)", live: o.live });
  if (o.crossed) line(`${k}x`, x + 0.3, y + 0.7, x + 1.7, y - 0.7, { c: "var(--chapter)", delay: o.delay });
}

// ---------- Scientific notation (g8-sci) and Small numbers (g8-small): one place chart ----------
// One square: a place is a column a block wide, its name (its power of 10) over it, the point fixed on the strong line
// after the ones. The number's digits sit in their columns (36). Drag them a column at a time; the record comes after.
function lPlace(id, index, P0) {
  const sciL = id === "sci", P = P0 || (sciL ? genSci(index) : genSmall(index)), CH = "var(--chapter)";
  const back = !sciL && !!P.rev, c = P.c, sig = String(c).replace(/0+$/, ""), len = sig.length, front = dec(c, 1);
  const n = sciL ? P.e : P.p;                                        // the places the digits move
  const top0 = sciL ? P.e : back ? 0 : -P.p, dir = sciL || back ? -1 : 1, zeros = sciL ? P.e + 1 - len : 0;
  const hi = sciL ? P.e : 1, lo = sciL ? -2 : back ? -P.p - (len - 1) : top0 - (len - 1);
  const sMax = dir < 0 ? top0 - (len - 1) - lo : hi - top0;
  const colX = p => (hi - p) * 5, mid = p => colX(p) + 2.5, PX = colX(0) + 5, W = (hi - lo + 1) * 5;
  const YN = 7, YT = 8, YB = 14, YD = 11, YR = 19, op = dir < 0 ? "÷" : "×";
  const given = sciL ? withCommas(c * 10 ** (P.e - 1)) : dec(c, P.p + 1);  // 45,000 · 0.00045
  const ans = back ? dec(c, P.p + 1) : null;
  const stages = back ? ["drag", "zeros", "write", "done"] : ["drag", "write", "done"];
  const L = withBoxes({
    id, index, P, stage: "drag", msg: null, verdict: null, typing: false, fr: null,
    s: 0, held: null, bad: false, fallAt: 0, tapped: new Set(),
    progress() { return stageIndex(stages, this.stage); },
    frame() { return this.fr; },
    empties() { const t = top0 + dir * n, out = []; for (let p = 0; p > t; p--) out.push(p); return out; },
    grab(q) {
      if (this.stage !== "drag" || q.y < YD - 2.5 || q.y > YD + 2.5 || q.x < 0 || q.x > W) return false;
      this.held = { gx: q.x, s0: this.s }; this.bad = false; this.msg = null; return true;
    },
    drag(q) { const h = this.held; if (h) this.s = Math.max(0, Math.min(sMax, h.s0 - dir * (q.x - h.gx) / 5)); },
    release() {
      const h = this.held; this.held = null;
      if (!h) return;
      const s = Math.round(this.s); this.s = s;
      this.fallAt = performance.now(); later(850, () => {});
      if (s === h.s0 && s === 0) return;
      if (s === n) {
        this.stage = back ? "zeros" : "write";
        if (!back) { this.typing = true; this.active = "f"; }
        return;
      }
      this.bad = true;
      const t = top0 + dir * s, shown = placeStr(sig, t);
      if (back) this.msg = `× 10${sup(-n)} moves the digits ${n} places.`;
      else this.msg = t >= 1 ? `${shown} has ${WORD[t + 1] || t + 1} digits before the point.` : `That's ${shown}: one digit goes before the point.`;
    },
    cancel() { this.held = null; this.s = Math.round(this.s); },
    tap(q) {
      if (this.stage !== "zeros" || Math.abs(q.y - YD) > 2.5 || q.x < 0 || q.x > W) return false;
      const p = hi - Math.floor(q.x / 5), em = this.empties();
      if (em.includes(p)) { this.tapped.add(p); this.msg = null; }
      else if (p > 0) this.msg = "A 0 in front of the ones changes nothing.";
      else return false;
      if (this.tapped.size === em.length) { this.stage = "write"; this.typing = true; this.active = "d"; }
      return true;
    },
    act(x) {
      if (boxAct(this, x)) return;
      if (x !== "check" || this.stage !== "write") return;
      if (back) {
        const v = num(this.vals.d);
        if (Number.isNaN(v)) { this.msg = "Write the decimal first."; return; }
        if (Math.abs(v - c / 10 ** (n + 1)) < 1e-12) { this.verdict = null; this.stage = "done"; this.typing = false; this.msg = null; return; }
        this.verdict = "wrong";
        this.msg = Math.abs(v - c * 10 ** (n - 1)) < 1e-6 ? `× 10${sup(-n)} makes it smaller: less than 1.` : "Read it off the columns: a 0 in each empty place.";
        return;
      }
      const f = num(this.vals.f), e = num(this.vals.e), wantE = sciL ? n : -n, okF = Math.abs(f - c / 10) < 1e-9;
      if (Number.isNaN(f) || Number.isNaN(e)) { this.msg = "Fill in both boxes."; return; }
      if (okF && e === wantE) { this.verdict = null; this.stage = "done"; this.typing = false; this.msg = null; return; }
      this.verdict = "wrong";
      const say = (box, m) => { this.active = box; this.msg = m; };
      if (sciL && e === n + 1) say("e", "Count only the digits after the first one: the first digit stays in front of the point.");
      else if (!sciL && e === n) say("e", "It's less than 1, so the power is negative.");
      else if (!(f >= 1 && f < 10)) say("f", "The front number has to be at least 1 and less than 10.");
      else if (!okF) say("f", "The front number is the digits as they stand now.");
      else say("e", `Count the places the digits moved: ${n}.`);
    },
    scene() {
      const st = this.stage, live = !!this.held, sr = Math.round(this.s), t = top0 + dir * (live ? this.s : sr);
      const say = {
        drag: back ? ["Drag the digits to make it a decimal.", "Each place right is ÷ 10."]
          : sciL ? [`Drag the digits right until only the ${sig[0]} is before the point.`, "The point stays put. 0s after the point fall away."]
          : [`Drag the digits left until the ${sig[0]} is before the point.`, "The faint 0s are empty places."],
        zeros: [`Tap each empty place before the ${sig[0]}.`, "A 0 holds its place."],
        write: [back ? "Write the decimal." : "Write it in scientific notation.", ""],
        done: [back ? `× 10${sup(-n)} is ÷ ${withCommas(10 ** n)}: ${n} places smaller.`
          : sciL ? `Moved ${n} places smaller, so × 10${sup(n)} puts it back.` : `Moved ${n} places bigger, so × 10${sup(-n)} puts it back.`, ""],
      }[st];
      // the columns: names over them, the point's line darker
      for (let p = hi; p >= lo; p--) text(`nm${p}`, placeName(p), mid(p), YN, "small", { c: "var(--ink3)" });
      for (let j = 0; j <= hi - lo + 1; j++) { const x = j * 5, isP = x === PX; line(`col${j}`, x, YT, x, YB, { c: isP ? "var(--ink2)" : "var(--ink3)", w: isP ? 1.5 : 1 }); }
      // the digits
      const doneC = st === "done" ? CH : null;
      const after = placeDigits("d", sig, zeros, t, YD, mid, { live, faint: !back, fallAt: this.fallAt, c: doneC, lo });
      // the empty places (back): dashed squares to tap, then 0s
      let zerosAfter = false;
      if (back && st !== "drag") for (const p of this.empties()) {
        if (st === "zeros" && !this.tapped.has(p)) rect(`zb${p}`, mid(p) - 1, YD - 1, 2, 2, { c: "var(--ink3)", dash: true });
        else { text(`z0${p}`, "0", mid(p), YD, "maths", { c: doneC }); if (p < 0) zerosAfter = true; }
      }
      dot("pt", PX, YD + 0.65, 0.2, { c: after || zerosAfter ? "var(--ink)" : "var(--ink3)", live: true });
      // the readout under the first digit while the finger moves them (or after a miss)
      if ((live || this.bad) && sr > 0) {
        const tr = top0 + dir * sr, x = Math.max(3, Math.min(W - 3, mid(Math.max(tr, lo))));
        lab(`ro${sr}${this.bad}`, `${movedBy(sr, op)} = ${placeStr(sig, tr)}`, "below", YB, x, "small", this.bad ? "var(--wrong)" : CH, { live: true });
      }
      // the record: forward, written once the digits have landed; back, the problem itself from the start
      let right = W, bottom = YB + 2;
      if (back || st === "write" || st === "done") {
        const done = st === "done";
        const toks = back
          ? [front, " × ", "10", { sup: -n }, " = ", done ? { t: ans, c: CH } : { box: "d", cells: ans.replace(".", "").length + 1, L: this }]
          : [given, " = ", done ? { t: front, c: CH } : { box: "f", cells: 2, L: this }, " × ", "10", done ? { sup: sciL ? n : -n, c: CH } : { box: "e", cells: sciL ? 1 : 2, sup: true, L: this }];
        const r = mrow("rec", toks, 0, YR);
        right = Math.max(right, r.w);
        if (done) block("next", 0, YR + 3, 10, "Next problem", "next");
        else if (st === "write") block("check", 0, YR + 3, 7, "Check", "check");
        bottom = YR + (st === "write" || done ? 5 : 1);
      }
      this.fr = { x: -2, y: -0.5, w: Math.max(46, right + 4), h: bottom + 1.5 };
      dhead(this, say[0], say[1], 0, 0, this.fr.w - 4);
    },
  });
  return L;
}

// ---------- Multiply and divide big numbers (g8-scicalc) ----------
// One square: a "× 10" is a chip 2 × 2. Each number is its front (36, a digit 2 squares, the point on the grid line
// after the ones) and its power drawn out as a row of chips; the two one above the other, the second's sign (× or +)
// at its left, or a bar between them for ÷; each named at its right end. Slide the bottom chips up: onto the end of
// the top row (×), onto the top chips to cancel in pairs (÷), or onto their partners (+, same power).
function lCalc(index, P0) {
  const P = P0 || genCalc(index), CH = "var(--chapter)", kind = P.kind;
  const YA = 10, YB = 16, CX = 10, OX = 2, YR = 22, cellMid = p => OX - 2 * p + 1, POINT = OX + 2;
  const a = P.a, b = kind === "add" ? P.a : P.b;
  const f1 = kind === "add" ? dec(P.c1, 1) : String(P.f1), f2 = kind === "add" ? dec(P.c2, 1) : String(P.f2);
  const prod = kind === "mul" ? P.f1 * P.f2 : 0, shift = prod >= 10;
  const q = kind === "div" ? P.f1 / P.f2 : 0, d = a - b, times = q * 10 ** d, sum = kind === "add" ? P.c1 + P.c2 : 0;
  const stages = kind === "mul" ? ["slide", "front", ...(shift ? ["shift"] : []), "write", "done"]
    : kind === "div" ? ["slide", "front", "pow", "times", "done"] : ["slide", "front", "done"];
  const maxChips = kind === "mul" ? a + b + (shift ? 1 : 0) : a, NX = Math.ceil((CX + 2 * maxChips + 3) / 5) * 5;
  const target = { x: kind === "mul" ? 2 * a : 0, y: YA - YB };
  const frontSig = s => s.replace(".", "").replace(/0+$/, ""), frontTop = s => s.split(".")[0].length - 1;
  const L = withBoxes({
    id: "scicalc", index, P, stage: "slide", msg: null, verdict: null, typing: false, fr: null,
    off: { x: 0, y: 0 }, held: null, landed: false, fs: 0, fheld: null, fbad: false, fallAt: 0,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return this.fr; },
    near() { return Math.abs(this.off.x - target.x) <= 2.5 && Math.abs(this.off.y - target.y) <= 2.5; },
    grab(q) {
      if (this.stage === "slide" && q.x >= CX - 0.5 && q.x <= CX + 2 * b + 0.5 && Math.abs(q.y - YB) <= 1.8) {
        this.held = { gx: q.x, gy: q.y }; this.msg = null; return true;
      }
      if (this.stage === "shift" && q.x >= -0.5 && q.x <= CX - 1 && Math.abs(q.y - YA) <= 2) {
        this.fheld = { gx: q.x, s0: this.fs }; this.fmax = 0; this.fbad = false; this.msg = null; return true;
      }
      return false;
    },
    drag(q) {
      if (this.held) this.off = { x: q.x - this.held.gx, y: q.y - this.held.gy };
      if (this.fheld) { this.fs = Math.max(0, Math.min(2, this.fheld.s0 + (q.x - this.fheld.gx) / 2)); this.fmax = Math.max(this.fmax, Math.abs(this.fs - this.fheld.s0)); }
    },
    release() {
      if (this.fheld) {
        const s = Math.round(this.fs); this.fs = s; this.fheld = null; this.fallAt = performance.now(); later(850, () => {});
        if (s === 1) { this.stage = "write"; this.typing = true; this.active = "fr"; return; }
        if (s === 0 && this.fmax < 0.3) return;
        this.fbad = s > 0;
        this.msg = s === 0 ? `${prod} has two digits before the point.` : `That's ${placeStr(frontSig(String(prod)), 1 - s)}: one digit goes before the point.`;
        return;
      }
      const h = this.held; this.held = null;
      if (!h) return;
      if (this.near()) { this.landed = true; this.off = { x: 0, y: 0 }; this.stage = "front"; this.typing = true; this.active = "p"; return; }
      if (Math.hypot(this.off.x, this.off.y) > 1) this.msg = kind === "mul" ? "Slide them onto the end of the top row." : "Slide them up onto the top ones.";
      this.off = { x: 0, y: 0 };
    },
    cancel() { this.held = null; this.fheld = null; this.off = { x: 0, y: 0 }; this.fs = Math.round(this.fs); },
    act(x) {
      if (boxAct(this, x)) return;
      if (x !== "check") return;
      const st = this.stage, ok = () => { this.verdict = null; this.msg = null; };
      const go = (next, box) => { ok(); this.stage = next; if (box) this.active = box; else this.typing = false; };
      if (st === "front") {
        const v = num(this.vals.p);
        if (Number.isNaN(v)) { this.msg = "Write it first."; return; }
        if (kind === "mul") {
          if (v === prod) return go(shift ? "shift" : "write", shift ? null : "pw");
          this.verdict = "wrong"; this.msg = `Multiply the fronts: ${f1} × ${f2}.`;
        } else if (kind === "div") {
          if (v === q) return go("pow", "d");
          this.verdict = "wrong"; this.msg = `Divide the fronts: ${f1} ÷ ${f2}.`;
        } else {
          if (Math.abs(v - sum / 10) < 1e-9) return go("done");
          this.verdict = "wrong"; this.msg = v === sum ? `Line up the points: ${f1} + ${f2}.` : `Add the fronts: ${f1} + ${f2}.`;
        }
      } else if (st === "write") {
        const fr = shift ? num(this.vals.fr) : prod, pw = num(this.vals.pw), want = a + b + (shift ? 1 : 0);
        if (Number.isNaN(fr) || Number.isNaN(pw)) { this.msg = shift ? "Fill in both boxes." : "Write the power first."; return; }
        if (Math.abs(fr - prod / (shift ? 10 : 1)) < 1e-9 && pw === want) return go("done");
        this.verdict = "wrong";
        const say = (box, m) => { this.active = box; this.msg = m; };
        if (shift && fr === prod) say("fr", `${prod} has two digits before the point.`);
        else if (shift && Math.abs(fr - prod / 10) > 1e-9) say("fr", "The front is the digits as they stand now.");
        else if (pw === a * b || pw === a * b + (shift ? 1 : 0)) say("pw", `Count the tens: ${a} and ${b} more is ${a + b}.` + (shift ? ` One more chip makes ${want}.` : ""));
        else if (shift && pw === a + b) say("pw", "A chip was added: count them again.");
        else say("pw", "Count the chips.");
      } else if (st === "pow") {
        const v = num(this.vals.d);
        if (Number.isNaN(v)) { this.msg = "Write it first."; return; }
        if (v === d) return go("times", "t");
        this.verdict = "wrong";
        this.msg = v === a + b ? "The tens cancel in pairs: take away, don't add." : "Count the chips that are left.";
      } else if (st === "times") {
        const v = num(this.vals.t);
        if (Number.isNaN(v)) { this.msg = "Write it first."; return; }
        if (v === times) return go("done");
        this.verdict = "wrong";
        this.msg = v === q * d ? `10${sup(d)} means ${d} tens multiplied, not ${d}.` : `${q} × 10${sup(d)} is ${q} with ${WORD[d]} 0${d > 1 ? "s" : ""} after it.`;
      }
    },
    scene() {
      const st = this.stage, live = !!this.held, after = this.landed, si = stages.indexOf(st);
      const past = s2 => si > stages.indexOf(s2);
      const say = {
        mul: { slide: ["Slide the bottom ×10s onto the end of the top row.", "Each chip is one × 10."], front: ["Multiply the fronts.", ""],
          shift: ["Make the front less than 10.", "Drag its digits one place right: that's one more × 10."], write: ["Write it in scientific notation.", ""],
          done: ["Fronts multiply and the tens add up.", ""] },
        div: { slide: ["How many times as big is the top number as the bottom one?", "Slide the bottom chips up onto the top ones."],
          front: ["Divide the fronts.", ""], pow: ["Write the tens that are left.", ""], times: ["Write it as one number.", ""],
          done: [`Fronts divide and the tens cancel: ${withCommas(times)} times as big.`, ""] },
        add: { slide: ["Slide the bottom ×10s up onto the top ones.", "Same power: every chip has a partner."], front: ["Add the fronts.", ""],
          done: ["Same power of 10, so the fronts add.", ""] },
      }[kind][st];
      // the fronts
      const used = kind === "mul" && past("front");
      if (used) {
        const sTop = 1 - (this.fheld ? this.fs : Math.round(this.fs)) - (shift ? 0 : 1);
        const aft = placeDigits("fA", frontSig(String(prod)), String(prod).length - frontSig(String(prod)).length, sTop, YA, cellMid,
          { live: !!this.fheld, faint: true, fallAt: this.fallAt, c: CH, lo: -2 });
        if (st === "shift" || aft) dot("fpt", POINT, YA + 0.65, 0.2, { c: aft ? "var(--ink)" : "var(--ink3)", live: true });
        if ((this.fheld || this.fbad) && Math.round(this.fs) > 0) {
          const s = Math.round(this.fs);
          lab(`fro${s}${this.fbad}`, `÷ ${10 ** s} = ${placeStr(frontSig(String(prod)), 1 - s)}`, "above", YA - 1.2, 0, "small", this.fbad ? "var(--wrong)" : CH, { live: true, anchor: "start" });
        }
      } else if (kind === "add" && st === "done") mrow("fA", [{ t: dec(sum, 1), c: CH }], OX, YA);
      else mrow("fA", [f1], OX - 2 * frontTop(f1), YA);
      const fadeB = used || (kind === "add" && st === "done") ? "var(--ink3)" : null;
      mrow("fB", [f2], OX - 2 * frontTop(f2), YB, { c: fadeB });
      if (kind === "mul") text("opB", "×", 1, YB, "maths", { c: fadeB });
      if (kind === "add") text("opB", "+", 1, YB, "maths", { c: fadeB });
      // the chips
      const nTop = kind === "mul" && after ? a + b + (shift && (st === "write" || st === "done") ? 1 : 0) : a;
      for (let i = 0; i < a; i++) {
        const gone = kind === "div" && after && i < b;
        tenChip(`A${i}${gone}${kind === "add" && after}`, CX + 2 * i, YA, { crossed: gone, c: gone ? "var(--ink3)" : null, tc: gone ? "var(--ink3)" : null,
          fill: kind === "add" && after ? "var(--tint)" : null, delay: 0.15 * i });
      }
      if (!after) {
        for (let j = 0; j < b; j++) tenChip(`B${j}${live ? "h" : ""}`, CX + 2 * j + this.off.x, YB + this.off.y, { live });
        if (live) {
          const nn = this.near() ? (kind === "mul" ? a + b : kind === "div" ? d : b) : b;
          lab(`hro${nn}${this.near()}`, `10${sup(nn)}`, "above", YB + this.off.y - 1.2, CX + b + this.off.x, "small", CH, { live: true });
        }
      } else if (kind === "mul") {
        for (let j = 0; j < b; j++) tenChip(`J${j}`, CX + 2 * (a + j), YA, {});
        if (nTop > a + b) tenChip("plus", CX + 2 * (a + b), YA, { c: CH, tc: CH });
        for (let i = 0; i < nTop; i++) lab(`cnt${i}`, i + 1, "above", YA - 1, CX + 2 * i + 1, "small", CH, { delay: i < a ? 0 : i < a + b ? 0.25 * (i - a + 1) : 0.3 });
        bracket("br", CX, CX + 2 * nTop, YA + 1.9, { c: CH });
        mrow(`brn${nTop}`, ["10", { sup: nTop }], CX + nTop - 2.3, YA + 3.2, { c: CH });
      } else if (kind === "div") {
        if (d > 0) lab(`left${d}`, `10${sup(d)} left`, "above", YA - 1, CX + 2 * b + d, "small", CH, { delay: 0.15 * b + 0.2 });
      }
      if (kind === "div") line("bar", 0, (YA + YB) / 2, NX + 12, (YA + YB) / 2);
      // the names at the right ends
      const nA = mrow("nA", [f1, " × ", "10", { sup: a }], NX, YA), nB = mrow("nB", [f2, " × ", "10", { sup: b }], NX, YB);
      let right = NX + Math.max(nA.w, nB.w);
      // the record
      let y = YR, w = 0;
      const box = (id, cells, o = {}) => ({ box: id, cells, L: this, ...o });
      const lines = [];
      if (si >= 1) {
        if (kind === "mul") lines.push([f1, " × ", f2, " = ", past("front") ? { t: String(prod), c: CH } : box("p", 2)]);
        if (kind === "div") lines.push([f1, " ÷ ", f2, " = ", past("front") ? { t: String(q), c: CH } : box("p", 1)]);
        if (kind === "add") lines.push([f1, " + ", f2, " = ", st === "done" ? { t: dec(sum, 1), c: CH } : box("p", 2)]);
      }
      if (kind === "mul" && (st === "write" || st === "done")) {
        const done = st === "done", want = a + b + (shift ? 1 : 0);
        const pwT = done ? { sup: want, c: CH } : box("pw", 2, { sup: true });
        lines.push(shift ? [String(prod), " × ", "10", { sup: a + b }, " = ", done ? { t: dec(prod, 1), c: CH } : box("fr", 2), " × ", "10", pwT] : [String(prod), " × ", "10", pwT]);
      }
      if (kind === "div" && si >= 2) lines.push(["10", { sup: a }, " ÷ ", "10", { sup: b }, " = ", "10", past("pow") ? { sup: d, c: CH } : box("d", 1, { sup: true })]);
      if (kind === "div" && si >= 3) lines.push([String(q), " × ", "10", { sup: d }, " = ", st === "done" ? { t: String(times), c: CH } : box("t", String(times).length + 1)]);
      if (kind === "add" && st === "done") lines.push([{ t: dec(sum, 1), c: CH }, { t: " × ", c: CH }, { t: "10", c: CH }, { sup: a, c: CH }]);
      lines.forEach((tk, i) => { w = Math.max(w, mrow(`rec${i}`, tk, 0, y).w); y += 4; });
      let bottom = YB + 2;
      if (lines.length) {
        const yb = y - 4 + 3;
        if (st === "done") block("next", 0, yb, 10, "Next problem", "next"); else block("check", 0, yb, 7, "Check", "check");
        bottom = yb + 2;
      }
      right = Math.max(right, w);
      this.fr = { x: -2, y: -0.5, w: Math.max(50, right + 4), h: bottom + 1.5 };
      dhead(this, say[0], say[1], 0, 0, this.fr.w - 4);
    },
  });
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  sci: { name: "Scientific notation", make: (i, P) => lPlace("sci", i, P), gen: genSci },
  small: { name: "Small numbers", make: (i, P) => lPlace("small", i, P), gen: genSmall },
  scicalc: { name: "Multiply and divide big numbers", make: lCalc, gen: genCalc },
};
const IDX = {};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
// start(id, index, problem): problem is optional (the test driver passes one to see a given case)
function start(id, index, P) {
  id = String(id || "").replace(/^g8-/, "");
  if (!LESSONS[id]) id = "sci";
  if (index != null) IDX[id] = index;
  token++;
  lesson = LESSONS[id].make(IDX[id] || 0, P);
  document.body.className = "numbers";
  pick.value = id;
  drawn = new Set(); keys.blur(); keys.value = "";
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g8ch2-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value);
document.getElementById("fresh").onclick = () => leave();
function leave() {
  const go = () => { IDX[lesson.id] = (IDX[lesson.id] || 0) + 1; start(lesson.id); };
  if (lesson.leave) lesson.leave(go); else go();
}
let first = "sci", firstI = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g8ch2-lesson") || "sci";
  firstI = +(u.get("i") || 0);
  if (u.get("theme")) document.documentElement.dataset.theme = u.get("theme");
} catch (err) {}
start(first, firstI);
