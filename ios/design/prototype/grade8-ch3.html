<title>8th Grade: Lines and Slope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). iPad landscape only.
   Chapter colour: grade8.md names none, so this chapter (the plane: one unit is one square) uses the kit's blue, the
   colour of 6th grade's plane (Points in four quadrants) and 7th grade's lines. */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #4F63D9; --tint: rgba(79, 99, 217, .22); --tint-strong: rgba(79, 99, 217, .42);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
/* a unit cube's faces: the chapter colour mixed into the paper, opaque so cubes in front hide cubes behind */
:root { --cube-top: color-mix(in srgb, var(--chapter) 18%, var(--paper)); --cube-front: color-mix(in srgb, var(--chapter) 34%, var(--paper));
  --cube-side: color-mix(in srgb, var(--chapter) 52%, var(--paper)); --cube-edge: color-mix(in srgb, var(--chapter) 70%, var(--ink)); }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none; margin: 0;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
/* 0s that pass the point fall away */
.out-fall { animation: fall .75s ease-in forwards; transform-box: fill-box; }
@keyframes fall { from { opacity: 1; } to { opacity: 0; transform: translateY(36px); } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--tint)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const isqrt = n => { let r = Math.floor(Math.sqrt(n)); while (r * r > n) r--; while ((r + 1) * (r + 1) <= n) r++; return r; };
const isSquare = n => isqrt(n) ** 2 === n;
// an integer read with `places` decimals, trailing zeros dropped: (2916, 2) → "29.16", (500, 2) → "5"
function dec(v, places) {
  const s = String(v).padStart(places + 1, "0"), w = s.slice(0, s.length - places), f = s.slice(s.length - places).replace(/0+$/, "");
  return f ? `${w}.${f}` : w;
}
const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹", "-": "⁻" };
const sup = n => String(n).split("").map(c => SUP[c] || c).join("");

let items = [], drawn = new Set();
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in, and an
// optional delay (a count that runs on). UP: what's put now faces the child (drawn over the tilting paper, never tilted)
let UP = false;
function put(k, tag, a, kind = "fade", text, delay) { items.push({ k, tag, a, kind, text, up: UP, delay }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay);
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: 1,
    "stroke-dasharray": o.dash ? "0.03 0.03" : null }, o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay);
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, "stroke-dasharray": o.dash ? "6 6" : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null }, o.live ? "none" : o.c && !o.fill && !o.dash ? "line" : "fade", undefined, o.delay);
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade", undefined, o.delay); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s, o.delay);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c, live: o.live }); continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c, live: o.live }); col += 2;
  }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// a label's ink half a square from the edge it labels
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c, o = {}) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c, ...o });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c, ...o });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end", ...o });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start", ...o });
}
// an answer box in the record: cells of 2 squares, what's typed lined up on the right (or centred), the cursor after it
function dbox(k, x, y, cells, value, state, actName, centred = false) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null, v = String(value || "").replace("-", "−");
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (v) {
    if (centred) text(`${k}v`, v, x + cells, y + 1, "maths", { c: vc, live: true });
    else digits(`${k}v${v}`, v, x + cells * 2, y + 1, { c: vc, live: true });
  }
  if (state === "active") {
    const cx = centred ? x + cells + (v ? v.length * 0.31 : 0) + 0.25 : x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// a line of maths laid on the grid (names and the record): a character 2 squares, a space 1, a superscript 1 square a
// character in small type, an answer box 2 squares a cell (raised for an exponent), a fraction as a column with its bar
// on the row's middle, a root with its bar over the number. Returns its width and where each part sits.
// draw = false only measures. Tokens: "x² · " strings, {t, c} coloured text, {sup}, {box, cells, sup, L}, {frac: [top, bottom]},
// {root, idx}.
function mrow(k, toks, x, y, o = {}, draw = true) {
  let cx = x; const at = {};
  toks.forEach((t, i) => {
    if (t == null) return;
    const kk = `${k}.${i}`, x0 = cx, c = (t && t.c) || o.c;
    const T = (key, s, px, py, cls, col) => { if (draw) text(key, s, px, py, cls, { c: col, live: o.live }); };
    if (typeof t !== "object" || t.t != null) {
      for (const ch of String(typeof t === "object" ? t.t : t)) {
        if (ch === " ") cx += 1;
        else if (ch === "." || ch === ",") T(`${kk}p${ch}${cx}`, ch, cx, y, "maths", c);
        else { T(`${kk}${ch}${cx}`, ch, cx + 1, y, "maths", c); cx += 2; }
      }
    } else if (t.word != null) {
      // a word in the record (slope, table:) is written as a word, not a letter a square
      if (draw) text(`${kk}w${t.word}${cx}`, t.word, cx, y, "maths", { anchor: "start", c, live: o.live });
      cx += Math.ceil(t.word.length * 0.95);
    } else if (t.box) {
      const typed = String(t.L.vals[t.box] || ""), tight = typed.includes(".");
      const cells = Math.max(t.cells || 1, tight ? Math.ceil((typed.length + 1) / 2) : typed.length);
      if (draw) dbox(`${k}b${t.box}`, cx, t.sup ? y - 2 : y - 1, cells, typed, boxState(t.L, t.box), `box:${t.box}`, tight || !!t.centred);
      cx += cells * 2;
    } else if (t.sup != null) {
      // an exponent hugs its base: its first character starts in the base's last square
      const chs = String(t.sup).replace("-", "−"); cx -= 0.7;
      for (const ch of chs) { T(`${kk}s${ch}${cx}`, ch, cx + 0.5, y - 0.9, "small", c || "var(--ink)"); cx += 1; }
      cx += 0.7;
    } else if (t.frac) {
      const wt = mrow("", t.frac[0], 0, 0, o, false).w, wb = mrow("", t.frac[1], 0, 0, o, false).w, W = Math.max(wt, wb) + 2;
      if (draw) {
        mrow(kk + "t", t.frac[0], cx + (W - wt) / 2, y - 1, { ...o, c });
        line(`${kk}bar`, cx, y, cx + W, y, { c: c || "var(--ink)" });
        mrow(kk + "b", t.frac[1], cx + (W - wb) / 2, y + (t.frac[1].some(u => u && u.sup != null && !u.box) ? 1.7 : 1), { ...o, c });
      }
      cx += W;
    } else if (t.root != null) {
      const s = String(t.root), w = s.length * 2;
      if (draw) {
        path(`${kk}rad${s}`, `M${sq(cx + 0.2)} ${sq(y + 0.15)}L${sq(cx + 0.65)} ${sq(y - 0.1)}L${sq(cx + 1.15)} ${sq(y + 0.9)}L${sq(cx + 1.8)} ${sq(y - 1.2)}H${sq(cx + 2.2 + w)}`, { c: c || "var(--ink)" });
        if (t.idx) T(`${kk}ri`, t.idx, cx + 0.75, y - 0.75, "small", c || "var(--ink)");
        mrow(kk + "rd", [s], cx + 2, y, { ...o, c });
      }
      cx += 2 + w;
    }
    at[t.id || t.box || i] = { x: x0, w: cx - x0 };
  });
  return { w: cx - x, at };
}
// what to do on the rows above the picture: one line, and a small second line (or what a miss says, in red)
function dhead(L, say, sub, x = 0, y = 0, width = 60) {
  const n = words(`say-${say}`, say, x, y + 1, width);
  const y2 = y + 1 + 2 * n + 0.3;
  if (L.msg) words(`msg-${L.msg}`, L.msg, x, y2, width, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, x, y2, width, "small");
}
// lessons with answer boxes: each box has its own value; the hidden input types into the active one
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; L.verdict = null; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];
const num = s => s === "" || s == null ? NaN : +String(s).replace("−", "-");
// the first problems of a run are the friendly ones: the smallest of six draws (the web's withEasyStart)
function easyStart(i, draw, size) {
  let best = draw();
  if (i >= 3) return best;
  for (let k = 1; k < 6; k++) { const p = draw(); if (size(p) < size(best)) best = p; }
  return best;
}

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none" && it.kind !== "fall", a = { ...it.a };
    if (it.kind === "fall") { a.class = ((a.class || "") + " out-fall").trim(); a.style = `animation-delay:${(it.delay || 0).toFixed(3)}s;`; }
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      const d = it.delay != null ? it.delay : Math.min(n++ * 0.035, 1.2);
      a.style = `animation-delay:${d.toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  const m = lesson.paperMatrix && lesson.paperMatrix();
  if (m) document.getElementById("paperg").setAttribute("transform", `matrix(${m.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  // a lesson that's moving (the paper tilting, cubes rising) draws again next frame
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.25x. The frame's top row sits at the top
// of the screen (the words on rows 0–2), centred across; no empty band above the paper.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 24, bottom = 110;
  const s = Math.min((W - 64) / sq(f.w), (H - top - bottom - 16) / sq(f.h), 1.25);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { camTo = null; Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/−/g, "-").replace(/[^0-9.\-]/g, "").slice(0, 10)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, press, drag (on the lesson's picture) or pan the paper; mouse and touch alike ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); afterHand(); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) afterHand();
});
svg.addEventListener("pointercancel", () => { if (down && down.grabbed && lesson.cancel) lesson.cancel(); down = null; render(); });
function afterHand() { render(); frame(lesson.frame()); if (lesson.typing) openKeys(); }
function act(a) {
  if (a === "next") { leave(); return; }
  if (a === "type") { openKeys(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}

// ---------- the hand moves (each built once, for this chapter and the ones after) ----------
// Drag a square's corner: a square from (x0, y0), k squares a unit, its far corner snapped to whole units; it stays a
// square (the side is the farther of the finger's two distances). Returns the live side in units.
const cornerSide = (q, x0, y0, k, max) => Math.max(1, Math.min(max, Math.max(q.x - x0, q.y - y0) / k));
// A unit square's inside: its unit lines, every fifth one bold (as Multiply two-digit numbers bolds its tens)
function unitGrid(k, x0, y0, m, kk, c = "var(--ink3)", live = false) {
  for (let i = 1; i < m; i++) {
    const bold = i % 5 === 0, o = { c: bold ? "var(--ink2)" : c, w: bold ? 1.5 : 1, live };
    line(`${k}v${i}_${m}${kk}`, x0 + i * kk, y0, x0 + i * kk, y0 + m * kk, o);
    line(`${k}h${i}_${m}${kk}`, x0, y0 + i * kk, x0 + m * kk, y0 + i * kk, o);
  }
}
// A chip: an x (or what it stands for) in a 4 × 4 outline, crossed out when it cancels
function chip(k, x, y, label, o = {}) {
  if (o.lit) rect(`${k}f`, x, y, 4, 4, { fill: "var(--tint)", live: o.live });
  rect(`${k}o`, x, y, 4, 4, { c: o.c || "var(--ink)", live: o.live });
  text(`${k}t${label}`, label, x + 2, y + 2, "maths", { c: o.tc, live: o.live });
  if (o.crossed) line(`${k}x`, x + 0.5, y + 3.5, x + 3.5, y + 0.5, { c: "var(--chapter)", delay: o.delay });
}
// A bracket under (or over) a run of things, its ends turned up
const bracket = (k, x0, x1, y, o = {}) => path(k, `M${sq(x0)} ${sq(y - 0.6)}V${sq(y)}H${sq(x1)}V${sq(y - 0.6)}`, o);
// A line that opens: a number line from x0 to x0 + 50, one block a step, its labels below; a tick a block
const numberLine = (k, y, labels, o = {}) => {
  line(`${k}l`, 0, y, 50, y);
  for (let j = 0; j <= 10; j++) {
    line(`${k}t${j}`, j * 5, y - (j % 10 === 0 ? 1.5 : 1), j * 5, y);
    if (labels[j] != null) lab(`${k}n${j}${labels[j]}${o.lit === j}`, labels[j], "below", y, j * 5, "small", o.lit === j ? "var(--chapter)" : null);
  }
};

// ---------- the 3D paper (Unit cubes, as paper-lessons.html's Volume of a box draws it) ----------
// The paper turns and tips back about a point (no perspective in this preview: the app's long lens is RealityKit's);
// cubes stand on it and words stay upright. t is 0 flat, 1 tilted.
const PHI = 28 * Math.PI / 180, THETA = 52 * Math.PI / 180;
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
function tilter(L) {
  Object.assign(L, { tiltFrom: 0, tiltTo: 0, tiltAt: -1e9, piv: { x: 0, y: 0 } });
  L.t = function () { const u = Math.min(1, (performance.now() - this.tiltAt) / 1100); return this.tiltFrom + (this.tiltTo - this.tiltFrom) * ease(Math.max(0, u)); };
  L.tiltTo1 = function (to, after) { this.tiltFrom = this.t(); this.tiltTo = to; this.tiltAt = performance.now(); if (after) later(1150, after); };
  L.proj = function (x, y, z, t = this.t()) {
    const f = PHI * t, th = THETA * t, c = Math.cos(f), s = Math.sin(f), dx = x - this.piv.x, dy = y - this.piv.y;
    return { x: this.piv.x + c * dx - s * dy, y: this.piv.y + (s * dx + c * dy) * Math.cos(th) - z * Math.sin(th) };
  };
  L.paperMatrix = function () {
    const t = this.t(); if (t <= 0.001) return null;
    const f = PHI * t, th = THETA * t, c = Math.cos(f), s = Math.sin(f), a = c, b = s * Math.cos(th), cc = -s, d = c * Math.cos(th);
    const px = sq(this.piv.x), py = sq(this.piv.y);
    return [a, b, cc, d, px - (a * px + cc * py), py - (b * px + d * py)];
  };
  // a box's bounds as seen at tilt t
  L.bounds = function (x0, y0, x1, y1, z1, t) {
    let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
    for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [0, z1]) {
      const q = this.proj(x, y, z, t); a = Math.min(a, q.x); b = Math.min(b, q.y); c = Math.max(c, q.x); d = Math.max(d, q.y);
    }
    return { x0: a, y0: b, x1: c, y1: d };
  };
  return L;
}
// unit cubes (one block each) standing on the tilted paper, drawn back to front; each rises over 0.4 s from its time
function drawCubes(L, list, t) {
  const f = PHI * t, th = THETA * t, B = 5, now = performance.now(), cubes = [];
  const corner = (x, y, z) => { const q = L.proj(x, y, z, t); return `${sq(q.x)},${sq(q.y)}`; };
  for (const c of list) {
    const h = ease(Math.max(0, Math.min(1, (now - c.at) / 400)));
    if (h <= 0) continue;
    const cx = c.x + B / 2 - L.piv.x, cy = c.y + B / 2 - L.piv.y, zc = (c.k + h / 2) * B;
    cubes.push({ ...c, h, d: (cx * Math.sin(f) + cy * Math.cos(f)) * Math.sin(th) + zc * Math.cos(th) });
  }
  cubes.sort((p, q) => p.d - q.d);
  for (const c of cubes) {
    const x0 = c.x, x1 = x0 + B, y0 = c.y, y1 = y0 + B, z0 = c.k * B, z1 = (c.k + c.h) * B, id = `${x0}_${y0}_${c.k}`;
    const face = (n, pts, fill) => put(`${n}${id}`, "polygon", { points: pts.map(p => corner(...p)).join(" "), fill, stroke: "var(--cube-edge)", "stroke-width": 1.5, "stroke-linejoin": "round" }, "none");
    face("top", [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], "var(--cube-top)");
    face("front", [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], "var(--cube-front)");
    face("side", [[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], "var(--cube-side)");
  }
}
// timers for the See beats; a new problem cancels the old one's
let token = 0;
function later(ms, fn) { const t = token; setTimeout(() => { if (t !== token) return; fn(); render(); frame(lesson.frame()); }, ms); }

// ---------- the plane (chapter 3: one unit is one square, so the paper is the plane) ----------
// The origin sits on a strong-line crossing at paper (0, 0); the point (u, v) is paper square (u, −v). Every strong
// line is a 5, numbered small along the axes; the axes run to the screen's edges (what the camera shows, less the
// words' rows and the side column that holds the table, the readout and the record).
const fmt = n => String(n).replace("-", "−");
const pair = (u, v) => `(${fmt(u)}, ${fmt(v)})`;
const par = n => n < 0 ? `(${fmt(n)})` : String(n);           // a negative number after an operator, in brackets
const nz = (a, b) => { let v; do v = rnd(a, b); while (!v); return v; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const near = (q, u, v, r = 1.6) => Math.hypot(q.x - u, q.y + v) < r;
const snapP = q => ({ u: Math.round(q.x), v: Math.round(-q.y) });
const inBox = (p, b) => p.u >= b.u0 && p.u <= b.u1 && p.v >= b.v0 && p.v <= b.v1;
const clampBox = (p, b) => ({ u: clamp(p.u, Math.ceil(b.u0), Math.floor(b.u1)), v: clamp(p.v, Math.ceil(b.v0), Math.floor(b.v1)) });
const onLine = (p, k, s) => p.v === s + k * p.u;
// what the camera shows of the paper for a frame, in squares (its bottom less the pill)
function viewOf(fr) { const t = fitTo(fr); return { x0: t.x / SQ, x1: (t.x + innerWidth / t.s) / SQ, y0: t.y / SQ, y1: (t.y + (innerHeight - 100) / t.s) / SQ }; }
// A plane lesson's layout, from its picture's bounds b (units, the 3 squares around its points included) and its side
// column (colW × colH squares, left or right of the picture, on a strong line): the words' top row T (the picture's top
// on row T + 6), the frame (all of it, centred on it), the view, and the plane's box (units) the axes and lines run to.
function planeLayout(b, colW, colH, side, wNow = colW) {
  const T = Math.floor(-b.v1) - 6;
  const colX = side === "left" ? Math.floor((b.u0 - 2 - colW) / 5) * 5 : Math.ceil((b.u1 + 2) / 5) * 5;
  const x0 = side === "left" ? colX + colW - wNow : b.u0, x1 = side === "left" ? b.u1 : colX + wNow;
  const bottom = Math.max(-b.v0, T + 6 + colH), w = Math.max(46, Math.ceil(x1 - x0) + 4);
  const fr = { x: Math.round((x0 + x1) / 2 - w / 2), y: T - 0.5, w, h: bottom - T + 1.5 };
  const V = viewOf(fr);
  const box = side === "left" ? { u0: 0, u1: Math.floor(V.x1) - 1, v0: 0, v1: -(T + 6) }
    : { u0: Math.ceil(V.x0) + 1, u1: colX - 2, v0: -(Math.floor(V.y1) - 1), v1: -(T + 6) };
  return { T, colX, colY: T + 6, fr, V, box };
}
// The axes through the origin across the box, arrowheads at their ends, every strong line numbered small (but not
// under a point's name: skip), a story's names at the far ends.
function axes(k, bx, o = {}) {
  const head = (kk, x, y, dx, dy) => path(kk, `M${sq(x - 0.8 * dx + 0.8 * dy)} ${sq(y - 0.8 * dy + 0.8 * dx)}L${sq(x)} ${sq(y)}L${sq(x - 0.8 * dx - 0.8 * dy)} ${sq(y - 0.8 * dy - 0.8 * dx)}`);
  const skip = o.skip || (() => false);
  bx = { ...bx, u0: bx.u0 < 0 && bx.u0 > -3 ? 0 : bx.u0, v0: bx.v0 < 0 && bx.v0 > -3 ? 0 : bx.v0 };
  if (bx.v0 <= 0 && bx.v1 >= 0) {
    line(`${k}x`, bx.u0, 0, bx.u1, 0);
    head(`${k}xa`, bx.u1, 0, 1, 0); if (bx.u0 < 0) head(`${k}xb`, bx.u0, 0, -1, 0);
    for (let n = Math.ceil((bx.u0 + 1.5) / 5) * 5; n <= bx.u1 - 1.5; n += 5) if (n && !skip(n, -0.85, false)) lab(`${k}xn${n}`, fmt(n), "below", 0, n);
  }
  if (bx.u0 <= 0 && bx.u1 >= 0) {
    line(`${k}y`, 0, -bx.v0, 0, -bx.v1);
    head(`${k}ya`, 0, -bx.v1, 0, -1); if (bx.v0 < 0) head(`${k}yb`, 0, -bx.v0, 0, 1);
    for (let n = Math.ceil((bx.v0 + 1.5) / 5) * 5; n <= bx.v1 - 1.5; n += 5) if (n && !skip(-1.2, n, true)) lab(`${k}yn${n}`, fmt(n), "left", 0, -n);
  }
  if (inBox({ u: 0, v: 0 }, bx) && !skip(-0.6, -0.85)) text(`${k}o`, "0", -0.5, 0.85, "small", { anchor: "end" });
  if (o.names) {
    text(`${k}nx${o.names[0]}`, o.names[0], bx.u1 - 1, -0.95, "small", { anchor: "end" });
    text(`${k}ny${o.names[1]}`, o.names[1], 0.9, -bx.v1 + 0.6, "small", { anchor: "start" });
  }
}
// a skip test for the axes' numbers: none within reach of these names (each { u, v, w }: its left end, row, width)
const skipNear = (names, lines = []) => (u, v, y) => names.some(n => u > n.u - 2 && u < n.u + n.w + 1.5 && Math.abs(v - n.v) < 1.6)
  || lines.some(l => y ? Math.abs(l.p.u + (v - l.p.v) / l.m - u) < 1.4 : Math.abs(l.p.v + l.m * (u - l.p.u) - v) < 1.1);
// the part of the line through a and b (units) inside the box
function clipLine(a, b, bx) {
  const du = b.u - a.u, dv = b.v - a.v; let t0 = -1e9, t1 = 1e9;
  for (const [p, q0, lo, hi] of [[du, a.u, bx.u0, bx.u1], [dv, a.v, bx.v0, bx.v1]]) {
    if (Math.abs(p) < 1e-9) { if (q0 < lo || q0 > hi) return null; continue; }
    let ta = (lo - q0) / p, tb = (hi - q0) / p; if (ta > tb) [ta, tb] = [tb, ta];
    t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
  }
  return t0 < t1 ? [{ u: a.u + du * t0, v: a.v + dv * t0 }, { u: a.u + du * t1, v: a.v + dv * t1 }] : null;
}
function lineThrough(k, a, b, bx, o = {}) { const s = clipLine(a, b, bx); if (s) line(k, s[0].u, -s[0].v, s[1].u, -s[1].v, o); }
// a point: a dot a square across on a crossing; its name half a square off it
const pt = (k, u, v, o = {}) => dot(k, u, -v, o.r || 0.5, { c: o.c || "var(--ink)", live: o.live });
const ptName = (k, u, v, side, o = {}) => text(k, pair(u, v), u + (side === "left" ? -1 : 1), -v + (o.dy || 0), "small", { anchor: side === "left" ? "end" : "start", c: o.c });
const nameW = s => s.length * 0.52;
// the readout of the hand move now: beside the picture, at the top of the side column (28, the chapter colour)
const readout = (s, x, y) => { if (s) text(`ro${s}`, s, x, y, "say", { anchor: "start", c: "var(--chapter)", live: true }); };

// ---------- the hand moves new in this chapter (each built once, for the chapters after) ----------
// Place a point: tap or drag to a crossing; it snaps; readout (3, 12).
// Draw the step: from a point, across then up or down, each leg on whole squares, in the chapter colour; readout
// "3 across · 12 up".
function legs(k, u, v, a, b, o = {}) {
  const c = o.c || "var(--chapter)";
  if (a) line(`${k}a${u}_${v}_${a}`, u, -v, u + a, -v, { c, live: o.live });
  if (b) line(`${k}b${u}_${v}_${a}_${b}`, u + a, -v, u + a, -(v + b), { c, live: o.live });
}
const stepWords = (a, b) => `${Math.abs(a)} ${a < 0 ? "back" : "across"} · ${Math.abs(b)} ${b < 0 ? "down" : "up"}`;
// Lay a line: a line through two round handles; a handle drags to any crossing and the line pivots through it;
// readout its slope, rise/run in lowest terms.
function slopeOf(a, b) {
  const du = b.u - a.u, dv = b.v - a.v; if (!du) return "straight up";
  const g = gcd(Math.abs(dv), Math.abs(du)), n = dv / g * Math.sign(du), d = Math.abs(du) / g;
  return `slope ${fmt(n)}${d === 1 ? "" : "/" + d}`;
}
const handle = (k, p, held) => dot(k, p.u, -p.v, held ? 0.75 : 0.55, { c: "var(--chapter)", live: true });
// Hop along a line (Dividing by a decimal's hops, now on the plane): each hop 1 across and the slope up or down, an
// arc from crossing to crossing on the side away from `away` (the slope's step), a small dot where it lands.
function hopArc(k, a, b, away, o = {}) {
  const x1 = a.u, y1 = -a.v, x2 = b.u, y2 = -b.v, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  let nx = dy / len, ny = -dx / len;
  if (away && nx * (away.u - mx) + ny * (-away.v - my) > 0) { nx = -nx; ny = -ny; }
  path(k, `M${sq(x1)} ${sq(y1)}Q${sq(mx + 1.1 * nx)} ${sq(my + 1.1 * ny)} ${sq(x2)} ${sq(y2)}`, { c: "var(--chapter)", live: o.live });
  dot(`${k}d`, x2, y2, 0.25, { live: o.live });
}
// A table: two columns 6 squares wide, rows 3 tall, the names over them (20), the numbers 28; lit rows in the colour
function table(k, x, y, names, rows, lit) {
  const H = 3 * (rows.length + 1);
  rect(`${k}o${rows.length}`, x, y, 12, H, { c: "var(--ink)" });
  line(`${k}m`, x + 6, y, x + 6, y + H);
  for (let r = 1; r <= rows.length; r++) line(`${k}h${r}`, x, y + 3 * r, x + 12, y + 3 * r);
  names.forEach((n, j) => text(`${k}n${j}${n}`, n, x + 3 + 6 * j, y + 1.5, "small"));
  rows.forEach((r, i) => [r.u, r.v].forEach((n, j) => text(`${k}r${i}_${j}_${n}${!!lit(i)}`, fmt(n), x + 3 + 6 * j, y + 3 * i + 4.5, "say", { c: lit(i) ? "var(--chapter)" : null })));
  return H;
}
// the record in the side column: maths rows 4 apart from row y (a row may carry a small word at its right end), then
// Check (or Next problem) 3 under the last; returns the bottom
function record(rowsT, x, y, st) {
  rowsT.forEach((t, i) => {
    if (t.say) { text(`recs${i}${t.say}`, t.say, x, y + 4 * i, "say", { anchor: "start", c: "var(--chapter)" }); return; }
    const r = mrow(`rec${i}`, t.toks || t, x, y + 4 * i);
    if (t.word) text(`recw${i}${t.word}`, t.word, x + r.w + 1, y + 4 * i, "small", { anchor: "start" });
  });
  const yb = y + 4 * (rowsT.length - 1) + 3;
  if (st === "done") block("next", x, yb, 10, "Next problem", "next"); else if (st !== "none") block("check", x, yb, 7, "Check", "check");
  return yb + 2;
}
const recWidth = rowsT => Math.max(...rowsT.map(t => t.say ? t.say.length * 0.72 : mrow("", t.toks || t, 0, 0, {}, false).w + (t.word ? nameW(t.word) + 1.5 : 0)));

// ---------- the problems (fresh numbers, easy first by index) ----------
// Unit rate is the slope (new): rate k 2–6 (the first three 2–3), three different hours 1–5 in the table, so miles stay
// within 30; the story's own pair is one of the rows (hours 2–5, so it isn't the unit rate already).
const STORY = [
  { x: "hours", y: "miles", x1: "hour", y1: "mile", say: (y, x) => `A bike goes ${y} miles in ${x} hours.`, per: "miles per hour" },
  { x: "minutes", y: "pages", x1: "minute", y1: "page", say: (y, x) => `Mia reads ${y} pages in ${x} minutes.`, per: "pages per minute" },
  { x: "pounds", y: "dollars", x1: "pound", y1: "dollar", say: (y, x) => `${x} pounds of apples cost ${y} dollars.`, per: "dollars per pound" },
];
function genRate(i) {
  const k = i < 3 ? rnd(2, 3) : rnd(2, 6), x0 = rnd(2, 5), xs = [x0];
  while (xs.length < 3) { const x = rnd(1, 5); if (!xs.includes(x)) xs.push(x); }
  return { k, x0, xs: xs.sort((a, b) => a - b), s: rnd(0, STORY.length - 1) };
}
// Slope from two points (the web's g8-slope): x1 −5..5, run 1..5, slope ±1..4, y1 −6..6; the first three the smallest
// of six, sized as the web sizes them (the points' numbers plus the rise, run and slope).
function genSlope(i) {
  return easyStart(i, () => { const x1 = rnd(-5, 5), run = rnd(1, 5), m = nz(-4, 4), y1 = rnd(-6, 6); return { x1, y1, x2: x1 + run, y2: y1 + m * run, m }; },
    p => Math.abs(p.x1) + Math.abs(p.y1) + Math.abs(p.x2) + Math.abs(p.y2) + Math.abs(p.y2 - p.y1) + (p.x2 - p.x1) + Math.abs(p.m));
}
// Slope-intercept form (the web's g8-intercept): m ±1..5, x0 ±1..5, y0 −10..10, b = y0 − m·x0; the first three the
// smallest of six (the shown slope and point, and the answers m·x0, b, m, b).
function genIntercept(i) {
  return easyStart(i, () => { const m = nz(-5, 5), x0 = nz(-5, 5), y0 = rnd(-10, 10); return { m, x0, y0, b: y0 - m * x0 }; },
    p => 2 * Math.abs(p.m) + Math.abs(p.x0) + Math.abs(p.y0) + Math.abs(p.m * p.x0) + 2 * Math.abs(p.b));
}

// ---------- Unit rate is the slope (g8-rate) ----------

// ---------- Slope from two points (g8-slope) ----------

        see: ["It lands on the y-axis: that dot is b.", "The line runs through b and the point."],
        b: ["Write b.", ""],
        line: ["Write the line.", ""],
        done: [`${n} ${n === 1 ? "step" : "steps"} back to the y-axis ${b < y0 ? "drop" : "climb"} ${Math.abs(mx)}, so the line crosses at ${fmt(b)}.`, ""],
      }[st];
      dhead(this, say[0], say[1], lay.fr.x + 2, T, Math.min(60, lay.V.x1 - lay.fr.x - 4));
      const names = [{ u: sg > 0 ? x0 : x0 - nameW(nm), v: y0 - nameDy, w: nameW(nm) }];
      if (landed) names.push({ u: -2.5, v: b, w: 2.5 });
      axes("ax", box, { skip: skipNear(names, [{ p: { u: x0, v: y0 }, m }]) });
      if (landed) lineThrough("ln", { u: 0, v: b }, { u: x0, v: y0 }, box, { c: done ? CH : "var(--ink2)" });
      // the point, its name, and the slope as one small step at it
      pt("p", x0, y0);
      text("pn", nm, x0, -y0 + nameDy, "small", { anchor: sg > 0 ? "start" : "end" });
      legs("sl", x0, y0, sg, sg * m, { c: "var(--ink)" });
      text("sln", sl, tip.u + sg * 0.5, -(y0 + sg * m / 2), "small", { anchor: sg > 0 ? "start" : "end" });
      // the hops
      const shownHops = this.live != null ? Math.max(this.live, this.hops) : this.hops;
      for (let h = 1; h <= shownHops; h++) hopArc(`hop${h}`, at(h - 1), at(h), corner, { live: h > this.hops });
      if (landed) { pt("b", 0, b, { c: CH }); text("bn", "b", -sg * 0.8, -b, "say", { anchor: sg > 0 ? "end" : "start", c: CH }); }
      readout(shownHops ? hopWords(shownHops) : "", colX, colY + 1);
      if (landed && st !== "see") record(shown, colX, colY + 5, st);
    },
  });
  return L;
}

// ---------- Which is faster? (g8-compare) ----------
// One square: one unit. Two rates, each a graph (a drawn line with two dots), a table (left, as in Unit rate) or an
// equation written as its line's name; the plane's first quadrant, x 0 to 4. Find each one's step, tap the steeper.
function lCompare(index, P0) {
  const P = P0 || genCompare(index), CH = "var(--chapter)", story = P.kind === "A";
  const kinds = { A: ["graph", "eq"], B: ["table", "eq"], C: ["graph", "table"] }[P.kind];
  const R = kinds.map((kind, i) => ({ kind, k: i ? P.k2 : P.k1, s: i ? P.s2 : P.s1 }));
  const eqName = r => story ? `d = ${r.k === 1 ? "" : r.k}t` : `y = ${r.k === 1 ? "" : r.k}x${r.s ? " + " + r.s : ""}`;
  const label = r => r.kind === "eq" ? "equation" : r.kind;
  R.forEach(r => { r.name = r.kind === "eq" ? eqName(r) : r.kind; r.end = { u: 4, v: r.s + 4 * r.k }; });
  const G = R.find(r => r.kind === "graph"), Tb = R.find(r => r.kind === "table"), E = R.find(r => r.kind === "eq");
  if (G) G.dots = [{ u: 0, v: G.s }, { u: P.j, v: G.s + P.j * G.k }];
  if (Tb) Tb.rows = P.xs.map(u => ({ u, v: Tb.s + Tb.k * u }));
  const order = { A: ["graph", "hop"], B: ["place", "lay", "hop"], C: ["graph", "place", "lay"] }[P.kind];
  const stages = [...order, "tap", "write", "done"];
  const big = R[0].k > R[1].k ? R[0] : R[1], small = big === R[0] ? R[1] : R[0];
  const L = withBoxes({
    id: "compare", index, P, stage: stages[0], msg: null, verdict: null, typing: false, fr: null, lay: null,
    held: null, ghost: null, bad: null, legs: null, found: null, placed: [], hd: [{ u: 1, v: 0 }, { u: 3, v: 1 }], laid: false,
    hops: 0, live: null, wrongLine: null, picked: false,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return this.fr; },
    next() { this.stage = stages[stages.indexOf(this.stage) + 1]; if (this.stage === "write") { this.typing = true; this.active = "a"; } },
    grab(q) {
      const st = this.stage, bx = this.lay.box, p = { u: q.x, v: -q.y };
      this.bad = null; this.wrongLine = null;
      if (st === "graph") { const A = G.dots.find(d => near(q, d.u, d.v)); if (A) { this.held = "step"; this.legs = { A, a: 0, b: 0 }; this.msg = null; return true; } return false; }
      if (st === "lay") { const i = this.hd.findIndex(h => near(q, h.u, h.v)); if (i >= 0) { this.held = "hd" + i; this.msg = null; return true; } return false; }
      if (!(q.x > -1.5 && q.y < 1.5 && q.x < bx.u1 + 1 && -q.y < bx.v1 + 1)) return false;
      if (st === "place") { this.held = "pt"; this.ghost = clampBox(snapP(q), bx); this.msg = null; return true; }
      if (st === "hop") { this.held = { q0: q, moved: false }; this.live = this.hops; this.msg = null; return true; }
      if (st === "tap") { this.held = "tap"; return true; }
      void p; return false;
    },
    drag(q) {
      const bx = this.lay.box, p = clampBox(snapP(q), bx), h = this.held;
      if (h === "pt") this.ghost = p;
      if (h === "step") { this.legs.a = p.u - this.legs.A.u; this.legs.b = p.v - this.legs.A.v; }
      if (h === "hd0" || h === "hd1") { const i = +h[2], o = this.hd[1 - i]; if (p.u !== o.u || p.v !== o.v) this.hd[i] = p; }
      if (h && h.q0) { if (Math.hypot(q.x - h.q0.x, q.y - h.q0.y) > 0.4) h.moved = true; if (h.moved) this.live = clamp(Math.round(q.x), this.hops, 4); }
    },
    release(q) {
      const h = this.held; this.held = null;
      if (h === "pt") {
        const p = this.ghost; this.ghost = null;
        if (this.placed.some(r => r.u === p.u && r.v === p.v)) return;
        if (Tb.rows.some(r => r.u === p.u && r.v === p.v)) { this.placed.push(p); if (this.placed.length === 2) this.next(); return; }
        const sw = Tb.rows.find(r => r.u === p.v && r.v === p.u), same = Tb.rows.find(r => r.u === p.u);
        this.bad = p;
        this.msg = sw ? "Across is x, up is y." : same ? `That's ${pair(p.u, p.v)}. The table says ${pair(same.u, same.v)}: up to ${same.v}.` : `That's ${pair(p.u, p.v)}. Pick a row: its x across, then its y up.`;
      }
      if (h === "step") {
        const { A, a, b } = this.legs, end = { u: A.u + a, v: A.v + b }; this.legs = null;
        if (!a && !b) return;
        const other = G.dots.find(d => d !== A);
        if (end.u === other.u && end.v === other.v) { this.found = { A, a, b }; this.next(); return; }
        this.msg = "Stop on the other dot.";
      }
      if (h === "hd0" || h === "hd1") {
        const i = +h[2];
        if (this.hd.every(p => onLine(p, Tb.k, Tb.s))) { this.laid = true; this.next(); return; }
        if (!onLine(this.hd[i], Tb.k, Tb.s)) this.msg = "Lay it through both points.";
      }
      if (h && h.q0) {
        const toward = q.x - this.hops;                                   // > 0: to the right of where the hops end
        if (h.moved && this.live > this.hops) this.hops = this.live;
        else if (toward < -0.6) this.msg = "Hop to the right.";
        else if (!h.moved || toward > 0.4) this.hops = Math.min(4, this.hops + 1);
        this.live = null;
        if (this.hops === 4) this.next();
      }
      if (h === "tap") {
        const d = R.map(r => { const dx = 4, dy = 4 * r.k, t = clamp((q.x * dx + (-q.y - r.s) * dy) / (dx * dx + dy * dy), 0, 1); return Math.hypot(q.x - t * dx, -q.y - r.s - t * dy); });
        const i = d[0] < d[1] ? 0 : 1;
        if (d[i] > 2.5) return;
        const r = R[i], o = R[1 - i];
        if (r === big) { this.picked = true; this.next(); return; }
        this.wrongLine = i;
        this.msg = r.s > o.s ? `It starts higher, but grows ${r.k} a step. Look at the slope.` : `That one goes up ${r.k} for each 1 across. The other goes up ${o.k}.`;
      }
    },
    cancel() { this.held = null; this.ghost = null; this.legs = null; this.live = null; },
    act(x) {
      if (boxAct(this, x)) return;
      if (x !== "check" || this.stage !== "write") return;
      const va = num(this.vals.a), vb = num(this.vals.b);
      if (Number.isNaN(va) || Number.isNaN(vb)) { this.msg = "Fill in both boxes."; return; }
      if (va === R[0].k && vb === R[1].k) { this.verdict = null; this.msg = null; this.stage = "done"; this.typing = false; return; }
      this.verdict = "wrong";
      const i = va !== R[0].k ? 0 : 1, r = R[i];
      this.active = i ? "b" : "a";
      if (r.kind === "graph") this.msg = `The graph's step: ${Math.abs(this.found.b)} up for ${Math.abs(this.found.a)} across.`;
      else if (r.kind === "table") { const [p, q] = this.placed; this.msg = `The table's step: ${Math.abs(q.v - p.v)} up for ${Math.abs(q.u - p.u)} across.`; }
      else this.msg = `In ${r.name}, the number with ${story ? "t" : "x"} is the step up.`;
    },
    scene() {
      const st = this.stage, done = st === "done", top = Math.max(R[0].end.v, R[1].end.v);
      const rec = R.map((r, i) => [{ word: `${label(r)}:` }, " ", done ? { t: String(r.k), c: CH } : { box: i ? "b" : "a", cells: 1, L: this }, " ", { word: "per" }, " 1"]);
      if (done) rec.push([{ t: `${big.k} > ${small.k}`, c: CH }]);
      const tH = Tb ? 14 : 0, writing = st === "write" || done;
      const colW = Math.max(12, recWidth(rec)), colH = tH + (writing ? 4 + 4 * rec.length + 2 : 3);
      const lay = this.lay = planeLayout({ u0: -3, u1: 13, v0: -3, v1: top + 3 }, colW, colH, "left", writing ? colW : 12), { T, colX, colY, box } = lay, tx = colX + colW - 12;
      this.fr = lay.fr;
      const q = story ? "Two bikes ride for 4 hours. Which is faster?" : "Which line grows faster?";
      const say = {
        graph: ["Draw a step on the graph, from dot to dot.", "Drag across, then up."],
        place: ["Place two of the table's points.", "Tap or drag to a crossing."],
        lay: ["Lay a line through them.", "Drag its two round handles."],
        hop: [`Hop the equation's line up from ${E ? E.s : 0}.`, `Each hop: 1 across, ${E ? E.k : 0} up. Tap to add one.`],
        tap: ["Tap the steeper line.", "It grows faster."],
        write: ["Write how much each goes up for 1 across.", ""],
        done: [`${big.k} up for each 1 across beats ${small.k}: the ${label(big)}'s grows faster.`, ""],
      }[st];
      dhead(this, st === stages[0] ? `${q} ${say[0]}` : say[0], say[1], lay.fr.x + 2, T, Math.min(60, lay.V.x1 - lay.fr.x - 4));
      axes("ax", box, { names: story ? ["hours", "miles"] : ["x", "y"] });
      if (Tb) table("tb", tx, colY, story ? ["hours", "miles"] : ["x", "y"], Tb.rows, i => this.placed.some(p => p.u === Tb.rows[i].u));
      // the lines, x 0 to 4, each named at its right end (names nudged apart when the ends meet)
      const ends = R.map(r => r.end.v), gap = Math.abs(ends[0] - ends[1]) < 1.6;
      R.forEach((r, i) => {
        const shown = r.kind === "graph" || (r.kind === "table" && this.laid) || (r.kind === "eq" && this.hops === 4);
        const c = this.wrongLine === i ? "var(--wrong)" : this.picked && r === big ? CH : "var(--ink)";
        if (shown) line(`l${i}${c}`, 0, -r.s, 4, -r.end.v, { c });
        const ny = gap ? (ends[i] >= ends[1 - i] && i === 0 || ends[i] > ends[1 - i] ? -0.8 : 0.8) : 0;
        if (shown || r.kind === "eq") text(`nm${i}`, r.name, 4.8, -r.end.v + ny, "small", { anchor: "start", c: this.picked && r === big ? CH : "var(--ink)" });
      });
      let ro = "";
      if (G) { for (const d of G.dots) pt(`gd${d.u}`, d.u, d.v); }
      if (G && this.found) { legs("gs", this.found.A.u, this.found.A.v, this.found.a, this.found.b); if (st === order[order.indexOf("graph") + 1] || st === "graph") ro = stepWords(this.found.a, this.found.b); }
      if (this.legs) { legs("lg", this.legs.A.u, this.legs.A.v, this.legs.a, this.legs.b, { live: true }); ro = stepWords(this.legs.a, this.legs.b); }
      if (Tb) {
        for (const p of this.placed) pt(`tp${p.u}`, p.u, p.v, { c: CH });
        if (st === "lay") { lineThrough(`lay${this.hd.map(h => h.u + "_" + h.v).join()}`, this.hd[0], this.hd[1], box, { c: "var(--ink2)", live: !!this.held }); this.hd.forEach((h, i) => handle(`hd${i}`, h, this.held === "hd" + i)); ro = slopeOf(this.hd[0], this.hd[1]); }
        if (this.laid && st === order[order.indexOf("lay") + 1]) ro = slopeOf(this.hd[0], this.hd[1]);
      }
      if (this.ghost) { pt("ghost", this.ghost.u, this.ghost.v, { c: CH, live: true, r: 0.6 }); ro = pair(this.ghost.u, this.ghost.v); }
      if (this.bad && this.msg) pt(`bad${this.bad.u}_${this.bad.v}`, this.bad.u, this.bad.v, { c: "var(--wrong)" });
      if (E && (st === "hop" || this.hops)) {
        pt("es", 0, E.s, { c: CH });
        const shownHops = this.live != null ? Math.max(this.live, this.hops) : this.hops, at = h => ({ u: h, v: E.s + E.k * h });
        for (let h = 1; h <= shownHops; h++) hopArc(`eh${h}`, at(h - 1), at(h), { u: h, v: E.s + E.k * (h - 1) }, { live: h > this.hops });
        if (st === "hop" || st === order[order.indexOf("hop") + 1]) ro = shownHops ? `${shownHops} ${shownHops === 1 ? "hop" : "hops"}: up ${E.k * shownHops}` : "";
      }
      readout(ro, tx, colY + tH + 1);
      if (writing) record(rec, colX, colY + tH + 5, st);
    },
  });
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  rate: { name: "Unit rate is the slope", make: lRate, gen: genRate },
  slope: { name: "Slope from two points", make: lSlope, gen: genSlope },
  intercept: { name: "Slope-intercept form", make: lIntercept, gen: genIntercept },
  compare: { name: "Which is faster?", make: lCompare, gen: genCompare },
};
const IDX = {};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
// start(id, index, problem): problem is optional (the test driver passes one to see a given case)
function start(id, index, P) {
  id = String(id || "").replace(/^g8-/, "");
  if (!LESSONS[id]) id = "rate";
  if (index != null) IDX[id] = index;
  token++;
  lesson = LESSONS[id].make(IDX[id] || 0, P);
  pick.value = id;
  drawn = new Set(); keys.blur(); keys.value = "";
  render(); frame(lesson.frame(), true); render();
  try { localStorage.setItem("g8ch3-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value);
document.getElementById("fresh").onclick = () => leave();
function leave() {
  const go = () => { IDX[lesson.id] = (IDX[lesson.id] || 0) + 1; start(lesson.id); };
  if (lesson.leave) lesson.leave(go); else go();
}
let first = "rate", firstI = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g8ch3-lesson") || "rate";
  firstI = +(u.get("i") || 0);
  if (u.get("theme")) document.documentElement.dataset.theme = u.get("theme");
} catch (err) {}
start(first, firstI);
addEventListener("resize", () => render());
</script>
