<title>8th Grade: Functions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). iPad landscape only.
   Chapter colour: grade8.md names none, so Functions takes a violet of its own: chapter 3 (lines and slope) is the
   kit's blue and chapters 1–2 the pink; violet sits between them, and is neither red nor green. */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #7A4FD0; --tint: rgba(122, 79, 208, .2); --tint-strong: rgba(122, 79, 208, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #B69BFF; --tint: rgba(182, 155, 255, .22); --tint-strong: rgba(182, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #B69BFF; --tint: rgba(182, 155, 255, .22); --tint-strong: rgba(182, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
/* a unit cube's faces: the chapter colour mixed into the paper, opaque so cubes in front hide cubes behind */
:root { --cube-top: color-mix(in srgb, var(--chapter) 18%, var(--paper)); --cube-front: color-mix(in srgb, var(--chapter) 34%, var(--paper));
  --cube-side: color-mix(in srgb, var(--chapter) 52%, var(--paper)); --cube-edge: color-mix(in srgb, var(--chapter) 70%, var(--ink)); }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none; margin: 0;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
/* 0s that pass the point fall away */
.out-fall { animation: fall .75s ease-in forwards; transform-box: fill-box; }
@keyframes fall { from { opacity: 1; } to { opacity: 0; transform: translateY(36px); } }
/* hops flipped over 0 turn over like a card round the 0 line (7th grade's flip) */
.flip-in { transform-box: view-box; animation: flipin .5s ease-out; }
@keyframes flipin { from { transform: scaleX(-1); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade, .flip-in { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--tint)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const isqrt = n => { let r = Math.floor(Math.sqrt(n)); while (r * r > n) r--; while ((r + 1) * (r + 1) <= n) r++; return r; };
const isSquare = n => isqrt(n) ** 2 === n;
// an integer read with `places` decimals, trailing zeros dropped: (2916, 2) → "29.16", (500, 2) → "5"
function dec(v, places) {
  const s = String(v).padStart(places + 1, "0"), w = s.slice(0, s.length - places), f = s.slice(s.length - places).replace(/0+$/, "");
  return f ? `${w}.${f}` : w;
}
const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹", "-": "⁻" };
const sup = n => String(n).split("").map(c => SUP[c] || c).join("");

let items = [], drawn = new Set();
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in, and an
// optional delay (a count that runs on). UP: what's put now faces the child (drawn over the tilting paper, never tilted)
let UP = false;
function put(k, tag, a, kind = "fade", text, delay) { items.push({ k, tag, a, kind, text, up: UP, delay }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay);
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: 1,
    "stroke-dasharray": o.dash ? "0.03 0.03" : null }, o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay);
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, "stroke-dasharray": o.dash ? "6 6" : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null }, o.live ? "none" : o.c && !o.fill && !o.dash ? "line" : "fade", undefined, o.delay);
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade", undefined, o.delay); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s, o.delay);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// how many rows words() wraps a line into
function wrapN(s, widthSq, cls = "say") {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per)); let n = 0, cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { n++; cur = w; } else cur = (cur + " " + w).trim(); }
  return n + (cur ? 1 : 0);
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c, live: o.live }); continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c, live: o.live }); col += 2;
  }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// a label's ink half a square from the edge it labels
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c, o = {}) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c, ...o });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c, ...o });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end", ...o });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start", ...o });
}
// an answer box in the record: cells of 2 squares, what's typed lined up on the right (or centred), the cursor after it
function dbox(k, x, y, cells, value, state, actName, centred = false) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null, v = String(value || "").replace("-", "−");
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (v) {
    if (centred) text(`${k}v`, v, x + cells, y + 1, "maths", { c: vc, live: true });
    else digits(`${k}v${v}`, v, x + cells * 2, y + 1, { c: vc, live: true });
  }
  if (state === "active") {
    const cx = centred ? x + cells + (v ? v.length * 0.31 : 0) + 0.25 : x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// a line of maths laid on the grid (names and the record): a character 2 squares, a space 1, a superscript 1 square a
// character in small type, an answer box 2 squares a cell (raised for an exponent), a fraction as a column with its bar
// on the row's middle, a root with its bar over the number. Returns its width and where each part sits.
// draw = false only measures. Tokens: "x² · " strings, {t, c} coloured text, {sup}, {box, cells, sup, L}, {frac: [top, bottom]},
// {root, idx}.
function mrow(k, toks, x, y, o = {}, draw = true) {
  let cx = x; const at = {};
  toks.forEach((t, i) => {
    if (t == null) return;
    const kk = `${k}.${i}`, x0 = cx, c = (t && t.c) || o.c;
    const T = (key, s, px, py, cls, col) => { if (draw) text(key, s, px, py, cls, { c: col, live: o.live }); };
    if (typeof t !== "object" || t.t != null) {
      for (const ch of String(typeof t === "object" ? t.t : t)) {
        if (ch === " ") cx += 1;
        else if (ch === "." || ch === ",") T(`${kk}p${ch}${cx}`, ch, cx, y, "maths", c);
        else { T(`${kk}${ch}${cx}`, ch, cx + 1, y, "maths", c); cx += 2; }
      }
    } else if (t.word != null) {
      // a word in the record (slope, table:) is written as a word, not a letter a square
      if (draw) text(`${kk}w${t.word}${cx}`, t.word, cx, y, "maths", { anchor: "start", c, live: o.live });
      cx += Math.ceil(t.word.length * 0.95);
    } else if (t.box) {
      const typed = String(t.L.vals[t.box] || ""), tight = typed.includes(".");
      const cells = Math.max(t.cells || 1, tight ? Math.ceil((typed.length + 1) / 2) : typed.length);
      if (draw) dbox(`${k}b${t.box}`, cx, t.sup ? y - 2 : y - 1, cells, typed, boxState(t.L, t.box), `box:${t.box}`, tight || !!t.centred);
      cx += cells * 2;
    } else if (t.sup != null) {
      // an exponent hugs its base: its first character starts in the base's last square
      const chs = String(t.sup).replace("-", "−"); cx -= 0.7;
      for (const ch of chs) { T(`${kk}s${ch}${cx}`, ch, cx + 0.5, y - 0.9, "small", c || "var(--ink)"); cx += 1; }
      cx += 0.7;
    } else if (t.frac) {
      const wt = mrow("", t.frac[0], 0, 0, o, false).w, wb = mrow("", t.frac[1], 0, 0, o, false).w, W = Math.max(wt, wb) + 2;
      if (draw) {
        mrow(kk + "t", t.frac[0], cx + (W - wt) / 2, y - 1, { ...o, c });
        line(`${kk}bar`, cx, y, cx + W, y, { c: c || "var(--ink)" });
        mrow(kk + "b", t.frac[1], cx + (W - wb) / 2, y + (t.frac[1].some(u => u && u.sup != null && !u.box) ? 1.7 : 1), { ...o, c });
      }
      cx += W;
    } else if (t.root != null) {
      const s = String(t.root), w = s.length * 2;
      if (draw) {
        path(`${kk}rad${s}`, `M${sq(cx + 0.2)} ${sq(y + 0.15)}L${sq(cx + 0.65)} ${sq(y - 0.1)}L${sq(cx + 1.15)} ${sq(y + 0.9)}L${sq(cx + 1.8)} ${sq(y - 1.2)}H${sq(cx + 2.2 + w)}`, { c: c || "var(--ink)" });
        if (t.idx) T(`${kk}ri`, t.idx, cx + 0.75, y - 0.75, "small", c || "var(--ink)");
        mrow(kk + "rd", [s], cx + 2, y, { ...o, c });
      }
      cx += 2 + w;
    }
    at[t.id || t.box || i] = { x: x0, w: cx - x0 };
  });
  return { w: cx - x, at };
}
// what to do on the rows above the picture: one line, and a small second line (or what a miss says, in red)
function dhead(L, say, sub, x = 0, y = 0, width = 60) {
  const n = words(`say-${say}`, say, x, y + 1, width);
  const y2 = y + 1 + 2 * n + 0.3;
  if (L.msg) words(`msg-${L.msg}`, L.msg, x, y2, width, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, x, y2, width, "small");
}
// lessons with answer boxes: each box has its own value; the hidden input types into the active one
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; L.verdict = null; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];
const num = s => s === "" || s == null ? NaN : +String(s).replace("−", "-");
// the first problems of a run are the friendly ones: the smallest of six draws (the web's withEasyStart)
function easyStart(i, draw, size) {
  let best = draw();
  if (i >= 3) return best;
  for (let k = 1; k < 6; k++) { const p = draw(); if (size(p) < size(best)) best = p; }
  return best;
}

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none" && it.kind !== "fall", a = { ...it.a };
    if (it.kind === "fall") { a.class = ((a.class || "") + " out-fall").trim(); a.style = `animation-delay:${(it.delay || 0).toFixed(3)}s;`; }
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      const d = it.delay != null ? it.delay : Math.min(n++ * 0.035, 1.2);
      a.style = `animation-delay:${d.toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  const m = lesson.paperMatrix && lesson.paperMatrix();
  if (m) document.getElementById("paperg").setAttribute("transform", `matrix(${m.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  // a lesson that's moving (the paper tilting, cubes rising) draws again next frame
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.25x. The frame's top row sits at the top
// of the screen (the words on rows 0–2), centred across; no empty band above the paper.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 24, bottom = 110;
  const s = Math.min((W - 64) / sq(f.w), (H - top - bottom - 16) / sq(f.h), 1.25);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { camTo = null; Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}

// ---------- what chapter 4 adds to the kit (each built once, for the chapters after) ----------
// A frame for a lesson laid out on its own squares (not the plane): from x0 to x1 across, row 0 down to y1; the words
// start at its left edge + 2 and are as wide as the screen lets them be.
function ownFrame(L, x0, x1, y1) {
  const w = Math.max(46, Math.ceil(x1 - x0) + 4), fr = { x: Math.round((x0 + x1) / 2 - w / 2), y: -0.5, w, h: y1 + 1.5 };
  const t = fitTo(fr);
  L.fr = fr;
  return { fr, ww: Math.min(60, (t.x + innerWidth / t.s) / SQ - fr.x - 4) };
}
// Negative is striped (7th grade's look): what goes right is solid in the chapter colour, what goes left striped.
const fillOf = d => d > 0 ? "var(--tint-strong)" : "url(#stripes)";
// a hop: a hump over the line from x1 to x2 (squares), at most 3 squares high. o.cls: it turns over like a card (flip).
function hump(k, x1, x2, y, o = {}) {
  const h = Math.min(o.hmax || 3, Math.abs(x2 - x1) / 2), m = (x1 + x2) / 2, d = `M${sq(x1)} ${sq(y)}Q${sq(m)} ${sq(y - 2 * h)} ${sq(x2)} ${sq(y)}`;
  const kind = o.cls ? "none" : o.live ? "none" : "fade";
  put(`${k}f`, "path", { d: d + "Z", fill: o.fill || fillOf(x2 - x1), stroke: "none", class: o.cls || null, style: o.style || null }, kind);
  put(`${k}s`, "path", { d, fill: "none", stroke: o.c || "var(--chapter)", "stroke-width": 1.5, class: o.cls || null, style: o.style || null }, kind);
}
// an arrow a square tall from its tail to its head (squares), solid going right, striped going left (7th grade's)
function arrowBar(k, x0, x1, y, o = {}) {
  const d = Math.sign(x1 - x0) || 1, hd = Math.min(0.9, Math.abs(x1 - x0) / 2);
  put(k, "path", { d: `M${sq(x0)} ${sq(y - 0.5)}H${sq(x1 - d * hd)}L${sq(x1)} ${sq(y)}L${sq(x1 - d * hd)} ${sq(y + 0.5)}H${sq(x0)}Z`,
    fill: fillOf(x1 - x0), stroke: o.c || "var(--chapter)", "stroke-width": 1.5 }, o.live ? "none" : "fade");
}
// an arrow from one point to another (squares), its head at the far end
function arrow(k, x1, y1, x2, y2, o = {}) {
  const c = o.c || "var(--ink)", len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  line(k, x1, y1, x2, y2, { c, live: o.live });
  path(`${k}h`, `M${sq(x2 - 0.8 * ux + 0.45 * uy)} ${sq(y2 - 0.8 * uy - 0.45 * ux)}L${sq(x2)} ${sq(y2)}L${sq(x2 - 0.8 * ux - 0.45 * uy)} ${sq(y2 - 0.8 * uy + 0.45 * ux)}`, { c, live: o.live });
}
// a ring round something (squares)
const ring = (k, x, y, r, o = {}) => put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: "none", stroke: o.c || "var(--chapter)", "stroke-width": 1.5 }, o.live ? "none" : "fade");
// Pick: the answer words as blocks side by side, a square apart; a wrong one turns red. Returns the right edge.
function pickBlocks(L, k, opts, x, y) {
  let cx = x;
  for (const o of opts) {
    const w = Math.ceil(nameW(o.label)) + 2, bad = L.picked === o.id && !!L.msg, c = bad ? "var(--wrong)" : "var(--ink)";
    rect(`${k}${o.id}o${bad}`, cx, y, w, 2, { c });
    text(`${k}${o.id}w${bad}`, o.label, cx + 1, y + 1, "small", { anchor: "start", c });
    put(`${k}${o.id}hit`, "rect", { x: sq(cx), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": `pick:${o.id}` }, "none");
    cx += w + 1;
  }
  return cx - 1;
}
// Sweep a line: a line straight up the plane at x = c, a round handle at its foot; readout "x = 3: 2 points"
function sweepLine(k, c, bx, held) {
  line(`${k}l${c}`, X(c), Y(bx.v0), X(c), Y(bx.v1), { c: "var(--chapter)", live: true });
  handle(`${k}h`, { u: c, v: bx.v0 }, held);
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
// the record laid by hand: rows of maths from (x, y), each with its own left edge offset (so "=" lines up)
function rows(k, list, x, y) { list.forEach((r, i) => { if (r) mrow(`${k}${i}`, r.toks, x + (r.dx || 0), y + 4 * i); }); }

// ---------- the problems (fresh numbers, easy first by index) ----------
// One output each (new): 4–6 pairs, inputs −5..9 (outputs the same range); half are functions, the rest have exactly
// one input with two outputs. The first three are arrows with 4 pairs, problems 4–6 arrows with 4–6, then the plane.
function genIsFunc(i) {
  const plane = i >= 6, n = i < 3 ? 4 : rnd(4, 6), isF = rnd(0, 1) === 1, m = isF ? n : n - 1, ins = [];
  while (ins.length < m) { const u = rnd(-5, 9); if (!ins.includes(u)) ins.push(u); }
  const pairs = ins.map(u => ({ u, v: rnd(-5, 9) }));
  let dup = null;
  if (!isF) { const j = rnd(0, m - 1); let v; do v = rnd(-5, 9); while (v === pairs[j].v); dup = pairs[j].u; pairs.push({ u: dup, v }); }
  return { plane, isF, pairs, dup };
}
// Evaluate a function (the web's g8-func): f(x) = ax + b, a −6..9 and b −12..12 (neither 0), x −6..6; the first three
// the smallest of six (sized by the numbers shown and worked out).
function genFunc(i) {
  return easyStart(i, () => { const a = nz(-6, 9), b = nz(-12, 12), x = rnd(-6, 6); return { a, b, x, v: a * x + b }; },
    p => Math.abs(p.a) + Math.abs(p.b) + Math.abs(p.x) + Math.abs(p.a * p.x) + Math.abs(p.v));
}

// ---------- One output each (g8-isfunc) ----------
// Arrows: the inputs in a column of cells on the left, the outputs 20 squares right, an arrow from each input to its
// output. From problem 7 the pairs are points on the plane, swept by a line straight up.
function lIsFunc(index, P0) {
  const P = P0 || genIsFunc(index), CH = "var(--chapter)", { pairs, isF, dup } = P;
  const ins = [...new Set(pairs.map(p => p.u))].sort((a, b) => a - b), outs = [...new Set(pairs.map(p => p.v))].sort((a, b) => a - b);
  const outsOf = u => pairs.filter(p => p.u === u).map(p => p.v).sort((a, b) => a - b), dupOuts = dup == null ? [] : outsOf(dup);
  const stages = [P.plane ? "sweep" : "tap", "pick", "done"];
  const CW = 6, CHh = Math.max(ins.length, outs.length) <= 4 ? 6 : 5, TOP = 8, OX = 26, SX = 35;   // cells 6 wide; outputs 20 squares right
  const cy = (list, v) => TOP + CHh * list.indexOf(v) + CHh / 2;
  const minU = Math.min(...ins), maxU = Math.max(...ins), vs = pairs.map(p => p.v);
  const recRow = isF ? [{ word: "each input → one output" }] : [`${fmt(dup)} → ${fmt(dupOuts[0])}, ${fmt(dup)} → ${fmt(dupOuts[1])}`];
  const L = {
    id: "isfunc", index, P, stage: stages[0], msg: null, fr: null, lay: null, k: null,
    cur: null, seen: new Set(), c: minU - 1, c0: null, far: minU - 1, held: false, picked: null,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return this.fr; },
    tap(q) {
      if (this.stage !== "tap") return false;
      const row = Math.floor((q.y - TOP) / CHh);
      if (q.x >= 0 && q.x <= CW && row >= 0 && row < ins.length) {
        this.cur = ins[row]; this.seen.add(this.cur); this.msg = null;
        if (this.seen.size === ins.length) this.stage = "pick";
        return true;
      }
      if (q.x >= OX && q.x <= OX + CW && row >= 0 && row < outs.length) { this.msg = "Tap an input, on the left."; return true; }
      return false;
    },
    grab(q0) {
      if (this.stage !== "sweep") return false;
      const q = toU(q0), bx = this.lay.box;
      if (Math.abs(q.x - this.c) * PK > 1.6 || -q.y < bx.v0 - 1.5 / PK || -q.y > bx.v1 + 0.5) return false;
      this.held = true; this.c0 = this.c; this.msg = null; return true;
    },
    drag(q0) { const bx = this.lay.box; this.c = clamp(Math.round(toU(q0).x), Math.ceil(bx.u0), Math.floor(bx.u1)); this.far = Math.max(this.far, this.c); },
    release() {
      this.held = false;
      if (this.c < this.c0) { this.msg = "Sweep to the right, past every point."; return; }
      if (this.far >= maxU) this.stage = "pick";
    },
    cancel() { this.held = false; },
    act(x) {
      if (!x.startsWith("pick:") || this.stage !== "pick") return;
      const id = x.slice(5); this.picked = id;
      if (id === (isF ? "one" : "two")) { this.msg = null; this.stage = "done"; return; }
      if (!isF && !P.plane) this.cur = dup;                                // the input that breaks it lights
      this.msg = isF ? (P.plane ? "Each x has one point. Look again." : "Each input has one arrow. Look again.")
        : `${fmt(dup)} goes to ${fmt(dupOuts[0])} and to ${fmt(dupOuts[1])}: two outputs.`;
    },
    scene() {
      const st = this.stage, done = st === "done";
      const colW = Math.max(18, recWidth([recRow]) + 1), wNow = done ? colW : st === "pick" ? 17 : 12;
      const say = {
        tap: ["Tap each input to see where its arrows go.", "The inputs are on the left."],
        sweep: ["Sweep the line across, one x at a time.", "Drag its round handle to the right."],
        pick: ["Tap what's true.", ""],
        done: [isF ? "Every input has just one output: a function." : `${fmt(dup)} has two outputs, so this isn't a function.`, ""],
      }[st];
      let rx, ry, ro = "";
      if (!P.plane) {
        PK = 1;
        const bottom = TOP + CHh * Math.max(ins.length, outs.length);
        const { fr, ww } = ownFrame(this, 0, SX + wNow, bottom + 1);
        dhead(this, say[0], say[1], fr.x + 2, 0, ww);
        lab("nin", "in", "above", TOP, CW / 2); lab("nout", "out", "above", TOP, OX + CW / 2);
        [[ins, 0, "i"], [outs, OX, "o"]].forEach(([list, x0, s]) => {
          list.forEach((v, r) => {
            if (s === "i" && this.seen.has(v)) rect(`${s}f${v}`, x0, TOP + CHh * r, CW, CHh, { fill: "var(--tint)" });
            text(`${s}n${v}`, fmt(v), x0 + CW / 2, TOP + CHh * r + CHh / 2, "maths");
            if (r) line(`${s}d${r}`, x0, TOP + CHh * r, x0 + CW, TOP + CHh * r);
          });
          rect(`${s}c${list.length}`, x0, TOP, CW, CHh * list.length, { c: "var(--ink)" });
        });
        const lit = u => (!done && this.cur === u) || (done && !isF && u === dup);
        for (const p of pairs) arrow(`ar${p.u}_${p.v}`, CW + 0.4, cy(ins, p.u), OX - 0.4, cy(outs, p.v), { c: lit(p.u) ? CH : "var(--ink)" });
        const shownU = done ? (isF ? null : dup) : this.cur;
        if (shownU != null) {
          for (const v of outsOf(shownU)) ring(`ro${shownU}_${v}`, OX + CW / 2, cy(outs, v), 1.7);
          if (done) ring(`ri${dup}`, CW / 2, cy(ins, dup), 1.7);
        }
        if (this.cur != null && !done) { const o = outsOf(this.cur); ro = `${fmt(this.cur)} → ${o.map(fmt).join(" and ")}`; }
        rx = SX; ry = TOP + 1;
      } else {
        const b = { u0: Math.min(0, minU - 1), u1: Math.max(0, maxU + 1), v0: Math.min(0, ...vs), v1: Math.max(0, ...vs) };
        const colH = done ? 10 : 7;
        const lay = this.lay = planeLayout(this, b, { l: 3, r: 7, t: 3, bm: 4 }, colW, colH, "right", wNow, 10), { T, colX, colY, box } = lay;
        this.fr = lay.fr;
        dhead(this, say[0], say[1], lay.fr.x + 2, T, lay.ww);
        unitNote(lay);
        axes("ax", box, { skip: skipNear(dup == null ? [] : dupOuts.map(v => ({ x: X(dup) + 1.5, y: Y(v), w: nameW(pair(dup, v)) }))) });
        const on = st === "sweep" || this.held;
        for (const p of pairs) {
          const hit = on && p.u === this.c, twice = p.u === dup && this.far >= dup;
          pt(`p${p.u}_${p.v}${hit}`, p.u, p.v, { c: hit || twice ? CH : "var(--ink)" });
          if (twice) { ring(`pr${p.u}_${p.v}`, X(p.u), Y(p.v), 0.95); text(`pn${p.u}_${p.v}`, pair(p.u, p.v), X(p.u) + 1.5, Y(p.v), "small", { anchor: "start" }); }
        }
        if (st === "sweep") { sweepLine("sw", this.c, box, this.held); const n = pairs.filter(p => p.u === this.c).length; if (this.far >= minU) ro = `x = ${fmt(this.c)}: ${plural(n, "point", "points")}`; }
        rx = colX; ry = colY + 1;
      }
      readout(ro, rx, ry);
      if (st === "pick") pickBlocks(this, "pk", [{ id: "one", label: "One each" }, { id: "two", label: "Two outputs" }], rx, ry + 3);
      if (done) record([recRow], rx, ry + 4, "done");
    },
  };
  return L;
}

// ---------- Evaluate a function (g8-func) ----------
// A line along a strong row, k squares a unit (the biggest that fits: 4, 3, 2 or 1); the rule written once as its name
// at the right end and the input as a tag under 0. Hops of the rule's number from 0, by size first and flipped over 0
// once for each negative; then one hop of the number on its own; then the record.
function lFunc(index, P0) {
  const P = P0 || genFunc(index), { a, b, x } = P, ax = a * x, v = ax + b, A = Math.abs(a), n = Math.abs(x), size = A * n, CH = "var(--chapter)";
  const negs = (a < 0) + (x < 0), B = Math.abs(b), bs = b < 0 ? "−" : "+";
  const stages = n === 0 ? ["b", "write", "done"] : negs ? ["hops", "flip", "b", "write", "done"] : ["hops", "b", "write", "done"];
  const rule = `f(x) = ${a === 1 ? "" : a === -1 ? "−" : fmt(a)}x ${bs} ${B}`, tag = `x = ${fmt(x)}`, ruleW = rule.length * 0.6;
  // the line on a strong row; hops are humps up to 5 squares high (taller hops fill the screen), so a tall run's line
  // sits a block lower; the hop of the number on its own is a bar over the humps
  const HHk = k => n ? Math.min(5, k * A / 2) : 0, LYk = k => HHk(k) >= 2 ? 15 : 10;
  // the values the line holds: 0, the hops by size (and flipped, the other side), the answer; room for one hop too many
  const vals = [0, size, ax, v]; if (negs) vals.push(-size);
  const LO = Math.min(...vals), HI = Math.max(...vals);
  const width = (k, lo, hi, beside) => k * (hi - lo + 2 * (k >= 2 ? 1 : 2)) + (beside ? ruleW + 1 : 0);
  const fitsW = (w, k) => fitTo({ x: 0, y: -0.5, w: Math.ceil(w) + 5, h: LYk(k) + 18 }).s >= 0.75;
  let K = null, room = 0, beside = true, big = false;
  outer: for (const r of [A, 0]) for (const k of [4, 3, 2, 1]) if (fitsW(width(k, LO, HI + (n ? r : 0), true), k)) { K = k; room = n ? r : 0; break outer; }
  if (K == null) { K = 1; beside = false; if (!fitsW(width(1, LO, HI, false), 1)) big = true; }
  const k = K, e = k >= 2 ? 1 : 2, LY = LYk(k), HH = HHk(k), BY = LY - Math.max(HH, 1) - 1.5;
  const L = withBoxes({
    id: "func", index, P, stage: stages[0], msg: null, verdict: null, typing: false, fr: null, k, LY,
    hops: 0, live: null, over: 0, held: null, flips: 0, side: 1, d: null, bad: null,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return this.fr; },
    end() { return this.side * size; },                                   // where the run of hops ends now (units)
    range() {
      if (!big) return [LO, HI + room];
      const st = this.stage;
      if (st === "hops") return [0, size + room];
      if (st === "flip") return this.side > 0 ? [-3, size] : [-size, 3];
      return [Math.min(0, ax, v), Math.max(0, ax, v)];
    },
    next() { this.stage = stages[stages.indexOf(this.stage) + 1]; if (this.stage === "write") { this.typing = true; this.active = "v"; } },
    grab(q) {
      const st = this.stage, [lo, hi] = this.range(), u = q.x / k;
      if (q.y < BY - 1.5 || q.y > LY + 3 || u < lo - e || u > hi + e) return false;
      this.msg = null; this.bad = null; this.over = 0;
      if (st === "hops") { this.held = { q0: q, moved: false }; this.live = this.hops; return true; }
      const E = this.end();
      if (st === "flip") { this.held = { q0: q, moved: false, end: Math.abs(q.x - k * E) < 1.6, cross: false }; this.d = null; return true; }
      if (st === "b" && Math.abs(q.x - k * (n ? E : 0)) < 1.6) { this.held = { q0: q, moved: false, end: true }; this.d = 0; return true; }
      return false;
    },
    drag(q) {
      const h = this.held; if (!h) return;
      if (Math.hypot(q.x - h.q0.x, q.y - h.q0.y) > 0.4) h.moved = true;
      if (!h.moved) return;
      const [lo, hi] = this.range(), u = clamp(q.x / k, lo - e, hi + e);
      if (this.stage === "hops") this.live = clamp(Math.round(u / A), this.hops, Math.floor((hi + e) / A));
      // the run's body flips over 0; the end dot hops on (until the first flip, dragging it over 0 flips too)
      if (this.stage === "flip") { h.cross = (!h.end || !this.flips) && Math.sign(u) === -this.side && Math.abs(u) > 0.5 / k; if (h.end && !h.cross) this.d = Math.round(u - this.end()); }
      if (this.stage === "b") this.d = Math.round(u - (n ? this.end() : 0));
    },
    release() {
      const h = this.held; this.held = null; if (!h) return;
      const st = this.stage;
      if (st === "hops") {
        const got = h.moved ? this.live : this.hops + 1; this.live = null;
        if (got > n) { this.over = got; this.msg = `That's ${got} hops. x is ${fmt(x)}.`; return; }
        this.hops = Math.max(this.hops, got);
        if (this.hops === n) this.next();
        return;
      }
      if (st === "flip") {
        if (h.cross) { this.flips++; this.side = -this.side; this.d = null; return; }
        if (!h.end || !h.moved || !this.d) { this.d = null; return; }
        if (this.side !== (Math.sign(ax) || 1) || this.flips < negs) {
          this.d = null;
          this.msg = `${fmt(a)} × ${fmt(x)} has ${negs === 1 ? "one negative: flip once" : "two negatives: flip twice"}.`;
          return;
        }
        this.stage = "b";                                                  // the flips are right: this drag is the hop
      }
      if (this.stage === "b") {
        const d = this.d; this.d = null;
        if (!d) return;
        if (d === b) { this.hopB = d; this.next(); return; }
        this.bad = d;
        this.msg = Math.sign(d) !== Math.sign(b) ? `The rule has ${bs} ${B}: hop ${b < 0 ? "left" : "right"}.` : `That's ${Math.abs(d)}. The rule's number is ${B}.`;
      }
    },
    cancel() { this.held = null; this.live = null; this.d = null; },
    act(c) {
      if (boxAct(this, c)) return;
      if (c !== "check" || this.stage !== "write") return;
      const t = num(this.vals.v);
      if (Number.isNaN(t)) { this.msg = "Write it first."; return; }
      if (t === v) { this.verdict = null; this.msg = null; this.typing = false; this.next(); return; }
      this.verdict = "wrong";
      if (t === ax - b) this.msg = `The rule has ${bs} ${B}: keep its sign.`;
      else if (ax && t === -ax + b) this.msg = `${a < 0 ? "Negative" : "Positive"} times ${x < 0 ? "negative" : "positive"} is ${ax < 0 ? "negative" : "positive"}.`;
      else if (t === a + x + b) this.msg = `The rule multiplies x by ${fmt(a)}.`;
      else this.msg = `Read where the last hop lands: ${fmt(ax)} ${bs} ${B}.`;
    },
    scene() {
      PK = 1;
      const st = this.stage, done = st === "done", writing = st === "write" || done;
      const [lo, hi] = this.range(), xL = k * (lo - e), xR = k * (hi + e);
      // the record: f(4) = 3 × 4 − 5, then = 12 − 5 = [7] with "=" under "=", then the pair
      const lead = `f(${fmt(x)})`, r1 = [lead, " = ", fmt(a), " × ", par(x), ` ${bs} `, String(B)];
      const r2 = ["= ", fmt(ax), ` ${bs} `, String(B), " = ", done ? { t: fmt(v), c: CH } : { box: "v", cells: String(v).replace("-", "−").length, L: this }];
      if (done) r2.push("   ", { t: pair(x, v), c: CH });
      const dx2 = mrow("", [lead, " "], 0, 0, {}, false).w, recW = Math.max(mrow("", r1, 0, 0, {}, false).w, dx2 + mrow("", r2, 0, 0, {}, false).w);
      const RY = LY + 7, bottom = writing ? RY + 4 + 3 + 2 : RY + 1;
      const { fr, ww } = ownFrame(this, xL, Math.max(xR + (beside ? ruleW + 1 : 0), xL + recW), bottom);
      const say = {
        hops: [`Hop from 0 by ${A}, as many times as x says.`, negs ? "Sizes first: hop to the right. Tap, or drag." : "Tap to add a hop, or drag."],
        flip: ["Now flip the hops over 0, once for each negative.", this.flips ? "Then hop on from the end dot." : "Drag them across 0."],
        b: [n ? "Hop the rule's last number from the end." : "x is 0: no hops. Hop the rule's last number from 0.", "Drag the end dot."],
        write: ["Write what comes out.", ""],
        done: [`${fmt(x)} goes in and ${fmt(v)} comes out: that pair is a point on the graph of f.`, ""],
      }[st];
      dhead(this, say[0], say[1], fr.x + 2, 0, ww);
      if (k > 1) text(`kn${k}`, `${k} squares = 1`, xL, 5, "small", { anchor: "start" });
      // the line: arrowheads both ends, a tick every one (0 longest), numbers on the strong lines
      line(`ln${xL}_${xR}`, xL, LY, xR, LY);
      path(`lr${xR}`, `M${sq(xR - 0.8)} ${sq(LY - 0.8)}L${sq(xR)} ${sq(LY)}L${sq(xR - 0.8)} ${sq(LY + 0.8)}`);

// ---------- Start and rate (g8-model) ----------

    picked: [], placed: null, ghost: null, bad: null, held: null, hopped: false, tx: 0, ty: 0,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return this.fr; },
    step() { const [i, j] = [...this.picked].sort((a, b) => a - b); return { dx: xs[j] - xs[i], dy: ys[j] - ys[i], i, j }; },
    tap(q) {

        const sw = pts.find(t => t.u === p.v && t.v === p.u), same = pts.find(t => t.u === p.u);
        this.bad = p;
        this.msg = sw ? `Across is ${names[0]}, up is ${names[1]}.` : same ? `That's ${pair(p.u, p.v)}. The table says ${pair(same.u, same.v)}: up to ${same.v}.`
          : `That's ${pair(p.u, p.v)}. Pick a row: its ${names[0]} across, then its ${names[1]} up.`;
      }
      if (h === "hd0" || h === "hd1") {
        if (this.hd.every(p => onLine(p, m1, b1))) { this.laid = true; this.stage = "pick"; return; }
        if (!onLine(this.hd[+h[2]], m1, b1)) this.msg = "Lay it through the first two points.";
      }
    },
    cancel() { this.held = null; this.ghost = null; },
    act(c) {
      if (boxAct(this, c)) return;
      if (c.startsWith("pick:") && this.stage === "pick") {
        const id = c.slice(5); this.picked = id;
        if (id === (straight ? "s" : "b")) { this.msg = null; this.stage = straight ? "eq" : "done"; if (straight) { this.typing = true; this.active = "m"; } return; }
        this.msg = straight ? "Every point is on the line, so it's straight." : `${pair(far.u, far.v)} is off the line, so it bends.`;
        return;
      }
      if (c !== "check" || this.stage !== "eq") return;
      const vm = num(this.vals.m), vb = num(this.vals.c);
      if (Number.isNaN(vm) || Number.isNaN(vb)) { this.msg = "Fill in both boxes."; return; }
      if (vm === P.m && vb === P.b) { this.verdict = null; this.msg = null; this.stage = "done"; this.typing = false; return; }
      this.verdict = "wrong";
      if (vm === P.b && vb === P.m) { this.active = "m"; this.msg = "The step up goes with x. The start is y at x = 0."; }
      else if (vm !== P.m) { this.active = "m"; this.msg = `The step up, ${P.m}, goes with x.`; }
      else { this.active = "c"; this.msg = `y at x = 0 is the number on its own, ${P.b}.`; }
    },
    scene() {
      const st = this.stage, done = st === "done", writing = st === "eq" || done;
      const stepRow = [steps.map(d => `+${d}`).join(", ")];
      const recs = !writing ? [] : straight ? [stepRow, done ? [{ t: eqStr, c: CH }] : ["y = ", { box: "m", cells: 2, L: this }, "x + ", { box: "c", cells: 2, L: this }]]
        : [stepRow, { say: "steps change: not linear" }];
      const colW = Math.max(16, recWidth([stepRow, { say: "steps change: not linear" }])), TH = 15;
      const colH = TH + 4 + (writing ? 4 * recs.length + 2 : st === "pick" ? 3 : 0);
      const lay = this.lay = planeLayout(this, { u0: 0, u1: 3, v0: 0, v1: Math.max(...ys) }, { l: 3, r: 9, t: 3, bm: 3 }, colW, colH, "left", colW, TH + 4 + 10);
      const { T, colX, colY, box } = lay, tx = colX, ty = colY;
      this.fr = lay.fr;
      const say = {
        place: [`${P.area ? "A square's side s and its area A. " : ""}Place the first two points from the table.`, "Tap or drag to a crossing."],
        lay: ["Lay a line through the first two points.", "Drag its two round handles."],
        pick: ["Straight or bent? Tap one.", ""],
        eq: ["Write the rule.", ""],
        done: [straight ? "Same steps across, same steps up: it's straight." : "Same steps across, different steps up: it bends.", ""],
      }[st];
      dhead(this, say[0], say[1], lay.fr.x + 2, T, lay.ww);
      unitNote(lay, names[1]);
      axes("ax", box, { names, skip: skipNear(this.laid ? off.map(p => ({ x: X(p.u) + 1, y: Y(p.v), w: 1 })) : []) });
      table("tb", tx, ty, names, pts, i => this.placed.some(p => p.u === pts[i].u) || this.placed.length === 2);
      // the line through the first two, laid by its handles
      if (st === "lay") { lineThrough(`lay${this.hd.map(h => h.u + "_" + h.v).join()}`, this.hd[0], this.hd[1], box, { c: "var(--ink2)", live: !!this.held }); this.hd.forEach((h, i) => handle(`hd${i}`, h, this.held === "hd" + i)); }
      if (this.laid) lineThrough("ln", pts[0], pts[1], box, { c: done && straight ? CH : "var(--ink2)" });
      // the points: the hand's two, then the other two draw in; once laid, on the line in the colour, off it ringed and measured
      if (this.placed.length) pts.forEach((p, i) => {
        const own = this.placed.some(t => t.u === p.u);
        if (!own && this.placed.length < 2) return;
        const isOff = this.laid && off.includes(p);
        dot(`p${i}`, X(p.u), Y(p.v), 0.5, { c: this.laid && !isOff ? CH : "var(--ink)", delay: own ? undefined : 0.2 + 0.25 * i });
        if (isOff) {
          ring(`pr${i}`, X(p.u), Y(p.v), 0.95);
          const yl = Y(b1 + m1 * p.u), xm = X(p.u) + 1.4;
          path(`ms${i}`, `M${sq(xm - 0.4)} ${sq(yl)}H${sq(xm)}V${sq(Y(p.v) + 1)}M${sq(xm - 0.4)} ${sq(Y(p.v) + 1)}H${sq(xm)}`, { c: "var(--ink2)" });
        }
      });
      if (this.ghost) pt("ghost", this.ghost.u, this.ghost.v, { c: CH, live: true, r: 0.6 });
      if (this.bad && this.msg) pt(`bad${this.bad.u}_${this.bad.v}`, this.bad.u, this.bad.v, { c: "var(--wrong)" });
      let ro = "";
      if (this.ghost) ro = pair(this.ghost.u, this.ghost.v);
      if (st === "lay") ro = slopeOf(this.hd[0], this.hd[1]);
      if (st === "pick") ro = straight ? "All four are on the line." : `${pair(far.u, far.v)} is ${gap} above the line.`;
      readout(ro, tx, ty + TH + 2);
      if (st === "pick") pickBlocks(this, "pk", [{ id: "s", label: "Straight" }, { id: "b", label: "Bent" }], tx, ty + TH + 4);
      if (writing) record(recs, colX, ty + TH + 6, st);
    },
  });
  return L;
}

// ---------- Graphs that tell a story (g8-story) ----------
// The plane's first quadrant: across in minutes (a square each), up in meters from home (2 a square, numbered on the
// strong lines). Read: tap the piece the words ask for. Draw: a pen from the last point to the next crossing, piece by
// piece; readout up, flat, down.
function lStory(index, P0) {
  const P = P0 || genStory(index), G = GSTORY[P.t], CH = "var(--chapter)";
  const kindOf = (a, b) => b > 0 ? "up" : b < 0 ? "down" : "flat";
  const given = [{ u: 0, v: 0 }]; P.runs.forEach((a, i) => given.push({ u: given[i].u + a, v: given[i].v + P.rises[i] }));
  const stages = P.read ? ["tap", "done"] : ["draw", "done"];
  const L = {
    id: "story", index, P, stage: stages[0], msg: null, fr: null, k: 1,
    pts: [{ u: 0, v: 0 }], pen: null, bad: null, held: false, hit: null,
    progress() { return P.read ? stageIndex(stages, this.stage) : [this.pts.length - 1, 3]; },
    frame() { return this.fr; },
    corners() { return P.read ? given : this.pts; },
    tap(q) {
      if (this.stage !== "tap") return false;
      const d = [0, 1, 2].map(i => { const a = given[i], b = given[i + 1], ax = a.u, ay = -a.v, bx = b.u, by = -b.v, L2 = (bx - ax) ** 2 + (by - ay) ** 2;
        const t = clamp(((q.x - ax) * (bx - ax) + (q.y - ay) * (by - ay)) / L2, 0, 1); return Math.hypot(q.x - ax - t * (bx - ax), q.y - ay - t * (by - ay)); });
      const i = d.indexOf(Math.min(...d));
      if (d[i] > 2) return false;
      this.hit = i;
      if (i === P.ask) { this.msg = null; this.stage = "done"; } else this.msg = G.pieces[i].read;
      return true;
    },
    grab(q) {
      if (this.stage !== "draw" || q.x < -1 || q.x > GW + 1 || q.y > 1 || q.y < -GH - 1) return false;
      this.held = true; this.bad = null; this.msg = null; this.pen = this.snap(q); return true;
    },
    snap(q) { return { u: clamp(Math.round(q.x), 0, GW), v: clamp(Math.round(-q.y), 0, GH) }; },
    drag(q) { this.pen = this.snap(q); },
    release() {
      this.held = false;
      const a = this.pts[this.pts.length - 1], p = this.pen; this.pen = null;
      if (!p || (p.u === a.u && p.v === a.v)) return;
      const i = this.pts.length - 1, pc = G.pieces[i], du = p.u - a.u, dv = p.v - a.v;
      const miss = m => { this.bad = { a, p }; this.msg = m; };
      if (du <= 0) return miss("Time goes on: draw to the right.");
      if (kindOf(du, dv) !== pc.k) return miss(pc.draw);
      if (pc.home && p.v !== 0) return miss(`Home is 0 meters: go all the way down.`);
      if (pc.steeper != null) {
        const b0 = this.pts[pc.steeper], b1 = this.pts[pc.steeper + 1];
        if (Math.abs(dv) / du <= Math.abs(b1.v - b0.v) / (b1.u - b0.u)) return miss(pc.steep);
      }
      this.pts.push(p);
      if (this.pts.length === 4) this.stage = "done";
    },
    cancel() { this.held = false; this.pen = null; },
    act() {},
    scene() {
      PK = 1;
      const st = this.stage, done = st === "done", RX = GW + 3;
      const w = Math.max(46, RX + 8 + 4 + 2), fx = Math.round((-4 + RX + 8) / 2 - w / 2);
      const t0 = fitTo({ x: fx, y: 0, w, h: GH + 14 }), ww = Math.min(60, (t0.x + innerWidth / t0.s) / SQ - fx - 4);
      const say = P.read ? {
        tap: [`${G.say} ${G.pieces[P.ask].q}`, "Tap that piece of the graph."],
        done: [G.done, ""],
      }[st] : {
        draw: [this.pts.length === 1 ? `${G.say} Draw the graph.` : "Draw the next piece.", this.pts.length === 1 ? "Drag from home, at 0, piece by piece." : "Drag from the last point."],
        done: [G.done, ""],
      }[st];
      const T = -GH - 2 - 6 - 2 * (wrapN(say[0], ww) - 1), bottom = done ? 11 : 2;
      const fr = this.fr = { x: fx, y: T - 0.5, w, h: bottom - T + 1.5 };
      dhead(this, say[0], say[1], fr.x + 2, T, ww);
      text("kn", "Up: a square is 2 meters.", 0, -GH - 3, "small", { anchor: "start" });
      // the axes: minutes across, meters up (2 a square), numbered on the strong lines
      const head = (k, x, y, dx, dy) => path(k, `M${sq(x - 0.8 * dx + 0.8 * dy)} ${sq(y - 0.8 * dy + 0.8 * dx)}L${sq(x)} ${sq(y)}L${sq(x - 0.8 * dx - 0.8 * dy)} ${sq(y - 0.8 * dy - 0.8 * dx)}`);
      line("axx", 0, 0, GW + 2, 0); head("axxa", GW + 2, 0, 1, 0);
      line("axy", 0, 0, 0, -GH - 1); head("axya", 0, -GH - 1, 0, -1);
      for (let n = 5; n <= GW; n += 5) lab(`axn${n}`, String(n), "below", 0, n);
      for (let n = 5; n <= GH; n += 5) lab(`ayn${n}`, String(2 * n), "left", 0, -n);
      text("ax0", "0", -0.5, 0.85, "small", { anchor: "end" });
      text("axnx", "minutes", GW + 1, -0.95, "small", { anchor: "end" });
      text("axny", "meters from home", 0.9, -GH - 0.4, "small", { anchor: "start" });
      // the graph: given (read) or drawn so far
      const c = this.corners();
      for (let i = 0; i + 1 < c.length; i++) {
        const lit = done && (P.read ? i === P.ask : true), wrong = P.read && this.hit === i && this.msg;
        line(`g${i}_${c[i + 1].u}_${c[i + 1].v}`, c[i].u, -c[i].v, c[i + 1].u, -c[i + 1].v, { c: wrong ? "var(--wrong)" : lit ? CH : "var(--ink)", w: 1.5 });
      }
      c.forEach((p, i) => dot(`gc${i}_${p.u}_${p.v}`, p.u, -p.v, 0.3, { c: "var(--ink)" }));
      let ro = "";
      if (!P.read && !done) {
        const a = this.pts[this.pts.length - 1];
        if (this.pen) { line("pen", a.u, -a.v, this.pen.u, -this.pen.v, { c: CH, live: true }); ro = this.pen.u > a.u || this.pen.v !== a.v ? kindOf(this.pen.u - a.u, this.pen.v - a.v) : ""; }
        if (this.bad && this.msg) line(`bad${this.bad.p.u}_${this.bad.p.v}`, a.u, -a.v, this.bad.p.u, -this.bad.p.v, { c: "var(--wrong)" });
        handle("pa", a, this.held);
      }
      readout(ro, RX, -GH + 1);
      if (done) {
        text(`rk${G.kinds}`, G.kinds, 0, 4.5, "say", { anchor: "start", c: CH });
        text(`rw${G.words}`, G.words, 0, 7, "say", { anchor: "start" });
        block("next", 0, 9, 10, "Next problem", "next");
      }
    },
  };
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  isfunc: { name: "One output each", make: lIsFunc, gen: genIsFunc },
  func: { name: "Evaluate a function", make: lFunc, gen: genFunc },
  model: { name: "Start and rate", make: lModel, gen: genModel },
  linear: { name: "Straight or bent?", make: lLinear, gen: genLinear },
  story: { name: "Graphs that tell a story", make: lStory, gen: genStory },
};
const IDX = {};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
// start(id, index, problem): problem is optional (the test driver passes one to see a given case)
function start(id, index, P) {
  id = String(id || "").replace(/^g8-/, "");
  if (!LESSONS[id]) id = "isfunc";
  if (index != null) IDX[id] = index;
  token++;
  PK = 1;
  lesson = LESSONS[id].make(IDX[id] || 0, P);
  pick.value = id;
  drawn = new Set(); keys.blur(); keys.value = "";
  render(); frame(lesson.frame(), true); render();
  try { localStorage.setItem("g8ch4-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value);
document.getElementById("fresh").onclick = () => leave();
function leave() {
  const go = () => { IDX[lesson.id] = (IDX[lesson.id] || 0) + 1; start(lesson.id); };
  if (lesson.leave) lesson.leave(go); else go();
}
let first = "isfunc", firstI = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g8ch4-lesson") || "isfunc";
  firstI = +(u.get("i") || 0);
  if (u.get("theme")) document.documentElement.dataset.theme = u.get("theme");
} catch (err) {}
start(first, firstI);
addEventListener("resize", () => render());
</script>
