<title>8th Grade: Slides, flips and turns</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is

   slide / flip / turn piece after grade10-ch4.html's. Chapter colour: grade8.md names none, so this geometry chapter
   takes new5-lessons.html's geometry teal (as 10th grade's geometry chapters do): chapters 1–2 are pink, 3 blue, 4
   violet, 5 ochre. */
/* ′ (prime) drawn from a serif face so A′ never reads as A' (the rounded faces draw it upright) */
@font-face { font-family: "Prime"; src: local("Georgia"), local("Times New Roman"), local("Times"); unicode-range: U+2032-2033; }
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #1E8A78; --tint: rgba(30, 138, 120, .2); --tint-strong: rgba(30, 138, 120, .4);
  --right: #178A57; --wrong: #C8372D;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #4FD1BC; --tint: rgba(79, 209, 188, .22); --tint-strong: rgba(79, 209, 188, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #4FD1BC; --tint: rgba(79, 209, 188, .22); --tint-strong: rgba(79, 209, 188, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
/* a unit cube's faces: the chapter colour mixed into the paper, opaque so cubes in front hide cubes behind */
:root { --cube-top: color-mix(in srgb, var(--chapter) 18%, var(--paper)); --cube-front: color-mix(in srgb, var(--chapter) 34%, var(--paper));
  --cube-side: color-mix(in srgb, var(--chapter) 52%, var(--paper)); --cube-edge: color-mix(in srgb, var(--chapter) 70%, var(--ink)); }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none; margin: 0;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
/* 0s that pass the point fall away */
.out-fall { animation: fall .75s ease-in forwards; transform-box: fill-box; }
@keyframes fall { from { opacity: 1; } to { opacity: 0; transform: translateY(36px); } }
/* hops flipped over 0 turn over like a card round the 0 line (7th grade's flip) */
.flip-in { transform-box: view-box; animation: flipin .5s ease-out; }
@keyframes flipin { from { transform: scaleX(-1); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade, .flip-in { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }

  border-radius: 999px; cursor: pointer; white-space: nowrap; }

#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }

</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">

<nav id="bar" aria-label="Lessons">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const isqrt = n => { let r = Math.floor(Math.sqrt(n)); while (r * r > n) r--; while ((r + 1) * (r + 1) <= n) r++; return r; };
const isSquare = n => isqrt(n) ** 2 === n;
// an integer read with `places` decimals, trailing zeros dropped: (2916, 2) → "29.16", (500, 2) → "5"
function dec(v, places) {
  const s = String(v).padStart(places + 1, "0"), w = s.slice(0, s.length - places), f = s.slice(s.length - places).replace(/0+$/, "");
  return f ? `${w}.${f}` : w;
}
const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹", "-": "⁻" };
const sup = n => String(n).split("").map(c => SUP[c] || c).join("");

let items = [], drawn = new Set();
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in, and an
// optional delay (a count that runs on). UP: what's put now faces the child (drawn over the tilting paper, never tilted)
let UP = false;
// XF: what's put now turns with a transform (the balance's beam tipping about its pivot)
let XF = null;
function put(k, tag, a, kind = "fade", text, delay) { items.push({ k, tag, a: XF ? { ...a, transform: XF } : a, kind, text, up: UP, delay }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay);
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: 1,
    "stroke-dasharray": o.dash ? "0.03 0.03" : null }, o.live ? "none" : o.dash ? "fade" : "line", undefined, o.delay);
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, "stroke-dasharray": o.dash ? "6 6" : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null }, o.live ? "none" : o.c && !o.fill && !o.dash ? "line" : "fade", undefined, o.delay);
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade", undefined, o.delay); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s, o.delay);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// how many rows words() wraps a line into
function wrapN(s, widthSq, cls = "say") {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per)); let n = 0, cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { n++; cur = w; } else cur = (cur + " " + w).trim(); }
  return n + (cur ? 1 : 0);
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c, live: o.live }); continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c, live: o.live }); col += 2;
  }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// a label's ink half a square from the edge it labels
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c, o = {}) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c, ...o });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c, ...o });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end", ...o });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start", ...o });
}
// an answer box in the record: cells of 2 squares, what's typed lined up on the right (or centred), the cursor after it
function dbox(k, x, y, cells, value, state, actName, centred = false) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null, v = String(value || "").replace("-", "−");
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (v) {
    if (centred) text(`${k}v`, v, x + cells, y + 1, "maths", { c: vc, live: true });
    else digits(`${k}v${v}`, v, x + cells * 2, y + 1, { c: vc, live: true });
  }
  if (state === "active") {
    const cx = centred ? x + cells + (v ? v.length * 0.31 : 0) + 0.25 : x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// a line of maths laid on the grid (names and the record): a character 2 squares, a space 1, a superscript 1 square a
// character in small type, an answer box 2 squares a cell (raised for an exponent), a fraction as a column with its bar
// on the row's middle, a root with its bar over the number. Returns its width and where each part sits.
// draw = false only measures. Tokens: "x² · " strings, {t, c} coloured text, {sup}, {box, cells, sup, L}, {frac: [top, bottom]},
// {root, idx}.
function mrow(k, toks, x, y, o = {}, draw = true) {
  let cx = x; const at = {};
  toks.forEach((t, i) => {
    if (t == null) return;
    const kk = `${k}.${i}`, x0 = cx, c = (t && t.c) || o.c;
    const T = (key, s, px, py, cls, col) => { if (draw) text(key, s, px, py, cls, { c: col, live: o.live }); };
    if (typeof t !== "object" || t.t != null) {
      for (const ch of String(typeof t === "object" ? t.t : t)) {
        if (ch === " ") cx += 1;
        else if (ch === "." || ch === ",") T(`${kk}p${ch}${cx}`, ch, cx, y, "maths", c);
        else { T(`${kk}${ch}${cx}`, ch, cx + 1, y, "maths", c); cx += 2; }
      }
    } else if (t.word != null) {
      // a word in the record (slope, table:) is written as a word, not a letter a square
      if (draw) text(`${kk}w${t.word}${cx}`, t.word, cx, y, "maths", { anchor: "start", c, live: o.live });
      cx += Math.ceil(t.word.length * 0.95);
    } else if (t.box) {
      const typed = String(t.L.vals[t.box] || ""), tight = typed.includes(".");
      const cells = Math.max(t.cells || 1, tight ? Math.ceil((typed.length + 1) / 2) : typed.length);
      if (draw) dbox(`${k}b${t.box}`, cx, t.sup ? y - 2 : y - 1, cells, typed, boxState(t.L, t.box), `box:${t.box}`, tight || !!t.centred);
      cx += cells * 2;
    } else if (t.sup != null) {
      // an exponent hugs its base: its first character starts in the base's last square
      const chs = String(t.sup).replace("-", "−"); cx -= 0.7;
      for (const ch of chs) { T(`${kk}s${ch}${cx}`, ch, cx + 0.5, y - 0.9, "small", c || "var(--ink)"); cx += 1; }
      cx += 0.7;
    } else if (t.frac) {
      const wt = mrow("", t.frac[0], 0, 0, o, false).w, wb = mrow("", t.frac[1], 0, 0, o, false).w, W = Math.max(wt, wb) + 2;
      if (draw) {
        mrow(kk + "t", t.frac[0], cx + (W - wt) / 2, y - 1, { ...o, c });
        line(`${kk}bar`, cx, y, cx + W, y, { c: c || "var(--ink)" });
        mrow(kk + "b", t.frac[1], cx + (W - wb) / 2, y + (t.frac[1].some(u => u && u.sup != null && !u.box) ? 1.7 : 1), { ...o, c });
      }
      cx += W;
    } else if (t.root != null) {
      const s = String(t.root), w = s.length * 2;
      if (draw) {
        path(`${kk}rad${s}`, `M${sq(cx + 0.2)} ${sq(y + 0.15)}L${sq(cx + 0.65)} ${sq(y - 0.1)}L${sq(cx + 1.15)} ${sq(y + 0.9)}L${sq(cx + 1.8)} ${sq(y - 1.2)}H${sq(cx + 2.2 + w)}`, { c: c || "var(--ink)" });
        if (t.idx) T(`${kk}ri`, t.idx, cx + 0.75, y - 0.75, "small", c || "var(--ink)");
        mrow(kk + "rd", [s], cx + 2, y, { ...o, c });
      }
      cx += 2 + w;
    }
    at[t.id || t.box || i] = { x: x0, w: cx - x0 };
  });
  return { w: cx - x, at };
}
// what to do on the rows above the picture: one line, and a small second line (or what a miss says, in red)
function dhead(L, say, sub, x = 0, y = 0, width = 60) {
  const n = words(`say-${say}`, say, x, y + 1, width);
  const y2 = y + 1 + 2 * n + 0.3;
  if (L.msg) words(`msg-${L.msg}`, L.msg, x, y2, width, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, x, y2, width, "small");
}
// lessons with answer boxes: each box has its own value; the hidden input types into the active one
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; L.verdict = null; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];
const num = s => s === "" || s == null ? NaN : +String(s).replace("−", "-");
// the first problems of a run are the friendly ones: the smallest of six draws (the web's withEasyStart)
function easyStart(i, draw, size) {
  let best = draw();
  if (i >= 3) return best;
  for (let k = 1; k < 6; k++) { const p = draw(); if (size(p) < size(best)) best = p; }
  return best;
}

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none" && it.kind !== "fall", a = { ...it.a };
    if (it.kind === "fall") { a.class = ((a.class || "") + " out-fall").trim(); a.style = `animation-delay:${(it.delay || 0).toFixed(3)}s;`; }
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      const d = it.delay != null ? it.delay : Math.min(n++ * 0.035, 1.2);
      a.style = `animation-delay:${d.toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  const m = lesson.paperMatrix && lesson.paperMatrix();
  if (m) document.getElementById("paperg").setAttribute("transform", `matrix(${m.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  // a lesson that's moving (the paper tilting, cubes rising) draws again next frame
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `${lesson.index < 3 ? "Guided" : "Problem"} ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.25x. The frame's top row sits at the top
// of the screen (the words on rows 0–2), centred across; no empty band above the paper.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 24, bottom = 110;

    flipMark() { const hd = this.hand(), j = [1, 2].reduce((b, k) => Math.hypot(this.cur[k].u - hd.h.u, this.cur[k].v - hd.h.v) > Math.hypot(this.cur[b].u - hd.h.u, this.cur[b].v - hd.h.v) ? k : b, 1);

    hand() { const R = this.cur[0], d = [1, 2].map(j => { const x = this.cur[j].u - R.u, y = this.cur[j].v - R.v, l = Math.hypot(x, y); return { x: x / l, y: y / l, l }; });
      const r = Math.max(d[0].l, d[1].l), bx = d[0].x + d[1].x, by = d[0].y + d[1].y, bl = Math.hypot(bx, by); return { R, r, h: PU(R.u + bx / bl * r, R.v + by / bl * r) }; },
    grab(q0) {

    drag(q0) {

      if (h.m === "slide") { const f = fitSlide(cur, Math.round(q.u - h.g.u), Math.round(q.v - h.g.v), CBOX); h.du = f.du; h.dv = f.dv; this.live = shift(cur, f.du, f.dv); this.ro = slideWords(f.du, f.dv); return; }

      h.t = Math.abs(off) >= 0.5 ? clamp(mv / (-2 * off), 0, 1) : clamp(Math.abs(mv) / 2, 0, 1);

    },
    release() {
      const h = this.held; this.held = null; this.live = null; this.ro = ""; if (!h) return;
      const cur = this.cur;
      if (h.m === "slide") { if (!h.du && !h.dv) return; this.cur = shift(cur, h.du, h.dv); this.note({ k: "slide", du: h.du, dv: h.dv }); }
      else if (h.m === "turn") {
        const raw = Math.round(h.cum / (Math.PI / 2)), r4 = ((raw % 4) + 4) % 4, qq = r4 === 3 ? -1 : r4; if (!qq) return;
        const nx = cur.map(p => turnQ(p, cur[0], qq));
        if (!insideBox(nx, CBOX)) { this.msg = "No room to turn it here: slide it nearer the middle first."; return; }
        this.cur = nx; this.note({ k: "turn", q: qq, c: cur[0] });
      } else { if (!h.ax || h.t < 0.5) return; this.cur = cur.map(p => mirror(p, { k: h.ax })); this.note({ k: "flip", ax: h.ax }); }

      if (Math.hypot(c1.u - c2.u, c1.v - c2.v) < 1.5) this.msg = needFlip ? "It's facing the other way: it needs a flip. Drag the corner with the arrows toward an axis." : "It's turned the wrong way: turn it by its handle.";
      // the first move that leaves it facing the wrong way names the flip (once)

    // the moves written as they happen: slides together, turns about one point together, a flip undone struck off
    note(mv) {

      if (last && last.k === "slide" && mv.k === "slide") { last.du += mv.du; last.dv += mv.dv; if (!last.du && !last.dv) this.moves.pop(); return; }

    cancel() { this.held = null; this.live = null; this.ro = ""; },
    act(c) {},
    scene() {
      const st = this.stage, done = st === "done", cur = this.cur, moved = this.moves.length > 0 || !sameAll(cur, A0);
      const words = mv => mv.k === "slide" ? `slide ${slideWords(mv.du, mv.dv)}` : mv.k === "flip" ? `flip over the ${mv.ax}-axis` : `turn ${turnRead(mv.q * 90)} about ${pair(mv.c.u, mv.c.v)}`;
      const recs = this.moves.map(mv => ({ say: words(mv), c: CH }));
      const colW = Math.max(20, ...recs.map(r => Math.ceil(r.say.length * 0.78)), Math.ceil("turn 90° ↺ about (−6, −6)".length * 0.78));
      const colH = 5 + 2 * Math.max(3, recs.length) + 3;
      const lay = this.lay = lay6(this, { u0: CBOX.u0 + 1, u1: CBOX.u1 - 1, v0: CBOX.v0 + 1, v1: CBOX.v1 - 1 }, colW, colH, this.moves.length ? colW : 16);
      const { T, colX, colY, box } = lay;

      const say = done ? ["Moved without stretching, so the two shapes are congruent.", ""]

      if (!done) { S.disc(hd.h.u, hd.h.v, 1); const f = this.flipMark(); S.disc(f.p.u, f.p.v, 1.4); }
      if (done) { seeMarks(S, "s0", A0, "var(--ink2)"); seeMarks(S, "s1", cur, CH); }
      if (PK > 1) unitBeside(T, [], lay.fr.x + 2);
      axes("ax", box, { skip: S.skip });
      // the axis a flip turns it over, in the chapter colour while the finger holds it
      if (h && h.m === "flip" && h.ax) h.ax === "x" ? line("fx", X(box.u0), 0, X(box.u1), 0, { c: CH, live: true }) : line("fy", 0, Y(box.v0), 0, Y(box.v1), { c: CH, live: true });

      shapeU("b", B, { fill: "none", c: "var(--ink)" });
      if (!done && (!h || h.m !== "turn")) { dashRing(`rg${hd.R.u}_${hd.R.v}_${hd.r}`, hd.R, hd.r); }
      if (h && h.m === "turn") dashRing("rgl", hd.R, hd.r);
      shapeU("a", shown, { live: true });
      if (done) { rightMark("rm0", A0, { c: "var(--ink2)" }); rightMark("rm1", cur, { c: CH }); }
      if (!done) handle("hd", h && h.m === "turn" ? rotP(hd.h, hd.R, h.th) : hd.h, h && h.m === "turn");
      if (!done && !h) flipHandle("fm", this.flipMark());

      readout(this.ro, colX, colY + 1);
      recLines(this, recs, colX, colY + 5, done ? "done" : "none");

}

// ---------- Dilations (g8-dilate) ----------
// A triangle in the first quadrant, dashed rays from the origin through each corner; named "× 2 from (0, 0)". Drag a
// corner along its ray: every corner follows (snaps at × ½, × 1, × 2, × 3; readout "× 2"). Write corner A's new place,
// then a side's new length; the rule is the record. Then slide the stretched triangle onto a matching one (8.G.4).
function lDilate(index, P0) {
  const P = P0 || genDilate(index), k = P.k, tri = P.tri, img = tri.map(p => PU(p.u * k, p.v * k)), tgt = shift(img, P.tx, P.ty);
  const maxC = Math.max(...tri.map(p => Math.max(p.u, p.v))), SN = [0.5, 1, 2, 3].filter(s => s === k || (s <= Math.max(k, 2) && s * maxC <= 12)), smax = Math.max(...SN);
  const A = tri[0], A2 = img[0], LAB = Math.round(Math.hypot(tri[1].u - A.u, tri[1].v - A.v));
  const stages = ["stretch", "write", "side", "slide", "done"];

    id: "dilate", index, P, stage: "stretch", msg: null, verdict: null, typing: false, fr: null, lay: null, k: null,
    s: 1, held: null, bad: null, off: { du: 0, dv: 0 }, sl: null,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return this.fr; },
    grab(q0) {
      const q = U(q0);
      if (this.stage === "stretch") {
        const dj = tri.map(p => Math.hypot(q.u - p.u * this.s, q.v - p.v * this.s) * PK), j = dj.indexOf(Math.min(...dj));
        if (dj[j] >= 1.6) return false;
        this.held = { j }; this.msg = null; this.bad = null; return true;
      }
      if (this.stage === "slide") {
        if (!nearPoly(q, shift(img, this.off.du, this.off.dv), 0.3)) return false;
        this.held = { g: q }; this.sl = { ...this.off }; this.msg = null; return true;
      }
      return false;
    },
    drag(q0) {
      const h = this.held; if (!h) return;
      const q = U(q0);
      if (this.stage === "stretch") {
        const c = tri[h.j], s = clamp((q.u * c.u + q.v * c.v) / (c.u * c.u + c.v * c.v), 0.3, smax), sn = SN.find(x => Math.abs(s - x) < 0.15);
        this.s = sn ?? s; return;
      }
      const f = fitSlide(img, this.off.du + Math.round(q.u - h.g.u), this.off.dv + Math.round(q.v - h.g.v), this.lay.box); this.sl = f;
    },
    release() {
      const h = this.held; this.held = null; if (!h) return;
      if (this.stage === "stretch") {
        const s = SN.reduce((b, x) => Math.abs(this.s - x) < Math.abs(this.s - b) ? x : b, 1); this.s = 1;
        if (s === 1) return;
        if (s === k) { this.s = k; this.stage = "write"; this.active = "u"; this.typing = true; return; }
        this.bad = s; this.msg = `That's × ${kStr(s)}: every corner is ${s === 0.5 ? "half" : s + " times"} as far.`; return;
      }
      const f = this.sl; this.sl = null; if (!f) return;
      this.off = f;
      if (f.du === P.tx && f.dv === P.ty) { this.stage = "done"; this.msg = null; return; }
      if (f.du || f.dv) this.msg = "It isn't on the other triangle yet: keep sliding.";
    },
    cancel() { this.held = null; this.sl = null; if (this.stage === "stretch") this.s = 1; },
    act(c) {
      if (boxAct(this, c)) return;
      if (c !== "check") return;
      if (this.stage === "write") {
        const tu = num(this.vals.u), tv = num(this.vals.v);
        if (tu === A2.u && tv === A2.v) { this.stage = "side"; this.active = "side"; this.verdict = null; this.msg = null; return; }
        this.active = tu !== A2.u ? "u" : "v"; this.verdict = "wrong";
        this.msg = tu === A.u + k || tv === A.v + k ? `A dilation multiplies every coordinate by ${kStr(k)}.` : "Read A′ off the plane.";
        return;
      }
      if (this.stage === "side") {
        const t = num(this.vals.side);
        if (t === LAB * k) { this.stage = "slide"; this.typing = false; this.active = null; this.verdict = null; this.msg = null; return; }
        this.verdict = "wrong"; this.msg = t === LAB + k ? `A dilation multiplies every length by ${kStr(k)}.` : "Count A′B′'s squares on the plane.";

    scene() {

      const recs = d => {
        const r = [[`A(${fmt(A.u)},`, `${fmt(A.v)})`, "→", { t: "A′(", ng: true }, ansT(this, "u", A2.u, d || si > 1, true), { t: "," }, ansT(this, "v", A2.v, d || si > 1, true), { t: ")" }]];

      const { T, colX, colY, box } = lay;
      this.fr = lay.fr;
      const say = { stretch: [`Stretch it × ${kStr(k)} from (0, 0).`, "Drag a corner along its ray."], write: ["Write where A landed.", "Type each number."],
        side: ["Write how long A′B′ is.", "Type the number."], slide: ["Slide your stretched triangle onto the other one.", "Drag it."],
        done: [`Every length × ${kStr(k)} and every angle the same: similar.`, ""] }[st];

      const live = tri.map(p => PU(p.u * this.s, p.v * this.s)), stretched = Math.abs(this.s - 1) > 1e-9;
      const slid = shift(img, (this.sl || this.off).du, (this.sl || this.off).dv);

      if (si >= 1 && si <= 3) cornerNames(S, "nB", img, ["A′", "B′", "C′"], CH);
      if (done) { seeMarks(S, "s0", tri, "var(--ink2)"); seeMarks(S, "s1", tgt, CH); }
      if (PK > 1) unitBeside(T, [], lay.fr.x + 2);
      axes("ax", box, { skip: S.skip });
      rays.forEach((r, j) => r && line(`ray${j}`, X(r[0].u), Y(r[0].v), X(r[1].u), Y(r[1].v), { c: "var(--ink2)", dash: true }));
      if (badImg) shapeU(`bad${this.bad}`, badImg, { fill: "none", c: "var(--wrong)", dash: true });
      if (si >= 3) shapeU("tgt", tgt, { fill: "none", c: "var(--ink)" });
      if (si >= 3 && !done) shapeU("imgo", img, { fill: "none", c: CH, dash: true });
      shapeU("tri", tri, stretched || si >= 1 ? { fill: "none", c: "var(--ink2)" } : {});
      if (st === "stretch" && stretched) shapeU("live", live, { live: true });
      if (si >= 1 && si <= 2) shapeU("img", img);
      if (si >= 3) shapeU("sl", slid, { live: true });
      if (done) { rightMark("rm0", tri, { c: "var(--ink2)" }); rightMark("rm1", tgt, { c: CH }); }

      S.draw();
      readout(this.held ? (st === "stretch" ? `× ${SN.includes(this.s) ? kStr(this.s) : (Math.round(this.s * 10) / 10)}` : slideWords(this.sl.du, this.sl.dv)) : "", colX, colY + 1);
      if (si >= 1) recLines(this, recs(done), colX, colY + 5, done ? "done" : si >= 3 ? "none" : "check");
    },

}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  translate: { name: "Translations", make: lTranslate, gen: genTranslate },
  reflect: { name: "Reflections", make: lReflect, gen: genReflect },
  rotate: { name: "Rotations", make: lRotate, gen: genRotate },
  congruent: { name: "Same shape, moved", make: lCongruent, gen: genCongruent },
  dilate: { name: "Dilations", make: lDilate, gen: genDilate },
};
const IDX = {};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
// start(id, index, problem): problem is optional (the test driver passes one to see a given case)
function start(id, index, P) {
  id = String(id || "").replace(/^g8-/, "");
  if (!LESSONS[id]) id = "translate";
  if (index != null) IDX[id] = index;
  token++;
  PK = 1; XF = null;
  lesson = LESSONS[id].make(IDX[id] || 0, P);
  pick.value = id;
  drawn = new Set(); keys.blur(); keys.value = "";
  render(); frame(lesson.frame(), true); render();
  try { localStorage.setItem("g8ch6-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value);
document.getElementById("fresh").onclick = () => leave();
function leave() {
  const go = () => { IDX[lesson.id] = (IDX[lesson.id] || 0) + 1; start(lesson.id); };
  if (lesson.leave) lesson.leave(go); else go();
}
let first = "translate", firstI = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g8ch6-lesson") || "translate";
  firstI = +(u.get("i") || 0);
  if (u.get("theme")) document.documentElement.dataset.theme = u.get("theme");
} catch (err) {}
start(first, firstI);
addEventListener("resize", () => render());
</script>
