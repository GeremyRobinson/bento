<title>Grade 9 Equations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* 9th grade, chapter 1 (Equations and inequalities), from design/grade9.md. The kit of new5-lessons.html: the whole
   screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is the only chrome.
   1 square = 20 paper units, a strong line every 5 squares (a block). grade9.md names no chapter colour, so this uses
   the Whole numbers family's purple (Theme.swift's Chapter.whole, as grade4-ch1.html does). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #7A5CF0; --tint: rgba(122, 92, 240, .2); --tint-strong: rgba(122, 92, 240, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #A58BFF; --tint: rgba(165, 139, 255, .22); --tint-strong: rgba(165, 139, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #A58BFF; --tint: rgba(165, 139, 255, .22); --tint-strong: rgba(165, 139, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit of new5-lessons.html) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set(), born = new Map();
let UP = false;
function put(k, tag, a, kind = "fade", text) { items.push({ k, tag, a, kind, text, up: UP }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: o.fill ? null : 1,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linejoin": "round" }, o.live ? "none" : o.fill || o.dash ? "fade" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, rx: o.rx ?? null,
    pathLength: o.c && !o.fill ? 1 : null, transform: o.t || null }, o.live ? "none" : o.c && !o.fill ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)", stroke: o.stroke || null, "stroke-width": o.stroke ? 1.5 : null, "stroke-dasharray": o.dash ? "4 4" : null }, o.live ? "none" : "fade"); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c }); continue; }
    if (ch === "−") { text(`${k}${i}${ch}`, ch, right - col - 0.5, row, "maths", { c: o.c }); col += 1; continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c }); col += 2;
  }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Try another, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}

// what's drawn now, in squares: the camera frames it (words' widths are estimated from their size)
let drawnBox = null;
const CHW = { say: 0.72, small: 0.52, maths: 1 };
function boxOf(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
  for (const it of list) {
    const a = it.a;
    if (it.up || a.transform) continue;
    if (it.tag === "rect") add(+a.x, +a.y, +a.x + +a.width, +a.y + +a.height);
    else if (it.tag === "line") add(Math.min(a.x1, a.x2), Math.min(a.y1, a.y2), Math.max(a.x1, a.x2), Math.max(a.y1, a.y2));
    else if (it.tag === "circle") add(a.cx - a.r, a.cy - a.r, +a.cx + +a.r, +a.cy + +a.r);
    else if (it.tag === "text") {
      const cls = a.class || "small", w = String(it.text).length * (CHW[cls] || 0.6) * SQ, h = (cls === "maths" ? 1.3 : cls === "say" ? 1 : 0.7) * SQ / 2;
      const left = a["text-anchor"] === "start" ? +a.x : a["text-anchor"] === "end" ? a.x - w : a.x - w / 2;
      add(left, a.y - h, left + w, +a.y + h);
    }
  }
  return { x0: x0 / SQ, y0: y0 / SQ, x1: x1 / SQ, y1: y1 / SQ };
}
// the camera's frame for what's drawn now: from the top row (the words on rows 0–2) to the last thing drawn, a square
// of margin round it
function autoFrame() { const b = drawnBox; return { x: Math.min(-1, Math.floor(b.x0) - 1), y: -1, w: Math.ceil(b.x1) + 1 - Math.min(-1, Math.floor(b.x0) - 1), h: Math.ceil(b.y1) + 2 }; }

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(), now = performance.now(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const a = { ...it.a };
    if (it.kind !== "none") {
      // a piece draws in once; a redraw while it's still drawing in (a drag, a motion) carries on where it was
      if (!drawn.has(it.k)) born.set(it.k, { t: now, d: Math.min(n++ * 0.035, 1.2) });
      const b = born.get(it.k);
      if (b) {
        const age = (now - b.t) / 1000;
        if (age < b.d + 0.65) {
          a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
          a.style = `animation-delay:${(b.d - age).toFixed(3)}s;` + (a.style || "");
        } else born.delete(it.k);
      }
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  for (const k of [...born.keys()]) if (!next.has(k)) born.delete(k);
  drawnBox = boxOf(items);
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s). The frame's top sits at the top of the screen, so the
// words are on the top rows and the picture under them; it's centred across.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 20, bottom = 112;
  const s = Math.min((W - 40) / sq(f.w), (H - top - bottom) / sq(f.h), (lesson && lesson.maxZoom) || 1.6);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));
function toScreen(x, y) { const p = new DOMPoint(sq(x), sq(y)).matrixTransform(svg.getScreenCTM()); return { x: p.x, y: p.y }; }

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/-/g, "−").replace(/[^0-9.−]/g, "").slice(0, 6)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; pointer events, so mouse and touch ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); render(); frame(lesson.frame()); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) { render(); frame(lesson.frame()); }
});
function act(a) {
  if (a === "type") { openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}

// ---------- the designer kit (three text sizes, one line weight, labels half a square from what they label) ----------
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end" });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start" });
}
function dbox(k, x, y, cells, value, state, actName = "box:0") {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (value) digits(`${k}v${value}`, value, x + cells * 2, y + 1, { c: vc });
  if (state === "active") {
    const cx = x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// what to do on rows 0–2 (words 28), and under it a small line, or what a miss says in red (rows 3–4)
function dhead(L, say, sub) {
  const y = 3.3 + 2 * (words(`say-${say}`, say, 0, 1, 66) - 1);
  if (L.msg) words(`msg-${L.msg}`, L.msg, 0, y, 66, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, 0, y, 66, "small");
}
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { if (L.typing) L.active = a.slice(4); return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const ring = (k, x, y, r = 1.05) => path(k, `M${sq(x + r)} ${sq(y)}a${sq(r)} ${sq(r)} 0 1 1 0 -0.1`, { c: "var(--chapter)" });
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// ---------- 9th grade: shared pieces ----------
const M = "−", CH = "var(--chapter)", INK = "var(--ink)", INK2 = "var(--ink2)", INK3 = "var(--ink3)";
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const oneOf = a => a[rnd(0, a.length - 1)];
const fmt = n => (n < 0 ? M + Math.abs(n) : String(n));
const num = s => Number(String(s).replace(/−/g, "-"));
const dec = n => String(Math.round(n * 100) / 100);
const ceil5 = v => Math.ceil(v / 5) * 5, floor5 = v => Math.floor(v / 5) * 5;
// problems 1–3 are the smallest of six draws (the web's withEasyStart); from problem 4 the full range
function easy(idx, gen, size) {
  let best = gen(); if (idx >= 3) return best;
  let s = size(best);
  for (let k = 1; k < 6; k++) { const p = gen(), t = size(p); if (t < s) { best = p; s = t; } }
  return best;
}
// a·x + b as school writes it: "5x − 3", "x + 5", "−x", "8"
function lin(a, b, v = "x") {
  let s = a === 0 ? "" : a === 1 ? v : a === -1 ? M + v : fmt(a) + v;
  if (!s) return fmt(b);
  if (b > 0) s += ` + ${b}`; else if (b < 0) s += ` ${M} ${-b}`;
  return s;
}
const flipOp = op => ({ "<": ">", ">": "<", "≤": "≥", "≥": "≤" })[op];
const holds = (l, op, r) => op === "<" ? l < r : op === ">" ? l > r : op === "≤" ? l <= r : l >= r;

// a line of maths on the grid: digits and letters 2 squares each, a sign 3 (a space each side), brackets 1, the point on
// a grid line. Parts: "text", { s, c, ring }, { box, cells, value, state } (typed), { words, c, cls } (words after it).
const SIGNS = "+−=<>≤≥÷×";
function glyphs(s) {

    right(step) {
      const st = L.stage;
      if (st === "choose") { L.act(`pick:${opts.indexOf(right)}`); return; }
      if (st === "slide") { const i = full.indexOf(true), o = onesAt(i), px = pileX(); L.grab({ x: o.x + .5, y: o.bottom - .5 }); L.drag({ x: Math.max(o.x + 3.5, px + .5), y: o.bottom - .5 }); L.release(); return; }
      if (st === "write1") { L.act("box:d"); L.type(String(ab)); L.act("check"); return; }
      if (st === "take") { const px = pileX(); L.grab({ x: px + .5, y: BY - .5 }); L.drag({ x: px + .5, y: BY - .5 - (step === "half" ? 4 : 30) }); if (step !== "half") L.release(); return; }
      if (st === "share") { const hx = RX + (L.r ? dealW(ax, L.r) : tidyW(ax)), hy = BY - (L.r ? dealH(ax, L.r) : tidyH(ax)); L.grab({ x: hx, y: hy }); L.drag({ x: hx, y: BY - a }); if (step !== "half") L.release(); return; }
      if (st === "write3") { L.act("box:x"); L.type(String(x)); L.act("check"); }
    },
    onesAt, BY,
  };

}

// ---------- Rearrange a formula (g9-literal) ----------
// One square is one of the formula's units. Each formula is drawn as one real case so it can be counted; the hands undo
// it; the paper writes the moves as letters; then the same moves on another case, writing the number.
function dLiteral(idx) {
  const order = ["lw", "rt", "ir", "p", "f", "p", "f", "p", "sq", "sq", "c", "fc", "cyl"];
  const kind = idx < order.length ? order[idx] : oneOf(order);
  const L = { lw: litShare, ir: litShare, rt: litHops, p: litBar, f: litBar, sq: litSquare, c: litRecord, fc: litRecord, cyl: litRecord }[kind](kind, idx);
  L.id = "literal"; L.index = idx; L.maxZoom = 1.25; L.P.kind = kind;
  return L;
}
// the steps every picture kind shares after its hand moves: the letters, then another case to write
const litSay = {
  letters1: ["Your move, written with letters.", "Tap Try another."],
  letters2: ["Your two moves, written with letters.", "Tap Try another."],
};
function litCheck(L, ans, misses) {
  const v = L.vals.t;
  if (!v) { L.msg = "Type the number first."; return; }
  if (num(v) === ans) { L.stage = "done"; L.typing = false; L.active = null; L.verdict = null; L.msg = null; return; }
  L.verdict = "wrong";
  for (const [val, m] of misses) if (val != null && num(v) === val) { L.msg = m; return; }
  L.msg = misses.at(-1)[1];
}

// A = lw (for w) and V = IR (for R): the area's squares shared into rows, one row for each square of the side.
function litShare(kind, idx) {
  const isA = kind === "lw";
  const N = isA ? { T: "A", S: "l", W: "w", unit: "m", line: "m² ÷ m = m", note: "1 cell = 1 m²", what: "rectangle" }
    : { T: "V", S: "I", W: "R", unit: "ohms", line: "volts ÷ amps = ohms", note: "1 cell = 1 volt", what: "circuit" };
  const gen = () => { const l = rnd(2, 9), w = rnd(2, 9); return { l, w, A: l * w }; };
  const P = easy(idx, gen, p => p.l + p.w + p.A); let Q; do Q = gen(); while (Q.l === P.l && Q.w === P.w);
  P.try = Q;
  // the biggest cell that fits: rows at most 12 cells long, at most 10 rows
  const U = 3, X0 = 6, Y0 = 9, EQ = 48, stages = ["share", "letters", "try", "done"];
  const rminOf = n => Math.max(1, Math.ceil(n / 12)), rmaxOf = n => Math.min(10, n);
  const L = withBoxes({
    P, stage: "share", r: null, dr: null, msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return autoFrame(); },
    hpos() { const n = P.A; return this.r ? { x: X0 + dealW(n, this.r) * U, y: Y0 + dealH(n, this.r) * U } : { x: X0 + Math.min(10, n) * U, y: Y0 + Math.ceil(n / 10) * U }; },
    grab(q) { if (this.stage !== "share") return false; const h = this.hpos(); if (Math.hypot(q.x - h.x, q.y - h.y) > 2.5) return false; this.dr = true; this.msg = null; this.drag(q); return true; },
    drag(q) { this.r = clamp(Math.round((q.y - Y0) / U), rminOf(P.A), rmaxOf(P.A)); },
    release() { this.dr = null; if (this.r === P.l) { this.stage = "letters"; this.msg = null; } else { this.msg = `${N.S} is ${P.l}: make ${P.l} rows.`; this.r = null; } },
    act(k) {
      if (k === "another" && this.stage === "letters") { this.stage = "try"; this.typing = true; this.active = "t"; return; }
      if (boxAct(this, k) || k !== "check" || this.stage !== "try") return;
      litCheck(this, Q.w, [[Q.l, `${Q.l} is ${N.S}. Share ${Q.A} into ${Q.l} rows.`], [null, `Share ${Q.A} into ${Q.l} rows: ${Q.A} ÷ ${Q.l}.`]]);
    },
    scene() {
      const st = this.stage, C = st === "try" || st === "done" ? Q : P, tr = st === "try" || st === "done";
      const say = {
        share: [`Share the cells into ${N.S} rows.`, "Drag the handle down."],
        letters: litSay.letters1, try: [`Use it on another ${N.what}.`, "Type the number."],
        done: [`${N.W} = ${Q.w} ${N.unit}.`, `The same move works for every ${N.what}, so we can do it with letters.`],
      }[st];
      dhead(this, say[0], say[1]);
      // the side, l cells long, and the area's cells: rows of ten, or dealt into rows
      line(`side${C.l}${tr}`, X0, Y0, X0, Y0 + C.l * U, { c: INK });
      lab(`sidel${C.l}${tr}`, `${N.S} = ${C.l}`, "left", X0, Y0 + C.l * U / 2, "say");
      const r = st === "share" ? this.r : st === "try" ? null : C.l;
      const box = r ? deal(`ar${tr}`, C.A, r, X0, Y0, { live: !!this.dr, u: U }) : tens(`ar${st}`, C.A, X0, Y0, { u: U });
      lab(`aname${C.A}${tr}`, `${N.T} = ${C.A}`, "above", Y0, X0 + box.w * U / 2, "small");
      if (st === "share") {
        const h = this.hpos(); handle("hd", h.x, h.y, { big: !!this.dr });
        if (this.r) lab("rread", `${this.r} rows of ${Math.floor(P.A / this.r)}${P.A % this.r ? `, ${P.A % this.r} over` : ""}`, "right", h.x + 0.5, h.y, "small", CH);
      }
      if (r === C.l && st !== "share") lab(`wl${C.w}${st}`, `${N.W} = ${C.w}`, "right", X0 + C.w * U, Y0 + C.l * U / 2, "say", CH);
      text("note", N.note, X0, Y0 + Math.max(box.h, C.l) * U + 1.5, "small", { anchor: "start" });
      // the record
      const ry = 10;
      mrow("r1", [`${N.T} = ${N.S}`, { s: N.W, ring: true }], 0, ry, { eq: EQ });
      if (st === "share") return;
      mrow("r2", [`${N.T} ÷ ${N.S} = ${N.W}`], 0, ry + 3, { eq: EQ });
      mrow("r3", [`${N.W} = ${N.T} ÷ ${N.S}`], 0, ry + 6, { eq: EQ });
      const bx = EQ - 6, by = ry + 14;
      if (st === "letters") { block("another", bx, by, 10, "Try another", "another"); return; }
      const ans = st === "done" ? { s: String(Q.w), c: CH } : { box: "t", cells: 2, value: this.vals.t, state: boxState(this, "t") };
      mrow("r4", [`${N.W} = ${Q.A} ÷ ${Q.l} = `, ans, { words: N.unit, cls: "say" }], 0, ry + 9, { eq: EQ });
      text("units", N.line, EQ - 2, ry + 11.4, "small", { anchor: "start" });
      if (st === "try") block("check", bx, by, 7, "Check", "check"); else block("next", bx, by, 10, "Next problem", "next");
    },
  });
  L.test = {
    miss() { if (L.stage === "share") { const h = L.hpos(), r = P.l + 1 <= rmaxOf(P.A) ? P.l + 1 : P.l - 1; L.grab(h); L.drag({ x: h.x, y: Y0 + r * U }); L.release(); return true; }
      if (L.stage === "try") { L.act("box:t"); L.type(String(Q.l === Q.w ? Q.w + 1 : Q.l)); L.act("check"); return true; } return false; },
    right(step) { if (L.stage === "share") { const h = L.hpos(); L.grab(h); L.drag({ x: h.x, y: Y0 + P.l * U }); if (step !== "half") L.release(); }
      else if (L.stage === "letters") L.act("another"); else if (L.stage === "try") { L.act("box:t"); L.type(String(Q.w)); L.act("check"); } },
  };
  return L;
}

// d = rt (for t): a road of d miles; hops of r, one an hour, laid along it until they reach the end.
function litHops(kind, idx) {
  const gen = () => { for (;;) { const r = rnd(2, 12), t = rnd(2, 10); if (r * t <= 60) return { r, t, d: r * t }; } };
  const P = easy(idx, gen, p => p.r + p.t + p.d); let Q; do Q = gen(); while (Q.r === P.r && Q.t === P.t);
  P.try = Q;
  const Uof = C => clamp(Math.floor(60 / C.d), 1, 3);   // the biggest cell that fits: a mile is U squares
  let U = Uof(P);
  const X0 = 2, RY = 12, EQ = 12, stages = ["hop", "letters", "try", "done"];
  const L = withBoxes({
    P, stage: "hop", h: 0, dr: null, msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return autoFrame(); },
    grab(q) { if (this.stage !== "hop" || Math.abs(q.y - RY) > 4 || q.x < X0 - 1 || q.x > X0 + 62) return false; this.dr = true; this.msg = null; this.drag(q); return true; },
    drag(q) { this.h = clamp(Math.round((q.x - X0) / (P.r * U)), 0, Math.floor(62 / (P.r * U))); },
    release() {
      this.dr = null;
      if (this.h * P.r === P.d) { this.stage = "letters"; this.msg = null; return; }
      if (this.h) this.msg = `${this.h} ${this.h === 1 ? "hop makes" : "hops make"} ${this.h * P.r} miles. The road is ${P.d}.`;
      this.h = 0;
    },
    act(k) {
      if (k === "another" && this.stage === "letters") { this.stage = "try"; this.typing = true; this.active = "t"; return; }
      if (boxAct(this, k) || k !== "check" || this.stage !== "try") return;
      litCheck(this, Q.t, [[Q.r, `${Q.r} is r. Hop ${Q.r} at a time along ${Q.d}: ${Q.d} ÷ ${Q.r}.`], [null, `Count the hops of ${Q.r} in ${Q.d}: ${Q.d} ÷ ${Q.r}.`]]);
    },
    scene() {
      const st = this.stage, C = st === "try" || st === "done" ? Q : P;
      U = Uof(C);
      const say = {
        hop: ["Hop along the road to the end.", `Each hop is one hour: ${P.r} miles.`],
        letters: litSay.letters1, try: ["Use it on another trip.", "Type the number."],
        done: [`t = ${Q.t} hours.`, "The same move works for every trip, so we can do it with letters."],
      }[st];
      dhead(this, say[0], say[1]);
      // the road, its name at its end, one hour's hop marked under its start
      cells(`road${C.d}${st === "try"}`, X0, RY, C.d, 1, { u: U });
      lab(`dname${C.d}${st === "try"}`, `d = ${C.d} miles`, "right", X0 + C.d * U + 0.8, RY + U / 2, "small");
      path(`rbr${C.r}${st === "try"}`, `M${sq(X0)} ${sq(RY + U + 0.5)}v${sq(0.5)}H${sq(X0 + C.r * U)}v${sq(-0.5)}`, {});
      lab(`rname${C.r}${st === "try"}`, `1 hour: ${C.r} miles`, "below", RY + U + 1, Math.max(X0 + C.r * U / 2, X0 + 4), "small");
      const hops = st === "hop" ? this.h : st === "try" ? 0 : C.t;
      for (let i = 0; i < hops; i++) {
        const x0 = X0 + i * C.r * U, hl = C.r * U, hh = Math.min(3, hl / 2 + 0.5);
        path(`hop${i}_${C.r}${st === "done"}`, `M${sq(x0)} ${sq(RY)}Q${sq(x0 + hl / 2)} ${sq(RY - 2 * hh)} ${sq(x0 + hl)} ${sq(RY)}`, { c: CH, live: st === "hop" });
      }
      if (st === "hop" && this.dr) lab("hread", `${this.h} ${this.h === 1 ? "hop" : "hops"}: ${this.h * P.r} miles`, "above", RY - 3.2, X0 + Math.max(this.h * P.r * U, 4), "small", CH);
      if (st === "hop") handle("hd", X0 + this.h * P.r * U, RY, { big: !!this.dr });
      if (st === "letters" || st === "done") lab(`tl${C.t}${st}`, `t = ${C.t} hours`, "above", RY - 3.2, X0 + C.d * U / 2, "small", CH);
      // the record
      const ry = 20;
      mrow("r1", ["d = r", { s: "t", ring: true }], 0, ry, { eq: EQ });
      if (st === "hop") return;
      mrow("r2", ["d ÷ r = t"], 0, ry + 3, { eq: EQ });
      mrow("r3", ["t = d ÷ r"], 0, ry + 6, { eq: EQ });
      const bx = EQ - 6, by = ry + 13;
      if (st === "letters") { block("another", bx, by, 10, "Try another", "another"); return; }
      const ans = st === "done" ? { s: String(Q.t), c: CH } : { box: "t", cells: 2, value: this.vals.t, state: boxState(this, "t") };
      mrow("r4", [`t = ${Q.d} ÷ ${Q.r} = `, ans, { words: "hours", cls: "say" }], 0, ry + 9, { eq: EQ });
      text("units", "miles ÷ miles per hour = hours", EQ - 4, ry + 11.4, "small", { anchor: "start" });
      if (st === "try") block("check", bx, by, 7, "Check", "check"); else block("next", bx, by, 10, "Next problem", "next");
    },
  });
  L.test = {
    miss() { if (L.stage === "hop") { L.grab({ x: X0, y: RY }); L.drag({ x: X0 + (P.t - 1) * P.r * U, y: RY }); L.release(); return true; }
      if (L.stage === "try") { L.act("box:t"); L.type(String(Q.r === Q.t ? Q.t + 1 : Q.r)); L.act("check"); return true; } return false; },
    right(step) { if (L.stage === "hop") { L.grab({ x: X0, y: RY }); L.drag({ x: X0 + P.d * U, y: RY }); if (step !== "half") L.release(); }
      else if (L.stage === "letters") L.act("another"); else if (L.stage === "try") { L.act("box:t"); L.type(String(Q.t)); L.act("check"); } },
  };
  return L;
}

// P = 2l + 2w (for w) and y = mx + b, written as f(x) = mx + b (for x): a bar in pieces. Slide the others off, then cut
// what's left with the ruler.
function litBar(kind, idx) {
  const isP = kind === "p";
  let P, Q;
  if (isP) {
    const gen = () => { for (;;) { const l = rnd(10, 18), w = rnd(4, Math.min(10, l - 2)); if (2 * (l + w) <= 60) return { l, w, P: 2 * (l + w) }; } };
    P = gen(); do Q = gen(); while (Q.l === P.l && Q.w === P.w);
  } else {
    const m = rnd(2, 5), b = rnd(1, 9);
    const gen = () => { for (;;) { const x = rnd(2, 12); if (m * x + b <= 60) return { m, b, x, y: m * x + b }; } };
    P = gen(); do Q = gen(); while (Q.x === P.x);
  }
  P.try = Q;
  // the biggest cell that fits: P's rectangle and bar stay one square a metre; f's bar grows to about 60 squares
  const Uof = C => (isP ? 1 : clamp(Math.floor(60 / C.y), 1, 3));
  let U = Uof(P);
  const X0 = 2, RT = 9, BH = 4;
  const BT = isP ? Math.max(Math.max(P.P, Q.P) > 34 ? 23 : 0, RT + Math.max(P.w, Q.w) + 6) : 10, EQ = isP ? 40 : 14, ry = isP ? 10 : 20;
  const stages = ["slide", "cut", "letters", "try", "done"];
  const pieceList = C => (isP ? [{ n: "l", len: C.l }, { n: "w", len: C.w }, { n: "l", len: C.l }, { n: "w", len: C.w }] : [{ n: "b", len: C.b }, { n: "mx", len: C.y - C.b }]);
  const wanted = n => n === "w" || n === "mx";
  const off = new Set();
  const total = C => (isP ? C.P : C.y);
  const rest = isP ? 2 * P.w : P.y - P.b;                   // what's left after the slide
  const want = isP ? P.w : P.m;                             // the right piece size
  const L = withBoxes({
    P, stage: "slide", dr: null, cut: null, fit: null, msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage); },
    animating() { return running(this.fit); },
    frame() { return autoFrame(); },
    layout() { let x = X0; return pieceList(P).map((p, i) => { if (off.has(i)) return null; const o = { ...p, i, x }; x += p.len * U; return o; }).filter(Boolean); },
    rulerX() { return X0 + U * (this.cut == null ? (this.stage === "cut" ? rest : total(P)) : this.cut); },
    grab(q) {
      const st = this.stage;
      if ((st === "slide" || st === "cut") && Math.hypot(q.x - this.rulerX(), q.y - (BT + BH + 1.5)) < 2) {
        if (st === "slide") { this.msg = isP ? "Take 2l off first, then cut what's left." : `Take ${P.b} off first, then cut what's left.`; return false; }
        this.dr = { what: "ruler" }; this.msg = null; this.drag(q); return true;
      }
      if (st !== "slide") return false;
      const p = this.layout().find(p => q.x >= p.x && q.x <= p.x + p.len * U && q.y >= BT - .5 && q.y <= BT + BH + .5);
      if (!p) return false;
      this.dr = { what: "piece", i: p.i, x0: q.x, y0: q.y, dx: 0, dy: 0 }; this.msg = null; return true;
    },
    drag(q) {
      const d = this.dr; if (!d) return;
      if (d.what === "ruler") { this.cut = clamp(Math.round((q.x - X0) / U), 1, rest); return; }
      d.dx = Math.round(q.x - d.x0); d.dy = Math.round(q.y - d.y0);
    },
    release() {
      const d = this.dr; this.dr = null; if (!d) return;
      if (d.what === "ruler") {
        if (this.cut === want) { this.stage = "letters"; this.msg = null; if (isP) this.fit = tween(1100); return; }
        if (this.cut !== rest) this.msg = isP ? "There are 2 w's: cut it in 2." : `${P.m}x is x pieces of ${P.m}: cut pieces of ${P.m}.`;
        this.cut = null; return;
      }
      if (Math.abs(d.dy) < 3 && Math.abs(d.dx) < 3) return;
      const p = pieceList(P)[d.i];
      if (wanted(p.n)) { this.msg = isP ? "w is the one we want. Move the others away." : "x is the one we want. Move the others away."; return; }
      off.add(d.i);
      if (pieceList(P).every((p, i) => wanted(p.n) || off.has(i))) this.stage = "cut";
    },
    act(k) {
      if (k === "another" && this.stage === "letters") { this.stage = "try"; this.typing = true; this.active = "t"; return; }
      if (boxAct(this, k) || k !== "check" || this.stage !== "try") return;
      if (isP) litCheck(this, Q.w, [[Q.P - 2 * Q.l, "There are 2 w's: cut it in 2."], [Q.l, `${Q.l} is l. Work out (${Q.P} ${M} ${2 * Q.l}) ÷ 2.`], [null, `Take ${2 * Q.l} off ${Q.P}, then cut what's left in 2.`]]);
      else litCheck(this, Q.x, [[Q.y - Q.b, `${Q.m}x is x pieces of ${Q.m}: cut pieces of ${Q.m}.`], [null, `Take ${Q.b} off ${Q.y}, then cut what's left into pieces of ${Q.m}.`]]);
    },
    scene() {
      const st = this.stage, C = st === "try" || st === "done" ? Q : P, d = this.dr;
      U = Uof(C);
      const say = isP ? {
        slide: ["Take both l's off the bar.", "Drag them away. The bar is the rectangle's edge, unrolled."],
        cut: ["Cut what's left to find w.", "Drag the ruler's handle."],
        letters: litSay.letters2, try: ["Use them on another rectangle.", "Type the number."],
        done: [`w = ${Q.w} m.`, "The same two moves work for every rectangle, so we can do them with letters."],
      }[st] : {
        slide: [`Take the ${P.b} off the bar.`, "Drag it away."],
        cut: ["Cut what's left into pieces to find x.", "Drag the ruler's handle."],
        letters: litSay.letters2, try: ["Use them on another y.", "Type the number."],
        done: [`x = ${Q.x}.`, "The same two moves undo f for every y, so we can do them with letters."],
      }[st];
      dhead(this, say[0], say[1]);
      const tr = st === "try" || st === "done";
      // the rectangle (P only): l across, w down; w's in the chapter colour
      if (isP) {
        rect(`rect${C.l}x${C.w}`, X0, RT, C.l, C.w, { c: INK });
        lab(`rl${C.l}${tr}`, `l = ${C.l} m`, "above", RT, X0 + C.l / 2, "small");
        if (st !== "letters") lab(`rw${C.w}${st}`, st === "done" ? `w = ${C.w} m` : "w", "right", X0 + C.l, RT + C.w / 2, "say", CH);
        text("note", "1 square = 1 m", X0, RT + C.w + 1.5, "small", { anchor: "start" });

      }
      // the bar: its pieces, those slid off gone; its name at its end
      const bar = (st === "slide" || st === "cut") ? this.layout() : st === "letters" ? null : pieceList(C).map((p, i, a) => ({ ...p, i, x: X0 + U * a.slice(0, i).reduce((s, q) => s + q.len, 0) }));
      const name = isP ? `P = ${total(C)} m` : `y = ${total(C)}`;
      if (bar) {
        for (const p of bar) {
          const mv = d && d.what === "piece" && d.i === p.i, dx = mv ? d.dx : 0, dy = mv ? d.dy : 0, w = wanted(p.n);
          const k = `pc${p.i}_${p.len}${tr}`;
          if (w) rect(`${k}f`, p.x + dx, BT + dy, p.len * U, BH, { fill: "var(--tint)", live: mv });
          if (U > 1) { let dd = ""; for (let j = 1; j < p.len; j++) dd += `M${sq(p.x + dx + j * U)} ${sq(BT + dy)}v${sq(BH)}`; if (dd) put(`${k}t`, "path", { d: dd, stroke: INK3, "stroke-width": 1, fill: "none" }, mv ? "none" : "fade"); }
          rect(`${k}o`, p.x + dx, BT + dy, p.len * U, BH, { c: w ? CH : INK, live: mv });

// ---------- Inequalities (g9-ineq) ----------
// One square is 1 on the plane. Both sides drawn as lines, each named at its right end; the inequality is the record's
// first line. Sweep a line across to where they're equal, drag the arrow along the x-axis the way it's true, tap the
// point open or filled, then write the school working.
function dIneq(idx) {
  const kind = idx >= 10 ? (idx === 10 ? "both" : oneOf(["plain", "fall", "bracket", "story", "both"]))
    : idx >= 8 ? "story" : idx >= 6 ? "bracket" : idx >= 3 ? (idx === 3 ? "plainE" : idx === 4 ? "fall" : oneOf(["plainE", "fall"])) : "plain";
  const size = p => Math.abs(p.a) + Math.abs(p.b) + Math.abs(p.c) + Math.abs(p.d) + Math.abs(p.k) + Math.abs((p.a - p.c) * p.k);

    const ops = kind === "plain" ? (idx >= 10 ? ["<", ">", "≤", "≥"] : ["<", ">"]) : ["≤", "≥"];
    const fall = kind === "fall";
    const gen = () => { for (;;) {
      const a = rnd(1, 5), c = rnd(-3, 4), k = rnd(-6, 6), b = rnd(-12, 12);
      if (!c || a === c || !b || (fall ? a > c : a < c)) continue;
      const d = (a - c) * k + b, yk = a * k + b;

    const gen = () => { for (;;) {
      const m = oneOf([-4, -3, -2, 2, 3, 4]), n = rnd(-6, 6), c = idx === 6 ? 0 : oneOf([0, 1, -1, 2]), k = rnd(-6, 6);
      if (!n || m === c) continue;

  } else if (kind === "story") {
    const diff = oneOf([5, 10]), k = rnd(4, 10), p = oneOf([5, 10, 15]), fee = diff * k, q = p + diff;
    const S = oneOf([
      { v: "v", say: `A gym costs $${fee} to join and $${p} a visit. Pay as you go is $${q} a visit. When is the gym cheaper?`, axis: "visits", what: "visits", done: `The gym is cheaper from ${k + 1} visits.`, why: `After ${k} visits the gym's line is lower, so it's cheaper from then on.` },
      { v: "h", say: `Bike shop A charges $${fee} plus $${p} an hour. Shop B charges $${q} an hour. When is shop A cheaper?`, axis: "hours", what: "hours", done: `Shop A is cheaper from ${k + 1} hours.`, why: `After ${k} hours shop A's line is lower, so it's cheaper from then on.` },
    ]);

  const truth = both ? (t => holds(P.lo, P.op1, Lf(t)) && holds(Lf(t), P.op2, P.hi)) : (t => holds(Lf(t), P.op, Rf(t)));
  const A = both ? P.m : P.a - P.c, K = both ? null : P.d - P.b, k = P.k;
  const opF = both ? null : A < 0 ? flipOp(P.op) : P.op;

  const Rs = story ? `${P.c}${v}` : both ? "" : lin(P.c, P.d);
  const ineq = both ? `${fmt(P.lo)} ${P.op1} ${Ls} ${P.op2} ${fmt(P.hi)}` : `${Ls} ${P.op} ${Rs}`;
  P.text = ineq; P.A = A; P.K = K; P.opF = opF;
  // the plane: x from xmin to xmax, one square a unit (a story's money axis counts in 10s or 20s)
  const xmin = story ? 0 : -12, xmax = story ? 20 : 12, OX = story ? 5 : 15;
  const ys = story ? (P.c * k > 150 ? 20 : 10) : 1;
  const keyVals = both ? [P.lo, P.hi] : [Lf(k)];
  let yTop = ceil5(Math.max(0, ...keyVals.map(t => t / ys)) + 4), yBot = story ? 0 : floor5(Math.min(0, ...keyVals.map(t => t / ys)) - 4);
  while (yTop - yBot < (story ? 25 : 30)) { if (story || yTop <= -yBot) yTop += 5; else yBot -= 5; }
  const TOP = story ? 10 : 5, OY = TOP + yTop, bottom = OY - yBot;                  // the x-axis's row; the plane's bottom row
  const px = t => OX + t, py = val => OY - val / ys;
  function clip(s, t0) {                                     // the part of y = s·x + t0 inside the plane
    const lo = yBot * ys, hi = (yTop - 1) * ys;
    let a0 = xmin, a1 = xmax;
    if (s === 0) { if (t0 < lo || t0 > hi) return null; }
    else { const xa = (lo - t0) / s, xb = (hi - t0) / s; a0 = Math.max(xmin, Math.min(xa, xb)); a1 = Math.min(xmax, Math.max(xa, xb)); if (a1 <= a0) return null; }
    return { x0: a0, y0: s * a0 + t0, x1: a1, y1: s * a1 + t0 };
  }
  const lines = both ? [{ s: 0, t: P.lo, c: INK, name: `y = ${fmt(P.lo)}` }, { s: 0, t: P.hi, c: INK, name: `y = ${fmt(P.hi)}` }, { s: P.m, t: P.n, c: CH, name: `y = ${Ls}` }]
    : [{ s: P.a, t: P.b, c: CH, name: story ? `y = ${Ls}` : `y = ${lin(P.a, P.b)}` }, { s: P.c, t: P.d, c: INK, name: `y = ${Rs}` }];
  // the record's lines
  const RY = 9, EQ = OX + xmax + 9 + mbefore([ineq]);
  const stages = both ? ["sweep", "point", "write", "done"] : ["sweep", "arrow", "point", "write", "done"];
  const wBoxes = story ? ["k"] : both ? ["k"] : A === 1 ? ["K"] : ["K", "k"];
  const ansOf = id => (id === "K" ? K : both ? P.x2 : k);
  const sideVal = t => fmt(Lf(t));
  const readout = t => both ? `x = ${fmt(t)}: ${fmt(P.lo)} ${P.op1} ${fmt(Lf(t))} ${P.op2} ${fmt(P.hi)}` : `${v} = ${fmt(t)}: ${fmt(Lf(t))} ${Lf(t) === Rf(t) ? "=" : P.op} ${fmt(Rf(t))}`;
  const opWords = { "<": "isn't less than", ">": "isn't more than" };
  const L = withBoxes({
    id: "ineq", index: idx, P, maxZoom: 1.25, stage: "sweep", sx: story ? 1 : -9, found: [], ae: null, pt: [null, null], dr: null,
    msg: null, verdict: null, typing: false, wi: 0,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return autoFrame(); },
    grab(q) {
      const st = this.stage;
      if (st === "sweep" && Math.abs(q.x - px(this.sx)) < 1.6 && q.y > 4 && q.y < bottom + 3) { this.dr = "sweep"; this.msg = null; return true; }
      if (st === "arrow") { const e = this.ae == null ? k : this.ae; if (Math.abs(q.x - px(e)) < 1.6 && Math.abs(q.y - OY) < 1.6) { this.dr = "arrow"; this.msg = null; return true; } }
      return false;
    },
    drag(q) {
      const t = clamp(Math.round(q.x - OX), xmin, xmax);
      if (this.dr === "sweep") this.sx = t; else if (this.dr === "arrow") this.ae = t;
    },
    release() {
      const d = this.dr; this.dr = null;
      if (d === "sweep") {
        const t = this.sx;
        if (both) {
          if ((t === P.x1 || t === P.x2) && !this.found.includes(t)) { this.found.push(t); this.msg = null; if (this.found.length === 2) this.stage = "point"; }
          else if (!this.found.includes(t)) this.msg = `At x = ${fmt(t)} the middle is ${fmt(Lf(t))}. Find where it meets ${fmt(P.lo)} or ${fmt(P.hi)}.`;
          return;
        }
        if (t === k) { this.stage = "arrow"; this.msg = null; }
        else this.msg = `At ${v} = ${fmt(t)} the sides are ${sideVal(t)} and ${fmt(Rf(t))}. Find where they're equal.`;
        return;
      }
      if (d === "arrow") {
        const t = this.ae;
        if (t == null || t === k) { this.ae = null; return; }
        if (truth(t)) { this.stage = "point"; this.msg = null; this.ae = t > k ? xmax : xmin; return; }
        const l = fmt(Lf(t)), r = fmt(Rf(t));
        this.msg = P.op === "<" || P.op === ">" ? `At ${v} = ${fmt(t)}, ${l} ${opWords[P.op]} ${r}.` : P.op === "≤" ? `At ${v} = ${fmt(t)}, ${l} is more than ${r}.` : `At ${v} = ${fmt(t)}, ${l} is less than ${r}.`;
        if (A < 0 && !story) this.msg += ` ${lin(A, 0)} shrinks as x grows: the sign turns.`;
        this.ae = null;
      }
    },
    tap(q) {
      if (this.stage !== "point") return false;
      const ends = both ? [P.x1, P.x2] : [k];
      for (let i = 0; i < ends.length; i++) if (Math.hypot(q.x - px(ends[i]), q.y - OY) < 1.5) {
        this.pt[i] = this.pt[i] === "open" ? "filled" : "open"; this.msg = null; return true;
      }
      return false;
    },
    act(kk) {
      if (boxAct(this, kk) || kk !== "check") return;
      if (this.stage === "point") {
        const ends = both ? [[P.x1, P.op1], [P.x2, P.op2]] : [[k, P.op]];
        for (let i = 0; i < ends.length; i++) {
          const [t, op] = ends[i], strict = op === "<" || op === ">";
          if (!this.pt[i]) { this.msg = `Tap the point at ${fmt(t)} to leave it open or fill it.`; return; }
          if ((this.pt[i] === "open") !== strict) { this.msg = strict ? `${op} leaves ${fmt(t)} out: open.` : `${op} takes ${fmt(t)} in: filled.`; this.wrongPt = i; return; }
        }
        this.stage = "write"; this.typing = true; this.active = wBoxes[0]; this.msg = null; this.wrongPt = null; return;
      }
      if (this.stage !== "write") return;
      const id = this.active, val = this.vals[id];
      if (!val) { this.msg = "Type the number first."; return; }
      if (num(val) === ansOf(id)) {
        this.verdict = null; this.msg = null; this.wi++;
        if (this.wi < wBoxes.length) this.active = wBoxes[this.wi]; else { this.stage = "done"; this.typing = false; this.active = null; }
        return;
      }
      this.verdict = "wrong";
      if (story) this.msg = `Take ${P.a}${v} off both sides: ${P.b} < ${P.c - P.a}${v}, so ${v} > ${P.b} ÷ ${P.c - P.a}.`;
      else if (both) this.msg = `${P.n > 0 ? `Take ${P.n} off` : `Add ${-P.n}`}, then divide by ${P.m}: (${fmt(P.hi)} ${P.n > 0 ? M : "+"} ${Math.abs(P.n)}) ÷ ${P.m}.`;
      else if (id === "K") {
        const p1 = P.c > 0 ? `Take ${lin(P.c, 0)} off both sides` : P.c < 0 ? `Add ${lin(-P.c, 0)} to both sides` : "";
        const p2 = P.b > 0 ? `take ${P.b} off` : `add ${-P.b}`;
        this.msg = `${p1 ? p1 + ", then " + p2 : p2[0].toUpperCase() + p2.slice(1) + " both sides"}: ${fmt(P.d)} ${P.b > 0 ? M : "+"} ${Math.abs(P.b)} = ${fmt(K)}.`;
      } else this.msg = `Divide both sides by ${fmt(A)}: ${fmt(K)} ÷ ${fmt(A)} = ${fmt(k)}.${A < 0 ? ` Dividing by ${fmt(A)} turns the sign.` : ""}`;
    },
    scene() {
      const st = this.stage, d = this.dr;
      const trueSide = both ? null : truth(k + 1) ? "right" : "left";
      let say;
      if (st === "sweep") say = story ? [P.S.say, "Drag the line across. Stop where both cost the same."]
        : both ? [this.found.length ? "Now find where it meets the other level line." : "Drag the line across. Stop where the middle line meets a level line.", "The readout shows all three at that x."]
        : ["Drag the line across. Stop where the two sides are equal.", "The readout shows both sides at that x."];
      else if (st === "arrow") say = [`Drag from ${fmt(k)} along the axis, the way it's true.`, "The arrow's end is tested."];
      else if (st === "point") say = both ? ["Tap each end: open, or filled.", "Then tap Check."] : [`Tap the point at ${fmt(k)}: open, or filled.`, "Then tap Check."];
      else if (st === "write") say = ["Write the working.", "Type the number."];
      else if (story) say = [P.S.done, P.S.why];
      else if (both) say = [`The answer is ${fmt(P.x1)} ${P.op1} x ${P.op2} ${fmt(P.x2)}.`, `Between ${fmt(P.x1)} and ${fmt(P.x2)} the middle line is between the level lines, so every x there works.`];
      else {
        const why = A < 0 && P.a > 0 && P.c > 0
          ? `${Ls} climbs slower than ${Rs}, so it's ${trueSide === "left" ? "ahead only left" : "behind only right"} of ${fmt(k)}.`
          : `${trueSide === "left" ? "Left" : "Right"} of ${fmt(k)} the first line is ${(trueSide === "left") === (A > 0) ? "lower" : "higher"}, so every x there works.`;
        say = [`The answer is x ${opF} ${fmt(k)}.`, why];
      }
      dhead(this, say[0], say[1]);
      // axes: on strong lines, numbered every 5
      const xl = px(xmin) - 1, xr = px(xmax) + 1;
      line("ax", xl, OY, xr, OY); path("axa", `M${sq(xr - 0.8)} ${sq(OY - 0.8)}L${sq(xr)} ${sq(OY)}L${sq(xr - 0.8)} ${sq(OY + 0.8)}`);
      line("ay", OX, bottom + (story ? 0 : 1), OX, TOP); path("aya", `M${sq(OX - 0.8)} ${sq(TOP + 0.8)}L${sq(OX)} ${sq(TOP)}L${sq(OX + 0.8)} ${sq(TOP + 0.8)}`);
      lab("axn", story ? P.S.axis : "x", "right", xr, OY, "small");
      if (!story) lab("ayn", "y", "right", OX + 0.3, TOP + 0.6, "small");
      else text("scale", `1 square = $${ys}`, OX + 1, TOP + 0.6, "small", { anchor: "start" });
      const marks = st === "sweep" ? [] : both ? [P.x1, P.x2] : [k];
      for (let t = ceil5(xmin + 1); t <= xmax; t += 5) if (t && !marks.some(m => m !== t && Math.abs(m - t) <= 2)) { line(`xt${t}`, px(t), OY, px(t), OY + 0.5); lab(`xl${t}`, fmt(t), "below", OY + 0.5, px(t), "small"); }
      for (let t = ceil5(yBot + 1); t < yTop; t += 5) if (t) { line(`yt${t}`, OX - 0.5, OY - t, OX, OY - t); lab(`yl${t}`, story ? `$${t * ys}` : fmt(t), "left", OX - 0.5, OY - t, "small"); }
      // the lines, each named at its right end
      const names = [];
      lines.forEach((ln, i) => {
        const seg = clip(ln.s, ln.t); if (!seg) return;
        line(`ln${i}`, px(seg.x0), py(seg.y0), px(seg.x1), py(seg.y1), { c: ln.c });
        names.push({ i, x: px(seg.x1), y: py(seg.y1), atRight: seg.x1 >= xmax - 0.01, ln });
      });
      names.sort((p, q) => p.y - q.y);
      for (let j = 0; j < names.length; j++) {
        const nm = names[j];
        let y = nm.y;
        if (!nm.atRight) y = nm.y <= TOP + 2 ? nm.y + 0.6 : nm.y;
        if (nm.atRight && Math.abs(y - OY) < 1.4) y = OY + (y >= OY ? 1.6 : -1.6);   // clear of the x-axis's name
        if (j && Math.abs(y - names[j - 1].ly) < 1.6 && Math.abs(nm.x - names[j - 1].x) < 12) y = names[j - 1].ly + 1.6;
        nm.ly = y;
        text(`lnn${nm.i}`, nm.ln.name, nm.x + 0.6, y, "small", { anchor: "start", c: nm.ln.c });
      }
      // the sweep line, its handle under the plane, its readout; dots where it meets the lines
      if (st === "sweep") {
        const t = this.sx, X = px(t);
        const hy = Math.max(bottom + 1, OY + 3);
        line("sw", X, TOP, X, hy, { c: INK2, live: true });
        handle("swh", X, hy, { big: d === "sweep" });
        lines.forEach((ln, i) => { const val = ln.s * t + ln.t; if (val / ys < yTop && val / ys >= yBot) dot(`swd${i}`, X, py(val), 0.35, { c: ln.c, live: true }); });
        const eq = both ? (Lf(t) === P.lo || Lf(t) === P.hi) : Lf(t) === Rf(t);
        const col = eq ? CH : truth(t) ? "var(--right)" : "var(--wrong)";
        const rx = clamp(X, px(xmin) + 6, px(xmax) - 4);
        text("swr", readout(t), rx, hy + 1.8, "small", { c: col, live: true });
        for (const f of this.found) dot(`fd${f}`, px(f), OY, 0.35, { c: CH });
      } else {
        // where they're equal: a dot on the crossing, dashed down to the axis, its number under it
        const ends = both ? [P.x1, P.x2] : [k];
        ends.forEach((t, i) => {
          const val = both ? Lf(t) : Lf(t);
          dot(`cx${i}`, px(t), py(val), 0.35, { c: CH });
          if (val !== 0) line(`cxd${i}`, px(t), py(val), px(t), OY, { c: CH, dash: true });
          if (t % 5) lab(`cxn${i}`, fmt(t), val < 0 ? "above" : "below", val < 0 ? OY - 1 : OY + 0.5, px(t), "small", CH);
        });
      }
      // the arrow along the axis: a band in the row above it, from the boundary; a story's whole visits are dots
      if (st === "arrow" && this.ae == null) handle("ah", px(k), OY);
      const e = st === "arrow" ? this.ae : st === "sweep" ? null : both ? null : (trueSide === "right" ? xmax : xmin);
      if (e != null && e !== k) {
        const x0 = Math.min(k, e), x1 = Math.max(k, e), ok = truth(e), live = st === "arrow";
        if (story) { for (let t = k + 1; t <= x1; t++) dot(`ad${t}`, px(t), OY, 0.3, { c: live && !ok ? "var(--wrong)" : CH, live }); }
        else {
          rect(`band${live}`, px(x0), OY - 1, x1 - x0, 1, { fill: live && !ok ? "rgba(200,55,45,.18)" : "var(--tint-strong)", live });
          if (!live) { const tip = e > k ? px(xmax) + 0.9 : px(xmin) - 0.9, s = e > k ? -1 : 1; path("atip", `M${sq(tip + s * 0.8)} ${sq(OY - 1.3)}L${sq(tip)} ${sq(OY - 0.5)}L${sq(tip + s * 0.8)} ${sq(OY + 0.3)}`, { c: CH }); }
        }
        if (live) {
          handle("ah", px(e), OY, { big: true });
          text("ar", `${readout(e)}${ok ? " ✓" : ""}`, clamp(px(e), px(xmin) + 6, px(xmax) - 4), Math.max(bottom + 1, OY + 3) + 1.8, "small", { c: ok ? "var(--right)" : "var(--wrong)", live: true });
        }
      }
      if (both && st !== "sweep") rect("bandb", px(P.x1), OY - 1, P.x2 - P.x1, 1, { fill: "var(--tint-strong)" });
      // the point(s) at the boundary: unset (dashed), open or filled
      if (st === "point" || st === "write" || st === "done") {
        const ends = both ? [P.x1, P.x2] : [k];
        ends.forEach((t, i) => {
          const s = this.pt[i], bad = this.wrongPt === i && this.msg;
          if (!s) dot(`pt${i}u`, px(t), OY, 0.5, { c: "var(--paper)", stroke: INK3, dash: true, live: true });
          else if (s === "open") dot(`pt${i}o`, px(t), OY, 0.5, { c: "var(--paper)", stroke: bad ? "var(--wrong)" : CH, live: true });
          else dot(`pt${i}f`, px(t), OY, 0.5, { c: bad ? "var(--wrong)" : CH, live: true });
        });
      }
      // the record, to the right of the plane
      let y = RY;
      mrow("r1", [ineq], 0, y, { eq: EQ });
      const bx = EQ - 8;
      if (st === "point") block("check", bx, RY + 3, 7, "Check", "check");
      if (st !== "write" && st !== "done") return;
      const box = id => (this.wi > wBoxes.indexOf(id) || st === "done" ? { s: fmt(ansOf(id)), c: CH } : { box: id, cells: id === "K" ? 3 : 2, value: this.vals[id], state: boxState(this, id) });
      if (kind === "bracket") { y += 3; mrow("r1b", [`${lin(P.a, P.b)} ${P.op} ${Rs}`], 0, y, { eq: EQ }); }
      if (story) { y += 3; mrow("r2", [`${v} > `, box("k")], 0, y, { eq: EQ }); }
      else if (both) { y += 3; mrow("r2", [`${fmt(P.x1)} ${P.op1} x ${P.op2} `, box("k")], 0, y, { eq: EQ }); }
      else {
        y += 3; mrow("r2", [`${lin(A, 0)} ${P.op} `, box("K")], 0, y, { eq: EQ });
        if (A !== 1 && this.wi >= 1) { y += 3; mrow("r3", [`x ${opF} `, box("k"), ...(A < 0 ? [{ words: `÷ ${fmt(A)} turns the sign`, c: CH }] : [])], 0, y, { eq: EQ }); }
      }
      if (st === "write") block("check", bx, y + 3, 7, "Check", "check"); else block("next", bx, y + 3, 10, "Next problem", "next");
    },
  });
  L.test = {
    miss() {
      const st = L.stage;
      if (st === "sweep") { const t0 = both ? (P.x1 + P.x2 >> 1) === P.x1 ? P.x1 + 1 : (P.x1 + P.x2) >> 1 : k + (k < 10 ? 2 : -2); L.grab({ x: px(L.sx), y: OY - 2 }); L.drag({ x: px(t0), y: OY - 2 }); L.release(); return true; }
      if (st === "arrow") { const wrong = truth(k + 2) ? k - 2 : k + 2; L.grab({ x: px(k), y: OY }); L.drag({ x: px(wrong), y: OY }); L.release(); return true; }
      if (st === "point") { const ends = both ? [P.op1, P.op2] : [P.op]; ends.forEach((op, i) => { L.pt[i] = (op === "<" || op === ">") ? "filled" : "open"; }); L.act("check"); return true; }
      if (st === "write") { const id = L.active; L.act(`box:${id}`); L.type(fmt(-ansOf(id) || 1)); L.act("check"); return true; }
      return false;
    },
    right(step) {
      const st = L.stage;
      if (st === "sweep") { for (const t of both ? [P.x1, P.x2] : [k]) { if (L.found.includes(t)) continue; L.grab({ x: px(L.sx), y: OY - 2 }); L.drag({ x: px(t), y: OY - 2 }); if (step === "half") { L.drag({ x: px(t - 2), y: OY - 2 }); return; } L.release(); } return; }
      if (st === "arrow") { const good = truth(k + 2) ? k + 2 : k - 2; L.grab({ x: px(k), y: OY }); L.drag({ x: px(good), y: OY }); if (step !== "half") L.release(); return; }
      if (st === "point") { const ends = both ? [P.op1, P.op2] : [P.op]; ends.forEach((op, i) => { L.pt[i] = (op === "<" || op === ">") ? "open" : "filled"; }); L.act("check"); return; }
      if (st === "write") { while (L.stage === "write") { const id = L.active; L.act(`box:${id}`); L.type(fmt(ansOf(id))); L.act("check"); } }
    },
    truth, Lf, Rf, px, OY, bottom, yTop, yBot, ys,
  };
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  multistep: { name: "Multi-step equations", make: dMultistep },
  literal: { name: "Rearrange a formula", make: dLiteral },
  ineq: { name: "Inequalities", make: dIneq },
};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id, index = 0) {
  if (!LESSONS[id]) id = "multistep";
  lesson = LESSONS[id].make(index);
  pick.value = id;
  drawn = new Set(); born = new Map(); keys.blur();
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g9ch1-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value, 0);
document.getElementById("fresh").onclick = () => leave();
function leave() { start(lesson.id, lesson.index + 1); }
let first = "multistep", firstP = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g9ch1-lesson") || "multistep";
  firstP = Math.max(0, (+u.get("p") || 1) - 1);
} catch (err) {}
start(first, firstP);
</script>
