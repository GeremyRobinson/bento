<title>Grade 9 Powers and roots</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* 9th grade, chapter 4 (Powers and roots), from design/grade9.md; the kit is chapters 1–3's (grade9-ch1/2/3.html),
   the 3D paper (the paper tilts, cubes rise, words stay upright) is 6th grade's (grade6-ch5.html). The kit of new5-lessons.html: the whole
   screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is the only chrome.
   1 square = 20 paper units, a strong line every 5 squares (a block). grade9.md names no chapter colour, so this uses
   the Whole numbers family's purple (Theme.swift's Chapter.whole, as grade4-ch1.html does). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #7A5CF0; --tint: rgba(122, 92, 240, .2); --tint-strong: rgba(122, 92, 240, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --cube-top: color-mix(in srgb, var(--chapter) 18%, var(--paper)); --cube-front: color-mix(in srgb, var(--chapter) 34%, var(--paper));
  --cube-side: color-mix(in srgb, var(--chapter) 52%, var(--paper)); --cube-edge: color-mix(in srgb, var(--chapter) 70%, var(--ink));
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #A58BFF; --tint: rgba(165, 139, 255, .22); --tint-strong: rgba(165, 139, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #A58BFF; --tint: rgba(165, 139, 255, .22); --tint-strong: rgba(165, 139, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <!-- a negative piece is striped (7th grade's) -->
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="var(--paper)"/><line x1="2" y1="0" x2="2" y2="8" stroke="var(--ink3)" stroke-width="1.5"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 4</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit of new5-lessons.html) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set(), born = new Map();
let UP = false;
function put(k, tag, a, kind = "fade", text) { items.push({ k, tag, a, kind, text, up: UP }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: o.fill ? null : 1,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linejoin": "round" }, o.live ? "none" : o.fill || o.dash ? "fade" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, rx: o.rx ?? null,
    pathLength: o.c && !o.fill ? 1 : null, transform: o.t || null }, o.live ? "none" : o.c && !o.fill ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)", stroke: o.stroke || null, "stroke-width": o.stroke ? 1.5 : null, "stroke-dasharray": o.dash ? "4 4" : null }, o.live ? "none" : "fade"); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: [o.c ? `fill:${o.c}` : null, o.op != null ? `opacity:${o.op}` : null].filter(Boolean).join(";") || null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c }); continue; }
    if (ch === "−") { text(`${k}${i}${ch}`, ch, right - col - 0.5, row, "maths", { c: o.c }); col += 1; continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c }); col += 2;
  }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Try another, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}

// what's drawn now, in squares: the camera frames it (words' widths are estimated from their size)
let drawnBox = null;
const CHW = { say: 0.72, small: 0.52, maths: 1 };
let tiltedNow = false;
function boxOf(list, tilt = tiltedNow) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
  for (const it of list) {
    const a = it.a;
    if (a.transform || (!it.up && tilt)) continue;
    if (it.tag === "rect") add(+a.x, +a.y, +a.x + +a.width, +a.y + +a.height);
    else if (it.tag === "line") add(Math.min(a.x1, a.x2), Math.min(a.y1, a.y2), Math.max(a.x1, a.x2), Math.max(a.y1, a.y2));
    else if (it.tag === "circle") add(a.cx - a.r, a.cy - a.r, +a.cx + +a.r, +a.cy + +a.r);
    else if (it.tag === "text") {
      const cls = a.class || "small", w = String(it.text).length * (CHW[cls] || 0.6) * SQ, h = (cls === "maths" ? 1.3 : cls === "say" ? 1 : 0.7) * SQ / 2;
      const left = a["text-anchor"] === "start" ? +a.x : a["text-anchor"] === "end" ? a.x - w : a.x - w / 2;
      add(left, a.y - h, left + w, +a.y + h);
    }
  }
  return { x0: x0 / SQ, y0: y0 / SQ, x1: x1 / SQ, y1: y1 / SQ };
}
// the camera's frame for what's drawn now: from the top row (the words on rows 0–2) to the last thing drawn, a square
// of margin round it
function autoFrame(b = drawnBox) { const x = Math.min(-1, Math.floor(b.x0) - 1), y = Math.min(-1, Math.floor(b.y0) - 1); return { x, y, w: Math.ceil(b.x1) + 1 - x, h: Math.ceil(b.y1) + 1 - y }; }

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(), now = performance.now(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const a = { ...it.a };
    if (it.kind !== "none") {
      // a piece draws in once; a redraw while it's still drawing in (a drag, a motion) carries on where it was
      if (!drawn.has(it.k)) born.set(it.k, { t: now, d: Math.min(n++ * 0.035, 1.2) });
      const b = born.get(it.k);
      if (b) {
        const age = (now - b.t) / 1000;
        if (age < b.d + 0.65) {
          a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
          a.style = `animation-delay:${(b.d - age).toFixed(3)}s;` + (a.style || "");
        } else born.delete(it.k);
      }
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  for (const k of [...born.keys()]) if (!next.has(k)) born.delete(k);
  const pm = lesson.paperMatrix && lesson.paperMatrix();
  tiltedNow = !!pm;
  drawnBox = boxOf(items);
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  if (pm) document.getElementById("paperg").setAttribute("transform", `matrix(${pm.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s). The frame's top sits at the top of the screen, so the
// words are on the top rows and the picture under them; it's centred across.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 20, bottom = 112;
  const s = Math.min((W - 40) / sq(f.w), (H - top - bottom) / sq(f.h), (lesson && lesson.maxZoom) || 1.6);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));
function toScreen(x, y) { const p = new DOMPoint(sq(x), sq(y)).matrixTransform(svg.getScreenCTM()); return { x: p.x, y: p.y }; }

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/-/g, "−").replace(/[^0-9.−]/g, "").slice(0, 6)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; pointer events, so mouse and touch ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); render(); frame(lesson.frame()); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) { render(); frame(lesson.frame()); }
});
function act(a) {
  if (a === "type") { openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}

// ---------- the designer kit (three text sizes, one line weight, labels half a square from what they label) ----------
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end" });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start" });
}
function dbox(k, x, y, cells, value, state, actName = "box:0") {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (value) digits(`${k}v${value}`, value, x + cells * 2, y + 1, { c: vc });
  if (state === "active") {
    const cx = x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// what to do on rows 0–2 (words 28), and under it a small line, or what a miss says in red (rows 3–4)
function dhead(L, say, sub, x0 = 0, y0 = 0) {
  const y = y0 + 3.3 + 2 * (words(`say-${say}`, say, x0, y0 + 1, 66) - 1);
  if (L.msg) words(`msg-${L.msg}`, L.msg, x0, y, 66, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, x0, y, 66, "small");
}
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { if (L.typing) L.active = a.slice(4); return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const ring = (k, x, y, r = 1.05) => path(k, `M${sq(x + r)} ${sq(y)}a${sq(r)} ${sq(r)} 0 1 1 0 -0.1`, { c: "var(--chapter)" });
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// ---------- 9th grade: shared pieces ----------
const M = "−", CH = "var(--chapter)", INK = "var(--ink)", INK2 = "var(--ink2)", INK3 = "var(--ink3)";
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const oneOf = a => a[rnd(0, a.length - 1)];
const fmt = n => (n < 0 ? M + Math.abs(n) : String(n));
const num = s => Number(String(s).replace(/−/g, "-"));
const dec = n => String(Math.round(n * 100) / 100);
const ceil5 = v => Math.ceil(v / 5) * 5, floor5 = v => Math.floor(v / 5) * 5;
// problems 1–3 are the smallest of six draws (the web's withEasyStart); from problem 4 the full range
function easy(idx, gen, size) {

      else if (id === "c") this.msg = v === kk ? `The square doesn't come out. Its root does: √${kk} = ${k}.` : `The root of ${kk} comes out.`;
      else this.msg = v === n ? `Once ${k} is outside, only ${m} stays under the root.` : "What's in each tile stays under the root.";
    },
    scene() {
      const st = this.stage, l = st === "share" ? this.cur() : Lf, held = !!this.held;
      const say = {
        share: ["Group the squares into tiles that close into a square.", "Drag the handle: down for bigger tiles, up for smaller."],
        root: [`Write the root of ${kk}.`, "Type the number."],
        simple: ["Write it simply.", "Type what comes out, then what stays under the root."],
        done: [`${kk} tiles make ${k} rows of ${k}, so ${k} comes out; the ${m} in each tile stays under the root.`],
      }[st];
      dhead(this, say[0], say[1]);
      // the picture
      const mu = tilt && st === "done" ? ease(tw(this.morph)) : 0;
      if (l.start) tens("st", n, 0, TOP, { u: U, fill: "var(--tint)", live: held });
      else if (mu > 0) {
        for (const T of l.tiles) {
          const r0 = [[T.x, TOP + T.y], [T.x + l.tw, TOP + T.y], [T.x + l.tw, TOP + T.y + l.th], [T.x, TOP + T.y + l.th]];
          const r1 = [tiltPt(T.i, T.j), tiltPt(T.i, T.j + 1), tiltPt(T.i + 1, T.j + 1), tiltPt(T.i + 1, T.j)];
          const pts = r0.map((p, z) => `${sq(p[0] + (r1[z][0] - p[0]) * mu).toFixed(1)},${sq(p[1] + (r1[z][1] - p[1]) * mu).toFixed(1)}`).join(" ");
          put(`tt${T.i}_${T.j}`, "polygon", { points: pts, fill: "var(--tint)", stroke: CH, "stroke-width": 1.5, "stroke-linejoin": "round" }, "none");
        }
        if (mu >= 1) {
          const a = tiltPt(0, 0), b = tiltPt(0, k), nl = Math.hypot(...va), mx = (a[0] + b[0]) / 2 - 1.5 * va[0] / nl, my = (a[1] + b[1]) / 2 - 1.5 * va[1] / nl;
          text("edge", `${k}√${m}`, mx, my, "say", { c: CH });
        }
      } else {
        const closedRight = l.closed && l.t === m;
        l.tiles.forEach((T, i) => cells(`tl${l.t}_${i}`, T.x, TOP + T.y, l.sh.w, l.sh.h, { u: U, fill: "var(--tint)", inner: INK3, c: closedRight ? CH : INK, live: held }));
        if (closedRight && st !== "share") lab("cnt", `${k} × ${k}`, "below", TOP + l.H, l.W / 2, "say", CH);
      }
      if (U > 1) text("unote", `1 is ${U} × ${U} squares`, 0, TOP + (st === "share" ? l.H : Hf) + (st !== "share" && !tilt ? 4.6 : 1.6), "small", { anchor: "start" });
      // the name, at the picture's right end while it's shared; the record's first line after
      const name = [{ rt: String(n) }];
      if (st === "share") {
        mrow("name", name, l.W + 2, TOP + 2);
        handle("hd", l.W, TOP + l.H, { big: held });
        text("rd", `${l.t}s: ${l.start ? n : l.c} tiles${l.closed ? `, ${l.r} × ${l.r}` : ""}`, l.W + 1.2, Math.max(TOP + l.H, TOP + 5), "small", { anchor: "start", c: CH, live: true });
        return;
      }
      const head = st === "simple" ? [...name, " = ", this.got.c != null ? { s: String(k), c: CH } : { box: "c", cells: 1, value: this.vals.c, state: boxState(this, "c") },
        { rt: { box: "r", cells: 1, value: this.vals.r, state: boxState(this, "r") } }] : st === "done" ? [...name, " = ", { s: String(k), c: CH }, { rt: String(m), c: CH }] : name;
      mrow("head", head, RX, RY);
      mrow("r1", [`${n} = `, { s: `${kk} × ${m}`, c: CH }], RX, RY + 4);
      mrow("r2", ["", { rt: String(kk) }, " = ", st === "root" ? { box: "q", cells: String(k).length, value: this.vals.q, state: boxState(this, "q") } : { s: String(k), c: CH }], RX, RY + 7);
      if (st === "done") mrow("r3", [`(${k}`, { rt: String(m) }, `)² = ${kk} × ${m} = ${n}`], RX, RY + 10);
      const last = st === "done" ? RY + 10 : RY + 7;
      block(st === "done" ? "next" : "check", RX, last + 3, st === "done" ? 10 : 7, st === "done" ? "Next problem" : "Check", st === "done" ? "next" : "check");
    },
  });
  L.test = {
    miss() {
      if (L.stage === "share") { const i = divs.findIndex(t => t > 1 && !lay(t, U).closed); L.test.to(i); return true; }
      if (L.typing) { const id = L.active; L.type(String({ q: kk / 2 !== k ? kk / 2 : kk, c: kk, r: n }[id])); L.act("check"); return true; }
      return false;
    },
    miss2() { if (L.stage !== "share") return null; L.test.to(divs.length - 1); return L.msg; },
    to(i, half) { const l = L.cur(), y = TOP + l.H; L.grab({ x: l.W, y }); L.drag({ x: l.W, y: y + (i - L.ti) * 1.5 }); if (!half) L.release(); },
    right(step) {
      if (L.stage === "share") return L.test.to(divs.indexOf(m), step === "half");
      if (L.typing) { const id = L.active; L.type(String({ q: k, c: k, r: m }[id])); L.act("check"); }
    },
    finish() { if (L.morph) L.morph.t0 -= 5000; },
    U, divs,
  };
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  negexp: { name: "Zero and negative exponents", make: dNegexp },
  fracexp: { name: "Fraction powers", make: dFracexp },
  radical: { name: "Simplify square roots", make: dRadical },
};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id, index = 0) {
  if (!LESSONS[id]) id = "negexp";
  token++;
  lesson = LESSONS[id].make(index);
  pick.value = id;
  drawn = new Set(); born = new Map(); keys.blur();
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g9ch4-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value, 0);
document.getElementById("fresh").onclick = () => leave();
// the paper lies flat again before the next problem
function leave() { const go = () => start(lesson.id, lesson.index + 1); if (lesson.leave) lesson.leave(go); else go(); }
let first = "negexp", firstP = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g9ch4-lesson") || "negexp";
  firstP = Math.max(0, (+u.get("p") || 1) - 1);
} catch (err) {}
start(first, firstP);
</script>
