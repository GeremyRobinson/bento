<title>Grade 9 Growing and shrinking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* 9th grade, chapter 5 (Growing and shrinking), from design/grade9.md; the kit is chapters 1–4's (grade9-ch1…4.html),
   decimals written as one tight number. The kit of new5-lessons.html: the whole
   screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is the only chrome.
   1 square = 20 paper units, a strong line every 5 squares (a block). grade9.md names no chapter colour, so this uses
   the Whole numbers family's purple (Theme.swift's Chapter.whole, as grade4-ch1.html does). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #7A5CF0; --tint: rgba(122, 92, 240, .2); --tint-strong: rgba(122, 92, 240, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --cube-top: color-mix(in srgb, var(--chapter) 18%, var(--paper)); --cube-front: color-mix(in srgb, var(--chapter) 34%, var(--paper));
  --cube-side: color-mix(in srgb, var(--chapter) 52%, var(--paper)); --cube-edge: color-mix(in srgb, var(--chapter) 70%, var(--ink));
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #A58BFF; --tint: rgba(165, 139, 255, .22); --tint-strong: rgba(165, 139, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #A58BFF; --tint: rgba(165, 139, 255, .22); --tint-strong: rgba(165, 139, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 150px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <!-- a negative piece is striped (7th grade's) -->
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="var(--paper)"/><line x1="2" y1="0" x2="2" y2="8" stroke="var(--ink3)" stroke-width="1.5"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 4</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit of new5-lessons.html) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set(), born = new Map();
let UP = false;
function put(k, tag, a, kind = "fade", text) { items.push({ k, tag, a, kind, text, up: UP }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: o.fill ? null : 1,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linejoin": "round" }, o.live ? "none" : o.fill || o.dash ? "fade" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, rx: o.rx ?? null,
    pathLength: o.c && !o.fill ? 1 : null, transform: o.t || null }, o.live ? "none" : o.c && !o.fill ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)", stroke: o.stroke || null, "stroke-width": o.stroke ? 1.5 : null, "stroke-dasharray": o.dash ? "4 4" : null }, o.live ? "none" : "fade"); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: [o.c ? `fill:${o.c}` : null, o.op != null ? `opacity:${o.op}` : null].filter(Boolean).join(";") || null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c }); continue; }
    if (ch === "−") { text(`${k}${i}${ch}`, ch, right - col - 0.5, row, "maths", { c: o.c }); col += 1; continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c }); col += 2;
  }
}
// a block drawn on the paper: an outline, its word and arrow (Check, Try another, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}

// what's drawn now, in squares: the camera frames it (words' widths are estimated from their size)
let drawnBox = null;
const CHW = { say: 0.72, small: 0.52, maths: 1 };
let tiltedNow = false;
function boxOf(list, tilt = tiltedNow) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
  for (const it of list) {
    const a = it.a;
    if (a.transform || (!it.up && tilt)) continue;
    if (it.tag === "rect") add(+a.x, +a.y, +a.x + +a.width, +a.y + +a.height);
    else if (it.tag === "line") add(Math.min(a.x1, a.x2), Math.min(a.y1, a.y2), Math.max(a.x1, a.x2), Math.max(a.y1, a.y2));
    else if (it.tag === "circle") add(a.cx - a.r, a.cy - a.r, +a.cx + +a.r, +a.cy + +a.r);
    else if (it.tag === "text") {
      const cls = a.class || "small", w = String(it.text).length * (CHW[cls] || 0.6) * SQ, h = (cls === "maths" ? 1.3 : cls === "say" ? 1 : 0.7) * SQ / 2;
      const left = a["text-anchor"] === "start" ? +a.x : a["text-anchor"] === "end" ? a.x - w : a.x - w / 2;
      add(left, a.y - h, left + w, +a.y + h);
    }
  }
  return { x0: x0 / SQ, y0: y0 / SQ, x1: x1 / SQ, y1: y1 / SQ };
}
// the camera's frame for what's drawn now: from the top row (the words on rows 0–2) to the last thing drawn, a square
// of margin round it
function autoFrame(b = drawnBox) { const x = Math.min(-1, Math.floor(b.x0) - 1), y = Math.min(-1, Math.floor(b.y0) - 1); return { x, y, w: Math.ceil(b.x1) + 1 - x, h: Math.ceil(b.y1) + 1 - y }; }

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(), now = performance.now(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const a = { ...it.a };
    if (it.kind !== "none") {
      // a piece draws in once; a redraw while it's still drawing in (a drag, a motion) carries on where it was
      if (!drawn.has(it.k)) born.set(it.k, { t: now, d: Math.min(n++ * 0.035, 1.2) });
      const b = born.get(it.k);
      if (b) {
        const age = (now - b.t) / 1000;
        if (age < b.d + 0.65) {
          a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
          a.style = `animation-delay:${(b.d - age).toFixed(3)}s;` + (a.style || "");
        } else born.delete(it.k);
      }
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  for (const k of [...born.keys()]) if (!next.has(k)) born.delete(k);
  const pm = lesson.paperMatrix && lesson.paperMatrix();
  tiltedNow = !!pm;
  drawnBox = boxOf(items);
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  if (pm) document.getElementById("paperg").setAttribute("transform", `matrix(${pm.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Problem ${lesson.index + 1} · Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s). The frame's top sits at the top of the screen, so the
// words are on the top rows and the picture under them; it's centred across.
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 20, bottom = 112;
  const s = Math.min((W - 40) / sq(f.w), (H - top - bottom) / sq(f.h), (lesson && lesson.maxZoom) || 1.6);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));
function toScreen(x, y) { const p = new DOMPoint(sq(x), sq(y)).matrixTransform(svg.getScreenCTM()); return { x: p.x, y: p.y }; }

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/-/g, "−").replace(/[^0-9.−]/g, "").slice(0, 6)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; pointer events, so mouse and touch ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); render(); frame(lesson.frame()); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) { render(); frame(lesson.frame()); }
});
function act(a) {
  if (a === "type") { openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}

// ---------- the designer kit (three text sizes, one line weight, labels half a square from what they label) ----------
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end" });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start" });
}
function dbox(k, x, y, cells, value, state, actName = "box:0") {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (value && /[.]/.test(value)) text(`${k}v${value}`, value, x + cells * 2 - 0.4, y + 1, "maths", { c: vc, anchor: "end" });   // a decimal: one tight number
  else if (value) digits(`${k}v${value}`, value, x + cells * 2, y + 1, { c: vc });
  if (state === "active") {
    const cx = x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// what to do on rows 0–2 (words 28), and under it a small line, or what a miss says in red (rows 3–4)
function dhead(L, say, sub, x0 = 0, y0 = 0) {
  const y = y0 + 3.3 + 2 * (words(`say-${say}`, say, x0, y0 + 1, 66) - 1);
  if (L.msg) words(`msg-${L.msg}`, L.msg, x0, y, 66, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, x0, y, 66, "small");
}
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { if (L.typing) L.active = a.slice(4); return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const ring = (k, x, y, r = 1.05) => path(k, `M${sq(x + r)} ${sq(y)}a${sq(r)} ${sq(r)} 0 1 1 0 -0.1`, { c: "var(--chapter)" });
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// ---------- 9th grade: shared pieces ----------
const M = "−", CH = "var(--chapter)", INK = "var(--ink)", INK2 = "var(--ink2)", INK3 = "var(--ink3)";
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const oneOf = a => a[rnd(0, a.length - 1)];
const fmt = n => (n < 0 ? M + Math.abs(n) : String(n));
const num = s => Number(String(s).replace(/−/g, "-"));
const dec = n => String(Math.round(n * 100) / 100);
const ceil5 = v => Math.ceil(v / 5) * 5, floor5 = v => Math.floor(v / 5) * 5;

    frame() { return autoFrame(); },
    type(v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; },
    grab(q) {
      const B = lens[this.cur], y = by(this.cur);

        if (!(Math.abs(q.x - this.c * U) < 1.6 && q.y > y - 1.6 && q.y < y + 4.5)) return false;

        if (!within(q, x0 - 0.3, y - 0.3, c * U + 0.6, 4.6)) return false;

    },
    drag(q) {
      if (this.held) { const B = lens[this.cur]; this.c = divisors(B).reduce((a, d) => (Math.abs(d * U - q.x) < Math.abs(a * U - q.x) ? d : a), B); }

        const { dx, dy } = this.pc; this.pc = null;
        if (Math.hypot(dx, dy) < 0.5) return;
        const ok = grow ? Math.abs(dx - B * U) <= 2.5 && Math.abs(dy) <= 2.5 : dx >= c * U + 1 || Math.abs(dy) >= 5;
        if (!ok) { this.msg = grow ? `Slide the ${one} onto the bar's end.` : `Slide the ${one} right off the bar.`; return; }
        this.cur++;
        if (this.cur < years) { this.stage = "cut"; this.c = lens[this.cur]; }
        else { this.stage = "write"; this.typing = true; this.boxes = years > 1 ? ["f", "e", "T"] : ["f", "T"]; this.wi = 0; this.active = "f"; }
      }
    },
    act(k) {
      if (boxAct(this, k) || k !== "check" || !this.typing) return;
      const id = this.active, raw = this.vals[id];
      if (!raw) { this.msg = "Type the number first."; return; }
      const v = num(raw), want = { f, e: years, T: final }[id];
      if (same(v, want)) { if (nextBox(this, id, want)) this.stage = "done"; return; }
      this.verdict = "wrong";
      if (id === "f") this.msg = near(v, p / 100) ? (grow ? `+${p}% keeps the whole and adds a ${one}: × ${fs}.` : `Taking ${p}% leaves ${100 - p}%: × ${fs}.`)
        : grow ? `The whole is 1, and a ${one} more makes it bigger than 1.` : `The whole is 1, and taking a ${one} leaves less than 1.`;
      else if (id === "e") this.msg = `One × ${fs} for each year: count the years.`;
      else this.msg = years > 1 && v === P + sg * years * cs[0] ? `The second ${one} is of ${lens[1]}, not ${P}: ${cs[1]}, not ${cs[0]}.`
        : years === 1 && v === cs[0] ? `That's just the ${one}. ${grow ? "Add it to" : "Take it from"} ${P}.` : "The last bar shows it: count its length.";
    },
    scene() {
      const st = this.stage, cur = this.cur;
      const say = {
        cut: [`Cut the bar to find ${p}% of it.`, "Drag the ruler along the bar."],
        slide: [grow ? `Slide a ${one} onto the bar's end.` : `Slide a ${one} off the bar.`, grow ? "That's a year's growth." : "That's a year's loss."],
        write: ["Write it with one factor a year.", "Type the numbers."],
        done: [years > 1 ? (grow ? `Each year's ${one} is of a bigger bar, so it grows by more each year.` : `Each year's ${one} is of a smaller bar, so it shrinks by less each year.`)
          : grow ? `A ${one} more keeps the whole bar and adds a ${one} of it.` : `Taking a ${one} leaves the rest of the bar: ${100 - p}% of it.`],
      }[st];
      dhead(this, say[0], say[1]);
      for (let i = 0; i <= Math.min(cur, years); i++) {
        const B = lens[i], y = by(i), isCur = i === cur && st !== "write" && st !== "done", live = isCur && (this.held || !!this.pc);
        barR(`b${i}`, 0, y, B * U, 4);
        // the piece this bar got from the one above (growing): its last part, in the chapter colour
        if (i > 0 && grow) rect(`bx${i}`, (B - cs[i - 1]) * U, y, cs[i - 1] * U, 4, { c: CH });
        const c = !isCur ? cs[i] : st === "slide" ? cs[i] : this.c;
        if (c && c < B) { let d = ""; for (let k = 1; k * c < B; k++) d += `M${sq(k * c * U)} ${sq(y)}v${sq(4)}`; put(`bc${i}_${c}`, "path", { d, stroke: INK, "stroke-width": 1.5, fill: "none" }, live ? "none" : "fade"); }
        // shrinking: the part that slid off is crossed out where it was
        if (!isCur && !grow && i < years) { const x0 = (B - cs[i]) * U; path(`bxx${i}`, `M${sq(x0)} ${sq(y)}L${sq(B * U)} ${sq(y + 4)}M${sq(x0)} ${sq(y + 4)}L${sq(B * U)} ${sq(y)}`, { c: INK2 }); }
        const lbl = i === 0 ? `${P} ${noun}, ${sign}${p}% a year, ${years} year${years > 1 ? "s" : ""}` : `${lens[i - 1]} ${sign} ${cs[i - 1]} = ${B}`;
        const LX = B * U + 1;
        const moving = isCur && !!this.pc;      // a piece being carried: the bar's words wait till it lands, so it never hides them
        if (!moving) text(`bl${i}${lbl}${LX}`, lbl, LX, y + 1, "small", { anchor: "start" });
        if (isCur && st === "cut") {
          handle("ru", this.c * U, y, { big: this.held });
          if (this.c < B) rdout(LX, y + 3, `${partsName(B / this.c)}: ${this.c} each`);
        }
        if (isCur && st === "slide") {
          const pcx = grow ? 0 : (B - cs[i]) * U, w = cs[i] * U;
          if (!grow && this.pc) { rect("gap", pcx, y, w, 4, { fill: "var(--paper)", live: true }); dashRect("gapd", pcx, y, w, 4, { live: true }); }
          else rect("lit", pcx, y, w, 4, { fill: "var(--tint-strong)", c: CH, live });
          if (this.pc) rect("pc", pcx + Math.round(this.pc.dx), y + Math.round(this.pc.dy), w, 4, { fill: "var(--tint-strong)", c: CH, live: true });
          if (!moving) rdout(LX, y + 3, `1 ${one}: ${cs[i]}`);
        }
      }
      if (U === 2) text("unote", `1 ${noun.replace(/s$/, "")} is 2 squares long`, 0, by(Math.min(cur, years)) + 5.6, "small", { anchor: "start" });
      if (st !== "write" && st !== "done") return;
      mrow("r1", [`${sign}${p}%`, { words: "is", cls: "say" }, "× ", bx(this, "f", 2)], 0, RY);
      const T = bx(this, "T", String(final).length);
      if (years > 1) {
        const e = this.got.e != null ? { s: supN(years), c: CH } : { box: "e", cells: 1, value: this.vals.e, state: boxState(this, "e"), sup: true };
        mrow("r2", [`${P}${` × ${fs}`.repeat(years)} = ${P} × ${fs}`, e, " = ", T], 0, RY + 3);
      } else mrow("r2", [`${P} × ${fs} = `, T], 0, RY + 3);
      block(st === "done" ? "next" : "check", 0, RY + 5, st === "done" ? 10 : 7, st === "done" ? "Next problem" : "Check", st === "done" ? "next" : "check");
    },
  });
  L.test = {
    cutTo(c, half) { const y = by(L.cur); L.grab({ x: L.c * U, y }); L.drag({ x: c * U, y }); if (!half) L.release(); },
    slideBy(dx, dy, half) {
      const B = lens[L.cur], c = cs[L.cur], y = by(L.cur), q = { x: (grow ? 0 : (B - c) * U) + 0.5, y: y + 2 };
      L.grab(q); L.drag({ x: q.x + dx, y: q.y + dy }); if (!half) L.release();
    },
    miss() {
      if (L.stage === "cut") { const B = lens[L.cur], w = divisors(B).find(d => d < B && B / d !== n); if (w == null) return false; L.test.cutTo(w); return true; }
      if (L.stage === "slide") { L.test.slideBy(grow ? 3 : 1, 0); return true; }
      if (L.typing) { const id = L.active, v = id === "f" ? (same(p / 100, f) ? 1 + p / 100 : p / 100) : id === "e" ? years + 1 : years > 1 ? P + sg * years * cs[0] : cs[0]; L.type(dstr(v)); L.act("check"); return true; }
      return false;
    },
    right(step) {
      const h = step === "half";
      if (L.stage === "cut") return L.test.cutTo(lens[L.cur] / n, h);
      if (L.stage === "slide") return grow ? L.test.slideBy(lens[L.cur] * U, 0, h) : L.test.slideBy(cs[L.cur] * U + 3, 0, h);

    lens, U,
  };
  return L;
}

// Read the rate (record only): y = 500 × 0.97ᵗ; choose grows or shrinks, write the percent, then the amount as the
// story allows it (people whole, dollars to the cent).
function pcRate(idx, G) {
  const { grow, p, f, P, t, money } = G, fs = dstr(f), amt = P * f ** t, want = money ? Math.round(amt * 100) / 100 : Math.round(amt);
  const dp = money ? 3 : 2, tr = Math.floor(amt * 10 ** dp + 1e-9) / 10 ** dp, amtS = tr.toFixed(dp) + (Math.abs(tr - amt) < 1e-9 ? "" : "…");
  const stages = ["choose", "rate", "round", "done"], R = 7;
  const L = withBoxes({
    id: "percent", index: idx, P: G, maxZoom: 1.25, stage: "choose", wrongPick: null, msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return autoFrame(); },
    act(k) {
      if (k.startsWith("pick:")) {
        if (this.stage !== "choose") return;
        const i = +k.slice(5);
        if (i === (grow ? 0 : 1)) { this.wrongPick = null; this.msg = null; this.stage = "rate"; this.typing = true; this.active = "r"; return; }
        this.wrongPick = i;
        this.msg = grow ? `${fs} is more than 1: each year keeps it all and adds ${p}%, so it grows.` : `${fs} is less than 1: each year keeps only ${100 - p}%, so it shrinks.`;
        return;
      }
      if (boxAct(this, k) || k !== "check" || !this.typing) return;
      const id = this.active, raw = this.vals[id];
      if (!raw) { this.msg = "Type the number first."; return; }
      const v = num(raw);
      if (id === "r") {
        if (v === p) { this.stage = "round"; this.active = "w"; this.verdict = null; this.msg = null; return; }
        this.verdict = "wrong";
        this.msg = !grow && v === 100 - p ? `${fs} keeps ${100 - p}% each year: how much goes?` : grow && v === 100 + p ? `${fs} is the whole and a bit more: how much more?` : "The rate is how far the factor is from 1, as a percent.";
        return;
      }
      if (same(v, want) && (money || isInt(v))) { this.stage = "done"; this.typing = false; this.active = null; this.verdict = null; this.msg = null; return; }
      this.verdict = "wrong";
      this.msg = money ? (isInt(v) ? "Dollars go to the cent: two places after the point." : "Round to the nearest cent.") : !isInt(v) ? "People come whole." : "Round to the nearest whole person.";
    },
    scene() {
      const st = this.stage, unit = money ? "dollars" : "people";
      const say = {
        choose: ["Does it grow or shrink?", "Tap one."],
        rate: ["Write the rate.", "Type the percent."],
        round: [`Write how many ${unit} there are after ${t} years.`, "Type the number."],
        done: [grow ? `A factor above 1 keeps it all and adds ${p}% each year, so it grows.` : `A factor below 1 keeps ${100 - p}% each year, so it shrinks.`],
      }[st];
      dhead(this, say[0], say[1]);
      mrow("r1", [`y = ${P} × ${fs}ᵗ`, { words: `${unit} after t years`, cls: "say" }], 0, R);
      if (st === "choose") { wchoices(this, "ch", ["grows", "shrinks"], 0, R + 3, { across: true }); return; }
      mrow("r2", [`${fs} ${grow ? ">" : "<"} 1`, { words: grow ? "grows" : "shrinks", c: CH, cls: "say" }], 0, R + 3);
      mrow("r3", st === "rate" ? [{ box: "r", cells: 1, value: this.vals.r, state: boxState(this, "r") }, "%", { words: "a year", cls: "say" }] : [{ s: `${grow ? "+" : M}${p}%`, c: CH }, { words: "a year", cls: "say" }], 0, R + 6);
      if (st === "rate") { block("check", 0, R + 8, 7, "Check", "check"); return; }
      mrow("r4", [`t = ${t}: ${money ? "$" : ""}${P} × ${fs}${supN(t)} = ${amtS}`], 0, R + 9);
      const wv = String(want).replace(".", "").length;
      mrow("r5", [{ words: "so about", cls: "say" }, money ? "$" : "", st === "round" ? { box: "w", cells: wv, value: this.vals.w, state: boxState(this, "w") } : { s: String(want), c: CH }, ...(money ? [] : [{ words: "people", cls: "say" }])].filter(x => x !== ""), 0, R + 12);
      block(st === "done" ? "next" : "check", 0, R + 14, st === "done" ? 10 : 7, st === "done" ? "Next problem" : "Check", st === "done" ? "next" : "check");
    },
  });
  L.test = {
    miss() {
      if (L.stage === "choose") { L.act(`pick:${grow ? 1 : 0}`); return true; }

    },
    right() {
      if (L.stage === "choose") return L.act(`pick:${grow ? 0 : 1}`);
      if (L.typing) { L.type(L.active === "r" ? String(p) : money ? want.toFixed(2) : String(want)); L.act("check"); }

// × F every k hours: k equal stretches from a point (each new bar is a copy of the last, stretched from its left end;
// it snaps at whole multiples); then write F^(1/k) for one hour.
function pcStretch(idx, G) {
  const { F, k, per } = G, TOP = 6, U = Math.floor(55 / F), by = j => TOP + 6 * j, LB = by(k) + 4, RY = LB + 5;
  const L = withBoxes({
    id: "percent", index: idx, P: G, maxZoom: 1.25, stage: "stretch", j: 1, m: 1, held: false, msg: null, verdict: null, typing: false,
    progress() { return this.stage === "stretch" ? [this.j - 1, k + 1] : this.stage === "write" ? [k, k + 1] : [k + 1, k + 1]; },
    frame() { return autoFrame(); },
    prev() { return per ** (this.j - 1) * U; },
    grab(q) {
      if (this.stage !== "stretch") return false;
      if (Math.hypot(q.x - this.prev() * this.m, q.y - by(this.j) - 2) > 2.2) return false;
      this.held = true; this.msg = null; return true;
    },
    drag(q) { if (this.held) this.m = clamp(Math.round(q.x / this.prev()), 1, Math.floor(58 / this.prev())); },
    release() {
      if (!this.held) return; this.held = false;
      const m = this.m; if (m === 1) return;
      if (m === per) { this.j++; this.m = 1; if (this.j > k) { this.stage = "write"; this.typing = true; this.active = "f"; } return; }
      this.msg = `${cap(NUMW[k])} stretches of × ${m} make ${m ** k}, not ${F}.`;
    },
    act(x) {
      if (boxAct(this, x) || x !== "check" || !this.typing) return;
      const raw = this.vals.f; if (!raw) { this.msg = "Type the number first."; return; }
      const v = num(raw);
      if (v === per) { this.stage = "done"; this.typing = false; this.active = null; this.verdict = null; this.msg = null; return; }
      this.verdict = "wrong";
      this.msg = near(v, F / k) ? `Not ${F} ÷ ${k}: ${NUMW[k]} equal stretches multiply to ${F}.` : `Which number, used ${k} times, multiplies to ${F}?`;
    },
    scene() {
      const st = this.stage;
      const say = {
        stretch: [`Make × ${F} in ${k} equal stretches, one an hour.`, "Drag the new bar's end."],
        write: ["Write the factor for one hour.", "Type the number."],
        done: [`${cap(NUMW[k])} equal stretches of × ${per} make × ${F}: each one is longer than the last, but each is × ${per}.`],
      }[st];
      dhead(this, say[0], say[1]);
      const made = st === "stretch" ? this.j - 1 : k;
      for (let i = 0; i <= made; i++) {
        const len = per ** i * U, y = by(i);
        barR(`s${i}`, 0, y, len, 4);
        dot(`sp${i}`, 0, y + 2, 0.3, { c: INK });
        if (i === 0) text("name", `× ${F} every ${k} hours`, len + 1, y + 1, "say", { anchor: "start" });
        else text(`sl${i}`, `hour ${i}: × ${per ** i}`, len + 1, y + 1, "small", { anchor: "start" });
      }
      if (st === "stretch") {
        const y = by(this.j), len = this.prev() * this.m;
        barR(`cur${len}`, 0, y, len, 4, { fill: "var(--tint-strong)", c: CH, live: this.held });
        dot("cp", 0, y + 2, 0.3, { c: INK, live: true });
        handle("hd", len, y + 2, { big: this.held });
        rdout(len + 1, y + 1, `× ${this.m}: ${per ** (this.j - 1) * this.m}`);
      }
      text("unote", `1 is ${U} squares long`, 0, (st === "stretch" ? by(this.j) + 4 : LB) + 1.6, "small", { anchor: "start" });
      if (st === "stretch") return;
      const fb = st === "write" ? { box: "f", cells: 1, value: this.vals.f, state: boxState(this, "f") } : { s: String(per), c: CH };
      mrow("r1", [String(F), { sx: [`1/${k}`] }, " = ", fb, { words: "an hour", cls: "say" }], 0, RY);
      block(st === "done" ? "next" : "check", 0, RY + 2, st === "done" ? 10 : 7, st === "done" ? "Next problem" : "Check", st === "done" ? "next" : "check");
    },
  });
  L.test = {
    to(m, half) { const y = by(L.j) + 2; L.grab({ x: L.prev() * L.m, y }); L.drag({ x: L.prev() * m, y }); if (!half) L.release(); },
    miss() {
      if (L.stage === "stretch") { const m = per === 2 ? 3 : 2; if (L.prev() * m > 58) return false; L.test.to(m); return true; }
      if (L.typing) { L.type(dstr(F / k === per ? per + 1 : F / k)); L.act("check"); return true; }
      return false;
    },
    right(step) { if (L.stage === "stretch") return L.test.to(per, step === "half"); if (L.typing) { L.type(String(per)); L.act("check"); } },
    U,
  };
  return L;
}

// × 1.21 every 2 years is × [1.1] a year: +[10]% (record only)
function pcRoot(idx, G) {
  const { F, k, per } = G, grow = per > 1, Fs = dstr(F), ps = dstr(per), q = Math.round(Math.abs(per - 1) * 100), R = 7;
  const L = withBoxes({
    id: "percent", index: idx, P: G, maxZoom: 1.25, stage: "f", msg: null, verdict: null, typing: true,
    progress() { return stageIndex(["f", "q", "done"], this.stage); },
    frame() { return autoFrame(); },
    act(x) {

      const id = this.active, raw = this.vals[id]; if (!raw) { this.msg = "Type the number first."; return; }
      const v = num(raw);
      if (id === "f") {

        this.verdict = "wrong";

      }[st];
      dhead(this, say[0], say[1]);
      mrow("r1", [`× ${Fs}`, { words: `every ${k} years`, cls: "say" }], 0, R);
      mrow("r2", [{ words: "is", cls: "say" }, " × ", st === "f" ? { box: "f", cells: 2, value: this.vals.f, state: boxState(this, "f") } : { s: ps, c: CH }, { words: "a year", cls: "say" }], 0, R + 3);
      if (st === "f") { block("check", 0, R + 5, 7, "Check", "check"); return; }
      mrow("r3", [`${Array(k).fill(ps).join(" × ")} = ${Fs}`], 0, R + 6);
      mrow("r4", [grow ? "+" : M, st === "q" ? { box: "q", cells: 2, value: this.vals.q, state: boxState(this, "q") } : { s: String(q), c: CH }, "%", { words: "a year", cls: "say" }], 0, R + 9);
      block(st === "done" ? "next" : "check", 0, R + 11, st === "done" ? 10 : 7, st === "done" ? "Next problem" : "Check", st === "done" ? "next" : "check");

    miss() { if (!L.typing) return false; L.type(L.active === "f" ? dstr(k === 2 ? 1 + (F - 1) / k : per + 0.1) : String(Math.round(per * 100))); L.act("check"); return true; },

// ---------- Sequences (g9-sequence) ----------
// One square is 1 (2, 3 or 4 squares up while the tallest bar still fits, said under the numbers). Term numbers 0 to 5
// along a strong line, a block apart; each term a bar standing on its number, the given ones drawn, the rest small dashed
// holders. Adding: drag the lit strip between two bars onto a holder next to a bar you have; the bar fills. Multiplying:
// stretch the next bar from its foot; it snaps at whole copies of the last. From problem 9 only two terms are given: hop

  const opts = sqK ? ["same amount each step", "same factor each step", "neither"] : ["same amount each week", "same factor each week"];
  const rightPick = [sqK ? 2 : 0, 1], dbl = r === 2 ? "doubles" : "triples";
  const lineA = sqK ? ["A = n²", { words: "neither", c: CH, cls: "say" }] : [`A = ${a * s} + ${d * s}w`, { words: "linear", c: CH, cls: "say" }];
  const lineB = sqK ? ["B = 2ⁿ", { words: "exponential", c: CH, cls: "say" }] : [`B = ${s} × ${r}ʷ`, { words: "exponential", c: CH, cls: "say" }];
  const stages = ["choose", "hop", "sweep", "write", "done"];
  const L = withBoxes({
    id: "overtake", index: idx, P: G, maxZoom: 1.25, stage: "choose", ci: 0, hp: 0, hw: [0, 0], hv: null, held: false, sw: 0, wrongPick: null,
    msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return autoFrame(); },
    grab(q) {

      }
      if (this.stage === "sweep") {
        if (Math.abs(q.x - px(this.sw)) > 1.6 || q.y < P.TOP - 1 || q.y > OY + 1.5) return false;

      return false;
    },
    drag(q) {

    },
    release() {
      if (!this.held) return; this.held = false;
      if (this.stage === "hop") {

        if (hv === v0) return;
        if (hv === F[pl](w + 1)) {
          this.hw[pl]++;
          if (this.hw[pl] === W) { if (pl === 0) this.hp = 1; else this.stage = "sweep"; }
          return;
        }
        this.msg = pl === 0 ? (sqK ? `${w + 1}² is ${(w + 1) ** 2}: this hop is ${2 * w + 1}.` : `A adds $${d * s} each week: every hop is ${d} squares up.`)
          : sqK ? "2ⁿ doubles: its hop is as tall as it already is." : r === 2 ? "B doubles: its hop is as tall as B already is." : "B triples: its hop is twice as tall as B already is.";
        return;
      }
      const sw = this.sw;
      if (sw === this.sw0) return;
      if (sw === W) { this.stage = "write"; this.typing = true; this.active = "b"; return; }
      if (!sqK) { this.msg = sw < W ? `In week ${sw} B has ${$(fB(sw))} and A has ${$(fA(sw))}: A is still ahead.` : "B was ahead sooner: sweep back."; return; }
      this.msg = sw === 2 || sw === 4 ? `At ${sw} they're equal: ${sw * sw} = ${2 ** sw}.` : sw === 3 ? "At 3, n² is ahead: 9 > 8." : "2ⁿ is ahead here, but n² passes it at 3. Find where 2ⁿ passes for good.";
    },
    act(k) {
      if (k.startsWith("pick:")) {
        if (this.stage !== "choose") return;
        const i = +k.slice(5);
        if (i === rightPick[this.ci]) { this.wrongPick = null; this.msg = null; this.ci++; if (this.ci === 2) this.stage = "hop"; return; }
        this.wrongPick = i;
        this.msg = this.ci === 0 ? (sqK ? "n² adds 1, 3, 5, 7…: not the same amount, and not the same factor." : tab ? `The table goes up $${d * s} every week: the same amount.` : `A adds $${d * s} each week: the same amount.`)
          : sqK ? "2ⁿ doubles each step: the same factor." : `B ${dbl} its whole amount each week: the same factor.`;
        return;
      }
      if (boxAct(this, k) || k !== "check" || !this.typing) return;
      const raw = this.vals.b; if (!raw) { this.msg = "Type the number first."; return; }
      const v = num(raw), want = fB(W) * s;
      if (v === want) { this.stage = "done"; this.typing = false; this.active = null; this.verdict = null; this.msg = null; return; }
      this.verdict = "wrong";
      this.msg = sqK && v === 16 ? "That's 2⁴. 2⁵ doubles it again." : v === fB(W - 1) * s ? `That's ${word} ${W - 1}. In ${word} ${W} B ${dbl} again.` : sqK ? "2⁵ is 2 × 2 × 2 × 2 × 2." : `Count B's squares in week ${W}: each is $${s}.`;
    },
    scene() {
      const st = this.stage;
      const say = {
        choose: [`What does each plan do each ${per}?`, this.ci === 0 ? "Tap one for A." : "Tap one for B."],
        hop: [`Hop ${this.hp === 0 ? "A" : "B"} from its start, a ${per} at a time.`, "Drag the dot up to its next amount."],
        sweep: [sqK ? "Sweep across to where 2ⁿ passes n² for good." : "Sweep across to the first week B is ahead.", "Drag the line."],
        write: [`Write what B has in ${word} ${W}.`, "Type the number."],
        done: [sqK ? "n² adds a bit more each step; 2ⁿ doubles all it has, so once it passes, it stays ahead."
          : `A adds ${$(d)} each week; B ${dbl} everything it has. ${r === 2 ? "Doubling" : "Tripling"} always wins in the end.`],
      }[st];
      dhead(this, say[0], say[1]);
      drawPlane3(P);
      // the graphs: points hopped so far, joined (A in a line, B in a curve) once a plan has two
      const upTo = st === "choose" ? [-1, -1] : st === "hop" ? [this.hw[0], this.hp === 1 ? this.hw[1] : -1] : [W, W];
      for (let pl = 0; pl < 2; pl++) {
        const n = upTo[pl]; if (n < 0) continue;
        if (n >= 1) path(`g${pl}_${n}`, ptsD(curvePts(P, x => F[pl](x) * s, 0, n, 60)), {});
        for (let w = 0; w <= n; w++) dot(`p${pl}_${w}`, px(w), py(F[pl](w)), 0.35, { c: INK });
        nameAt(`nm${pl}`, pl ? "B" : "A", px(n), py(F[pl](n)), P, "say", { below: pl === 0 && n === W });
      }
      // a hop being made: across a week, then up
      if (st === "hop") {
        const pl = this.hp, w = this.hw[pl], v0 = F[pl](w);
        if (this.held) {
          path("hop", `M${sq(px(w))} ${sq(py(v0))}H${sq(px(w + 1))}V${sq(py(this.hv))}`, { c: CH, live: true });
          handle("hh", px(w + 1), py(this.hv), { big: true });
          const dv = this.hv - v0;
          rdout(RX, rH, `${pl ? "B" : "A"}, ${word} ${w + 1}: ${$(this.hv)} (${dv >= 0 ? "+" : M} ${$(Math.abs(dv))})`);
        } else handle("hh", px(w), py(v0));
      }
      if (st === "sweep") {
        line(`sw${this.sw}`, px(this.sw), OY, px(this.sw), P.TOP, { c: CH, live: true });
        handle("sh", px(this.sw), OY, { big: this.held });
        rdout(RX, rH, sqK ? `n = ${this.sw}: n² = ${this.sw ** 2}, 2ⁿ = ${2 ** this.sw}` : `week ${this.sw}: A ${$(fA(this.sw))}, B ${$(fB(this.sw))}`);
      }
      if (st === "write" || st === "done") line(`swd`, px(W), OY, px(W), P.TOP, { c: CH, dash: true });
      // beside the plane: the plans, then the record
      if (tab) {
        const cols = [0, 1, 2, 3], cx = i => RX + 7 + 5 * i;
        text("tw", "week", RX, 7, "small", { anchor: "start" }); text("ta", "A", RX, 9, "small", { anchor: "start" });
        cols.forEach(i => { text(`tc${i}`, String(i), cx(i), 7, "small"); text(`tv${i}`, $(fA(i)), cx(i), 9, "small"); });
        line("th", RX - 0.5, 8, cx(3) + 3, 8); line("tv", RX + 4, 6, RX + 4, 10);
      } else if (!sqK) text("nA", nameA, RX, 7, "small", { anchor: "start" });
      if (!sqK) text("nB", nameB, RX, tab ? 11 : 9, "small", { anchor: "start" });
      if (sqK) {   // n² and 2ⁿ are their own names: the rules are there from the start, the words come with the choice
        mrow("rA", st !== "choose" || this.ci > 0 ? lineA : [lineA[0]], RX, rA);
        mrow("rB", st !== "choose" ? lineB : [lineB[0]], RX, rB);
        if (st === "choose") wchoices(this, "ch", opts, RX, rH);
      } else {
        if (st === "choose") wchoices(this, "ch", opts, RX, this.ci === 0 ? rA : rB);
        if (st !== "choose" || this.ci > 0) mrow("rA", lineA, RX, rA);
        if (st !== "choose") mrow("rB", lineB, RX, rB);
      }
      if (st !== "write" && st !== "done") return;
      const bb = st === "write" ? { box: "b", cells: String(fB(W) * s).length, value: this.vals.b, state: boxState(this, "b") } : { s: String(fB(W) * s), c: CH };
      let end;
      if (sqK) {
        mrow("w0", ["n = 4: 16 = 16"], RX, rH);
        mrow("w1", ["n = 5: 25 < ", bb], RX, rH + 3);
        end = rH + 3;
        if (st === "done") { mrow("w2", [{ words: "2ⁿ passes n² for good at", cls: "say" }, { s: "5", c: CH }], RX, rH + 6); end = rH + 6; }
      } else {
        mrow("w1", [{ words: `week ${W}:`, cls: "say" }, `${fA(W) * s} < `, bb], RX, rH);
        end = rH;
        if (st === "done") { mrow("w2", [{ words: "B passes A in week", cls: "say" }, { s: String(W), c: CH }], RX, rH + 3); end = rH + 3; }
      }
      block(st === "done" ? "next" : "check", RX, end + 2, st === "done" ? 10 : 7, st === "done" ? "Next problem" : "Check", st === "done" ? "next" : "check");
    },
  });
  L.test = {
    hopTo(v, half) { const pl = L.hp, w = L.hw[pl]; L.grab({ x: px(w), y: py(F[pl](w)) }); L.drag({ x: px(w + 1), y: py(v) }); if (!half) L.release(); },
    sweepTo(w, half) { L.grab({ x: px(L.sw), y: OY }); L.drag({ x: px(w), y: OY }); if (!half) L.release(); },
    miss() {
      const st = L.stage;
      if (st === "choose") { L.act(`pick:${rightPick[L.ci] === 0 ? 1 : 0}`); return true; }
      if (st === "hop") { const pl = L.hp, w = L.hw[pl], t = F[pl](w + 1); L.test.hopTo(t + 1 <= OY - P.TOP ? t + 1 : t - 1); return true; }
      if (st === "sweep") { L.test.sweepTo(W - 1); return true; }
      if (L.typing) { L.type(String(fB(W - 1) * s)); L.act("check"); return true; }
      return false;
    },
    right(step) {
      const st = L.stage, half = step === "half";
      if (st === "choose") return L.act(`pick:${rightPick[L.ci]}`);
      if (st === "hop") { const pl = L.hp; return L.test.hopTo(F[pl](L.hw[pl] + 1), half); }
      if (st === "sweep") return L.test.sweepTo(W, half);
      if (L.typing) { L.type(String(fB(W) * s)); L.act("check"); }
    },
    OY, top: P.TOP,
  };
  return L;
}
// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  growth: { name: "Exponential growth", make: dGrowth },
  percent: { name: "Grow or shrink by a percent", make: dPercent },
  sequence: { name: "Sequences", make: dSequence },
  overtake: { name: "Which grows faster?", make: dOvertake },
};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id, index = 0) {
  if (!LESSONS[id]) id = "growth";
  token++;
  lesson = LESSONS[id].make(index);
  pick.value = id;
  drawn = new Set(); born = new Map(); keys.blur();
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("g9ch5-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value, 0);
document.getElementById("fresh").onclick = () => leave();
// the paper lies flat again before the next problem
function leave() { const go = () => start(lesson.id, lesson.index + 1); if (lesson.leave) lesson.leave(go); else go(); }
let first = "growth", firstP = 0;
try {
  const u = new URLSearchParams(location.search);
  first = u.get("l") || localStorage.getItem("g9ch5-lesson") || "growth";
  firstP = Math.max(0, (+u.get("p") || 1) - 1);
} catch (err) {}
start(first, firstP);
</script>
