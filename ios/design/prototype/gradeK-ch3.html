<title>Kindergarten · Measure and sort</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). Kindergarten: one block is one
   thing (a thing's length: one block one cube). Chapter 3 (Measure and sort) is measurement: the app's measurement
   amber (Theme.swift, Chapter.measurement; as 4th grade's Measurement). The kit is gradeK-ch1.html's and gradeK-ch2.html's. */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #B7791F; --tint: rgba(197, 138, 27, .2); --tint-strong: rgba(197, 138, 27, .4);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #F0B341; --tint: rgba(240, 179, 65, .22); --tint-strong: rgba(240, 179, 65, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #F0B341; --tint: rgba(240, 179, 65, .22); --tint-strong: rgba(240, 179, 65, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button[aria-pressed="true"] { background: var(--tint); }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 120px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); white-space: nowrap; }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
/* the live readout of a hand move, big in the pill's middle */
#bar #live { font: 600 22px var(--round); color: var(--chapter); padding: 0 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#bar #live:empty, #bar #live:empty + .sep { display: none; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <span id="live" aria-live="polite"></span>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="voice" type="button" aria-pressed="true">Voice</button>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera (the kit from new5-lessons.html) ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pickOne = list => list[rnd(0, list.length - 1)];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const now = () => performance.now();
const ease = u => (u <= 0 ? 0 : u >= 1 ? 1 : u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);

let items = [], drawn = new Set();
// UP: what's put now faces the child (drawn over the tilting paper, never tilted): words, word blocks, records, solids
let UP = false;
function put(k, tag, a, kind = "fade", text) { items.push({ k, tag, a, kind, text, up: UP }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1, opacity: o.op ?? null },
    o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": 1.5, pathLength: 1, opacity: o.op ?? null }, o.live ? "none" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? 1.5 : null, "fill-opacity": o.op ?? null, rx: o.rx ?? null, "stroke-dasharray": o.dash ? "6 6" : null,
    pathLength: o.c && !o.fill && !o.dash ? 1 : null }, o.live ? "none" : o.c && !o.fill && !o.dash ? "line" : "fade");
}
function circle(k, x, y, r, o = {}) {
  put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.fill || "none", stroke: o.c || null, "stroke-width": o.c ? 1.5 : null,
    opacity: o.op ?? null }, o.live ? "none" : "fade");
}
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null, opacity: o.op ?? null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a block drawn on the paper: an outline, its word and arrow (Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: "var(--ink)" });
  text(`${k}w${label}`, label, o.arrow === false ? x + w / 2 : x + 1, y + 1, "small", { anchor: o.arrow === false ? "middle" : "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  hit(`${k}hit`, x, y, w, 2, act);
}
function hit(k, x, y, w, h, act) { put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: "transparent", "data-act": act }, "none"); }
const ring = (k, x, y, r, o = {}) => path(k, `M${sq(x + r)} ${sq(y)}a${sq(r)} ${sq(r)} 0 1 1 0 -0.1`, { c: o.c || "var(--chapter)", live: o.live });
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// text widths in squares, so a record's pieces start on whole squares
const mctx = document.createElement("canvas").getContext("2d");
const SIZE = { maths: 36, say: 28, small: 20 };
function tw(s, cls = "maths") { mctx.font = `600 ${SIZE[cls]}px ui-rounded, "SF Pro Rounded", Nunito, system-ui, sans-serif`; return mctx.measureText(String(s)).width / SQ; }

let raf = 0, lastStage = null;
function render() {
  if (lesson.tick) lesson.tick(now());
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none", a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${Math.min(n++ * 0.035, 1.2).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  // the 3D lessons tilt the paper (grid and all) about a point under the picture
  const m = lesson.paperMatrix && lesson.paperMatrix();
  if (m) document.getElementById("paperg").setAttribute("transform", `matrix(${m.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  drawn = next;
  // a lesson that's moving (dots gliding, a cube flashing) draws again next frame
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  // a step that changes by itself (after a See beat) moves the camera to what it shows now
  if (lesson.stage !== lastStage) { lastStage = lesson.stage; frame(lesson.frame()); }
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
  const r = lesson.readout ? lesson.readout() : null;
  document.getElementById("live").textContent = r == null ? "" : String(r);
  voiceUpdate();
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.25x; the frame's top sits at the top of
// the screen (the words on rows 0–2 first, the picture under them), centred across
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 28, bottom = 104;
  const s = Math.min((W - 48) / sq(f.w), (H - top - bottom) / sq(f.h), 1.25);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y) - top / s };
}
function frame(f, instant) {
  const t = fitTo(f);
  if (instant) { camTo = null; Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = ease(u);
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));
const keys = document.getElementById("keys");

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper; mouse and touch alike (pointer events) ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  if (down) return;
  const p = toPaper(e), h = e.target.closest("[data-act]");
  down = { id: e.pointerId, p, sx: e.clientX, sy: e.clientY, act: h && h.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
});
svg.addEventListener("pointermove", e => {
  if (!down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
function up(e) {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); render(); frame(lesson.frame()); return; }
  if (d.moved || e.type === "pointercancel") return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) { render(); frame(lesson.frame()); }
}
svg.addEventListener("pointerup", up);
svg.addEventListener("pointercancel", up);
function act(a) {
  if (a === "next") { if (!(lesson.flatten && lesson.flatten())) leave(); return; }
  if (a === "voice") { replay(); return; }
  lesson.act(a);
  render(); frame(lesson.frame());
}

// ---------- the voice (K–2: the words are read aloud for kids who can't read yet) ----------
// Every instruction, miss line and Say line is spoken when it appears; the speaker mark drawn left of the words says
// them again. speechSynthesis may be missing (or silent until the first tap): every call is guarded.
const voice = { on: true, say: null, missN: 0, log: [] };
function speak(s) {
  if (!s) return;
  voice.log.push(s);
  if (!voice.on) return;
  try {
    const ss = window.speechSynthesis;
    if (!ss || typeof SpeechSynthesisUtterance === "undefined") return;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(s); u.rate = 0.9; u.pitch = 1.05; u.lang = "en-US";
    ss.speak(u);
  } catch (err) {}
}
function voiceUpdate() {
  const s = lesson._say || "", m = lesson.msg || "", mn = lesson.missN || 0;
  if (s !== voice.say) { voice.say = s; voice.missN = mn; speak(m ? `${s} ${m}` : s); }
  else if (mn !== voice.missN) { voice.missN = mn; if (m) speak(m); }
}
function replay() { const L = lesson; speak(L.msg ? `${L._say} ${L.msg}` : L._say); }
// the speaker mark: 2 × 2 squares left of the instruction's first row, drawn like the lessons' lines
function speaker() {
  const x = -3, y = 0, c = "var(--ink2)";
  path("spk-body", `M${sq(x + 0.1)} ${sq(y + 0.7)}h${sq(0.45)}l${sq(0.55)} ${sq(-0.45)}v${sq(1.5)}l${sq(-0.55)} ${sq(-0.45)}h${sq(-0.45)}z`, { c });
  path("spk-a1", `M${sq(x + 1.45)} ${sq(y + 0.7)}a${sq(0.4)} ${sq(0.4)} 0 0 1 0 ${sq(0.6)}`, { c });
  path("spk-a2", `M${sq(x + 1.7)} ${sq(y + 0.35)}a${sq(0.75)} ${sq(0.75)} 0 0 1 0 ${sq(1.3)}`, { c });
  hit("spk-hit", x - 0.5, y - 0.5, 3, 3, "voice");
}
// what to do on the rows above the picture (rows 0–2, 28), and what a miss says under it (rows 3–4, 20, red)
function head(L, say) {
  L._say = say;
  const was = UP; UP = true;
  speaker();
  words(`say-${say}`, say, 0, 1, 64);
  if (L.msg) words(`msg${L.missN}-${L.msg}`, L.msg, 0, 3.3, 64, "small", { c: "var(--wrong)" });
  UP = was;
}
// timers for the See beats; a new problem cancels the old one's
let token = 0;
function later(ms, fn) { const t = token; setTimeout(() => { if (t !== token) return; fn(); if (lesson) { render(); frame(lesson.frame()); } }, ms); }
function miss(L, s) { L.msg = s; L.missN = (L.missN || 0) + 1; }

// ---------- shared K pieces (chapter 1's): dots, cubes, the ten track, the record, the number row ----------
// a flash: two quick pulses after a tap that needs a second look (a counted dot, a cube too many)
const FLASH = 650;
const flashOp = t0 => { const e = now() - t0; return e < FLASH ? Math.abs(Math.sin(Math.PI * e / (FLASH / 2))) : 0; };
// a counter: a dot 3 squares across in the middle of its block; counted, it's lighter and carries its number (28)
function counter(k, cx, cy, num, o = {}) {
  if (num == null) circle(`${k}d`, cx, cy, 1.5, { fill: "var(--chapter)", live: o.live });
  else {
    circle(`${k}c`, cx, cy, 1.5, { fill: "var(--tint-strong)", c: "var(--chapter)", live: o.live });
    text(`${k}n${num}`, num, cx, cy, "say", { live: o.live });
  }
  if (o.ring) ring(`${k}r`, cx, cy, 2.05, { live: o.live });
}
// the ten track: a row of ten outlined blocks (50 × 5 squares); dashed when it waits for a train (One more)
function tenTrack(k, x, y, o = {}) {
  const c = o.c || "var(--ink)";
  if (o.dash) {
    for (let i = 0; i < 10; i++) rect(`${k}b${i}`, x + i * 5, y, 5, 5, { c, dash: true });
    return;
  }
  rect(`${k}o`, x, y, 50, 5, { c });
  for (let i = 1; i < 10; i++) line(`${k}l${i}`, x + i * 5, y, x + i * 5, y + 5, { c });
}
// a train of cubes on a track: each cube fills its block; numbers on them when counting writes them; lit cubes darker
function train(k, x, y, m, o = {}) {
  for (let j = 0; j < m; j++) {
    const lit = o.lit && o.lit(j);
    rect(`${k}f${j}${lit ? "L" : ""}`, x + j * 5, y, 5, 5, { fill: lit ? "var(--tint-strong)" : "var(--tint)", live: o.live });
    if (o.nums) text(`${k}n${j}`, j + 1, x + j * 5 + 2.5, y + 2.5, "say", { live: o.live });
  }
  if (!m) return;
  // outline: top (dashed when the stair goes on up), bottom, ends and the lines between cubes
  if (o.dashTop) line(`${k}top`, x, y, x + m * 5, y, { c: "var(--chapter)", dash: true, live: o.live });
  else line(`${k}top${m}`, x, y, x + m * 5, y, { c: "var(--chapter)", live: o.live });
  line(`${k}bot${m}`, x, y + 5, x + m * 5, y + 5, { c: "var(--chapter)", live: o.live });
  for (let j = 0; j <= m; j++) line(`${k}v${j}`, x + j * 5, y, x + j * 5, y + 5, { c: "var(--chapter)", live: o.live });
}
// a red flash over cubes (a cube too many) or a dot (counted already)
function flashCubes(k, x, y, from, to, t0) {
  const op = flashOp(t0); if (!op) return;
  for (let j = from; j < to; j++) rect(`${k}${j}`, x + j * 5, y, 5, 5, { fill: "var(--wrong)", op: (op * 0.35).toFixed(3), live: true });
}
function flashDot(k, cx, cy, t0) {
  const op = flashOp(t0); if (!op) return;
  circle(k, cx, cy, 2.05, { c: "var(--wrong)", op: op.toFixed(3), live: true });
}
// the record: a short line in maths (36) laid out in whole squares; a number is 2 squares a digit; a box is 4 squares
function record(k, parts, x, y, o = {}) {
  let cx = x;

      const j = [0, 1].find(j => Math.abs(c[0] - PX[j]) <= 12 && c[1] >= this.panY(j) - 13 && c[1] <= this.panY(j) + 5);
      if (j == null) { if (Math.abs(p.x - home(t).x) + Math.abs(p.y - home(t).y) > 1) { miss(this, "Put it on a pan."); this.back = { t, at: now(), x: p.x, y: p.y }; } else this.pos[t] = home(t); return; }
      if (this.pan[j] != null) { miss(this, "One thing on each pan."); this.back = { t, at: now(), x: p.x, y: p.y }; return; }
      this.pan[j] = t; this.msg = null;
      if (this.pan[0] != null && this.pan[1] != null) { this.stage = "tip"; this.tipT = now(); }
    },
    // the answer: the pan that went down (heavier), up (lighter), or "same" when it stayed level
    answer() {
      if (level) return "same";
      const down = T[this.pan[0]].w > T[this.pan[1]].w ? 0 : 1;
      return P.ask === "heavier" ? down : 1 - down;
    },
    tap(q) {
      if (this.stage === "pick") {
        const j = [0, 1].find(j => { const t = this.pan[j], p = this.at(t); return q.x >= p.x - 1 && q.x <= p.x + 5 * T[t].len + 1 && q.y >= p.y - 1 && q.y <= p.y + 6; });

      }
      if (this.stage === "long") {
        if (now() - this.t0 < 700) return false;
        const j = [0, 1].find(j => q.y >= ROW[j] && q.y <= ROW[j] + 5 && q.x >= LINE - 1 && q.x <= LINE + 5 * T[this.pan[j]].len + 1);
        if (j == null) return false;
        const a = T[this.pan[j]], o = T[this.pan[1 - j]];

        this.wrong = j; miss(this, `The ${a.n} is only ${cubes(a.len)}. The ${o.n} is ${o.len}.`);

    },
    choose(j) {
      const ans = this.answer();
      if (j === ans) {
        this.picked = j; this.msg = null; this.wrong = null; this.wrongPick = null;
        if (P.both) { this.stage = "long"; this.t0 = now(); } else this.stage = "done";
        return;
      }
      if (j === "same") { this.wrongPick = "Same"; this.wrong = null; miss(this, "One side went down."); return; }
      this.wrong = j; this.wrongPick = null;
      if (level) { miss(this, "Look again: it stayed level."); return; }
      const down = T[this.pan[0]].w > T[this.pan[1]].w ? 0 : 1;
      miss(this, j === down ? "That side went down. It's heavier." : "That side went up. It's lighter.");
    },
    act(a) { if (this.stage === "pick" && a === "pick:Same") this.choose("same"); },
    scene() {
      const st = this.stage, C = "var(--chapter)";
      head(this, {
        put: "Put them on.", tip: "Watch the balance.", pick: `Tap the ${P.ask} one.`, long: "Tap the longer one.",
        done: P.both ? "Longer isn't always heavier." : level ? "The same weight: the balance stays level." : "The heavier side goes down.",
      }[st]);
      const heavyLine = () => level ? `The ${T[0].many} weigh the same.` : `The ${T[this.pan[this.picked]].n} is ${P.ask}.`;
      if (st === "long" || (st === "done" && P.both)) {
        // the balance draws out; the two things lie on the start line (k-length's), each with its name
        const u = st === "long" ? ease((now() - this.t0) / 650) : 1;
        line("start", LINE, ROW[0], LINE, ROW[1] + 5, { c: "var(--ink)" });
        for (const j of [0, 1]) {
          const t = this.pan[j], from = { x: PX[j] - 2.5 * T[t].len, y: BEAM + 6 }, x = from.x + (LINE - from.x) * u, y = from.y + (ROW[j] - from.y) * u;
          thing(`th${t}`, x, y, T[t].len, { live: u < 1, c: st === "long" && this.wrong === j ? "var(--wrong)" : null });
          if (u >= 1) text(`nm${t}`, T[t].n, x + 0.5, y + 0.25, "small", { anchor: "start" });
        }
        record("rh", [heavyLine()], 0, 23);
        if (st === "done") {
          const lj = T[this.pan[0]].len > T[this.pan[1]].len ? 0 : 1;
          record("rl", [`The ${T[this.pan[lj]].n} is longer.`], 0, 26);
          block("next", 0, 31, 10, "Next problem", "next");
        }
        return;
      }
      // the balance: a post 3 blocks tall on its foot, the beam on it, a pan hanging from each end
      const tl = this.tilt(), live = st === "tip";
      rect("post", 30, BEAM, 5, 15, { c: "var(--ink)" });
      line("foot", 25, BEAM + 15, 40, BEAM + 15, { c: "var(--ink)" });
      line("beam", PX[0], BEAM + 5 * tl, PX[1], BEAM - 5 * tl, { c: "var(--ink)", live: live || tl !== 0 });
      circle("piv", PIV, BEAM, 0.6, { fill: "var(--ink)" });
      for (const j of [0, 1]) {
        const ey = BEAM + (j ? -5 : 5) * tl, py = this.panY(j), lv = live || tl !== 0;
        line(`s${j}a`, PX[j], ey, PX[j] - 10, py - 1, { c: "var(--ink2)", live: lv });
        line(`s${j}b`, PX[j], ey, PX[j] + 10, py - 1, { c: "var(--ink2)", live: lv });
        path(`pan${j}`, `M${sq(PX[j] - 10)} ${sq(py - 1)}V${sq(py)}H${sq(PX[j] + 10)}V${sq(py - 1)}`, { c: "var(--ink)", live: lv });
      }
      for (const t of [0, 1]) {
        const p = this.at(t), inPan = this.pan.indexOf(t) >= 0, j = this.pan.indexOf(t);
        const lv = (this.grabbed && this.grabbed.t === t) || (this.back && this.back.t === t) || (inPan && (live || tl !== 0));
        thing(`th${t}`, p.x, p.y, T[t].len, { live: lv, c: st === "pick" && this.wrong === j && inPan ? "var(--wrong)" : null });
        text(`nm${t}`, T[t].n, p.x + (inPan ? 2.5 * T[t].len : 0.5), p.y + 0.25, "small", { anchor: inPan ? "middle" : "start", live: lv });
      }
      if (st === "pick") wordBlocks("same", ["Same"], 25, 28, 15, this);
      if (st === "done") {
        record("rh", [heavyLine()], 0, 28);
        block("next", 0, 33, 10, "Next problem", "next");
      }
      void C;
    },
  };
  return L;
}

// ---------- Sort and count (k-sort, web) ----------
// One block is one thing. The mixed-up pile on a field of 7 × 3 blocks from row 5; a block under it, one empty row per
// kind, each row's first block holding its kind's key; the rows start on one line. Tap each one of a kind: it flies
// into its row and takes the next number. Then the field draws out, the rows rise, tap the row with the most (or the
// fewest); the rows slide into order, most at the top.
const SORT_KINDS = [
  [{ g: "button", one: "button", many: "buttons", looks: "It is round with 4 little holes" },
    { g: "leaf", one: "leaf", many: "leaves", looks: "It has a pointed tip and a line down the middle" },
    { g: "block", one: "block", many: "blocks", looks: "It has 4 corners and a little square in the middle" }],
  [{ g: "circle", one: "circle", many: "circles", looks: "It is round all the way, with no corners" },
    { g: "square", one: "square", many: "squares", looks: "It has 4 corners and 4 straight sides" },
    { g: "triangle", one: "triangle", many: "triangles", looks: "It has 3 corners and 3 straight sides" }],
];
// the web's generator as it is (the first three 2 kinds, 1–6 each, 8 in all at most; then 3 kinds, 1–8, 15 at most;
// counts all different; the fewest every fourth)
function genSort(i) {
  const early = i < 3, kinds = early ? 2 : 3, top = early ? 6 : 8, capN = early ? 8 : 15;
  for (;;) {
    const counts = shuffle(Array.from({ length: top }, (_, j) => j + 1)).slice(0, kinds);
    if (counts.reduce((s, c) => s + c, 0) <= capN) return { by: rnd(0, 1), counts, theme: rnd(0, 2), ask: i % 4 === 3 ? 1 : 0 };
  }
}
const sortKinds = P => P.counts.map((_, j) => SORT_KINDS[P.by][(j + P.theme) % 3]);
// a thing drawn in its block: one colour, so only the shape tells them apart; detail (holes, a vein, a little square)
// on the pile's things and the keys, left off where a number is written on it
function glyph(k, g, cx, cy, o = {}) {
  const fill = o.fill || "var(--tint)", c = o.c || "var(--chapter)", live = o.live, d = o.detail !== false;
  if (g === "button" || g === "circle") {
    circle(`${k}c`, cx, cy, 1.7, { fill, c, live });
    if (d && g === "button") [[-.5, -.5], [.5, -.5], [-.5, .5], [.5, .5]].forEach(([dx, dy], j) => circle(`${k}h${j}`, cx + dx, cy + dy, .22, { fill: c, live }));
  } else if (g === "square" || g === "block") {
    rect(`${k}s`, cx - 1.6, cy - 1.6, 3.2, 3.2, { fill, c, live });
    if (d && g === "block") rect(`${k}i`, cx - .6, cy - .6, 1.2, 1.2, { fill: c, live });
  } else if (g === "triangle") {
    poly(`${k}t`, [[cx, cy - 1.8], [cx + 1.95, cy + 1.5], [cx - 1.95, cy + 1.5]], { fill, c, live });
  } else {
    const x0 = cx - 1.75, y0 = cy + 1.0, x1 = cx + 1.75, y1 = cy - 1.0, r = sq(2.4);
    put(`${k}l`, "path", { d: `M${sq(x0)} ${sq(y0)}A${r} ${r} 0 0 1 ${sq(x1)} ${sq(y1)}A${r} ${r} 0 0 1 ${sq(x0)} ${sq(y0)}Z`, fill, stroke: c, "stroke-width": 1.5 }, live ? "none" : "fade");
    if (d) line(`${k}v`, x0 + .35, y0 - .2, x1 - .35, y1 + .2, { c, live });
  }
}
function lSort(index) {
  const P = genSort(index), K = P.counts.length, kinds = sortKinds(P), total = P.counts.reduce((s, c) => s + c, 0);
  const g0 = (P.theme + P.counts[0]) % K, order = [g0].concat([...Array(K).keys()].filter(i => i !== g0));
  const word = P.ask ? "fewest" : "most", pickN = P.ask ? Math.min(...P.counts) : Math.max(...P.counts), other = P.ask ? Math.max(...P.counts) : Math.min(...P.counts);
  const rightRow = P.counts.indexOf(pickN);
  // the pile: each thing in its own block of the field, at random; the circled one is the first of its kind
  const cells = shuffle([...Array(21).keys()]).slice(0, total);
  const items = []; let c = 0;
  P.counts.forEach((n, i) => { for (let j = 0; j < n; j++) { const cell = cells[c++]; items.push({ kind: i, cx: (cell % 7) * 5 + 2.5, cy: 5 + Math.floor(cell / 7) * 5 + 2.5, slot: -1, flyT: 0 }); } });
  const circled = items.findIndex(it => it.kind === g0);
  const FIELD = 5, ROWS0 = 25, ROWS1 = 5, RISE = 700, SORTT = 900, FLY = 450;
  const rank = [...Array(K).keys()].sort((x, y) => P.counts[y] - P.counts[x]);   // most at the top
  const maxC = Math.max(...P.counts), recText = `The ${kinds[rightRow].many} have the ${word}.`;
  const stagesP = order.map((_, j) => `sort${j}`).concat(["pick", "see", "done"]);
  const L = {
    id: "sort", P, stage: "sort0", cur: 0, rows: P.counts.map(() => []), msg: null, shake: null, t0: 0, wrongRow: null, items,
    progress() { return stageIndex(stagesP, this.stage === "rise" ? "pick" : this.stage); },
    frame() {
      const st = this.stage, w = Math.max(st.startsWith("sort") ? 35 : 0, 5 + 5 * maxC + 5, st === "done" ? Math.ceil(tw(recText) + 1) : 0);
      if (st.startsWith("sort")) return { x: -4, y: -1, w: w + 5, h: ROWS0 + 5 * K + 2 };
      return { x: -4, y: -1, w: w + 5, h: ROWS1 + 5 * K + (st === "done" ? 11 : 3) };
    },
    kindNow() { return order[this.cur]; },
    readout() { const n = this.stage.startsWith("sort") ? this.rows[this.kindNow()].length : 0; return n ? n : null; },
    rowDone(i) { return this.rows[i].length === P.counts[i]; },
    animating() {
      const t = now();
      return this.stage === "rise" || this.stage === "see" || (this.shake && t - this.shake.t < 450) || items.some(it => it.flyT && t - it.flyT < FLY)
        || (this.stage.startsWith("sort") && this.rowDone(this.kindNow()));
    },
    tick(t) {
      if (this.stage.startsWith("sort") && this.rowDone(this.kindNow()) && t - this.t0 > 900) {
        this.cur++; this.msg = null; this.t0 = t;
        this.stage = this.cur < K ? `sort${this.cur}` : "rise";
      }
      if (this.stage === "rise" && t - this.t0 > RISE + 150) this.stage = "pick";
      if (this.stage === "see" && t - this.t0 > SORTT + 300) this.stage = "done";
    },
    // a row's top: under the field while sorting, risen after, in count order once seen
    rowY(i) {
      const st = this.stage, e = now() - this.t0;
      if (st.startsWith("sort")) return ROWS0 + 5 * i;
      if (st === "rise") return ROWS0 + 5 * i + (ROWS1 - ROWS0) * ease(e / RISE);
      const at = ROWS1 + 5 * i, to = ROWS1 + 5 * rank.indexOf(i);
      if (st === "see") return at + (to - at) * ease(e / SORTT);
      return st === "done" ? to : at;
    },
    tap(q) {
      const st = this.stage;
      if (st.startsWith("sort")) {
        if (this.rowDone(this.kindNow())) return false;
        const j = items.findIndex(it => it.slot < 0 && Math.abs(q.x - it.cx) <= 2.5 && Math.abs(q.y - it.cy) <= 2.5);
        if (j < 0) return false;
        const it = items[j], want = this.kindNow();
        if (it.kind !== want) { const k = kinds[it.kind]; miss(this, `That's a ${k.one}. ${k.looks}.`); this.shake = { j, t: now() }; return true; }
        this.msg = null; it.slot = this.rows[want].length; it.flyT = now(); this.rows[want].push(j);
        if (this.rowDone(want)) this.t0 = now();
        return true;
      }
      if (st === "pick") {
        const i = [...Array(K).keys()].find(i => { const y = this.rowY(i); return q.y >= y && q.y <= y + 5 && q.x >= 0 && q.x <= 5 + 5 * P.counts[i] + 3; });
        if (i == null) return false;
        if (i === rightRow) { this.stage = "see"; this.t0 = now(); this.msg = null; this.wrongRow = null; return true; }
        this.wrongRow = i;
        miss(this, P.counts[i] === other ? `That group has the ${P.ask ? "most" : "fewest"}. Which group has the ${word}?` : `That group is in the middle. The ${word} is the ${P.ask ? "shortest" : "longest"} row.`);
        return true;
      }
      return false;
    },
    act() {},
    scene() {
      const st = this.stage, sorting = st.startsWith("sort"), t = now();
      head(this, sorting ? `Tap each ${kinds[this.kindNow()].one}.` : st === "see" ? `In order: most at the top.` : st === "done"
        ? (P.ask ? "Rows from one line: the shortest row has the fewest." : "Rows from one line: the longest row has the most.") : `Tap the row with the ${word}.`);
      // the field and what's left in it; the circled one ringed
      if (sorting) {
        rect("field", 0, FIELD, 35, 15, { c: "var(--ink)" });
        items.forEach((it, j) => {
          if (it.slot >= 0) return;
          let dx = 0;
          if (this.shake && this.shake.j === j) { const e = t - this.shake.t; if (e < 450) dx = Math.sin(e / 35) * 0.6 * (1 - e / 450); }
          glyph(`it${j}`, kinds[it.kind].g, it.cx + dx, it.cy, { live: dx !== 0 });
          if (j === circled) ring("circ", it.cx, it.cy, 2.3);
        });
      }
      // the rows: a key in each one's first block, the start line after it; the things counted in it, numbered
      const rowsLive = st === "rise" || st === "see";
      const y0 = this.rowY(0), yK = Math.max(...[...Array(K).keys()].map(i => this.rowY(i)));
      const top = Math.min(...[...Array(K).keys()].map(i => this.rowY(i)));
      line("rstart", 5, top, 5, yK + 5, { c: "var(--ink)", live: rowsLive });
      void y0;
      for (let i = 0; i < K; i++) {
        const y = this.rowY(i), lit = sorting && this.kindNow() === i, bad = st === "pick" && this.wrongRow === i;
        rect(`key${i}`, 0, y, 5, 5, { c: bad ? "var(--wrong)" : "var(--ink)", live: rowsLive });
        if (lit) rect(`keyl${i}`, 0, y, 5, 5, { fill: "var(--tint-strong)", live: true });
        glyph(`kg${i}`, kinds[i].g, 2.5, y + 2.5, { live: rowsLive });
        this.rows[i].forEach((j, s) => {
          const it = items[j], u = it.flyT ? ease((t - it.flyT) / FLY) : 1, tx = 5 + 5 * s + 2.5, ty = y + 2.5;
          const x = it.cx + (tx - it.cx) * u, yy = it.cy + (ty - it.cy) * u, live = u < 1 || rowsLive;
          glyph(`rg${j}`, kinds[i].g, x, yy, { detail: false, live, fill: "var(--tint-strong)" });
          if (u >= 1) text(`rn${j}`, s + 1, x, yy, "say", { live });
        });
        if (this.rowDone(i)) {
          const n = P.counts[i];
          ring(`rr${i}`, 5 + 5 * (n - 1) + 2.5, y + 2.5, 2.05, { live: rowsLive });
          text(`rc${i}`, n, 5 + 5 * n + 0.6, y + 2.5, "maths", { anchor: "start", live: rowsLive, c: bad ? "var(--wrong)" : null });
        }
      }
      if (st === "done") {
        const ry = ROWS1 + 5 * K + 3;
        record("rec", [recText], 0, ry);
        block("next", 0, ry + 5, 10, "Next problem", "next");
      }
    },
  };
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  length: { name: "Longer and shorter", make: lLength },
  heavier: { name: "Heavier and lighter", make: lHeavier },
  sort: { name: "Sort and count", make: lSort },

const index = {};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id) {
  if (!LESSONS[id]) id = "length";
  index[id] = index[id] || 0;
  token++;
  lesson = LESSONS[id].make(index[id]);
  pick.value = id;
  drawn = new Set(); lastStage = lesson.stage; voice.say = null;
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("gradeK-ch3", id); } catch (err) {}
}
pick.onchange = () => start(pick.value);
document.getElementById("fresh").onclick = () => leave();
const vbtn = document.getElementById("voice");
vbtn.onclick = () => { voice.on = !voice.on; vbtn.setAttribute("aria-pressed", String(voice.on)); if (!voice.on) try { speechSynthesis.cancel(); } catch (err) {} else replay(); };
// the next problem: a fresh one from the generator, one further down the page (easy first by index)
function leave() { index[lesson.id] = (index[lesson.id] || 0) + 1; start(lesson.id); }
const qs = new URLSearchParams(location.search);
if (qs.get("theme")) document.documentElement.dataset.theme = qs.get("theme");
let first = "length";
try { first = qs.get("l") || localStorage.getItem("gradeK-ch3") || "length"; } catch (err) {}
if (qs.get("i")) index[first] = Math.max(0, +qs.get("i") || 0);
start(first);
