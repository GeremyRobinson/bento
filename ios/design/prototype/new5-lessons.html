<title>New 5th Grade Lessons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #4F63D9; --tint: rgba(79, 99, 217, .22); --tint-strong: rgba(79, 99, 217, .42);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
/* each lesson's chapter colour (colour lives only in the maths) */
body.decimals { --chapter: #D6407F; --tint: rgba(214, 64, 127, .2); --tint-strong: rgba(214, 64, 127, .4) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.decimals { --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42) } }
:root[data-theme="dark"] body.decimals { --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42) }

body.volume { --chapter: #B7791F; --tint: rgba(197, 138, 27, .2); --tint-strong: rgba(197, 138, 27, .4) }
:root { --cube-top: #F7E3B5; --cube-front: #F0CD80; --cube-side: #E5B95E; --cube-edge: #A8741A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cube-top: #8A6A2A; --cube-front: #74561E; --cube-side: #5F4516; --cube-edge: #E9B95A; }
  :root:not([data-theme="light"]) body.volume { --chapter: #F0B341; --tint: rgba(240, 179, 65, .22); --tint-strong: rgba(240, 179, 65, .42) } }
:root[data-theme="dark"] { --cube-top: #8A6A2A; --cube-front: #74561E; --cube-side: #5F4516; --cube-edge: #E9B95A; }
:root[data-theme="dark"] body.volume { --chapter: #F0B341; --tint: rgba(240, 179, 65, .22); --tint-strong: rgba(240, 179, 65, .42) }
body.geometry { --chapter: #1E8A78; --tint: rgba(30, 138, 120, .2); --tint-strong: rgba(30, 138, 120, .4) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.geometry { --chapter: #4FD1BC; --tint: rgba(79, 209, 188, .22); --tint-strong: rgba(79, 209, 188, .42) } }
:root[data-theme="dark"] body.geometry { --chapter: #4FD1BC; --tint: rgba(79, 209, 188, .22); --tint-strong: rgba(79, 209, 188, .42) }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }
.label { font-size: 26px; font-weight: 600; fill: var(--ink2); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button[aria-pressed="true"] { background: var(--tint); }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .seg { display: flex; border: 1px solid var(--pill-line); border-radius: 999px; padding: 2px; }
#bar .seg button { font-size: 14px; padding: 6px 10px; }
#bar .seg[hidden] { display: none; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 120px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; } #bar .seg button { font-size: 13px; padding: 5px 8px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--tint)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a * b / gcd(a, b);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set();
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in
// UP: what's put now stands up off the paper or faces the child (drawn over the tilting paper, never tilted)
let UP = false;
function put(k, tag, a, kind = "fade", text) { items.push({ k, tag, a, kind, text, up: UP }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: 1 }, o.live ? "none" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, rx: o.rx ?? null,
    pathLength: o.c && !o.fill ? 1 : null, transform: o.t || null }, o.live ? "none" : o.c && !o.fill ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade"); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c }); continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c }); col += 2;
  }
}
// a fraction in a column 4 squares wide: top centred on row r+1, its bar on r+2, bottom on r+3
function frac(k, top, bot, col, r, o = {}) {
  if (top != null) text(`${k}t${top}`, top, col + 2, r + 1, "maths", { c: o.c });
  line(`${k}bar`, col, r + 2, col + 4, r + 2, { c: o.c });
  if (bot != null) text(`${k}b${bot}`, bot, col + 2, r + 3, "maths", { c: o.c });
}
// a block drawn on the paper: an outline, its word and arrow (Check, Cut, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: o.main === false ? "var(--ink3)" : "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// an answer box in the work: cells of 2 squares, what's typed in the middle, the cursor after it
function answerBox(k, x, y, cells, value, state) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : "var(--ink)";
  rect(`${k}box${cells}`, x, y, cells * 2, 2, { c, live: false });
  if (value) text(`${k}v`, value, x + cells, y + 1, "maths", { c, live: true });
  if (state === "active") {
    const w = value ? value.length * 0.62 : 0;
    put(`${k}cur`, "line", { x1: sq(x + cells + w + 0.15), y1: sq(y + 0.35), x2: sq(x + cells + w + 0.15), y2: sq(y + 1.65),
      stroke: "var(--chapter)", "stroke-width": 2 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": "type" }, "none");
}

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none", a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${Math.min(n++ * 0.035, 1.2).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  const m = lesson.paperMatrix && lesson.paperMatrix();
  if (m) document.getElementById("paperg").setAttribute("transform", `matrix(${m.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  // a lesson that's moving (the paper tilting, cubes rising) draws again next frame
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.6x
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 24, bottom = 110;
  const s = Math.min((W - 64) / sq(f.w), (H - top - bottom - 32) / sq(f.h), (lesson && lesson.maxZoom) || 1.6);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y + f.h / 2) - ((top + H - bottom) / 2) / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/[^0-9.]/g, "").slice(0, 6)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); render(); frame(lesson.frame()); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) { render(); frame(lesson.frame()); }
});
function act(a) {
  if (a === "type") { openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}


// ---------- Designer versions (ios/design/*.md) ----------
// The same paper and helpers. Three text sizes only (maths 36, say 28, small 20), one line weight (1.5), the camera
// never past 1.25 (maxZoom), a label's ink half a square from what it labels (lab), everything on grid lines. A number
// typed into the work sits 2 squares a digit, lined up on the right (dbox). Red only for wrong, green only for right.
const CAPH = { small: 0.7, say: 1.0, maths: 1.3 };
function lab(k, s, side, edge, along, cls = "small", c) {
  const h = CAPH[cls] / 2;
  if (side === "above") text(k, s, along, edge - 0.5 - h, cls, { c });
  else if (side === "below") text(k, s, along, edge + 0.5 + h, cls, { c });
  else if (side === "left") text(k, s, edge - 0.5, along, cls, { c, anchor: "end" });
  else text(k, s, edge + 0.5, along, cls, { c, anchor: "start" });
}
function dbox(k, x, y, cells, value, state, actName = "box:0", centred = false) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : state === "idle" ? "var(--ink3)" : "var(--ink)";
  const vc = state === "right" || state === "wrong" ? c : null;
  rect(`${k}o${cells}`, x, y, cells * 2, 2, { c });
  if (value) {
    if (centred) text(`${k}v`, value, x + cells, y + 1, "maths", { c: vc, live: true });
    else digits(`${k}v${value}`, value, x + cells * 2, y + 1, { c: vc });
  }
  if (state === "active") {
    const cx = centred ? x + cells + (value ? value.length * 0.31 : 0) + 0.25 : x + cells * 2 + 0.4;
    put(`${k}cur`, "line", { x1: sq(cx), y1: sq(y + 0.35), x2: sq(cx), y2: sq(y + 1.65), stroke: "var(--chapter)", "stroke-width": 1.5 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": actName }, "none");
}
// what to do on the rows above the picture: one line, and a small second line (or what a slip says, in red)
function dhead(L, say, sub) {
  words(`say-${say}`, say, 0, 1, 66);
  if (L.msg) words(`msg-${L.msg}`, L.msg, 0, 3.3, 66, "small", { c: "var(--wrong)" });
  else if (sub) words(`sub-${sub}`, sub, 0, 3.3, 66, "small");
}
// lessons with more than one answer box: each box has its own value; the hidden input types into the active one
function withBoxes(L) {
  L.vals = {}; L.active = null;
  Object.defineProperty(L, "typed", { get() { return this.vals[this.active] || ""; }, configurable: true });
  L.type = function (v) { if (this.active != null) this.vals[this.active] = v; this.verdict = null; this.msg = null; };
  return L;
}
function boxAct(L, a) { if (a.startsWith("box:")) { L.active = a.slice(4); L.typing = true; return true; } return false; }
function boxState(L, id) { return L.verdict && L.active === id ? L.verdict : L.active === id ? "active" : "idle"; }
const PIECE = { 2: ["half", "halves"], 3: ["third", "thirds"], 4: ["fourth", "fourths"], 5: ["fifth", "fifths"], 6: ["sixth", "sixths"],
  7: ["seventh", "sevenths"], 8: ["eighth", "eighths"], 9: ["ninth", "ninths"], 10: ["tenth", "tenths"], 11: ["eleventh", "elevenths"],
  12: ["twelfth", "twelfths"], 14: ["fourteenth", "fourteenths"], 15: ["fifteenth", "fifteenths"], 16: ["sixteenth", "sixteenths"],
  18: ["eighteenth", "eighteenths"], 20: ["twentieth", "twentieths"], 21: ["twenty-first", "twenty-firsts"],
  22: ["twenty-second", "twenty-seconds"], 24: ["twenty-fourth", "twenty-fourths"] };
const pname = (n, plural = true) => (PIECE[n] || [`${n}th`, `${n}ths`])[plural ? 1 : 0];
const ring = (k, x, y, r = 1.05) => path(k, `M${sq(x + r)} ${sq(y)}a${sq(r)} ${sq(r)} 0 1 1 0 -0.1`, { c: "var(--chapter)" });
const stageIndex = (list, st) => [Math.max(0, list.indexOf(st)), list.length - 1];

// ---------- Points on a grid (g5-coord) ----------
// One step is one block (5 squares): the paper's own strong lines are the coordinate grid. Plot: drag the dot from 0
// along the bottom (across), then up. Read: drag the point down to the numbers, then across to the side, then write it.
function dCoord() {
  const S = 5, XM = 10, YM = 7, ox = 5, oy = 43;
  const P = (u, v) => ({ x: ox + u * S, y: oy - v * S });
  let a, b; do { a = rnd(1, XM); b = rnd(1, YM); } while (a === b);
  const kind = rnd(0, 1) ? "plot" : "read", name = "ABCDEFGHKMPRT"[rnd(0, 12)];
  const stages = kind === "plot" ? ["across", "up", "done"] : ["down", "side", "write", "done"];
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const L = withBoxes({
    id: "coord", maxZoom: 1.25, stage: stages[0], u: 0, v: 0, dv: b, du: a, grabbed: false, msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return { x: -1, y: -1, w: 72, h: 48 }; },
    grab(q) {
      const st = this.stage;
      const at = kind === "plot" ? P(this.u, this.v) : P(a, b);
      if (!["across", "up", "down", "side"].includes(st) || Math.hypot(q.x - at.x, q.y - at.y) > 2.5) return false;
      this.grabbed = true; this.msg = null; return true;
    },
    drag(q) {
      const st = this.stage;
      if (st === "across") this.u = clamp((q.x - ox) / S, 0, XM);
      else if (st === "up") this.v = clamp((oy - q.y) / S, 0, YM);
      else if (st === "down") this.dv = clamp((oy - q.y) / S, 0, b);
      else if (st === "side") this.du = clamp((q.x - ox) / S, 0, a);
    },
    release() {
      this.grabbed = false;
      const st = this.stage;
      if (st === "across") {
        const n = Math.round(this.u); this.u = n;
        if (n === a) { this.stage = "up"; return; }
        if (n === 0) return;
        this.msg = n === b ? `That's ${b} across. The first number, ${a}, is how far across.` : `That's ${n} across. Count ${a} along the bottom.`;
        this.u = 0;
      } else if (st === "up") {
        const n = Math.round(this.v); this.v = n;
        if (n === b) { this.stage = "done"; return; }
        if (n === 0) return;
        this.msg = n === a ? `That's ${a} up. The second number, ${b}, is how far up.` : `That's ${n} up. Count ${b} up.`;
        this.v = 0;
      } else if (st === "down") {
        if (this.dv < 0.4) { this.dv = 0; this.stage = "side"; return; }
        this.msg = "Drag it all the way down to the numbers."; this.dv = b;
      } else if (st === "side") {
        if (this.du < 0.4) { this.du = 0; this.stage = "write"; this.typing = true; this.active = "x"; return; }
        this.msg = "Drag it all the way across to the numbers."; this.du = a;
      }
    },
    act(x) {
      if (boxAct(this, x)) return;
      if (x !== "check" || this.stage !== "write") return;
      const vx = this.vals.x, vy = this.vals.y;
      if (!vx || !vy) { this.msg = "Fill in both boxes."; return; }
      if (+vx === a && +vy === b) { this.verdict = "right"; this.stage = "done"; this.typing = false; this.msg = null; return; }
      this.verdict = "wrong";
      if (+vx === b && +vy === a) this.msg = "Across comes first: the number under it, then the one beside it.";
      else if (+vx !== a) { this.active = "x"; this.msg = `${name} is above ${a} on the bottom line.`; }
      else { this.active = "y"; this.msg = `${name} is level with ${b} on the side.`; }
    },
    scene() {
      const st = this.stage;
      const say = {
        across: [`Put ${name} at (${a}, ${b}).`, "Drag the dot along the bottom. The first number is how far across."],
        up: ["Now drag it up.", "The second number is how far up."],
        done: kind === "plot" ? [`${a} across, then ${b} up.`, "Across always comes first."] : [`${name} is ${a} across and ${b} up.`, "Across always comes first."],
        down: [`Where is ${name}?`, `Drag ${name} straight down to the numbers.`],
        side: [`Now drag ${name} across to the side.`, ""],
        write: ["Write where it is.", "Across first, then up."],
      }[st];
      dhead(this, say[0], say[1]);
      // the axes: the paper's strong lines are the grid; only the two edges and their numbers are drawn
      const xEnd = ox + XM * S + 2, yEnd = oy - YM * S - 2;
      line("ax", ox, oy, xEnd, oy); path("axa", `M${sq(xEnd - 0.8)} ${sq(oy - 0.8)}L${sq(xEnd)} ${sq(oy)}L${sq(xEnd - 0.8)} ${sq(oy + 0.8)}`);
      line("ay", ox, oy, ox, yEnd); path("aya", `M${sq(ox - 0.8)} ${sq(yEnd + 0.8)}L${sq(ox)} ${sq(yEnd)}L${sq(ox + 0.8)} ${sq(yEnd + 0.8)}`);
      lab("axn", "x", "right", xEnd, oy, "small"); lab("ayn", "y", "above", yEnd, ox, "small");
      const litX = kind === "plot" ? (st === "across" && this.grabbed ? Math.round(this.u) : st !== "across" ? a : null) : (st !== "down" ? a : null);
      const litY = kind === "plot" ? (st === "up" && this.grabbed ? Math.round(this.v) : st === "done" ? b : null) : (["write", "done"].includes(st) ? b : null);
      for (let i = 0; i <= XM; i++) {
        line(`xt${i}`, ox + i * S, oy, ox + i * S, oy + 0.5);
        lab(`xl${i}${litX === i}`, i, "below", oy + 0.5, ox + i * S, "small", litX === i && i ? "var(--chapter)" : null);
      }
      for (let j = 1; j <= YM; j++) {
        line(`yt${j}`, ox - 0.5, oy - j * S, ox, oy - j * S);
        lab(`yl${j}${litY === j}`, j, "left", ox - 0.5, oy - j * S, "small", litY === j ? "var(--chapter)" : null);
      }
      const rx = 59, ry = 10;
      if (kind === "plot") {
        // the path walked: along the bottom, then up
        const u = st === "across" ? this.u : a, v = st === "up" ? this.v : st === "done" ? b : 0;
        if (u > 0.05) line("walkx", ox, oy, ox + u * S, oy, { c: "var(--chapter)", live: st === "across" });
        if (st !== "across" && v > 0.05) line("walky", ox + a * S, oy, ox + a * S, oy - v * S, { c: "var(--chapter)", live: st === "up" });
        const at = P(u, v);
        dot("pt", at.x, at.y, this.grabbed ? 0.7 : 0.55, { c: "var(--chapter)", live: true });
        if (this.grabbed) lab("read", st === "across" ? `${Math.round(this.u)} across` : `${Math.round(this.v)} up`, "above", at.y - 1, at.x, "small", "var(--chapter)");
        if (st === "done") lab("ptn", name, "right", at.x + 0.6, at.y - 1.2, "say", "var(--chapter)");
        // the record: the pair, each number labelled once its move is made
        text("rn", name, rx + 1, ry, "maths");
        text("ro", "(", rx + 3.5, ry, "maths");
        text("ra", a, rx + 5, ry, "maths", { c: st !== "across" ? "var(--chapter)" : null });
        text("rc", ",", rx + 6.5, ry, "maths");
        text("rb", b, rx + 8, ry, "maths", { c: st === "done" ? "var(--chapter)" : null });
        text("rcl", ")", rx + 9.5, ry, "maths");
        if (st !== "across") lab("rau", "across", "below", ry + 1, rx + 5, "small");
        if (st === "done") { lab("rbu", "up", "below", ry + 1, rx + 8, "small"); block("next", rx, ry + 5, 10, "Next problem", "next"); }
      } else {
        const pt = P(a, b);
        // the dashed lines the point is dragged along
        if (st === "down" && this.grabbed) line(`dd${this.dv.toFixed(2)}`, pt.x, pt.y, pt.x, oy - this.dv * S, { dash: true, c: "var(--chapter)", live: true });
        if (st !== "down") line("ddown", pt.x, pt.y, pt.x, oy, { dash: true, c: "var(--chapter)" });
        if (st === "side" && this.grabbed) line(`ds${this.du.toFixed(2)}`, pt.x, pt.y, ox + this.du * S, pt.y, { dash: true, c: "var(--chapter)", live: true });
        if (st === "write" || st === "done") line("dside", pt.x, pt.y, ox, pt.y, { dash: true, c: "var(--chapter)" });
        dot("pt", pt.x, pt.y, this.grabbed ? 0.7 : 0.55, { c: "var(--chapter)", live: true });
        lab("ptn", name, "right", pt.x + 0.6, pt.y - 1.2, "say");
        if (this.grabbed) {
          const end = st === "down" ? P(a, this.dv) : P(this.du, b);
          dot("fing", end.x, end.y, 0.35, { c: "var(--chapter)", live: true });
        }
        if (st === "write" || st === "done") {
          text("rn", name, rx + 1, ry, "maths");
          text("ro", "(", rx + 3.5, ry, "maths");
          text("rc", ",", rx + 7.5, ry, "maths");
          text("rcl", ")", rx + 11.5, ry, "maths");
        }
        if (st === "write") {
          dbox("x", rx + 4.5, ry - 1, 1, this.vals.x || "", boxState(this, "x"), "box:x", true);
          dbox("y", rx + 8.5, ry - 1, 1, this.vals.y || "", boxState(this, "y"), "box:y", true);
          block("check", rx, ry + 5, 7, "Check", "check");
        } else if (st === "done") {
          text("rx", a, rx + 5.5, ry, "maths", { c: "var(--chapter)" }); text("ry", b, rx + 9.5, ry, "maths", { c: "var(--chapter)" });
          lab("rau", "across", "below", ry + 1, rx + 5.5, "small"); lab("rbu", "up", "below", ry + 1, rx + 9.5, "small");
          block("next", rx, ry + 5, 10, "Next problem", "next");
        }
      }
    },
  });
  return L;
}

// ---------- Comparing decimals (g5-compare) ----------
// Rounding's zoom lines: the first line is a whole cut into ten blocks of a tenth. Tap the block both numbers are in
// and it opens into ten hundredths, and so on, until they land in different blocks. Then the bigger is plain to see.
function dCompare() {
  const names = ["tenth", "hundredth", "thousandth"];
  let w, d, A, B, la, lb, NA, NB;
  for (;;) {
    w = rnd(0, 3) === 0 ? rnd(1, 9) : 0; d = rnd(1, 3);
    A = [rnd(0, 9), rnd(0, 9), rnd(0, 9)]; B = A.slice();
    do B[d - 1] = rnd(0, 9); while (B[d - 1] === A[d - 1]);
    for (let j = d; j < 3; j++) B[j] = rnd(0, 9);
    // the trap school sets: the shorter number is often the bigger one
    const bigA = A[d - 1] > B[d - 1];
    la = d < 3 && rnd(0, 2) ? (bigA ? d : rnd(d + 1, 3)) : rnd(d, 3);
    lb = d < 3 && rnd(0, 2) ? (bigA ? rnd(d + 1, 3) : d) : rnd(d, 3);
    if (A[la - 1] === 0 || B[lb - 1] === 0) continue;
    NA = w * 1000 + A.slice(0, la).reduce((s, x, i) => s + x * 10 ** (2 - i), 0);
    NB = w * 1000 + B.slice(0, lb).reduce((s, x, i) => s + x * 10 ** (2 - i), 0);
    if (NA !== NB) break;
  }
  const As = `${w}.${A.slice(0, la).join("")}`, Bs = `${w}.${B.slice(0, lb).join("")}`;
  const size = j => 10 ** (3 - j), lo = (N, j) => Math.floor(N / size(j)) * size(j), dig = (N, j) => Math.floor(N / size(j + 1)) % 10;
  const show = (u, dd) => String(parseFloat((u / 1000).toFixed(dd))), lvY = j => 10 + 12 * j;
  const bigger = NA > NB ? ">" : "<", big = NA > NB ? As : Bs, small = NA > NB ? Bs : As;
  const stages = []; for (let j = 0; j < d - 1; j++) stages.push(`same${j}`); stages.push("split", "sign", "done");
  const L = {
    id: "compare", maxZoom: 1.25, stage: stages[0], open: 1, lit: {}, litA: null, litB: null, wrong: null, msg: null, picked: null,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return { x: -2, y: -1, w: 78, h: Math.max(lvY(this.open - 1) + 8, 27) }; },
    tap(q) {
      const st = this.stage, j = st === "split" ? d - 1 : st.startsWith("same") ? +st.slice(4) : -1;
      if (j < 0) return false;
      const y = lvY(j);
      if (q.y < y - 3.5 || q.y > y + 1.5 || q.x < 0 || q.x > 50) return false;
      const bl = Math.min(9, Math.floor(q.x / 5)), s = size(j + 1), base = lo(NA, j);
      this.msg = null; this.wrong = null;
      if (st !== "split") {
        if (bl === dig(NA, j)) { this.lit[j] = bl; this.open = j + 2; this.stage = stages[stages.indexOf(st) + 1]; }
        else { this.wrong = { j, bl }; this.msg = `They aren't between ${show(base + bl * s, j + 1)} and ${show(base + (bl + 1) * s, j + 1)}.`; }
        return true;
      }
      if (bl === dig(NA, j)) this.litA = bl;
      else if (bl === dig(NB, j)) this.litB = bl;
      else { this.wrong = { j, bl }; this.msg = `Neither number is between ${show(base + bl * s, j + 1)} and ${show(base + (bl + 1) * s, j + 1)}.`; }
      if (this.litA != null && this.litB != null) this.stage = "sign";
      return true;
    },
    act(x) {
      if (this.stage !== "sign" || (x !== "lt" && x !== "gt")) return;
      this.picked = x === "gt" ? ">" : "<";
      if (this.picked === bigger) { this.stage = "done"; this.msg = null; }
      else this.msg = `Look at the ${names[d - 1]}s: ${A[d - 1]} and ${B[d - 1]}. The open mouth faces the bigger one.`;
    },
    scene() {
      const st = this.stage, pl = names[d - 1];
      const shared = [];
      if (w) shared.push(`${w} whole${w > 1 ? "s" : ""}`);
      for (let j = 0; j < d - 1; j++) shared.push(`${A[j]} ${names[j]}${A[j] === 1 ? "" : "s"}`);
      const dB = Math.max(A[d - 1], B[d - 1]), dS = Math.min(A[d - 1], B[d - 1]);
      const fewer = big.length < small.length;
      const why = `${shared.length ? "Both have " + shared.join(" and ") + ". " : ""}${dB} ${pl}${dB === 1 ? " is" : "s are"} more than ${dS}.${fewer ? " Fewer digits, still bigger." : ""}`;
      const say = st.startsWith("same") ? [`Which is bigger, ${As} or ${Bs}?`, `Tap the ${names[+st.slice(4)]} they're both in.`]
        : st === "split" ? (d === 1 ? [`Which is bigger, ${As} or ${Bs}?`, "Tap the tenth each one is in."] : [`Tap the ${pl} each one is in.`, `Their ${names[d - 2]}s match, so look closer.`])
        : st === "sign" ? ["Which is bigger?", "Tap < or >."]
        : [`${big} is bigger.`, why];
      dhead(this, say[0], say[1]);
      for (let j = 0; j < this.open; j++) {
        const y = lvY(j), s = size(j + 1), base = lo(NA, j);
        if (this.lit[j] != null) rect(`lit${j}`, this.lit[j] * 5, y - 2, 5, 2, { fill: "var(--tint-strong)" });
        if (j === d - 1) {
          if (this.litA != null) { rect("litA", this.litA * 5, y - 2, 5, 2, { fill: "var(--tint-strong)" }); lab("labA", As, "above", y - 2, this.litA * 5 + 2.5, "small", "var(--chapter)"); }
          if (this.litB != null) { rect("litB", this.litB * 5, y - 2, 5, 2, { fill: "url(#stripes)" }); lab("labB", Bs, "above", y - 2, this.litB * 5 + 2.5, "small", "var(--chapter)"); }
        }
        if (this.wrong && this.wrong.j === j) rect(`wr${j}${this.wrong.bl}`, this.wrong.bl * 5, y - 2, 5, 2, { fill: "var(--wrong)", op: .18 });
        line(`lv${j}`, 0, y, 50, y);
        for (let i = 0; i <= 10; i++) line(`lv${j}t${i}`, i * 5, y - (i % 5 === 0 ? 2 : 1), i * 5, y);
        lab(`lv${j}lo`, show(base, j), "below", y, 0, "small");
        lab(`lv${j}hi`, show(base + size(j), j), "below", y, 50, "small");
        if (this.lit[j] != null && j + 1 < this.open) {
          const bl = this.lit[j], y2 = lvY(j + 1);
          line(`mgL${j}`, bl * 5, y + 2.4, 0, y2 - 5.5, { dash: true, c: "var(--chapter)" });
          line(`mgR${j}`, bl * 5 + 5, y + 2.4, 50, y2 - 5.5, { dash: true, c: "var(--chapter)" });
        }
      }
      // the record: the two numbers stacked with their points lined up, the deciding place ringed
      const px = 60, ry = [9, 13];
      digits("nA", As, px + 2 * la, ry[0]); digits("nB", Bs, px + 2 * lb, ry[1]);
      const colX = px + 2 * d - 1;
      if (["sign", "done"].includes(st)) { ring("rA", colX, ry[0]); ring("rB", colX, ry[1]); }
      if (st === "sign" || st === "done") {
        const y = 19, wA = 2 * (As.length - 1), x0 = 54;
        digits("iA", As, x0 + wA, y);
        const sx = x0 + wA + 1;
        if (st === "done") text("sg", bigger, sx + 1.5, y, "maths", { c: "var(--chapter)" });
        else rect("sgbox", sx, y - 1, 3, 2, { c: "var(--ink3)" });
        digits("iB", Bs, sx + 4 + 2 * (Bs.length - 1), y);
        if (st === "sign") for (const [k, sgn, x] of [["lt", "<", 54], ["gt", ">", 59]]) { rect(`${k}o`, x, 23, 4, 2, { c: "var(--ink)" }); text(`${k}w`, sgn, x + 2, 24, "maths"); put(`${k}hit`, "rect", { x: sq(x), y: sq(23), width: sq(4), height: sq(2), fill: "transparent", "data-act": k }, "none"); }
        else block("next", 54, 23, 10, "Next problem", "next");
      }
    },
  };
  return L;
}

// ---------- Fractions as division (g5-fracdiv) ----------
// One bar is one whole, 48 squares (40 for fifths). Cut every whole into one piece per friend with the ruler, then
// shade one friend's share; it slides together into one bar: a pieces of size 1/b, so a ÷ b = a/b.
function dFracDiv() {
  const things = [["sandwich", "sandwiches"], ["ribbon", "ribbons"], ["granola bar", "granola bars"], ["sub", "subs"]];
  const T = things[rnd(0, things.length - 1)];
  let a, b; do { b = [2, 3, 4, 5, 6, 8][rnd(0, 5)]; a = rnd(2, 4); } while (a === b || (a > b && rnd(0, 2)));
  const W = b === 5 ? 40 : 48, pw = W / b, H = 3, Y = i => 8 + 5 * i, rx = W + 5;
  const nm = n => (n === 1 ? T[0] : T[1]);
  const shareBars = Math.ceil(a / b), sy = Y(a) + 3;
  const stages = ["cut", "share", "write", "done"];
  const shaded = new Set();
  const L = withBoxes({
    id: "fracdiv", maxZoom: 1.25, stage: "cut", cx: null, grabbed: false, msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return { x: -3, y: -1, w: rx + 20, h: Math.max(30, (this.stage === "cut" || this.stage === "share" ? Y(a) : sy + shareBars * 5) + 7) }; },
    grab(q) {
      if (this.stage !== "cut" || q.y < Y(0) - 1.5 || q.y > Y(a - 1) + H + 1.5 || q.x <= 0 || q.x >= W) return false;
      this.grabbed = true; this.msg = null; this.drag(q); return true;
    },
    drag(q) { this.cx = Math.max(1, Math.min(W - 1, Math.round(q.x))); },
    release() { this.grabbed = false; },
    tap(q) {
      if (this.stage !== "share") return false;
      for (let i = 0; i < a; i++) {
        if (q.y >= Y(i) && q.y <= Y(i) + H && q.x >= 0 && q.x < W) {
          const k = `${i}:${Math.floor(q.x / pw)}`;
          if (shaded.has(k)) shaded.delete(k); else shaded.add(k);
          this.msg = null; return true;
        }
      }
      return false;
    },
    act(x) {
      if (boxAct(this, x)) return;
      if (x !== "check") return;
      const st = this.stage;
      if (st === "cut") {
        const cx = this.cx;
        if (!cx) this.msg = "Drag down across the bars to cut them.";
        else if (W % cx) this.msg = "The pieces must fill the whole bar.";
        else if (W / cx !== b) this.msg = `That's ${W / cx} pieces in each. There are ${b} friends.`;
        else { this.stage = "share"; this.msg = null; }
      } else if (st === "share") {
        const n = shaded.size;
        if (n === a) { this.stage = "write"; this.typing = true; this.active = "t"; this.msg = null; }
        else if (n < a) this.msg = `If each friend gets ${n}, ${b} friends take ${n * b}. ${a * b - n * b} are left over.`;
        else this.msg = `If each friend gets ${n}, ${b} friends need ${n * b}. There are only ${a * b}.`;
      } else if (st === "write") {
        const t = this.vals.t, bt = this.vals.b;
        if (!t || !bt) { this.msg = "Fill in both boxes."; return; }
        if (+t === a && +bt === b) { this.verdict = "right"; this.stage = "done"; this.typing = false; this.msg = null; }
        else if (+t === b && +bt === a) { this.verdict = "wrong"; this.msg = "Upside down: the top is how many pieces, the bottom is what size."; }
        else if (+t * b === +bt * a) { this.verdict = "wrong"; this.msg = `Same amount. Write it in ${pname(b)}, the pieces you cut.`; }
        else { this.verdict = "wrong"; this.msg = `Count the pieces in one share. Each is 1/${b}.`; }
      }
    },
    scene() {
      const st = this.stage;
      const say = {
        cut: [`${a} ${nm(a)}, shared equally by ${b} friends.`, "Cut every one so each friend gets a piece. Drag down across them."],
        share: ["Shade one friend's share.", "Tap the pieces. Every friend gets the same."],
        write: ["How much is one share?", `Write it as a fraction of one ${T[0]}.`],
        done: [`Each friend gets ${a}/${b} of a ${T[0]}.`, `Every ${T[0]} gives each friend 1/${b}, and there are ${a} of them.`],
      }[st];
      dhead(this, say[0], say[1]);
      const cutDone = st !== "cut";
      for (let i = 0; i < a; i++) {
        const y = Y(i);
        for (let p = 0; p < b; p++) if (shaded.has(`${i}:${p}`)) rect(`s${i}_${p}`, p * pw, y, pw, H, { fill: "var(--tint-strong)", live: st === "share" });
        rect(`bar${i}`, 0, y, W, H, { c: "var(--chapter)" });
        if (cutDone) for (let x = pw; x < W; x += pw) line(`bc${i}_${x}`, x, y, x, y + H, { c: "var(--chapter)" });
      }
      lab("barsn", `${a} ${nm(a)}`, "right", W, Y(0) + H / 2, "small");
      if (st === "cut" && this.cx) {
        for (let i = 0; i < a; i++) for (let x = this.cx; x < W; x += this.cx) line(`cut${i}_${x}`, x, Y(i) - 0.8, x, Y(i) + H + 0.8, { c: "var(--ink2)", dash: this.grabbed, live: true });
        const n = W / this.cx;
        if (this.grabbed && Number.isInteger(n)) lab("cutn", `${n} pieces`, "above", Y(0) - 0.8, this.cx, "small", "var(--chapter)");
      }
      if (st === "share") lab(`cnt${shaded.size}`, `${shaded.size} piece${shaded.size === 1 ? "" : "s"}`, "below", Y(a - 1) + H, 4, "small");
      // one friend's share, slid together into whole bars
      if (st === "write" || st === "done") {
        for (let j = 0; j < shareBars; j++) {
          const y = sy + 5 * j, n = Math.min(b, a - j * b);
          rect(`sh${j}`, 0, y, n * pw, H, { fill: "var(--tint-strong)" });
          rect(`sho${j}`, 0, y, W, H, { c: "var(--chapter)" });
          for (let x = pw; x < W; x += pw) line(`shc${j}_${x}`, x, y, x, y + H, { c: "var(--chapter)" });
        }
        lab("shn", "one share", "right", W, sy + H / 2, "small", "var(--chapter)");
        line("rule", 0, sy - 1.5, W, sy - 1.5, { c: "var(--ink3)" });
      }
      // the record: a ÷ b, then = and the fraction
      // the fraction column: top box on rows fr..fr+2, its bar on fr+2, the bottom box under it (as in Adding fractions)
      const fr = Y(0) - 1, mid = fr + 2;
      text("ra", a, rx + 1, mid, "maths"); text("rdiv", "÷", rx + 3.5, mid, "maths"); text("rb", b, rx + 6, mid, "maths");
      if (st === "write") {
        text("req", "=", rx + 8.5, mid, "maths");
        dbox("t", rx + 10, fr, 2, this.vals.t || "", boxState(this, "t"), "box:t", true);
        line("fbar", rx + 10, mid, rx + 14, mid);
        dbox("b", rx + 10, mid, 2, this.vals.b || "", boxState(this, "b"), "box:b", true);
      } else if (st === "done") {
        text("req", "=", rx + 8.5, mid, "maths", { c: "var(--chapter)" });
        frac("fr", a, b, rx + 10, fr, { c: "var(--chapter)" });
      }
      const by = st === "write" || st === "done" ? sy + 5 * shareBars + 1 : Y(a) + 1;
      if (st === "done") block("next", 0, by, 10, "Next problem", "next"); else block("check", 0, by, 7, "Check", "check");
    },
  });
  return L;
}

// ---------- Sorting shapes (g5-shapes) ----------
// A four-sided shape drawn on the grid by its corners, its sides counted in squares. Tap the parallel pairs (a wrong
// pair says how each side goes, in squares across and up), tap the square corners, then tap the smallest box it fits
// in on the family picture; every box around that one lights too.
function dShapes() {
  const kinds = {
    square: [[[0, 0], [15, 0], [15, 15], [0, 15]], [[0, 9], [12, 0], [21, 12], [9, 21]], [[0, 0], [20, 0], [20, 20], [0, 20]]],
    rect: [[[0, 0], [24, 0], [24, 10], [0, 10]], [[0, 0], [15, 0], [15, 20], [0, 20]], [[0, 0], [20, 0], [20, 15], [0, 15]]],
    rhombus: [[[0, 9], [12, 0], [24, 9], [12, 18]], [[9, 0], [24, 0], [15, 12], [0, 12]]],
    para: [[[6, 0], [24, 0], [18, 8], [0, 8]], [[0, 0], [15, 0], [21, 8], [6, 8]], [[0, 0], [10, 0], [16, 8], [6, 8]].map(([x, y]) => [x * 1.5, y * 1.5])],
    trap: [[[9, 0], [15, 0], [24, 12], [0, 12]], [[0, 0], [15, 0], [24, 12], [0, 12]], [[6, 0], [14, 0], [20, 8], [0, 8]]],
    quad: [[[0, 4], [14, 0], [20, 15], [4, 12]], [[0, 0], [12, 0], [20, 16], [3, 10]]],
  };
  const kind = Object.keys(kinds)[rnd(0, 5)], list = kinds[kind];
  let V = list[rnd(0, list.length - 1)].map(p => p.slice());
  console.assert(Math.max(...V.map(p => p[0])) <= 24, "shape too wide for the family picture");
  if (rnd(0, 1)) { const mx = Math.max(...V.map(p => p[0])); V = V.map(([x, y]) => [mx - x, y]).reverse(); }
  const ox = 2, oy = 9 + Math.max(0, Math.floor((22 - Math.max(...V.map(p => p[1]))) / 2));
  V = V.map(([x, y]) => [x + ox, y + oy]);
  const side = i => [V[(i + 1) % 4][0] - V[i][0], V[(i + 1) % 4][1] - V[i][1]];
  const cross = (u, v) => u[0] * v[1] - u[1] * v[0], dotp = (u, v) => u[0] * v[0] + u[1] * v[1];
  const pairs = [[0, 2], [1, 3]].filter(([i, j]) => cross(side(i), side(j)) === 0);
  const cornerVec = i => [side(i), side((i + 3) % 4).map(x => -x)];
  const rights = [0, 1, 2, 3].filter(i => dotp(...cornerVec(i)) === 0);
  const len = i => Math.hypot(...side(i));
  const cx = V.reduce((s, p) => s + p[0], 0) / 4, cy = V.reduce((s, p) => s + p[1], 0) / 4;
  const how = i => {
    let [dx, dy] = side(i);
    if (dy === 0) return "straight across"; if (dx === 0) return "straight up";
    if (dx < 0) { dx = -dx; dy = -dy; }
    const g = gcd(Math.abs(dx), Math.abs(dy));
    return `${dx / g} across, ${Math.abs(dy) / g} ${dy < 0 ? "up" : "down"}`;
  };
  // the family picture: boxes inside boxes
  const R = {
    Q: { x: 29, y: 6, w: 38, h: 37, name: "Quadrilaterals", lx: 30, ly: 7.5, needs: "4 sides" },
    T: { x: 31, y: 11, w: 34, h: 30, name: "Trapezoids", lx: 32, ly: 12.5, needs: "at least one pair of parallel sides" },
    P: { x: 33, y: 16, w: 30, h: 23, name: "Parallelograms", lx: 34, ly: 17.5, needs: "2 pairs of parallel sides" },
    R: { x: 35, y: 21, w: 16, h: 16, name: "Rectangles", lx: 35.5, ly: 22.5, needs: "4 square corners" },
    H: { x: 45, y: 21, w: 16, h: 16, name: "Rhombuses", lx: 60.5, ly: 22.5, end: true, needs: "4 equal sides" },
    S: { x: 45, y: 21, w: 6, h: 16, name: "Squares", lx: 48, ly: 30, mid: true, needs: "4 square corners and 4 equal sides" },
  };
  const chain = { square: ["S", "R", "H", "P", "T", "Q"], rect: ["R", "P", "T", "Q"], rhombus: ["H", "P", "T", "Q"], para: ["P", "T", "Q"], trap: ["T", "Q"], quad: ["Q"] }[kind];
  const one = { square: "square", rect: "rectangle", rhombus: "rhombus", para: "parallelogram", trap: "trapezoid", quad: "quadrilateral" };
  const aName = { S: "a square", R: "a rectangle", H: "a rhombus", P: "a parallelogram", T: "a trapezoid", Q: "a quadrilateral" };
  const inR = (r, q) => q.x >= r.x && q.x <= r.x + r.w && q.y >= r.y && q.y <= r.y + r.h;
  const stages = ["parallel", "corners", "sort", "done"];
  const L = {
    id: "shapes", maxZoom: 1.25, stage: "parallel", pick: null, found: [], marks: new Set(), wrongSide: null, wrongCorner: null, wrongBox: null, msg: null,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return this.stage === "sort" || this.stage === "done" ? { x: -1, y: -1, w: 70, h: 46 } : { x: -1, y: -1, w: 44, h: 41 }; },
    tap(q) {
      const st = this.stage;
      this.wrongSide = null; this.wrongCorner = null; this.wrongBox = null;
      if (st === "sort") {
        const r = ["S", "R", "H", "P", "T", "Q"].find(k => inR(R[k], q));
        if (!r) return false;
        if (r === chain[0]) { this.stage = "done"; this.msg = null; }
        else if (chain.includes(r)) { this.wrongBox = r; this.msg = "It fits there. Is there a smaller box inside that it fits in too?"; }
        else { this.wrongBox = r; this.msg = `${R[r].name} need ${R[r].needs}.`; }
        return true;
      }
      if (st === "corners") {
        const i = [0, 1, 2, 3].find(k => Math.hypot(q.x - V[k][0], q.y - V[k][1]) < 2.5);
        if (i == null) return false;
        if (rights.includes(i)) { this.marks.add(i); this.msg = null; }
        else { this.wrongCorner = i; this.msg = `That corner isn't square. It's ${dotp(...cornerVec(i)) > 0 ? "narrower" : "wider"} than a grid square's corner.`; }
        return true;
      }
      if (st !== "parallel") return false;
      // the side nearest the finger, within 1.5 squares
      let best = null, bd = 1.5;
      for (let i = 0; i < 4; i++) {
        const [x1, y1] = V[i], [dx, dy] = side(i), t = Math.max(0, Math.min(1, ((q.x - x1) * dx + (q.y - y1) * dy) / (dx * dx + dy * dy)));
        const dd = Math.hypot(q.x - (x1 + t * dx), q.y - (y1 + t * dy));
        if (dd < bd) { bd = dd; best = i; }
      }
      if (best == null) return false;
      this.msg = null;
      if (this.pick == null) { this.pick = best; return true; }
      if (this.pick === best) { this.pick = null; return true; }
      const pr = [this.pick, best].sort();
      if (cross(side(pr[0]), side(pr[1])) === 0 && !this.found.some(f => f[0] === pr[0] && f[1] === pr[1])) this.found.push(pr);
      else if (cross(side(pr[0]), side(pr[1])) !== 0) { this.wrongSide = pr; this.msg = `Not parallel: one goes ${how(pr[0])}, the other ${how(pr[1])}.`; }
      this.pick = null;
      return true;
    },
    act(x) {
      if (x !== "nomore") return;
      if (this.stage === "parallel") {
        if (this.found.length < pairs.length) this.msg = this.found.length ? "There's another parallel pair." : "Look again: two sides go the same way.";
        else { this.stage = "corners"; this.msg = null; this.pick = null; }
      } else if (this.stage === "corners") {
        if (this.marks.size < rights.length) this.msg = "There's another square corner.";
        else { this.stage = "sort"; this.msg = null; this.wrongCorner = null; }
      }
    },
    scene() {
      const st = this.stage;
      const say = {
        parallel: ["Tap two sides that are parallel.", "Parallel sides go the same way. When there are no more, tap No more."],
        corners: ["Tap every square corner.", "When there are no more, tap No more."],
        sort: ["Tap the smallest box it fits in.", "Its sides are counted in squares."],
        done: [`It's ${aName[chain[0]]}.`, chain.length > 1 ? `So it's also ${chain.slice(1).map(k => aName[k]).join(", ").replace(/, ([^,]*)$/, " and $1")}.` : "It has 4 sides, but no parallel sides."],
      }[st];
      dhead(this, say[0], say[1]);
      // the shape: corners on grid points, each side's length in squares where it's a whole number
      for (let i = 0; i < 4; i++) {
        const [x1, y1] = V[i], [dx, dy] = side(i);
        const lit = this.pick === i || this.found.some(f => f.includes(i));
        const bad = this.wrongSide && this.wrongSide.includes(i);
        line(`side${i}${lit}${bad}`, x1, y1, x1 + dx, y1 + dy, { c: bad ? "var(--wrong)" : lit ? "var(--chapter)" : "var(--ink)" });
        const l = len(i), mx = x1 + dx / 2, my = y1 + dy / 2, n = [dy / l, -dx / l];
        const out = (mx + n[0] - cx) ** 2 + (my + n[1] - cy) ** 2 > (mx - cx) ** 2 + (my - cy) ** 2 ? 1 : -1;
        if (Number.isInteger(Math.round(l * 1000) / 1000)) text(`len${i}`, Math.round(l), mx + out * n[0] * 1.6, my + out * n[1] * 1.6, "small");
      }
      // parallel marks: one arrowhead on each side of the first pair, two on the second
      this.found.forEach((pr, k) => pr.forEach(i => {
        const [x1, y1] = V[i], [dx, dy] = side(i), l = len(i), u = [dx / l, dy / l], nn = [-u[1], u[0]];
        for (let m = 0; m <= k; m++) {
          const px = x1 + dx / 2 + u[0] * 0.7 * m, py = y1 + dy / 2 + u[1] * 0.7 * m;
          path(`par${i}_${m}`, `M${sq(px - u[0] * 0.6 + nn[0] * 0.6)} ${sq(py - u[1] * 0.6 + nn[1] * 0.6)}L${sq(px)} ${sq(py)}L${sq(px - u[0] * 0.6 - nn[0] * 0.6)} ${sq(py - u[1] * 0.6 - nn[1] * 0.6)}`, { c: "var(--chapter)" });
        }
      }));
      // square-corner marks
      for (const i of this.marks) {
        const [u, v] = cornerVec(i), lu = Math.hypot(...u), lv = Math.hypot(...v), k = 1.5;
        const a1 = [V[i][0] + u[0] / lu * k, V[i][1] + u[1] / lu * k], a2 = [V[i][0] + v[0] / lv * k, V[i][1] + v[1] / lv * k];
        path(`rc${i}`, `M${sq(a1[0])} ${sq(a1[1])}L${sq(a1[0] + v[0] / lv * k)} ${sq(a1[1] + v[1] / lv * k)}L${sq(a2[0])} ${sq(a2[1])}`, { c: "var(--chapter)" });
      }
      if (this.wrongCorner != null) dot(`wc${this.wrongCorner}`, V[this.wrongCorner][0], V[this.wrongCorner][1], 0.6, { c: "var(--wrong)" });
      for (let i = 0; i < 4; i++) dot(`v${i}`, V[i][0], V[i][1], 0.3, { c: "var(--ink)" });
      if (st === "parallel" || st === "corners") block("nomore", 2, 36, 9, "No more", "nomore", { arrow: false });
      // the family picture
      if (st === "sort" || st === "done") {
        for (const k of ["Q", "T", "P", "R", "H"]) {
          const r = R[k], on = st === "done" && chain.includes(k), bad = this.wrongBox === k;
          if (st === "done" && chain[0] === k) rect(`fill${k}`, r.x, r.y, r.w, r.h, { fill: "var(--tint)" });
          rect(`box${k}${on}${bad}`, r.x, r.y, r.w, r.h, { c: bad ? "var(--wrong)" : on ? "var(--chapter)" : "var(--ink)" });
        }
        if (st === "done" && chain[0] === "S") rect("fillS", R.S.x, R.S.y, R.S.w, R.S.h, { fill: "var(--tint-strong)" });
        if (this.wrongBox === "S") rect("badS", R.S.x, R.S.y, R.S.w, R.S.h, { fill: "var(--wrong)", op: .15 });
        for (const k of ["Q", "T", "P", "R", "H", "S"]) {
          const r = R[k], on = st === "done" && chain.includes(k);
          text(`nm${k}${on}`, r.name, r.lx, r.ly, "small", { anchor: r.end ? "end" : r.mid ? "middle" : "start", c: on ? "var(--chapter)" : null });
        }
        if (st === "done") block("next", 2, 36, 10, "Next problem", "next");
      }
    },
  };
  return L;
}

// ---------- lessons, the bar ----------
let lesson;
const LESSONS = {
  coord: { name: "Points on a grid", body: "geometry", make: dCoord },
  shapes: { name: "Sorting shapes", body: "geometry", make: dShapes },
  compare: { name: "Comparing decimals", body: "decimals", make: dCompare },
  fracdiv: { name: "Fractions as division", body: "fractions", make: dFracDiv },
};
const pick = document.getElementById("pick");
pick.innerHTML = Object.entries(LESSONS).map(([id, e]) => `<option value="${id}">${esc(e.name)}</option>`).join("");
function start(id) {
  if (!LESSONS[id]) id = "coord";
  const e = LESSONS[id];
  lesson = e.make();
  document.body.className = e.body;
  pick.value = id;
  drawn = new Set(); keys.blur();
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("new5-lesson", id); } catch (err) {}
}
pick.onchange = () => start(pick.value);
document.getElementById("fresh").onclick = () => leave();
function leave() { start(lesson.id); }
let first = "coord";
try { first = new URLSearchParams(location.search).get("l") || localStorage.getItem("new5-lesson") || "coord"; } catch (err) {}
start(first);
</script>
