<title>Obento² Paper Lessons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is one sheet of graph paper seen through one camera; the floating pill at the bottom is
   the only chrome. 1 square = 20 paper units, a strong line every 5 squares (a block). */
:root {
  --paper: #F3F1EC; --grid: #E2DED6; --grid-strong: #D3CEC4;
  --ink: #1D1C1A; --ink2: #6E6A63; --ink3: #A39E95;
  --chapter: #4F63D9; --tint: rgba(79, 99, 217, .22); --tint-strong: rgba(79, 99, 217, .42);
  --right: #178A57; --wrong: #C8372D;
  --pill: rgba(255, 255, 255, .94); --pill-line: #E4E0D8;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1C1C1A; --grid: #2A2A27; --grid-strong: #363632;
  --ink: #F1EEE8; --ink2: #A9A49B; --ink3: #77736C;
  --chapter: #8C9BFF; --tint: rgba(140, 155, 255, .22); --tint-strong: rgba(140, 155, 255, .42);
  --right: #3CCF8E; --wrong: #FF6B5E;
  --pill: rgba(40, 40, 37, .94); --pill-line: #3A3A36; color-scheme: dark }
/* each lesson's chapter colour (colour lives only in the maths) */
body.decimals { --chapter: #D6407F; --tint: rgba(214, 64, 127, .2); --tint-strong: rgba(214, 64, 127, .4) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.decimals { --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42) } }
:root[data-theme="dark"] body.decimals { --chapter: #FF7AB0; --tint: rgba(255, 122, 176, .22); --tint-strong: rgba(255, 122, 176, .42) }

body.volume { --chapter: #B7791F; --tint: rgba(197, 138, 27, .2); --tint-strong: rgba(197, 138, 27, .4) }
:root { --cube-top: #F7E3B5; --cube-front: #F0CD80; --cube-side: #E5B95E; --cube-edge: #A8741A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cube-top: #8A6A2A; --cube-front: #74561E; --cube-side: #5F4516; --cube-edge: #E9B95A; }
  :root:not([data-theme="light"]) body.volume { --chapter: #F0B341; --tint: rgba(240, 179, 65, .22); --tint-strong: rgba(240, 179, 65, .42) } }
:root[data-theme="dark"] { --cube-top: #8A6A2A; --cube-front: #74561E; --cube-side: #5F4516; --cube-edge: #E9B95A; }
:root[data-theme="dark"] body.volume { --chapter: #F0B341; --tint: rgba(240, 179, 65, .22); --tint-strong: rgba(240, 179, 65, .42) }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--round); overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--round); font-variant-numeric: tabular-nums; }
.say { font-size: 28px; font-weight: 600; fill: var(--ink); }
.small { font-size: 20px; font-weight: 600; fill: var(--ink2); }
.maths { font-size: 36px; font-weight: 600; fill: var(--ink); }
.label { font-size: 26px; font-weight: 600; fill: var(--ink2); }

/* drawing in: lines stroke on, words and fills fade in, one after another */
.in-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.in-fade { opacity: 0; animation: fade .4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in-line, .in-fade { animation-duration: .01s; } }

/* the one floating bar */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: var(--pill);
  border: 1px solid var(--pill-line); box-shadow: 0 6px 24px rgba(0,0,0,.08); max-width: calc(100vw - 32px);
  font-family: var(--round); }
#bar button { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 14px;
  border-radius: 999px; cursor: pointer; white-space: nowrap; }
#bar button[aria-pressed="true"] { background: var(--tint); }
#bar button:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar select { font: 600 17px var(--round); color: var(--ink); background: none; border: 0; padding: 10px 26px 10px 14px;
  border-radius: 999px; cursor: pointer; -webkit-appearance: none; appearance: none; max-width: 52vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
#bar select:focus-visible { outline: 2px solid var(--chapter); outline-offset: 2px; }
#bar .seg { display: flex; border: 1px solid var(--pill-line); border-radius: 999px; padding: 2px; }
#bar .seg button { font-size: 14px; padding: 6px 10px; }
#bar .seg[hidden] { display: none; }
#bar .sep { width: 1px; align-self: stretch; background: var(--pill-line); margin: 4px 4px; }
#bar .progress { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; min-width: 120px; }
#bar .progress span { font: 600 14px var(--round); color: var(--ink2); }
#bar .track { height: 4px; border-radius: 2px; background: var(--pill-line); overflow: hidden; }
#bar .track i { display: block; height: 100%; background: var(--chapter); transition: width .4s ease; }
@media (max-width: 640px) { #bar .progress { display: none; } #bar button, #bar select { font-size: 15px; padding: 9px 10px; } #bar select { padding-right: 24px; } #bar .seg button { font-size: 13px; padding: 5px 8px; }
  #bar { flex-wrap: wrap; justify-content: center; border-radius: 26px; row-gap: 2px; } #bar .sep { display: none; } }
#keys { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>

<svg id="paper" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Graph paper lesson">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="var(--grid)" stroke-width="1" fill="none"/>
      <path d="M0 0V100M0 0H100" stroke="var(--grid-strong)" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="var(--tint)"/>
      <path d="M-5 5L5 -5M0 20L20 0M15 25L25 15" stroke="var(--chapter)" stroke-width="1.5" opacity=".55"/>
    </pattern>
  </defs>
  <g id="paperg">
    <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="scene"></g>
  </g>
  <g id="upright"></g>
</svg>

<nav id="bar" aria-label="Lessons">
  <select id="pick" aria-label="Lesson"></select>
  <div class="seg" id="ver"><button id="v-claude" type="button">Claude</button><button id="v-designer" type="button">Designer</button></div>
  <div class="sep"></div>
  <div class="progress"><span id="stepname">Step 1 of 3</span><div class="track"><i id="track" style="width:0"></i></div></div>
  <div class="sep"></div>
  <button id="fresh" type="button">New problem</button>
</nav>
<input id="keys" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Answer">

<script>
"use strict";
// ---------- the paper: squares, drawing, camera ----------
const SQ = 20, svg = document.getElementById("paper"), sceneEl = document.getElementById("scene");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a * b / gcd(a, b);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

let items = [], drawn = new Set();
// one thing on the paper: its key (a new key draws in), its tag and attributes in paper units, how it draws in
// UP: what's put now stands up off the paper or faces the child (drawn over the tilting paper, never tilted)
let UP = false;
function put(k, tag, a, kind = "fade", text) { items.push({ k, tag, a, kind, text, up: UP }); }
const sq = n => n * SQ;
function line(k, x1, y1, x2, y2, o = {}) {
  put(k, "line", { x1: sq(x1), y1: sq(y1), x2: sq(x2), y2: sq(y2), stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5,
    "stroke-dasharray": o.dash ? "6 6" : null, "stroke-linecap": "butt", pathLength: o.dash ? null : 1 }, o.live ? "none" : o.dash ? "fade" : "line");
}
function path(k, d, o = {}) {
  put(k, "path", { d, fill: o.fill || "none", stroke: o.c || "var(--ink)", "stroke-width": o.w || 1.5, pathLength: 1 }, o.live ? "none" : "line");
}
function rect(k, x, y, w, h, o = {}) {
  put(k, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(h), fill: o.fill || "none", stroke: o.c || null,
    "stroke-width": o.c ? (o.w || 1.5) : null, opacity: o.op ?? null, rx: o.rx ?? null,
    pathLength: o.c && !o.fill ? 1 : null, transform: o.t || null }, o.live ? "none" : o.c && !o.fill ? "line" : "fade");
}
function dot(k, x, y, r, o = {}) { put(k, "circle", { cx: sq(x), cy: sq(y), r: sq(r), fill: o.c || "var(--chapter)" }, o.live ? "none" : "fade"); }
function text(k, s, x, y, cls, o = {}) {
  put(k, "text", { x: sq(x), y: sq(y), class: cls, "text-anchor": o.anchor || "middle", "dominant-baseline": "central",
    style: o.c ? `fill:${o.c}` : null }, o.live ? "none" : "fade", s);
}
// words in rows of 2 squares, wrapped at a width in squares
function words(k, s, x, y, widthSq, cls = "say", o = {}) {
  const per = cls === "say" ? 0.72 : 0.52, max = Math.max(8, Math.floor(widthSq / per));
  const rows = []; let cur = "";
  for (const w of s.split(" ")) { if ((cur + " " + w).trim().length > max && cur) { rows.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) rows.push(cur);
  rows.forEach((r, i) => text(`${k}:${i}:${r}`, r, x, y + i * 2, cls, { anchor: "start", c: o.c }));
  return rows.length;
}
// a number written as school writes it on squared paper: 2 squares a digit, the point on the grid line between
function digits(k, s, right, row, o = {}) {
  let col = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const ch = s[i];
    if (ch === ".") { text(`${k}.${i}`, ".", right - col, row, "maths", { c: o.c }); continue; }
    text(`${k}${i}${ch}`, ch, right - col - 1, row, "maths", { c: o.c }); col += 2;
  }
}
// a fraction in a column 4 squares wide: top centred on row r+1, its bar on r+2, bottom on r+3
function frac(k, top, bot, col, r, o = {}) {
  if (top != null) text(`${k}t${top}`, top, col + 2, r + 1, "maths", { c: o.c });
  line(`${k}bar`, col, r + 2, col + 4, r + 2, { c: o.c });
  if (bot != null) text(`${k}b${bot}`, bot, col + 2, r + 3, "maths", { c: o.c });
}
// a block drawn on the paper: an outline, its word and arrow (Check, Cut, Next problem)
function block(k, x, y, w, label, act, o = {}) {
  rect(`${k}o`, x, y, w, 2, { c: o.main === false ? "var(--ink3)" : "var(--ink)" });
  text(`${k}w${label}`, label, x + 1, y + 1, "small", { anchor: "start", c: "var(--ink)" });
  if (o.arrow !== false) path(`${k}a`, `M${sq(x + w - 1.6)} ${sq(y + 1)}h${sq(0.8)}m-6 -6l6 6l-6 6`, {});
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(w), height: sq(2), fill: "transparent", "data-act": act }, "none");
}
// an answer box in the work: cells of 2 squares, what's typed in the middle, the cursor after it
function answerBox(k, x, y, cells, value, state) {
  const c = state === "right" ? "var(--right)" : state === "wrong" ? "var(--wrong)" : "var(--ink)";
  rect(`${k}box${cells}`, x, y, cells * 2, 2, { c, live: false });
  if (value) text(`${k}v`, value, x + cells, y + 1, "maths", { c, live: true });
  if (state === "active") {
    const w = value ? value.length * 0.62 : 0;
    put(`${k}cur`, "line", { x1: sq(x + cells + w + 0.15), y1: sq(y + 0.35), x2: sq(x + cells + w + 0.15), y2: sq(y + 1.65),
      stroke: "var(--chapter)", "stroke-width": 2 }, "none");
  }
  put(`${k}hit`, "rect", { x: sq(x), y: sq(y), width: sq(cells * 2), height: sq(2), fill: "transparent", "data-act": "type" }, "none");
}

let raf = 0;
function render() {
  items = [];
  lesson.scene();
  const next = new Set(); let n = 0, out = "", outUp = "";
  for (const it of items) {
    next.add(it.k);
    const fresh = !drawn.has(it.k) && it.kind !== "none", a = { ...it.a };
    if (fresh) {
      a.class = ((a.class || "") + (it.kind === "line" ? " in-line" : " in-fade")).trim();
      a.style = `animation-delay:${Math.min(n++ * 0.035, 1.2).toFixed(3)}s;` + (a.style || "");
    }
    const attrs = Object.entries(a).filter(([, v]) => v != null).map(([k, v]) => `${k}="${esc(v)}"`).join(" ");
    const el = `<${it.tag} ${attrs}>${it.text != null ? esc(it.text) : ""}</${it.tag}>`;
    if (it.up) outUp += el; else out += el;
  }
  sceneEl.innerHTML = out;
  document.getElementById("upright").innerHTML = outUp;
  const m = lesson.paperMatrix && lesson.paperMatrix();
  if (m) document.getElementById("paperg").setAttribute("transform", `matrix(${m.join(" ")})`);
  else document.getElementById("paperg").removeAttribute("transform");
  // a lesson that's moving (the paper tilting, cubes rising) draws again next frame
  if (lesson.animating && lesson.animating() && !raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  drawn = next;
  const [i, of] = lesson.progress();
  document.getElementById("stepname").textContent = `Step ${Math.min(i + 1, of)} of ${of}`;
  document.getElementById("track").style.width = `${Math.round(100 * i / of)}%`;
}

// the camera: frames what the lesson shows now, eased (0.75 s), never past 1.6x
const cam = { x: 0, y: 0, s: 1 }; let camTo = null, camFrom = null, camT0 = 0;
function fitTo(f) {
  const W = innerWidth, H = innerHeight, top = 24, bottom = 110;
  const s = Math.min((W - 64) / sq(f.w), (H - top - bottom - 32) / sq(f.h), (lesson && lesson.maxZoom) || 1.6);
  return { s, x: sq(f.x + f.w / 2) - W / 2 / s, y: sq(f.y + f.h / 2) - ((top + H - bottom) / 2) / s };
}
function frame(f, now) {
  const t = fitTo(f);
  if (now) { Object.assign(cam, t); applyCam(); return; }
  camFrom = { ...cam }; camTo = t; camT0 = performance.now(); requestAnimationFrame(stepCam);
}
function stepCam(t) {
  if (!camTo) return;
  const u = Math.min(1, (t - camT0) / 750), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  for (const k of ["x", "y", "s"]) cam[k] = camFrom[k] + (camTo[k] - camFrom[k]) * e;
  applyCam();
  if (u < 1) requestAnimationFrame(stepCam); else camTo = null;
}
function applyCam() { svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${innerWidth / cam.s} ${innerHeight / cam.s}`); }
addEventListener("resize", () => frame(lesson.frame(), true));

// ---------- typing (the iPad's own number keys) ----------
const keys = document.getElementById("keys");
function openKeys() { keys.value = lesson.typed || ""; keys.focus({ preventScroll: true }); }
keys.addEventListener("input", () => { lesson.type(keys.value.replace(/[^0-9.]/g, "").slice(0, 6)); render(); });
keys.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); act("check"); } });

// ---------- hands: tap, drag (on the lesson's picture) or pan the paper ----------
function toPaper(e) { const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse()); return { x: p.x / SQ, y: p.y / SQ }; }
let down = null;
svg.addEventListener("pointerdown", e => {
  const p = toPaper(e), hit = e.target.closest("[data-act]");
  down = { p, sx: e.clientX, sy: e.clientY, act: hit && hit.dataset.act, moved: false, grabbed: false, cam: { ...cam } };
  if (!down.act && lesson.grab && lesson.grab(p)) { down.grabbed = true; render(); }
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) down.moved = true;
  if (down.grabbed) { lesson.drag(toPaper(e)); render(); return; }
  if (down.moved && !down.act) { camTo = null; cam.x = down.cam.x - (e.clientX - down.sx) / cam.s; cam.y = down.cam.y - (e.clientY - down.sy) / cam.s; applyCam(); }
});
svg.addEventListener("pointerup", e => {
  if (!down) return;
  const d = down; down = null;
  if (d.grabbed) { lesson.release(toPaper(e)); render(); frame(lesson.frame()); return; }
  if (d.moved) return;
  if (d.act) { act(d.act); return; }
  if (lesson.tap && lesson.tap(toPaper(e))) { render(); frame(lesson.frame()); }
});
function act(a) {
  if (a === "type") { openKeys(); return; }
  if (a === "next") { leave(); return; }
  lesson.act(a);
  if (!lesson.typing) keys.blur(); else openKeys();
  render(); frame(lesson.frame());
}

// ---------- Rounding decimals ----------
// One square is a step of the place after the one rounded to. The number's tenth is ten blocks; tap the block it's
// in, and that block opens below into ten big steps of thousandths. Drag the number to the closer end, counting the
// steps; then write it.
function roundingLesson() {
  const p = rnd(1, 2), unit = 10 ** (p + 1);
  let n;
  for (;;) {
    n = rnd(1, 9) * unit + rnd(0, unit - 1);
    if (n % 10 !== 0) break; // a digit past the place, so there's something to round
  }
  const lo1 = Math.floor(n / 100) * 100, k = Math.floor((n - lo1) / 10), T = lo1 + 10 * k, s = n - T;
  const show = (x, d) => (x / unit).toFixed(d);
  const V = show(n, p + 1), up = s >= 5, R = up ? T + 10 : T, Rs = show(R, p), place = p === 1 ? "tenth" : "hundredth";
  const L = {
    id: "round", stage: "tap", typed: "", typing: false, msg: null, at: s, grabbed: false, wrongBlock: null, verdict: null,
    progress() { return [{ tap: 0, drag: 1, write: 2, done: 3 }[this.stage], 3]; },
    frame() {
      if (this.stage === "tap") return { x: -2, y: -1, w: 56, h: 16 };
      if (this.stage === "drag") return { x: -2, y: -1, w: 56, h: 29 };
      return { x: -2, y: -1, w: 56, h: 41 };
    },
    tap(q) {
      if (this.stage !== "tap" || q.y < 6 || q.y > 13 || q.x < 0 || q.x > 50) return false;
      const b = Math.floor(q.x / 5);
      if (b === k) { this.stage = "drag"; this.msg = null; this.wrongBlock = null; }
      else { this.wrongBlock = b; this.msg = `${V} isn't between ${show(lo1 + 10 * b, p)} and ${show(lo1 + 10 * b + 10, p)}. Find the point.`; }
      return true;
    },
    grab(q) {
      if (this.stage !== "drag") return false;
      if (Math.abs(q.x - this.at * 5) < 2.5 && Math.abs(q.y - 22) < 3.5) { this.grabbed = true; this.msg = null; return true; }
      return false;
    },
    drag(q) { this.at = Math.max(0, Math.min(10, Math.round(q.x / 5))); },
    release() {
      this.grabbed = false;
      const end = this.at;
      if (end !== 0 && end !== 10) { this.msg = "Drag it all the way to one end."; this.at = s; return; }
      const steps = end === 10 ? 10 - s : s, other = 10 - steps;
      if ((end === 10) === up) { this.stage = "write"; this.typing = true; this.msg = null; }
      else {
        this.msg = s === 5 ? "Exactly halfway rounds up." : `That end is ${steps} steps away. The other end is ${other}.`;
        this.at = s;
      }
    },
    type(v) { this.typed = v; this.verdict = null; this.msg = null; },
    act(a) {
      if (a !== "check" || this.stage !== "write") return;
      if (!this.typed) { this.msg = "Type the closer end first."; return; }
      if (Math.abs(parseFloat(this.typed) - R / unit) < 1e-9) { this.stage = "done"; this.typing = false; this.verdict = "right"; this.msg = null; }
      else { this.verdict = "wrong"; this.msg = `That's not the end you dragged to. It was ${Rs}.`; }
    },
    scene() {
      const st = this.stage, found = st !== "tap";
      // what to do, above the picture on a grid line
      const say = { tap: `Round ${V} to the nearest ${place}. Tap the part of the line it's in.`,
        drag: "Drag the point to the end it's closer to.", write: "Write the closer end.",
        done: up ? `${s} steps from ${show(T, p)}, ${10 - s} to ${Rs}. ${s === 5 ? "Halfway rounds up." : `${Rs} is closer.`}`
          : `${s} steps to ${Rs}, ${10 - s} to ${show(T + 10, p)}. ${Rs} is closer.` }[st];
      words(`say-${st}`, say, 0, 1, 54);
      if (this.msg) words(`msg-${this.msg}`, this.msg, 0, 3.4, 54, "small", { c: "var(--wrong)" });

      // the first line: the tenth the number is in, ten blocks of a hundredth (a block = 5 squares)
      const y1 = 10;
      line("l1", 0, y1, 50, y1);
      for (let i = 0; i <= 10; i++) line(`l1t${i}`, i * 5, y1 - (i % 5 === 0 ? 2 : 1), i * 5, y1);
      if (k !== 0 || !found) text("l1lo", show(lo1, p - 1), 0, y1 + 1.6, "label");
      if (k !== 9 || !found) text("l1hi", show(lo1 + 100, p - 1), 50, y1 + 1.6, "label");
      if (this.wrongBlock != null && !found) rect(`wb${this.wrongBlock}`, this.wrongBlock * 5, y1 - 2, 5, 2, { fill: "var(--wrong)", op: .18 });
      const x1 = (n - lo1) / 2; // a step of the next place is half a square up here
      dot("p1", x1, y1, 0.35, { c: found ? "var(--ink3)" : "var(--chapter)" });
      if (!found) text("p1w", V, x1, y1 - 3.2, "label", { c: "var(--ink)" });

      if (found) {
        // the block it's in, lit, and opened out below into ten big steps
        rect("blk", k * 5, y1 - 2, 5, 2, { fill: "var(--tint-strong)" });
        text("blklo", show(T, p), k * 5, y1 + 1.6, "label", { c: "var(--chapter)" });
        text("blkhi", show(T + 10, p), k * 5 + 5, y1 + 1.6, "label", { c: "var(--chapter)" });
        const y2 = 22;
        line("zoomL", k * 5, y1 + 3, 0, y2 - 3, { dash: true, c: "var(--chapter)" });
        line("zoomR", k * 5 + 5, y1 + 3, 50, y2 - 3, { dash: true, c: "var(--chapter)" });
        line("l2", 0, y2, 50, y2);
        for (let i = 0; i <= 10; i++) line(`l2t${i}`, i * 5, y2 - (i % 5 === 0 ? 2 : 1), i * 5, y2);
        text("l2lo", show(T, p), 0, y2 + 1.6, "label", { c: st === "done" && !up ? "var(--chapter)" : null });
        text("l2mid", show(T + 5, p + 1), 25, y2 + 1.6, "small", { c: "var(--ink3)" });
        text("l2hi", show(T + 10, p), 50, y2 + 1.6, "label", { c: st === "done" && up ? "var(--chapter)" : null });
        // the steps counted while dragging: a bracket from where it was to where it is
        const at = st === "drag" ? this.at : s;
        if (st === "drag" && this.grabbed && at !== s) {
          const a = Math.min(at, s), b = Math.max(at, s);
          path("count", `M${sq(a * 5)} ${sq(y2 - 4)}v${sq(1)}H${sq(b * 5)}v${-sq(1)}`, { c: "var(--chapter)", live: true });
          text("countw", `${b - a} step${b - a > 1 ? "s" : ""}`, (a + b) * 2.5, y2 - 5.2, "label", { c: "var(--chapter)", live: true });
        }
        if (st === "write" || st === "done") {
          const end = up ? 50 : 0;
          path("hop", `M${sq(s * 5)} ${sq(y2)}Q${sq((s * 5 + end) / 2)} ${sq(y2 - 5)} ${sq(end)} ${sq(y2)}`, { c: "var(--chapter)" });
          text("hopw", `${up ? 10 - s : s} steps`, (s * 5 + end) / 2, y2 - 4.4, "label", { c: "var(--chapter)" });
          dot("end", end, y2, 0.4);
        }
        dot("p2", at * 5, y2, this.grabbed ? 0.7 : 0.55, { c: "var(--chapter)", live: this.grabbed || st === "drag" });
        if (!this.grabbed) text("p2w", V, s * 5, y2 - 3.2, "label", { c: "var(--ink)", live: st === "drag" });
        if (st === "drag" && !this.grabbed) circleHint(at * 5, y2);
      }

      if (st === "write" || st === "done") {
        // the record, as school writes it: the number, ≈, the closer end
        const y3 = 31, right = 2 * V.replace(".", "").length;
        digits("num", V, right, y3);
        if (st === "done") {
          const whole = V.split(".")[0].length, placeI = whole + p - 1, mid = i => right - 2 * (V.length - 2 - i) - 1;
          line("under", mid(placeI) - 1, y3 + 1.2, mid(placeI) + 1, y3 + 1.2, { c: "var(--chapter)" });
          path("ring", `M${sq(mid(placeI + 1) + 1.05)} ${sq(y3)}a${sq(1.05)} ${sq(1.05)} 0 1 1 0 -0.1`, { c: "var(--chapter)" });
          text("rule", `${s} is ${s >= 5 ? "5 or more: round up" : "4 or less: it stays"}`, 0, y3 + 3, "small", { anchor: "start" });
        }
        text("approx", "≈", right + 2, y3, "maths");
        if (st === "write") {
          answerBox("ans", right + 4, y3 - 1, Rs.length, this.typed, this.verdict || "active");
          block("check", 0, y3 + 4, 7, "Check", "check");
        } else {
          digits("R", Rs, right + 4 + 2 * Rs.replace(".", "").length, y3, { c: "var(--chapter)" });
          block("next", 0, y3 + 5, 10, "Next problem", "next");
        }
      }
    },
  };
  function circleHint(x, y) { put("hint", "circle", { cx: sq(x), cy: sq(y), r: sq(1.3), fill: "none", stroke: "var(--chapter)", "stroke-width": 1.5, "stroke-dasharray": "4 5" }, "fade"); }
  return L;
}

// ---------- Adding fractions ----------
// A whole is always 48 squares, so every piece size is a whole number of squares. Drag the ruler to choose a piece
// size for both bars: old cuts light up when a new cut lands on them. Cut, slide the striped pieces into the top bar,
// count them, write it.
function fractionsLesson() {
  const bottoms = [2, 3, 4, 6, 8, 12];
  let a, b, c, d, Lc, A, C, S;
  for (;;) {
    b = bottoms[rnd(0, 5)]; d = bottoms[rnd(0, 5)];
    if (b === d) continue;
    const top = den => { let x; do x = rnd(1, den - 1); while (gcd(x, den) !== 1); return x; };
    a = top(b); c = top(d); Lc = lcm(b, d); A = a * Lc / b; C = c * Lc / d; S = A + C;
    if (S <= Lc && Lc <= 24) break;
  }
  const W = 48, pw1 = W / b, pw2 = W / d, pw = W / Lc, widths = [2, 3, 4, 6, 8, 12, 16, 24];
  const names = { 2: "halves", 3: "thirds", 4: "fourths", 6: "sixths", 8: "eighths", 12: "twelfths", 16: "sixteenths", 24: "twenty-fourths" };
  const g = gcd(S, Lc), sn = S / g, sd = Lc / g;
  const L = {
    id: "add", stage: "cut", w: Math.max(pw1, pw2), typed: "", typing: false, msg: null, grabbed: null, off: { x: 0, y: 0 }, verdict: null,
    progress() { return [{ cut: 0, slide: 1, write: 2, done: 3 }[this.stage], 3]; },
    frame() { return this.stage === "write" || this.stage === "done" ? { x: -2, y: -1, w: 58, h: 41 } : { x: -2, y: -1, w: 58, h: 30 }; },
    grab(q) {
      if (this.stage === "cut" && Math.abs(q.x - this.w) < 2.5 && Math.abs(q.y - 5) < 2.5) { this.grabbed = "ruler"; this.msg = null; return true; }
      if (this.stage === "slide" && q.y > 15 && q.y < 23 && q.x > 0 && q.x < C * pw + 1) { this.grabbed = "pieces"; this.from = q; this.msg = null; return true; }
      return false;
    },
    drag(q) {
      if (this.grabbed === "ruler") {
        let best = widths[0];
        for (const x of widths) if (Math.abs(x - q.x) < Math.abs(best - q.x)) best = x;
        this.w = best;
      } else if (this.grabbed === "pieces") this.off = { x: q.x - this.from.x, y: q.y - this.from.y };
    },
    release() {
      if (this.grabbed === "pieces") {
        // dropped on the top bar: they slide in after its shaded pieces
        const top = 16 + this.off.y;
        if (top > 3 && top < 12) { this.stage = "write"; this.typing = true; }
        else this.msg = "Put them in the top bar.";
        this.off = { x: 0, y: 0 };
      }
      this.grabbed = null;
    },
    type(v) { this.typed = v; this.verdict = null; this.msg = null; },
    act(a) {
      if (a === "cut" && this.stage === "cut") {
        const fits = pw1 % this.w === 0 && pw2 % this.w === 0;
        if (!fits) this.msg = "Some old cuts have no new cut on them. Try another size.";
        else if (this.w !== pw) this.msg = `Those fit both bars. Bigger pieces fit too.`;
        else { this.stage = "slide"; this.msg = null; }
      }
      if (a === "check" && this.stage === "write") {
        if (!this.typed) { this.msg = "Type how many first."; return; }
        if (+this.typed === S) { this.stage = "done"; this.typing = false; this.verdict = "right"; this.msg = null; }
        else { this.verdict = "wrong"; this.msg = +this.typed === a + c ? `That adds the old tops. Count the ${names[W / pw]} in the top bar.` : `Count the shaded ${names[W / pw]} in the top bar.`; }
      }
    },
    scene() {
      const st = this.stage, cut = st !== "cut", piece = names[W / pw];
      const say = { cut: "Drag the ruler to cut both bars into the same size pieces.", slide: `Slide the striped ${piece} into the top bar.`,
        write: `How many ${piece} in all? Write it.`, done: g > 1 ? `Same-size pieces, so the tops add. ${S}/${Lc} is ${sn}/${sd}.` : "Same-size pieces, so the tops add." }[st];
      words(`say-${st}`, say, 0, 1, 56);
      if (this.msg) words(`msg-${this.msg}`, this.msg, 0, 3.2, 56, "small", { c: "var(--wrong)" });

      const y1 = 7, y2 = 16, h = 6;
      // the ruler: one piece's length, its handle snapping to sizes that fit a whole
      if (st === "cut") {
        path("ruler", `M0 ${sq(5.6)}V${sq(5)}H${sq(this.w)}V${sq(5.6)}`, { c: "var(--chapter)", live: true });
        put("handle", "circle", { cx: sq(this.w), cy: sq(5), r: sq(this.grabbed ? 0.75 : 0.6), fill: "var(--chapter)" }, "none");
        text("rulerw", names[W / this.w], this.w / 2, 4, "small", { c: "var(--chapter)", live: true });
      }
      const cutsOf = (pwx) => { const r = []; for (let x = pwx; x < W; x += pwx) r.push(x); return r; };
      const bar = (k, y, parts, shaded, striped, skip = 0) => {
        const p = W / parts;
        if (shaded > skip) rect(`${k}f${parts}${shaded}`, skip * p, y, (shaded - skip) * p, h, { fill: striped ? "url(#stripes)" : "var(--tint-strong)" });
        rect(`${k}o`, 0, y, W, h, { c: "var(--chapter)" });
        cutsOf(p).forEach(x => line(`${k}c${parts}_${x}`, x, y, x, y + h, { c: "var(--chapter)" }));
      };
      // bar 1: a/b, then cut into L pieces; after the slide it holds the striped pieces too
      const parts1 = st === "done" && g > 1 ? sd : cut ? Lc : b;
      bar("b1", y1, parts1, st === "done" && g > 1 ? sn : cut ? A : a, false);
      if (st === "write" || st === "done" && g === 1) rect(`b1s${Lc}`, A * pw, y1, C * pw, h, { fill: "url(#stripes)" });
      // bar 2: c/d; its striped pieces lift out when they're slid
      const off = this.grabbed === "pieces" ? this.off : { x: 0, y: 0 };
      rect("b2o", 0, y2, W, h, { c: "var(--chapter)" });
      cutsOf(cut ? pw : pw2).forEach(x => line(`b2c${cut ? Lc : d}_${x}`, x, y2, x, y2 + h, { c: "var(--chapter)" }));
      if (st === "cut" || st === "slide") rect(`b2s${cut ? Lc : d}`, 0, y2, (cut ? C * pw : c * pw2), h,
        { fill: "url(#stripes)", live: this.grabbed === "pieces", t: off.x || off.y ? `translate(${sq(off.x)} ${sq(off.y)})` : null });
      // counted, once cut: every shaded piece its number
      if (cut && st !== "done") {
        for (let i = 0; i < A; i++) text(`n1_${i}`, i + 1, (i + 0.5) * pw, y1 + h / 2, "small", { c: "var(--ink)" });
        const n2y = st === "slide" ? y2 : y1, n2x = st === "slide" ? 0 : A * pw;
        if (!(this.grabbed === "pieces")) for (let i = 0; i < C; i++) text(`n2_${st}_${i}`, st === "slide" ? i + 1 : A + i + 1, n2x + (i + 0.5) * pw, n2y + h / 2, "small", { c: "var(--ink)" });
      }
      // while choosing a size: the new cuts dashed across both bars, and each old cut lit when a new one lands on it
      if (st === "cut") {
        cutsOf(this.w).forEach(x => { line(`d1_${x}`, x, y1 - 0.6, x, y1 + h + 0.6, { dash: true, c: "var(--ink2)", live: true }); line(`d2_${x}`, x, y2 - 0.6, x, y2 + h + 0.6, { dash: true, c: "var(--ink2)", live: true }); });
        const mark = (k, x, y) => put(`${k}${x}_${this.w}`, "circle", { cx: sq(x), cy: sq(y), r: sq(0.35), fill: x % this.w === 0 ? "var(--right)" : "var(--wrong)" }, "none");
        cutsOf(pw1).forEach(x => mark("m1_", x, y1 + h + 1));
        cutsOf(pw2).forEach(x => mark("m2_", x, y2 + h + 1));
        block("cut", 0, 25, 6, "Cut", "cut");
      }
      // the fractions, the bars' own names, at their right ends; the + between them
      frac("f1", cut ? A : a, cut ? Lc : b, W + 2, y1 + 1);
      text("plus", "+", W + 4, (y1 + h + y2) / 2 + 0.5, "maths");
      frac("f2", cut ? C : c, cut ? Lc : d, W + 2, y2 + 1);
      if (st === "slide") text("slidew", "↑", C * pw / 2, y2 - 1.5, "maths", { c: "var(--chapter)" });

      if (st === "write" || st === "done") {
        // the record: a/b + c/d = A/L + C/L = S/L (= simplest)
        const r = 27;
        frac("w1", a, b, 0, r); text("wp1", "+", 5, r + 2, "maths"); frac("w2", c, d, 6, r); text("we1", "=", 11, r + 2, "maths");
        frac("w3", A, Lc, 12, r); text("wp2", "+", 17, r + 2, "maths"); frac("w4", C, Lc, 18, r); text("we2", "=", 23, r + 2, "maths");
        if (st === "write") {
          answerBox("ans", 24, r, 2, this.typed, this.verdict || "active");
          line("w5bar", 24, r + 2.4, 28, r + 2.4); text("w5b", Lc, 26, r + 3.4, "maths");
          block("check", 0, r + 6, 7, "Check", "check");
        } else {
          frac("w5", S, Lc, 24, r, { c: "var(--chapter)" });
          if (g > 1) { text("we3", "=", 29, r + 2, "maths", { c: "var(--chapter)" }); frac("w6", sn, sd, 30, r, { c: "var(--chapter)" }); }
          block("next", 0, r + 6, 10, "Next problem", "next");
        }
      }
    },
  };
  return L;
}


// ---------- Volume of a box (3D) ----------
// As Unit cubes: one cube is one block (5 × 5 squares) on the paper. Flat, the child covers the box's floor, the
// squares counting; then the paper tilts and the floor rises into the first layer of cubes, the box's full height
// dashed; the child drags up to stack the layers, each counted on its front; then writes it. Words stay upright,
// facing the child; the paper lies flat again before the next problem.
function volumeLesson() {
  const Lx = rnd(2, 6), Wy = rnd(2, 4), H = rnd(2, 4), base = Lx * Wy, V = base * H, B = 5;
  const ox = 0, oy = 0, PHI = 25 * Math.PI / 180, THETA = 55 * Math.PI / 180;
  const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  const P = { x: ox + Lx * B / 2, y: oy + Wy * B / 2 };
  const L = {
    id: "volume", maxZoom: 1.25, stage: "floor", covered: new Set(), layers: 0, riseAt: [], tiltFrom: 0, tiltTo: 0, tiltAt: -1e9,
    typed: "", typing: false, msg: null, verdict: null, grabbed: false,
    progress() { return [{ floor: 0, build: 1, write: 2, done: 3 }[this.stage], 3]; },
    t() { const u = Math.min(1, (performance.now() - this.tiltAt) / 1100); return this.tiltFrom + (this.tiltTo - this.tiltFrom) * ease(Math.max(0, u)); },
    animating() { const now = performance.now(); return now - this.tiltAt < 1200 || this.riseAt.some(a => now - a < 450 && now - a > -1500); },
    tiltTo1(to, after) { this.tiltFrom = this.t(); this.tiltTo = to; this.tiltAt = performance.now(); if (after) setTimeout(after, 1150); },
    // a point on (or above) the paper, as it's seen now: the paper turned φ and tipped back θ about the floor's middle
    proj(x, y, z, t = this.t()) {
      const f = PHI * t, th = THETA * t, c = Math.cos(f), s = Math.sin(f), dx = x - P.x, dy = y - P.y;
      return { x: P.x + c * dx - s * dy, y: P.y + (s * dx + c * dy) * Math.cos(th) - z * Math.sin(th) };
    },
    paperMatrix() {
      const t = this.t(); if (t <= 0) return null;
      const f = PHI * t, th = THETA * t, c = Math.cos(f), s = Math.sin(f), a = c, b = s * Math.cos(th), cc = -s, d = c * Math.cos(th);
      const px = sq(P.x), py = sq(P.y);
      return [a, b, cc, d, px - (a * px + cc * py), py - (b * px + d * py)];
    },
    // the box's outline as seen at tilt t: its 8 corners' bounds (just the floor before it rises)
    bounds(t, high) {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const x of [ox, ox + Lx * B]) for (const y of [oy, oy + Wy * B]) for (const z of high ? [0, H * B] : [0]) {
        const q = this.proj(x, y, z, t); x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y);
      }
      return { x0, y0, x1, y1 };
    },
    frame() {
      const b = this.bounds(this.stage === "floor" ? 0 : 1, this.stage !== "floor");
      return { x: b.x0 - 8, y: b.y0 - 7, w: Math.max(56, b.x1 - b.x0 + 16), h: b.y1 - b.y0 + (this.stage === "floor" ? 10 : 17) };
    },
    cell(q) {
      const i = Math.floor((q.x - ox) / B), j = Math.floor((q.y - oy) / B);
      return i >= 0 && i < Lx && j >= 0 && j < Wy ? j * Lx + i : null;
    },
    cover(q) {
      const c = this.cell(q); if (c == null) return false;
      this.covered.add(c); this.msg = null; return true;
    },
    floorDone() {
      if (this.stage !== "floor" || this.covered.size < base) return;
      this.stage = "build";
      // the paper tips back, then the floor's squares rise into the first layer
      setTimeout(() => { this.tiltTo1(1); if (!this.layers) { this.layers = 1; this.riseAt[0] = performance.now() + 1050; } render(); frame(this.frame()); }, 450);
    },
    tap(q) {
      if (this.stage === "floor") { const ok = this.cover(q); this.floorDone(); return ok; }
      if (this.stage === "build" && this.t() > 0.95 && this.layers < H) { this.addLayers(this.layers + 1); this.checkBuilt(); return true; }
      return false;
    },
    grab(q) {
      if (this.stage === "floor") return this.cover(q);
      if (this.stage === "build" && this.t() > 0.95) { this.grabbed = true; this.y0 = q.y; this.l0 = this.layers; this.msg = null; return true; }
      return false;
    },
    drag(q) {
      if (this.stage === "floor") { this.cover(q); return; }
      if (!this.grabbed) return;
      // a layer for every cube's height the finger moves up (as it's seen, tipped back)
      const per = B * Math.sin(THETA), n = Math.max(1, Math.min(H, this.l0 + Math.round((this.y0 - q.y) / per)));
      this.addLayers(n);
    },
    addLayers(n) {
      const now = performance.now();
      for (let k = this.layers; k < n; k++) this.riseAt[k] = now + (k - this.layers) * 120;
      this.layers = n;
    },
    release() {
      if (this.stage === "floor") { this.floorDone(); return; }
      this.grabbed = false; this.checkBuilt();
    },
    checkBuilt() {
      if (this.layers >= H) { this.stage = "write"; this.typing = true; this.msg = null; }
      else this.msg = `Keep going. The box is ${H} cm tall.`;
    },
    type(v) { this.typed = v; this.verdict = null; this.msg = null; },
    act(a) {
      if (a !== "check" || this.stage !== "write") return;
      if (!this.typed) { this.msg = "Type how many cubes first."; return; }
      if (+this.typed === V) { this.stage = "done"; this.typing = false; this.verdict = "right"; }
      else { this.verdict = "wrong"; this.msg = +this.typed === Lx + Wy + H ? `That adds the sides. Count the layers: ${H} layers of ${base}.` : `Count the layers: ${H} layers of ${base}.`; }
    },
    leave(then) { this.typing = false; this.tiltTo1(0, then); render(); },
    scene() {
      const st = this.stage, t = this.t(), now = performance.now();
      // MARK: flat on the paper: the floor, its squares covered and counted
      if (t < 0.02) {
        rect("floor", ox, oy, Lx * B, Wy * B, { c: "var(--cube-edge)" });
        for (let i = 1; i < Lx; i++) line(`fx${i}`, ox + i * B, oy, ox + i * B, oy + Wy * B, { c: "var(--cube-edge)", w: 1 });
        for (let j = 1; j < Wy; j++) line(`fy${j}`, ox, oy + j * B, ox + Lx * B, oy + j * B, { c: "var(--cube-edge)", w: 1 });
        [...this.covered].forEach((c, n) => {
          const i = c % Lx, j = Math.floor(c / Lx);
          rect(`cv${c}`, ox + i * B, oy + j * B, B, B, { fill: "var(--cube-top)" });
          rect(`cvo${c}`, ox + i * B, oy + j * B, B, B, { c: "var(--cube-edge)" });
          text(`cvn${c}`, n + 1, ox + (i + .5) * B, oy + (j + .5) * B, "small", { c: "var(--ink)" });
        });
      }
      UP = true;
      const b = this.bounds(t, st !== "floor");
      // MARK: standing up: the box's full height dashed, the cubes layer by layer, each layer counted on its front
      if (t >= 0.02) {
        const corner = (x, y, z) => { const q = this.proj(x, y, z, t); return `${sq(q.x)},${sq(q.y)}`; };

        if ((w * den + n) * Lc !== S * den) { this.verdict = "wrong"; this.msg = `That's not the same amount as ${S}/${Lc}.`; }
        else if (n >= den && F.num) { this.verdict = "wrong"; this.msg = `Same amount. Take the whole ${den}s out first.`; }
        else if (gcd(n, den) > 1) { this.verdict = "wrong"; this.msg = `Same amount. Both ${n} and ${den} still divide by ${gcd(n, den)}.`; }
        else { this.verdict = "right"; this.next(); }

    },
    scene() {
      const st = this.stage, cut = !["look", "cut"].includes(st), P = pname(Lc);
      const sayMap = { look: ["Look at the bars. Are the pieces the same size?", ""], cut: ["Cut both bars into the same size pieces.", "Drag down across both bars."],
        shade0: [`Shade ${P} to match ${a}/${b}.`, "Tap the pieces."], shade1: [`Shade ${P} to match ${c}/${d}.`, "Tap the pieces."],
        add: ["Add the tops.", `Count the shaded ${P}. Write how many.`], simp: ["Write it as simply as you can.", ""],
        done: ["Same-size pieces, so the tops add.", `${a}/${b} + ${c}/${d} = ${A}/${Lc} + ${C}/${Lc} = ${S}/${Lc}${simp ? " = " + fstr : ""}`] };
      dhead(this, ...sayMap[st]);
      // the two bars
      for (const k of [0, 1]) {
        const y = Y[k], den = bottoms[k], old = W / den, oldLen = tops[k] * old, fill = k ? "url(#stripes)" : "var(--tint-strong)";
        const shadingNow = st === `shade${k}`, doneK = cut && stages.indexOf(st) > stages.indexOf(`shade${k}`) || (cut && den === Lc);

        const step = cut ? pw : old;
        for (let x = step; x < W; x += step) line(`b${k}c${step}_${x}`, x, y, x, y + H, { c: "var(--chapter)" });
        if (shadingNow) {
          path(`br${k}`, `M0 ${sq(y - 0.4)}V${sq(y - 1)}H${sq(oldLen)}V${sq(y - 0.4)}`, { c: "var(--chapter)" });
          lab(`brw${k}`, `${tops[k]}/${den}`, "above", y - 1, oldLen / 2, "small", "var(--chapter)");
          lab(`cnt${k}${tapped[k].size}`, `${tapped[k].size} of ${Lc}`, "below", y + H, 4, "small");
        }

        frac(`f${k}`, tops[k], den, rx, ry[k]);
        if (cut) {
          text(`eq${k}`, "=", rx + 5.5, ry[k] + 2, "maths");

      }
      text("plus", "+", rx - 1.5, ry[1] + 2, "maths");

          for (let x = this.cx; x < W; x += this.cx) line(`cut${k}_${x}`, x, Y[k] - 0.8, x, Y[k] + H + 0.8, { c: "var(--ink2)", dash: this.grabbed, live: true });
          const old = W / bottoms[k];
          for (let x = old; x < W; x += old) if (x % this.cx === 0) dot(`hit${k}_${x}_${this.cx}`, x, Y[k] + H + 1.3, 0.3, { live: true });
        }

      if (st === "look") block("go", 0, 24, 9, "Continue", "go");
      if (st === "cut" || st.startsWith("shade")) block("check", 0, 24, 7, "Check", "check");
      // the line, the answer bar(s), the answer
      if (["add", "simp", "done"].includes(st)) {
        line("rule", rx - 2.5, 25, rx + 11, 25);
        const filled = st !== "add", bars = spill ? 2 : 1;
        for (let j = 0; j < bars; j++) {
          const y = 27 + 6 * j, base = j * Lc;
          const recut = st === "done" && simp && F.whole === 0;
          if (filled && !recut) {
            const fromA = Math.max(0, Math.min(Lc, A - base)), more = Math.max(0, Math.min(Lc - fromA, S - base - fromA));
            if (fromA) rect(`ans${j}a`, 0, y, fromA * pw, H, { fill: "var(--tint-strong)" });
            if (more) rect(`ans${j}c`, fromA * pw, y, more * pw, H, { fill: "url(#stripes)" });
            for (let i = 0; i < Math.min(Lc, S - base); i++) text(`an${j}_${i}`, base + i + 1, (i + 0.5) * pw, y + H / 2, "small", { c: "var(--ink)" });
          }
          if (recut) rect(`ansS`, 0, y, F.num * W / F.den, H, { fill: "var(--tint-strong)" });
          rect(`ans${j}o`, 0, y, W, H, { c: "var(--chapter)" });
          const step = recut ? W / F.den : pw;
          for (let x = step; x < W; x += step) line(`ans${j}c${step}_${x}`, x, y, x, y + H, { c: "var(--chapter)" });
        }
        if (st === "add") {
          dbox("n", rx + 7, 27, 2, this.vals.n || "", boxState(this, "n"), "box:n", true);
          line("nbar", rx + 7, 29, rx + 11, 29); text("nb", Lc, rx + 9, 30, "maths");
        } else frac("ansf", S, Lc, rx + 7, 27, { c: st === "done" ? "var(--chapter)" : null });
        if (st === "simp") {
          text("eqs", "=", rx + 12.5, 29, "maths");
          let x = rx + 14;
          if (F.whole) { dbox("w", x, 28, 1, this.vals.w || "", boxState(this, "w"), "box:w", true); x += 3; }
          if (F.num) { dbox("sn", x, 27, 2, this.vals.sn || "", boxState(this, "sn"), "box:sn", true); line("snbar", x, 29, x + 4, 29); dbox("sd", x, 29, 2, this.vals.sd || "", boxState(this, "sd"), "box:sd", true); }
        }
        if (st === "done" && simp) {
          text("eqs", "=", rx + 12.5, 29, "maths", { c: "var(--chapter)" });
          let x = rx + 14;
          if (F.whole) { text("fw", F.whole, x + 1, 29, "maths", { c: "var(--chapter)" }); x += 3; }
          if (F.num) frac("fs", F.num, F.den, x, 27, { c: "var(--chapter)" });
        }
        const by = spill ? 40 : 34;
        if (st === "done") block("next", 0, by, 10, "Next problem", "next"); else block("check", 0, by, 7, "Check", "check");
      }
    },
  });
  return L;
}

// ---------- Adding decimals (Designer): wholes as squares, the part after the point as an opened whole ----------
// One square is 1 (a ten is a strip of 10). Opened, a whole is 10 × 10 cells of 2 × 2 squares: a cell is a hundredth.
function dAddDec() {
  const small = Math.random() < 0.5;
  let A10, B100;
  do { A10 = small ? rnd(11, 99) : rnd(11, 999); B100 = small ? rnd(101, 999) : rnd(101, 9999); } while (B100 % 100 === 0);
  const wa = Math.floor(A10 / 10), wb = Math.floor(B100 / 100), da = (A10 % 10) * 10, db = B100 % 100;
  const Wsum = wa + wb, Dsum = da + db, total = A10 * 10 + B100, over = Dsum - 100;
  const As = (A10 / 10).toFixed(2), Bs = (B100 / 100).toFixed(2), Ts = (total / 100).toFixed(2), Ds = (Dsum / 100).toFixed(2);
  const aShown = A10 % 10 ? 1 : 0, bShown = B100 % 10 ? 2 : B100 % 100 ? 1 : 0;
  const stages = ["look", "wholes"].concat((wa % 10) + (wb % 10) >= 10 ? ["group"] : [], ["pour"], Dsum >= 100 ? ["close"] : [], ["total", "done"]);
  const GY = 18, AX = 0, BX = 25;
  const L = withBoxes({
    id: "adddec", maxZoom: 1.25, stage: "look", msg: null, verdict: null, typing: false, grabbed: null, off: { x: 0, y: 0 },
    tens: Math.floor(wa / 10), ones: wa % 10, gridA: da, poured: 0, gridB: db, closed: false,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return { x: -2, y: -1, w: 70, h: 44 }; },
    next() { this.stage = stages[stages.indexOf(this.stage) + 1]; this.msg = null; this.verdict = null;
      if (this.stage === "total") { this.typing = true; this.active = "t"; } },
    grab(q) {
      if (this.stage === "wholes" && q.x > BX - 1 && q.x < BX + 21 && q.y > 4 && q.y < GY - 1) { this.grabbed = "wholes"; this.from = q; this.msg = null; return true; }
      if (this.stage === "pour" && q.x > BX - 1 && q.x < BX + 21 && q.y > GY - 1 && q.y < GY + 21) { this.grabbed = "grid"; this.from = q; this.msg = null; return true; }
      return false;
    },
    drag(q) { this.off = { x: q.x - this.from.x, y: q.y - this.from.y }; },
    release(q) {
      const g = this.grabbed; this.grabbed = null; this.off = { x: 0, y: 0 };
      if (!g) return;
      if (q.x > 21) { this.msg = g === "wholes" ? "Drop them on the other wholes." : "Drop it on the other opened whole."; return; }
      if (g === "wholes") { this.tens += Math.floor(wb / 10); this.ones += wb % 10; this.next(); }
      else { this.poured = Math.min(db, 100 - da); this.gridB = db - this.poured; this.next(); }
    },
    tap(q) {
      if (this.stage === "group" && q.x >= AX && q.x <= AX + 20 && Math.abs(q.y - (GY - 2.5)) < 1.5) { this.tens += 1; this.ones -= 10; this.next(); return true; }
      if (this.stage === "close" && q.x >= AX && q.x <= AX + 20 && q.y >= GY && q.y <= GY + 20) {
        this.ones += 1; if (this.ones >= 10) { this.ones -= 10; this.tens += 1; }
        this.closed = true; this.gridA = 0; this.poured = over; this.gridB = 0; this.next(); return true;
      }
      if (this.stage === "group" || this.stage === "close") { this.msg = this.stage === "group" ? "Tap the row of ones." : "Tap the full opened whole."; return true; }
      return false;
    },
    act(x) {
      if (boxAct(this, x)) return;
      if (x === "go" && this.stage === "look") { this.next(); return; }
      if (x !== "check" || this.stage !== "total") return;
      const v = this.vals.t;
      if (!v) { this.msg = "Type the total first."; return; }
      const n = Math.round(parseFloat(v) * 100);
      if (n === total) { this.verdict = "right"; this.next(); this.typing = false; }
      else { this.verdict = "wrong"; this.msg = Dsum >= 100 && n === total - 100 ? "The full whole you closed goes with the wholes." : n === Wsum * 100 ? "Keep the part after the point." : `Add the two rows: ${Wsum} and ${Ds}.`; }
    },
    scene() {
      const st = this.stage, merged = stages.indexOf(st) > stages.indexOf("wholes"), pouredNow = stages.indexOf(st) > stages.indexOf("pour");
      const sayMap = { look: ["Points under points. The 0 fills the empty place.", "The opened wholes show the part after the point: one cell is a hundredth."],
        wholes: ["Put the wholes together.", "Drag them across."], group: ["Make a ten.", "Tap the row of ones."],
        pour: ["Pour the hundredths in.", "Drag the opened whole across."], close: ["100 hundredths make a whole.", "Tap it to close it."],
        total: ["Add the two rows.", "Write the total under the line."], done: ["Points in a line, so hundredths add to hundredths.", ""] };
      dhead(this, ...sayMap[st]);
      // the wholes: tens as strips of 10 stacked, the ones in a row under them, one square each; bottom on row GY-2
      const wholesAt = (k, x0, tens, ones, o) => {
        const t = o ? `translate(${sq(o.x)} ${sq(o.y)})` : null, live = !!o;
        const ox = 0, rowsOfTens = Math.min(tens, 9), extra = tens - rowsOfTens;
        for (let i = 0; i < tens; i++) {
          const col = i < 9 ? 0 : 11, row = i < 9 ? i : i - 9, y = GY - 3 - Math.min(rowsOfTens, 9) + row;
          rect(`${k}t${i}`, x0 + col + ox, y, 10, 1, { fill: "var(--tint-strong)", live, t });
          rect(`${k}to${i}`, x0 + col + ox, y, 10, 1, { c: "var(--chapter)", live, t });
        }
        void extra;
        for (let i = 0; i < ones; i++) rect(`${k}o${i}`, x0 + i, GY - 3, 1, 1, { fill: "var(--tint-strong)", live, t });
        for (let i = 0; i < ones; i++) rect(`${k}oo${i}`, x0 + i, GY - 3, 1, 1, { c: "var(--chapter)", live, t });
        return ones;
      };
      // an opened whole: 20 × 20 squares, cells of 2 × 2 filled down each column (a column is a tenth)
      const gridAt = (k, x0, solid, striped, o) => {
        const t = o ? `translate(${sq(o.x)} ${sq(o.y)})` : null, live = !!o;
        const fillRun = (key, from, n, fill) => {
          for (let i = from; i < from + n;) {
            const col = Math.floor(i / 10), r = i % 10, run = Math.min(10 - r, from + n - i);
            rect(`${key}${col}_${r}_${run}`, x0 + col * 2, GY + r * 2, 2, run * 2, { fill, live, t }); i += run;
          }
        };
        fillRun(`${k}s`, 0, solid, "var(--tint-strong)");
        fillRun(`${k}p`, solid, striped, "url(#stripes)");
        for (let i = 1; i < 10; i++) { line(`${k}v${i}`, x0 + i * 2, GY, x0 + i * 2, GY + 20, { c: "var(--tint-strong)", w: 1, live }); line(`${k}h${i}`, x0, GY + i * 2, x0 + 20, GY + i * 2, { c: "var(--tint-strong)", w: 1, live }); }
        rect(`${k}go`, x0, GY, 20, 20, { c: "var(--chapter)", live, t });
      };
      // a's side (the answer builds here), b's side
      const onesA = wholesAt("wa", AX, this.tens, this.ones);
      if (!merged) wholesAt("wb", BX, Math.floor(wb / 10), wb % 10, this.grabbed === "wholes" ? this.off : null);
      const solidA = this.closed ? 0 : this.gridA, stripedA = this.poured;
      gridAt("ga", AX, solidA, stripedA);
      if (this.gridB > 0) gridAt(`gb${this.gridB}`, BX, 0, this.gridB, this.grabbed === "grid" ? this.off : null);
      // the magnifier: from the whole that's open (the square after the ones) to its grid
      const mag = (k, x0, ones) => {
        rect(`${k}mq${ones}`, x0 + ones, GY - 3, 1, 1, { c: "var(--chapter)" });
        line(`${k}m1${ones}`, x0 + ones, GY - 2, x0, GY, { dash: true, c: "var(--chapter)" });
        line(`${k}m2${ones}`, x0 + ones + 1, GY - 2, x0 + 20, GY, { dash: true, c: "var(--chapter)" });
      };
      if (onesA < 20) mag("ma", AX, Math.min(onesA, 19));
      if (!pouredNow && this.grabbed !== "grid") mag("mb", BX, wb % 10);
      if (st === "close") rect("closeHint", AX, GY, 20, 20, { c: "var(--chapter)", w: 1.5 });
      if (st === "done") lab("countA", `${this.tens} ${this.tens === 1 ? "ten" : "tens"}, ${this.ones} ${this.ones === 1 ? "one" : "ones"}, ${this.poured} hundredths`, "below", GY + 20, 10, "small");
      // the record: a over b on the points, the parts' sums, the total
      const right = 66, pointX = 62, sx = 53;
      const colour = (s, shown) => i => { const dec = s.length - 1 - i; return s[i] !== "." && dec < 2 - shown ? "var(--chapter)" : null; };
      const write = (k, s, row, col) => { let x = right; for (let i = s.length - 1; i >= 0; i--) { if (s[i] === ".") { text(`${k}.`, ".", pointX, row, "maths"); continue; } text(`${k}${i}${s[i]}`, s[i], x - 1, row, "maths", { c: col(i) }); x -= 2; } };
      write("ra", As, GY + 1, colour(As, aShown));
      text("rplus", "+", sx, GY + 3, "maths");
      write("rb", Bs, GY + 3, colour(Bs, bShown));
      line("rr1", sx - 1, GY + 4, right, GY + 4);
      line("rpt", pointX, GY - 0.5, pointX, GY + 10.5, { dash: true, c: "var(--ink3)" });
      if (merged) digits("rw", String(Wsum), pointX, GY + 5);
      if (pouredNow) {
        text("rplus2", "+", sx, GY + 7, "maths");
        write("rd", Ds, GY + 7, () => null);
        if (Dsum >= 100) ring("rdring", pointX - 1, GY + 7);
        line("rr2", sx - 1, GY + 8, right, GY + 8);
      }
      if (st === "total") { const cells = Ts.replace(".", "").length; dbox("t", right - 2 * cells, GY + 8, cells, this.vals.t || "", boxState(this, "t"), "box:t"); }
      if (st === "done") write("rt", Ts, GY + 9, () => "var(--chapter)");
      if (st === "look") block("go", 0, 40, 9, "Continue", "go");
      if (st === "total") block("check", 0, 40, 7, "Check", "check");
      if (st === "done") block("next", 0, 41, 10, "Next problem", "next");
    },
  });
  return L;
}

// ---------- Volume of a box (Designer, flat): cubes a block each, the floor from above, the layers from the front ----------
function dVolume() {
  let l, w, h; do { l = rnd(2, 6); w = rnd(2, 4); h = rnd(2, 4); } while (w + h > 6);
  const base = l * w, V = base * h, B = 5, x0 = 5, gapV = 2, fy = 6 + h * B + gapV, stages = ["cover", "build", "write", "done"];
  const L = withBoxes({
    id: "volume", maxZoom: 1.25, stage: "cover", covered: new Set(), layers: 0, grabbed: false, msg: null, verdict: null, typing: false,
    progress() { return stageIndex(stages, this.stage); },
    frame() { return { x: -2, y: -1, w: Math.max(56, x0 + l * B + 34), h: fy + w * B + 7 }; },
    cell(q) { const i = Math.floor((q.x - x0) / B), j = Math.floor((q.y - fy) / B); return i >= 0 && i < l && j >= 0 && j < w ? `${i},${j}` : null; },
    grab(q) {
      if (this.stage === "cover") { const c = this.cell(q); if (!c) return false; this.covered.add(c); this.grabbed = true; this.msg = null; return true; }
      if (this.stage === "build" && q.x > x0 && q.x < x0 + l * B && q.y > 5 && q.y < fy + w * B) { this.grabbed = true; this.y0 = q.y; this.msg = null; return true; }
      return false;
    },
    drag(q) {
      if (this.stage === "cover") { const c = this.cell(q); if (c) this.covered.add(c); }
      else this.layers = Math.max(0, Math.min(h + 2, Math.round((this.y0 - q.y) / B)));
    },
    release() {
      this.grabbed = false;
      if (this.stage === "build") {
        if (this.layers === h) { this.stage = "write"; this.typing = true; this.active = "v"; }
        else { this.msg = this.layers < h ? `Keep going: the box is ${h} cm tall.` : `Too tall: the box is ${h} cm tall.`; this.layers = 0; }
      }
    },
    act(x) {
      if (boxAct(this, x)) return;
      if (x !== "check") return;
      if (this.stage === "cover") {
        if (this.covered.size === base) { this.stage = "build"; this.msg = null; }
        else this.msg = `Cover every square: ${this.covered.size} of ${base} so far.`;
      } else if (this.stage === "write") {
        const v = this.vals.v;
        if (!v) { this.msg = "Type how many cubes first."; return; }
        if (+v === V) { this.verdict = "right"; this.stage = "done"; this.typing = false; this.msg = null; }
        else { this.verdict = "wrong"; this.msg = +v === base + h ? `Each layer is ${base} cubes. ${h} layers: multiply.` : `Count the layers: ${base} in each.`; }
      }
    },
    scene() {
      const st = this.stage;
      const sayMap = { cover: ["Cover the floor.", "Drag across it."], build: [`Build it ${h} cm tall.`, "Drag up on the box, a layer at a time."],
        write: ["How many cubes fill it?", "Write it."], done: [`${h} layers of ${base} is ${V}.`, `Volume = ${l} × ${w} × ${h} = ${V} cubes.`] };
      dhead(this, ...sayMap[st]);
      // the floor, from above: a block per cube
      const covered = st === "cover" ? this.covered : null;
      for (let i = 0; i < l; i++) for (let j = 0; j < w; j++) {
        if (!covered || covered.has(`${i},${j}`)) rect(`fl${i}_${j}`, x0 + i * B, fy + j * B, B, B, { fill: "var(--tint-strong)", live: st === "cover" });
      }
      for (let i = 1; i < l; i++) line(`fv${i}`, x0 + i * B, fy, x0 + i * B, fy + w * B, { c: "var(--chapter)" });
      for (let j = 1; j < w; j++) line(`fh${j}`, x0, fy + j * B, x0 + l * B, fy + j * B, { c: "var(--chapter)" });
      rect("floor", x0, fy, l * B, w * B, { c: "var(--chapter)" });
      lab("lenw", `${l} cm`, "below", fy + w * B, x0 + l * B / 2, "small", "var(--ink)");
      lab("widw", `${w} cm`, "left", x0, fy + w * B / 2, "small", "var(--ink)");
      if (st === "cover") lab(`cnt${this.covered.size}`, `${this.covered.size} of ${base} squares`, "right", x0 + l * B, fy + w * B / 2, "small");
      // the box from the front: its height dashed, the layers rising on the floor's back edge
      const shown = st === "build" ? this.layers : st === "cover" ? 0 : h;
      line("hgt", x0 + l * B, fy - gapV - h * B, x0 + l * B, fy - gapV, { dash: true, c: "var(--ink3)" });
      line("hgtTop", x0, fy - gapV - h * B, x0 + l * B, fy - gapV - h * B, { dash: true, c: "var(--ink3)" });
      line("hgtL", x0, fy - gapV - h * B, x0, fy - gapV, { dash: true, c: "var(--ink3)" });
      lab("hgtw", `${h} cm`, "right", x0 + l * B, fy - gapV - h * B / 2, "small", "var(--ink)");
      for (let k = 0; k < shown; k++) {
        const y = fy - gapV - (k + 1) * B, live = st === "build";
        rect(`ly${k}`, x0, y, l * B, B, { fill: "var(--tint-strong)", live });
        for (let i = 1; i < l; i++) line(`ly${k}v${i}`, x0 + i * B, y, x0 + i * B, y + B, { c: "var(--chapter)", live });
        rect(`ly${k}o`, x0, y, l * B, B, { c: k < h ? "var(--chapter)" : "var(--wrong)", live });
        if (st !== "build") lab(`lyc${k}`, `${(k + 1) * base}`, "left", x0, y + B / 2, "small", "var(--chapter)");

// ---------- Multiply by 10, 100, 1000 (Designer): the chart's columns are places; the digits move left ----------

    progress() { return stageIndex(stages, this.stage); },

  drawn = new Set(); keys.blur();
  render(); frame(lesson.frame(), true);
  try { localStorage.setItem("paper-lesson", id); localStorage.setItem("paper-version", version); } catch (e) {}
}
pick.onchange = () => start(pick.value);
document.getElementById("v-claude").onclick = () => { version = "claude"; start(lesson.id); };
document.getElementById("v-designer").onclick = () => { version = "designer"; start(lesson.id); };
document.getElementById("fresh").onclick = () => leave();
// a lesson that tilted the paper lays it flat again before the next problem
function leave() { if (lesson.leave) lesson.leave(() => start(lesson.id)); else start(lesson.id); }
let first = "add";
try { first = localStorage.getItem("paper-lesson") || "add"; version = localStorage.getItem("paper-version") || "claude"; } catch (e) {}
start(first);
</script>
