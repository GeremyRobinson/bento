# Generates Obento2.xcodeproj with XcodeGen (brew install xcodegen; xcodegen).
name: Obento2
options:
  bundleIdPrefix: education.bento
  deploymentTarget:
    iOS: "18.0"
targets:
  Obento2:
    type: application
    platform: iOS
    # the same files Swift Playgrounds runs, built as one app
    sources: [Obento2.swiftpm/App, Obento2.swiftpm/Core, Obento2.swiftpm/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: education.bento.obento2
        PRODUCT_NAME: Obento2
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Obento²
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  Obento2UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Obento2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: education.bento.obento2.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Obento2
schemes:
  Obento2:
    build:
      targets:
        Obento2: all
    test:
      targets:
        - Obento2UITests
