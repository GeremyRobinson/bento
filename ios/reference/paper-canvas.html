<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Obento on paper</title>
<style>@font-face{font-family:"Areal";src:url("areal.ttf") format("truetype");font-weight:400 700;font-style:normal;font-display:block}</style>
<style>
:root{
  --pill:52px;--gap:10px;--half:5px;--pad2:20px;--r-pill:26px;--r-node:18px;--r-panel:28px;
  --font:"Areal",system-ui,sans-serif;--mono:"Areal",ui-monospace,monospace;--serif:"Areal",system-ui,sans-serif;
  --bg:#f3f2ef;--grid-minor:rgba(26,26,25,.045);--grid-major:rgba(26,26,25,.09);
  --surface:#fbfbfa;--sunk:#efeee9;--line:#e3e1dc;--line-strong:#cfccc5;
  --ink:#1a1a19;--ink2:#5d5852;--ink3:#8c867d;--edge:#cdcac3;--on-ink:#fbfbfa;--right:#178a57;--act:var(--ink);--on-act:var(--on-ink);--dot:var(--on-ink);--on-dot:var(--ink);
  --ease:cubic-bezier(.2,.8,.2,1);--settle:cubic-bezier(.34,1.2,.5,1);
}
:root[data-theme="dark"]{--bg:#121211;--grid-minor:rgba(236,235,231,.035);--grid-major:rgba(236,235,231,.07);
  --surface:#1b1b1a;--sunk:#232321;--line:#2c2c2a;--line-strong:#3a3a37;--ink:#ecebe7;--ink2:#b3ada4;--ink3:#878177;--edge:#3d3c39;--on-ink:#121211;--right:#3ccf8e;--act:#3a3834;--on-act:#ecebe7;--dot:#e4e1db;--on-dot:#1b1b1a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--font);touch-action:none;user-select:none;-webkit-user-select:none;transition:background .3s}
button{font:inherit;color:inherit}

/* canvas: plain on the map; the grid only rises when a lesson opens */
#paper{position:fixed;inset:0;cursor:grab}
#paper.drag{cursor:grabbing}
#grid{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease);pointer-events:none;
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px)}
.focus #grid{opacity:1}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}


/* chapter groups: a quiet frame and a name, like a group in a node editor */
.group{position:absolute;border-radius:32px;background:color-mix(in oklab,var(--cc) 3%,transparent);outline:1px solid color-mix(in oklab,var(--cc) 16%,transparent);outline-offset:-1px;transition:opacity .4s var(--ease)}
.group h2{position:absolute;left:28px;top:-46px;font:500 26px/1 var(--serif);letter-spacing:-.025em;white-space:nowrap;display:flex;align-items:baseline;gap:12px}
.group h2 i{font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-style:normal}
.group h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc);align-self:center}

/* edges: what each lesson builds on */
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--edge);stroke-width:1.5;transition:stroke .25s var(--ease),stroke-width .25s,opacity .3s}
#edges path.walked{stroke:var(--ink2)}
#edges path.hl{stroke:var(--cc);stroke-width:2.5}
#edges circle{fill:var(--bg);stroke:var(--edge);stroke-width:1.5;transition:fill .25s,stroke .25s}
#edges circle.walked{fill:var(--ink2);stroke:var(--ink2)}
#edges circle.hl{fill:var(--cc);stroke:var(--cc)}
.sel-on #edges path:not(.hl),.sel-on #edges circle:not(.hl){opacity:.35}

/* node: one lesson */
.node{position:absolute;width:260px;height:88px;border-radius:var(--r-node);background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;
  display:grid;grid-template-columns:68px 1fr;align-items:center;gap:12px;padding:10px 16px 10px 10px;cursor:pointer;
  transition:outline-color .2s var(--ease),transform .25s var(--settle),opacity .3s var(--ease);animation:in .5s var(--settle) both}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.97)}}
.node:hover{outline-color:var(--line-strong)}
.node:active{transform:scale(.98)}
.node .th{width:68px;height:68px;border-radius:10px;background:var(--sunk);display:grid;place-items:center}
.node .th svg{width:56px;height:40px}
.node .meta{display:flex;align-items:center;gap:8px;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.node .nm{font-weight:500;font-size:15px;line-height:1.25;margin-top:3px;text-wrap:balance}
.node .st{margin-left:auto}
.node.done .st{color:var(--ink2)}
.node.now{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.node.now .st{color:var(--ink)}
.node.sel{outline:2px solid var(--cc);outline-offset:-2px}
.sel-on .node:not(.sel):not(.rel){opacity:.45}
.focus .node,.focus .group,.focus #edges{opacity:0!important;pointer-events:none}

/* floating UI */
.float{position:fixed;z-index:5;background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:var(--r-pill);display:flex;align-items:center;gap:var(--half);padding:var(--half);transition:background .3s,opacity .3s}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--sunk)}
.ib svg{width:20px;height:20px}
.tl{top:16px;left:16px;padding-right:var(--pad2)}
.tl .gr{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:500 15px var(--mono);outline:1px solid var(--line);outline-offset:-1px}
.tl b{font-weight:500}.tl small{display:block;font:400 11px var(--mono);letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.tl .back{display:none}.focus .tl .back{display:grid}.focus .tl .gr{display:none}
.tr{top:16px;right:16px}
.dock{bottom:20px;left:50%;transform:translateX(-50%)}
.dock .pct{min-width:52px;text-align:center;font:400 12px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.dock .sep{width:1px;height:24px;background:var(--line);margin:0 var(--half)}
.btn{height:42px;border:0;border-radius:21px;background:var(--act);color:var(--on-act);font:500 15px var(--font);padding:0 var(--pad2);cursor:pointer;white-space:nowrap}
.focus .hint,.sel-on .hint{opacity:0}
.hint{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:5;font:400 12px var(--mono);color:var(--ink3);letter-spacing:.04em;transition:opacity .4s;white-space:nowrap}

/* inspector: tap a lesson to see what it is and how it connects */
.insp{position:fixed;z-index:6;top:84px;left:16px;bottom:84px;width:340px;background:var(--surface);outline:1px solid var(--line);outline-offset:-1px;border-radius:var(--r-panel);
  padding:var(--pad2);display:flex;flex-direction:column;gap:18px;transform:translateX(-24px);opacity:0;pointer-events:none;transition:transform .4s var(--ease),opacity .3s var(--ease);overflow:auto}
.insp.on{transform:none;opacity:1;pointer-events:auto}
.focus .insp:not(.lp){opacity:0;pointer-events:none}
.insp .tag{font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:8px}
.insp .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc)}
.insp .x{margin-left:auto;width:32px;height:32px}
.insp h3{font:500 30px/1.08 var(--serif);letter-spacing:-.03em}
.insp .goal{color:var(--ink2);font-size:15px}
.insp .pv{height:140px;border-radius:16px;background:var(--sunk);display:grid;place-items:center}
.insp .pv svg{width:70%;height:80%}
.insp .row{display:flex;flex-direction:column;gap:6px}
.insp .row>i{font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-style:normal}
.insp .lk{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;border:0;background:var(--sunk);cursor:pointer;text-align:left;font-weight:500}
.insp .lk:hover{background:var(--line)}
.insp .lk span{width:6px;height:6px;border-radius:50%;background:var(--c2);flex:none}
.insp .lk em{margin-left:auto;font:400 11px var(--mono);color:var(--ink3);font-style:normal;text-transform:uppercase;letter-spacing:.06em}
.insp .none{color:var(--ink3);font-size:13px}
.insp .go{margin-top:auto;height:var(--pill);border-radius:var(--r-pill);display:flex;align-items:center;justify-content:space-between;padding:0 var(--half) 0 var(--pad2)}
.insp .go svg,.intro .begin svg{width:42px;height:42px;border-radius:50%;background:var(--dot);color:var(--on-dot);padding:11px}

/* LESSON: the picture is the problem, drawn on the grid; panels around it are the tools */
.board{position:absolute;display:none}
.board.on{display:block;animation:grow .5s var(--settle) both}
@keyframes grow{from{opacity:0;transform:scale(.96)}}
#lpic{position:absolute;left:0;top:0;overflow:visible}
#lpic .q{font:400 44px var(--mono);font-variation-settings:"MONO" 100;fill:var(--ink);letter-spacing:-.02em}
#lpic .lab{font:500 15px var(--font);fill:var(--ink2)}
#lpic .cnt{font:400 13px var(--mono);font-variation-settings:"MONO" 100;fill:var(--ink2);letter-spacing:.04em}
#lpic .eq{font:400 22px var(--mono);font-variation-settings:"MONO" 100;fill:var(--cc)}
#lpic .note{font:400 11px var(--mono);font-variation-settings:"MONO" 100;fill:var(--ink3);letter-spacing:.1em}
#lpic .pc{stroke:var(--cc);stroke-width:2;transition:fill .25s var(--ease)}
#lpic .pc.e{fill:transparent;stroke:color-mix(in oklab,var(--cc) 45%,transparent)}
#lpic .pc.s{fill:var(--cc)}
#lpic .pc.a{fill:color-mix(in oklab,var(--cc) 50%,var(--bg))}
.working #lpic .pc.tap{cursor:pointer}
.working #lpic .pc.tap.e:hover{fill:color-mix(in oklab,var(--cc) 12%,transparent)}
#lpic .guide{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 5;fill:none}
#lpic .match{stroke:var(--cc);stroke-width:2;stroke-dasharray:4 6;fill:none}
.dim line,.dim path{stroke:var(--line-strong);stroke-width:1.5;fill:none}
.dim text{font:400 11px var(--mono);font-variation-settings:"MONO" 100;letter-spacing:.1em;fill:var(--ink3)}
.pop{animation:rise .45s var(--settle) both}
.drawn{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .5s var(--ease) forwards}
.run .dim line,.run .dim path{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .5s var(--ease) var(--d) forwards}
.run #lpic text{opacity:0;animation:rise .45s var(--ease) var(--d) forwards}
.run #lpic .pc{transform-box:fill-box;transform-origin:center bottom;opacity:0;animation:cell .4s var(--settle) var(--d) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cell{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}

/* lesson panel: same master as the inspector; intro, then each step, then solved */
.lp{z-index:6}
.lp .tag::before{background:var(--cc)}
.lp h3.tt{font:500 40px/1.02 var(--serif);letter-spacing:-.04em}
.lp .chip{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;background:var(--sunk);font-weight:500}
.lp .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cc)}
.lp .marks{display:flex;gap:6px;margin-left:auto}
.lp .marks i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.lp .marks i.d{background:var(--cc)}.lp .marks i.n{background:var(--ink);width:28px}
.lp .ask{font:500 28px/1.12 var(--font);letter-spacing:-.025em}
.lp .how{color:var(--ink2)}
.lp .read{display:flex;align-items:baseline;gap:10px;padding:16px;border-radius:16px;background:var(--sunk)}
.lp .read b{font:400 40px var(--mono);font-variation-settings:"MONO" 100;font-weight:400;letter-spacing:-.02em}
.lp .read small{font:400 11px var(--mono);font-variation-settings:"MONO" 100;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.lp .say{min-height:20px;color:var(--ink2)}
.lp .say.ok{color:var(--right);font-weight:500}
.lp .ghost{background:transparent;color:var(--ink);outline:1px solid var(--line);outline-offset:-1px;justify-content:center}
.lp .acts{margin-top:auto;display:flex;flex-direction:column;gap:var(--gap)}
.lp .acts .btn{height:var(--pill);border-radius:var(--r-pill);display:flex;align-items:center;justify-content:space-between;padding:0 var(--half) 0 var(--pad2)}
.lp .acts .btn.ghost{justify-content:center;padding:0}
.lp .acts svg{width:42px;height:42px;border-radius:50%;background:var(--dot);color:var(--on-dot);padding:11px}
.lp .fade{animation:rise .4s var(--ease) both}

/* tools: a quiet rail on the right, labelled so it can be found */
.tools{right:16px;top:50%;transform:translateY(-50%) translateX(20px);flex-direction:column;padding:6px;gap:2px;border-radius:28px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .4s var(--ease)}
.working .tools{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.tb{width:64px;height:62px;border:0;border-radius:22px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--ink)}
.tb:hover,.tb.on{background:var(--sunk)}
.tb svg{width:22px;height:22px}
.tb span{font:400 10px var(--mono);font-variation-settings:"MONO" 100;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kp{right:96px;top:50%;width:236px;flex-direction:column;align-items:stretch;padding:10px;gap:10px;border-radius:var(--r-panel);transform:translateY(-50%) translateX(16px);opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .35s var(--ease)}
.kp-on .kp{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.kp .disp{height:56px;border-radius:20px;outline:1.5px solid var(--ink);outline-offset:-1.5px;display:flex;align-items:center;padding:0 16px;font:400 28px var(--mono);font-variation-settings:"MONO" 100}
.kp .disp small{font-size:15px;color:var(--ink3);margin-left:6px}
.kp .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp .keys button{height:46px;border:0;border-radius:23px;background:var(--sunk);font:400 19px var(--mono);font-variation-settings:"MONO" 100;cursor:pointer}
.kp .keys [data-k=del]{font-family:var(--font);font-variation-settings:"MONO" 0}
.focus #today,.focus .dock .sep{display:none}
.flyer{position:fixed;z-index:9;font:500 40px/1.02 var(--serif);letter-spacing:-.04em;pointer-events:none;transform-origin:0 0;transition:transform .6s var(--ease),opacity .25s var(--ease) .45s}
.isl{top:16px;left:50%;transform:translateX(-50%);padding:0 var(--pad2);height:var(--pill);opacity:0;pointer-events:none}
.isl b{font-weight:500}.isl small{font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:block}
.focus .isl.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}.fly #world{transition:none}}
@media (max-width:760px){.insp{left:16px;right:16px;width:auto;top:auto;height:62%}.hint{display:none}}

/* one family, ABC Areal: its MONO axis gives the labels and numbers their monospaced voice */
.group h2 i,.node .meta,.tl .gr,.tl small,.dock .pct,.hint,.insp .tag,.insp .row>i,.insp .lk em,.board .q,.dim text,.solve .s1,.solve .ans,.keys button,.intro .tag,.intro .uses i,.isl small,.mn{font-variation-settings:"MONO" 100}
.keys [data-k=del],.keys .go{font-variation-settings:"MONO" 0}
body{font-feature-settings:"ss01" 0;-webkit-font-smoothing:antialiased}

/* grade picker: the same panel, with the map blurred behind it, so grades read as part of the UI */
.gpick{display:flex;align-items:center;gap:var(--gap);border:0;background:transparent;cursor:pointer;text-align:left;padding:0;border-radius:var(--r-pill)}
.gpick .chev{width:16px;height:16px;color:var(--ink3);margin-left:2px;transition:transform .3s var(--ease)}
.gopen .gpick .chev{transform:rotate(180deg)}
.focus .gpick{pointer-events:none}.focus .gpick .chev{display:none}
.scrim{position:fixed;inset:0;z-index:6;background:color-mix(in oklab,var(--bg) 45%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.gopen .scrim{opacity:1;pointer-events:auto}
.insp.grades{z-index:7;gap:14px;touch-action:pan-y}
.gopen .tl{z-index:8}
.insp{touch-action:pan-y}
.grades .tag::before{display:none}
.grades .list{display:flex;flex-direction:column;gap:6px;margin:0 -6px;padding:0 6px 6px;overflow:auto;flex:1}
.grow{flex:none;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;min-height:64px;padding:8px 14px 8px 8px;border-radius:16px;border:0;background:transparent;cursor:pointer;text-align:left;transition:background .2s}
.grow:hover{background:var(--sunk)}
.grow .gn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;outline:1px solid var(--line);outline-offset:-1px;font:500 15px var(--mono);font-variation-settings:"MONO" 100}
.grow b{display:block;font-weight:500;font-size:15px}
.grow small{display:block;color:var(--ink3);font-size:13px;line-height:1.3;margin-top:1px}
.grow .pr{font:400 12px var(--mono);font-variation-settings:"MONO" 100;color:var(--ink3);text-align:right;white-space:nowrap}
.grow.cur .pr{color:var(--ink)}
.grow .bar{grid-column:2/4;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:2px}
.grow .bar i{display:block;height:100%;background:var(--ink)}
.grow.cur{background:var(--sunk);outline:1.5px solid var(--ink);outline-offset:-1.5px}
.grow.cur .gn{background:var(--ink);color:var(--on-ink);outline:0}
.grow .soon{grid-column:2/4;font:400 11px var(--mono);font-variation-settings:"MONO" 100;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:none}
.grow.ask .soon{display:block}
/* SOFT VOICE (G 2026-10-16: mono labels felt "technical"; kids should feel at home).
   No monospaced text anywhere: labels, numbers and the problem use Areal's normal sans,
   sentence case, no wide tracking. Numbers keep even widths via tabular figures. */
*,#lpic text{font-variation-settings:"MONO" 0 !important}
body{font-variant-numeric:tabular-nums}
.group h2 i,.node .meta,.tl small,.insp .tag,.insp .row>i,.insp .lk em,.isl small,.lp .read small,.tb span,.grow .soon{text-transform:none;letter-spacing:0;font-size:13px;font-weight:450}
.node .meta{font-size:12.5px}
.tb span{font-size:11.5px;font-weight:500}
.isl small{font-size:12px}
.dock .pct,.hint,.grow .pr{letter-spacing:0;font-size:13px}
#lpic .q{font-weight:500;letter-spacing:-.03em}
#lpic .eq{font-weight:500;letter-spacing:-.01em}
#lpic .cnt{font:450 15px var(--font);letter-spacing:0}
#lpic .note{font:450 13px var(--font);letter-spacing:0}
.dim text{font:450 13px var(--font);letter-spacing:0}
.lp .read b{font-weight:500;letter-spacing:-.03em}
.tl .gr,.grow .gn,.kp .keys button,.kp .disp{font-weight:500}

/* ---------- K-5: one trail, big stops, one obvious next step (the 6-12 map stays as it is) ---------- */
#kid{position:absolute;left:0;top:0;display:none}
.kid #kid{display:block}
.kid .node,.kid .group,.kid #edges{display:none}
.focus #kid{opacity:0;pointer-events:none}
#trail{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#trail path{fill:none;stroke-linecap:round}
#trail .road{stroke:var(--line);stroke-width:30}
#trail .dots{stroke:var(--line-strong);stroke-width:10;stroke-dasharray:0 22}
#trail .walk{stroke:var(--cc);stroke-width:10}
.stop{position:absolute;width:220px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;animation:in .5s var(--settle) both}
.stop .ring{width:156px;height:156px;border-radius:50%;background:var(--surface);outline:3px solid color-mix(in oklab,var(--cc) 40%,var(--line));outline-offset:-3px;display:grid;place-items:center;position:relative;transition:transform .25s var(--settle),outline-color .2s}
.stop:active .ring{transform:scale(.96)}
.stop .ring svg{width:112px;height:76px}
.stop.done .ring{background:color-mix(in oklab,var(--cc) 10%,var(--surface))}
.stop .ok{position:absolute;right:4px;top:4px;width:40px;height:40px;border-radius:50%;background:var(--cc);color:#fff;display:grid;place-items:center;outline:4px solid var(--bg)}
.stop .ok svg{width:22px;height:22px}
.stop.now .ring{width:184px;height:184px;margin-top:-28px;outline:4px solid var(--ink);outline-offset:-4px}
.stop.now .ring svg{width:132px;height:90px}
.stop .flag{position:absolute;top:-58px;height:36px;padding:0 16px;border-radius:18px;background:var(--ink);color:var(--on-ink);font:550 15px/36px var(--font);white-space:nowrap}
.stop.now .flag{top:-86px}
.stop .nm{font:550 19px/1.2 var(--font);letter-spacing:-.01em;text-align:center;text-wrap:balance}

const T3=window.T3={on:false};

function rgba(str){ const m=str.match(/rgba?\(([^)]+)\)/); if(!m) return {c:new THREE.Color(str),a:1}; const p=m[1].split(',').map(Number); return {c:new THREE.Color(p[0]/255,p[1]/255,p[2]/255),a:p[3]??1}; }
function colours(cc){ const surf=new THREE.Color(css('--surface')), ink=new THREE.Color(css('--ink')), c=new THREE.Color(cc), dark=document.documentElement.dataset.theme==='dark';
  const mix=(a,k)=>a.clone().lerp(c,k);
  return dark?{top:mix(surf,.32),front:mix(surf,.42),side:mix(surf,.52),deep:c.clone().lerp(new THREE.Color('#fff'),.25),sq:mix(surf,.38)}
             :{top:mix(surf,.30),front:mix(surf,.42),side:mix(surf,.55),deep:c.clone().lerp(ink,.35),sq:mix(surf,.35)}; }
function orient(el,az){ const e=el*Math.PI/180,z=az*Math.PI/180, dir=new THREE.Vector3(Math.cos(e)*Math.sin(z),Math.sin(e),Math.cos(e)*Math.cos(z));
  const right=new THREE.Vector3(0,1,0).cross(dir).normalize(), up=dir.clone().cross(right).normalize(); return {dir,right,up}; }
function place(){ const o=orient(view.el,view.az), W=innerWidth, H=innerHeight;
  cam3.position.copy(view.t).addScaledVector(o.dir,60); cam3.up.copy(o.up); cam3.lookAt(view.t);
  cam3.left=-W/2/view.s; cam3.right=W/2/view.s; cam3.top=H/2/view.s; cam3.bottom=-H/2/view.s; cam3.updateProjectionMatrix();
  const k=view.s/U; host.style.setProperty('--k',k); document.getElementById('pct').textContent=document.getElementById('kpct').textContent=Math.round(k*100)+'%'; dirty=true; }
function size(){ R.setSize(innerWidth,innerHeight,false); L2.setSize(innerWidth,innerHeight); const p=R.getPixelRatio(); mats.forEach(m=>m.resolution.set(innerWidth*p,innerHeight*p)); if(cam3) place(); }
function lineMat(o){ const m=new LineMaterial({linewidth:3,worldUnits:false,...o}); mats.push(m); m.resolution.set(innerWidth*R.getPixelRatio(),innerHeight*R.getPixelRatio()); return m; }
function tween(at,ms,fn){ if(reduce){ fn(1); dirty=true; return; } tweens.push({t0:performance.now()+at,ms,fn}); }
function moveTo(to,ms,done){ if(reduce||!ms){ Object.assign(view,to); if(to.t) view.t=to.t.clone(); place(); done&&done(); return; }
  move={from:{el:view.el,az:view.az,s:view.s,t:view.t.clone()},to:{el:to.el??view.el,az:to.az??view.az,s:to.s??view.s,t:(to.t||view.t).clone()},t0:performance.now(),ms,done}; }
function loop(now){ if(!T3.on&&!move){ return; }
  if(move){ const u=Math.min(1,(now-move.t0)/move.ms), k=ease(u), f=move.from, t=move.to;
    view.el=f.el+(t.el-f.el)*k; view.az=f.az+(t.az-f.az)*k; view.s=f.s*Math.pow(t.s/f.s,k); view.t.lerpVectors(f.t,t.t,k); place();
    if(u>=1){ const d=move.done; move=null; d&&d(); } }
  if(tweens.length){ tweens=tweens.filter(tw=>{ const u=(now-tw.t0)/tw.ms; if(u<0) return true; tw.fn(u<1?ease(u):1); dirty=true; return u<1; }); }
  if(dirty&&scene){ R.render(scene,cam3); L2.render(scene,cam3); dirty=false; }
  requestAnimationFrame(loop); }
// the paper's own grid, drawn as the floor: thin line every cell (20px), strong line every 5 cells (one cube)
function floor(){ const a=rgba(css('--grid-minor')), b=rgba(css('--grid-major')), mi=[], ma=[], N=60;
  for(let i=-N*5;i<=N*5;i++){ const v=i/5, arr=i%5===0?ma:mi, x=Math.round(O.x)+v, z=Math.round(O.z)+v;
    arr.push(x,0,O.z-N, x,0,O.z+N, O.x-N,0,z, O.x+N,0,z); }
  [[mi,a],[ma,b]].forEach(([p,c])=>{ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:c.c,transparent:true,opacity:c.a,depthWrite:false})); l.renderOrder=-1; scene.add(l); }); }
function pin(html,x,z,cls,y){ const d=document.createElement('div'); d.className='t3 '+(cls||''); d.innerHTML='<div class="t3i">'+html+'</div>';
  const o=new CSS2DObject(d); o.position.set(x,y||0,z); scene.add(o); return {d,o}; }
function cellBtn(act,label,main){ return '<button class="t3b'+(main?' main':'')+'" data-a="'+act+'">'+(label?'<span>'+label+'</span>'+ARROW:ICON[act])+'</button>'; }
// the box: 4 long, 3 wide, 2 tall
const BL=4, BW=3, BH=2;
function build(){
  scene=new THREE.Scene(); mats=[]; tweens=[]; sq=[]; cubes=[]; filled=new Set(); st=0; tilt=0;
  C=colours(CH[k0.ch].c); floor();
  // the box's floor, drawn on the paper's strong lines as a dashed outline
  const out=new LineSegmentsGeometry().setPositions([O.x,0,O.z, O.x+BL,0,O.z, O.x+BL,0,O.z, O.x+BL,0,O.z+BW, O.x+BL,0,O.z+BW, O.x,0,O.z+BW, O.x,0,O.z+BW, O.x,0,O.z]);
  ui.outline=new LineSegments2(out,lineMat({color:C.deep,dashed:true,dashSize:.08,gapSize:.06,linewidth:2})); ui.outline.computeLineDistances(); scene.add(ui.outline);
  const unit=new THREE.BoxGeometry(1,1,1).translate(.5,.5,.5), edges=new LineSegmentsGeometry().fromEdgesGeometry(new THREE.EdgesGeometry(unit));
  const m=c=>new THREE.MeshBasicMaterial({color:c,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
  const faces=[m(C.side),m(C.side),m(C.top),m(C.top),m(C.front),m(C.front)], lm=lineMat({color:C.deep});
  for(let y=0;y<BH;y++) for(let z=0;z<BW;z++) for(let x=0;x<BL;x++){ const g=new THREE.Group(); g.position.set(O.x+x,y,O.z+z);
    g.add(new THREE.Mesh(unit,faces)); g.add(new LineSegments2(edges,lm)); g.scale.set(1,.0001,1); g.visible=false; scene.add(g); cubes.push({g,x,y,z}); }
  ui.len=pin('4',O.x+BL/2,O.z+BW+.3,'lab'); ui.wid=pin('3',O.x-.3,O.z+BW/2,'lab'); ui.hgt=pin('2',O.x+BL+.3,O.z+BW,'lab',1); ui.hgt.d.style.opacity=0;
  ui.q=pin('',O.x,O.z-.6,'say'); ui.fb=pin('',O.x,O.z+BW+.6,'fb'); ui.bar=pin('',O.x,O.z+BW+1,'tbar');
  ui.bar.d.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(b) act(b.dataset.a); });
  words(); size(); }
function words(){ const say=[['How many cubes fill this box?','It is 4 long, 3 wide and 2 tall.'],['Cover the floor with squares.','Tap each square inside the box.'],['One layer: 12 cubes.','The box is 2 tall. Add the next layer.'],['2 layers of 12 is 24.','Volume = 4 × 3 × 2 = 24 cubes.']][st];
  ui.q.d.firstChild.innerHTML='<div class="q">'+say[0]+'</div><div class="h">'+say[1]+'</div>';
  ui.q.d.firstChild.classList.remove('in'); void ui.q.d.offsetWidth; ui.q.d.firstChild.classList.add('in');
  const go=['Let’s find out','Check','Add a layer','Next problem'][st];
  ui.bar.d.firstChild.innerHTML=(st===1?cellBtn('show')+cellBtn('reset')+'<i class="gap"></i>':'')+cellBtn('go',go,true);
  count(); dirty=true; }
function count(msg,ok){ ui.fb.d.firstChild.innerHTML=st===1?'<span class="'+(ok?'ok':msg?'no':'')+'">'+(msg||filled.size+' of 12 squares')+'</span>':''; dirty=true; }
function square(x,z,on){ const id=x+','+z; let s=sq.find(s=>s.id===id);
  if(!s){ const g=new THREE.Mesh(new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2).translate(.5,0,.5),new THREE.MeshBasicMaterial({color:C.sq,transparent:true,opacity:0,depthWrite:false}));
    g.position.set(O.x+x,.001,O.z+z); scene.add(g); s={id,g}; sq.push(s); }
  if(on) filled.add(id); else filled.delete(id); const a=s.g.material.opacity, b=on?1:0; tween(0,260,k=>s.g.material.opacity=a+(b-a)*k); }
function act(a){
  if(a==='go'){ if(st===0){ st=1; words(); }
    else if(st===1){ if(filled.size===12){ st=2; lift(); } else count(filled.size<12?'Not yet. '+(12-filled.size)+' squares are still empty.':'',false); }
    else if(st===2){ st=3; words(); cubes.filter(c=>c.y===1).forEach((c,i)=>{ c.g.visible=true; tween(i*35,700,k=>c.g.scale.y=Math.max(.0001,k)); }); tween(500,400,k=>ui.hgt.d.style.opacity=k); }
    else { T3.close(()=>T3.open(k0),true); } return; }
  if(st!==1) return;
  if(a==='show'){ let i=0; for(let z=0;z<BW;z++) for(let x=0;x<BL;x++){ const id=x+','+z; if(!filled.has(id)){ const xx=x,zz=z; setTimeout(()=>{ square(xx,zz,true); count(); },60*i++); } } }
  if(a==='reset'){ [...filled].forEach(id=>{ const [x,z]=id.split(',').map(Number); square(x,z,false); }); count(); } }
// the paper tilts, the squares rise into cubes; the words above the box step back so the cubes never cover them
function lift(){ words(); ui.outline.visible=false;
  // the tilted box must fit the screen: on a phone the view also steps back a little and centres on the box
  const o=orient(52,-28); let x0=1e9,x1=-1e9; for(const X of [0,BL]) for(const Y of [0,BH]) for(const Z of [0,BW]){ const v=new THREE.Vector3(O.x+X,Y,O.z+Z).dot(o.right); x0=Math.min(x0,v); x1=Math.max(x1,v); }
  const fit=(innerWidth-72)/(x1-x0), to={el:52,az:-28}; if(fit<view.s){ to.s=fit; to.t=new THREE.Vector3(O.x+BL/2,BH/2,O.z+BW/2); }
  moveTo(to,BEAT);
  tween(0,BEAT,k=>{ tilt=k; ui.q.o.position.set(O.x-.4*k,4.6*k,O.z-.6*(1-k)); });
  cubes.filter(c=>c.y===0).forEach((c,i)=>{ c.g.visible=true; c.g.scale.y=.0001; tween(BEAT*.55+i*40,700,k=>c.g.scale.y=Math.max(.0001,k)); });
  sq.forEach(s=>tween(BEAT*.55,500,k=>s.g.material.opacity=1-k)); }
// a tap on the paper: which square of the box's floor is under it?
const ray=new THREE.Raycaster(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
let drag=null;
function down(e){ if(e.target.closest('.t3b')) return; drag={x:e.clientX,y:e.clientY,m:0}; host.setPointerCapture(e.pointerId); }
function moveP(e){ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.m+=Math.abs(dx)+Math.abs(dy); drag.x=e.clientX; drag.y=e.clientY;
  const o=orient(view.el,view.az); view.t.addScaledVector(o.right,-dx/view.s).addScaledVector(o.up,dy/view.s); place(); }
function up(e){ const d=drag; drag=null; if(!d||d.m>6||st!==1) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam3); const p=new THREE.Vector3(); if(!ray.ray.intersectPlane(plane,p)) return;
  const x=Math.floor(p.x-O.x), z=Math.floor(p.z-O.z); if(x<0||z<0||x>=BL||z>=BW) return; square(x,z,!filled.has(x+','+z)); count(); }
T3.zoom=f=>{ view.s=Math.min(250,Math.max(25,view.s*f)); place(); };
// open: fly the flat paper to the lesson first, then hand the same view to the 3D camera, pixel for pixel
T3.open=function(k){ k0=k; open=k; document.body.classList.add('focus'); kidSelect(null);
  const ox=Math.round((k.x+10)/U)*U, oy=Math.round((k.y+40)/U)*U; O={x:ox/U,z:oy/U};
  document.getElementById('islT').textContent=k.n; document.getElementById('islS').textContent=CH[k.ch].t+' · Lesson '+String(chi(k)+1).padStart(2,'0'); document.getElementById('isl').classList.add('on');
  const wide=innerWidth>760; flyTo(ox-40,oy-200,480,640,wide?30:8,0,0,wide?0:70);
  setTimeout(()=>{ if(!host){ host=document.createElement('div'); host.id='three'; document.body.appendChild(host);
      R=new THREE.WebGLRenderer({antialias:true,alpha:true}); R.setPixelRatio(Math.min(2,devicePixelRatio)); host.appendChild(R.domElement);
      L2=new CSS2DRenderer(); L2.domElement.className='t3labels'; host.appendChild(L2.domElement);
      cam3=new THREE.OrthographicCamera(-1,1,1,-1,.1,400); addEventListener('resize',()=>T3.on&&size());
      host.addEventListener('pointerdown',down); host.addEventListener('pointermove',moveP); host.addEventListener('pointerup',up);
      host.addEventListener('wheel',e=>{ e.preventDefault(); if(e.ctrlKey||Math.abs(e.deltaY)>=40) T3.zoom(Math.exp(-e.deltaY*.0025)); },{passive:false}); }
    // same view as the flat paper: the point at the centre of the screen, at the same scale (lines sit on pixel centres like the CSS grid)
    view={el:89.9,az:0,s:cam.z*U,t:new THREE.Vector3(((innerWidth/2-cam.x)/cam.z-.5/cam.z)/U,0,((innerHeight/2-cam.y)/cam.z-.5/cam.z)/U)};
    build(); T3.on=true; document.body.classList.add('t3d'); host.classList.add('on'); place(); dirty=true; requestAnimationFrame(loop); },reduce?0:740); };
// close: tilt back to flat, hand the view back to the paper, then leave as any lesson does
T3.close=function(then,stay){ if(!T3.on) return; const o=orient(view.el,view.az), t=view.t.clone().addScaledVector(o.dir,-view.t.y/o.dir.y);
  moveTo({el:89.9,az:0,t},tilt?BEAT:0,()=>{ cam.z=view.s/U; cam.x=innerWidth/2-(view.t.x*U+.5/cam.z)*cam.z; cam.y=innerHeight/2-(view.t.z*U+.5/cam.z)*cam.z; render(cam);
    T3.on=false; document.body.classList.remove('t3d'); host.classList.remove('on'); scene=null; if(stay){ then&&then(); return; } then?then():document.getElementById('back').click(); });
  tween(0,BEAT,k=>{ if(ui.q&&tilt) ui.q.o.position.set(O.x-.4*(1-k),4.6*(1-k),O.z-.6*k); }); };
window.dispatchEvent(new Event('t3ready'));
</script>
</body></html>
